---
# sandbox インベントリ — production の playbook を、1行も書き換えずに
# 使い捨てVM 1台へ向けて走らせるためのもの。
#
# **使い方**: `ansible-playbook -i inventories/sandbox/hosts.yml --forks 1 <playbook>`
#
# **`--forks 1` を落とさないこと。** 複数のホスト名が同じ1台を指すため、Ansibleが
# 既定で行うホスト並列実行が「同じホストへの同時実行」になり、同じパスへ書きに行く
# タスクが壊れる(2026-08-06に47分ハングした)。
#
# **正本は docs/ai/context/operations/sandbox-vm.md。** この形にした理由、
# 確かめられること・確かめられないこと、production にあって sandbox に無い前提、
# 壊したときの扱いはそちらが持つ。ここへ複製しない。
#
# **すべてのホストの `ansible_host` が sandbox を指す。** 名前は `pve1` / `quory` /
# `authy` … のままで、実体は1台の使い捨てVMである。名前を残すのは、`groups[...]` の
# assert・`hosts:` の literal 指定・`delegate_to`・ホスト名キーの allow-list が
# すべて名前で効くためである。**実ホストには届かない。**
all:
  children:
    proxmox:
      hosts:
        pve1:
          ansible_host: sandbox.internal
        pve2:
          ansible_host: sandbox.internal

    radius_servers:
      hosts:
        authy:
          ansible_host: sandbox.internal

    monitoring_servers:
      hosts:
        monnie:
          ansible_host: sandbox.internal

    control_nodes:
      hosts:
        quory:
          ansible_host: sandbox.internal

    dev_nodes:
      hosts:
        ansy:
          ansible_host: sandbox.internal

    semaphore_servers:
      hosts:
        ansy:
        quory:

    sophos:
      hosts:
        sophos-fw:
          ansible_host: sandbox.internal

    cloudkey_devices:
      hosts:
        cloudkey:
          ansible_host: sandbox.internal

    # sandbox 自身の名前も残す。`serial_getty_mask` のように
    # `-e target_hosts=sandbox` で指定する playbook のため。
    sandbox_nodes:
      hosts:
        sandbox:
          ansible_host: sandbox.internal

    local:
      hosts:
        localhost:
          ansible_connection: local
