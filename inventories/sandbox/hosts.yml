---
# sandbox インベントリ — production の playbook を、1行も書き換えずに
# 使い捨てVM 1台へ向けて走らせるためのもの。
#
# **使い方**: `ansible-playbook -i inventories/sandbox/hosts.yml --forks 1 <playbook>`
#
# ## `--forks 1` は必須である(2026-08-06、47分ハングして分かった)
#
# **複数のホスト名が同じ1台を指すため、Ansibleが既定で行うホスト並列実行が
# 「同じホストへの同時実行」になる。** 同じパスへ同時に書きに行くタスクは、
# ここで壊れる。
#
# 実例: `recovery_exec_setup` の SSH 鍵生成は `creates:` を持つが、**`creates:` は
# 再実行を防ぐもので同時実行を防がない。** `ansy` と `quory` の2コンテキストが
# 同時に「鍵は無い」と判定して両方 `ssh-keygen` を実行し、後発が既存ファイルを
# 見つけて `Overwrite (y/n)?` で標準入力待ちになり、47分間ハングした。
#
# `--forks 1` ならタスクごとにホストが1つずつ処理されるので、後発は先発が
# 作ったファイルを `creates:` で見て正しくskipする。
#
# **これは production では起きない。** あちらは名前と実体が1対1なので、
# 並列実行しても別々のホストを触る。**この形に固有の落とし穴である。**
# 既定(`ansible.cfg` の `inventory`)は `inventories/homelab/hosts.yml` のままで、
# このファイルは**明示的に選んだときだけ**効く。付け忘れたら production 向けに
# なるのではなく、production 向けが既定で、こちらが明示指定である。
#
# ## 形: ホスト名は本物のまま、接続先だけを sandbox へ向ける
#
# **すべてのホストの `ansible_host` が `sandbox.internal` を指す。** 名前は
# `pve1` / `quory` / `authy` … のままで、実体は1台の使い捨てVMである。
#
# **最初は「全グループを `sandbox` という1ホストへ解決する」形で作ったが、
# 2026-08-06 に実際に走らせて作り直した。** 旧い形では次がすべて落ちた:
#   - `groups['proxmox']` を参照して assert する箇所(`recovery_probe_setup` が
#     「proxmoxグループに pve1/pve2 が居ない」で停止した — これが気づいた契機)
#   - `hosts: quory` のように literal のホスト名を書いている playbook
#   - `delegate_to: quory` のように名前でホストを掴む箇所
#   - ホスト名をキーにした role 側の allow-list
# 名前を残す形にすると、**この4つがすべて成立する**。playbook から見た世界は
# production と同じ形をしており、違うのは「全員の住所が同じ」ことだけである。
#
# **実ホストには絶対に届かない。** `ansible_host` が1つ残らず
# `sandbox.internal` を指しているため、このインベントリで到達しうるのは
# sandbox だけである。名前が `pve1` でも、開くのは sandbox への接続である。
#
# ## なぜ Semaphore の環境変数方式を採らなかったか(2026-08-06、Yoshinobu と協議)
#
#   1. 切り替えの正本が repo の外に出る。コードを読んでも、その playbook が
#      どこを向くのか分からなくなる(Semaphore の environment は git にも
#      AI にも見えない)
#   2. 壊れ方の向きが逆になる。「変数が立っていたら sandbox」は、変数の
#      付け忘れ・消失で production 向きになる(fail-open)。インベントリ選択は
#      明示しなければ sandbox にならない(fail-closed)
#   3. 全 playbook に手が入る。この方式は playbook を1本も触らない
#
# **これは安全機構ではない。** ansy が pve1 / pve2 / authy / quory / sophos-fw へ
# 届かないのは鍵が無いからであって、このファイルのおかげではない。ここが増やして
# いるのは「試せる範囲」であって「守り」ではない。
#
# ## 承知の上の性質
#
#   - **全員が同じ1台なので、複数ホストを別々に設定する playbook は、同じ
#     ホストへ重ねて適用される**(`--forks 1` を付ければ順に、付けなければ
#     同時に — 上記のとおり後者は壊れる)。gate の検証が目的なら問題にならないが、
#     「4台に別々の設定が入る」ことは確かめられない
#   - **複数の play が別グループを対象にする playbook では、前の play が失敗
#     すると後続の play に到達しない**(同じ1台なので、失敗ホストの除外が
#     後続 play にも効く)。`ubuntu_nightly` で実際に起きた — radius play が
#     CRITICAL で落ち、monitoring play は走らなかった
#   - 走らせた分だけ sandbox に machinery が溜まる。使い捨て前提で、要らなく
#     なったら消すかバックアップから戻す(`inventories/homelab/hosts.yml` の
#     `sandbox_nodes` コメント参照)
#   - `qm` / `pvesh` を叩く Proxmox 系は Ubuntu VM では落ちる。無害だが
#     得るものも無い
all:
  children:
    proxmox:
      hosts:
        pve1:
          ansible_host: sandbox.internal
        pve2:
          ansible_host: sandbox.internal

    radius_servers:
      hosts:
        authy:
          ansible_host: sandbox.internal

    monitoring_servers:
      hosts:
        monnie:
          ansible_host: sandbox.internal

    control_nodes:
      hosts:
        quory:
          ansible_host: sandbox.internal

    dev_nodes:
      hosts:
        ansy:
          ansible_host: sandbox.internal

    semaphore_servers:
      hosts:
        ansy:
        quory:

    sophos:
      hosts:
        sophos-fw:
          ansible_host: sandbox.internal

    cloudkey_devices:
      hosts:
        cloudkey:
          ansible_host: sandbox.internal

    # sandbox 自身の名前も残す。`serial_getty_mask` のように
    # `-e target_hosts=sandbox` で指定する playbook のため。
    sandbox_nodes:
      hosts:
        sandbox:
          ansible_host: sandbox.internal

    local:
      hosts:
        localhost:
          ansible_connection: local
