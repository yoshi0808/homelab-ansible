---
# sandbox インベントリ — production の playbook を、1行も書き換えずに
# 使い捨てVM 1台へ向けて走らせるためのもの。
#
# **使い方**: `ansible-playbook -i inventories/sandbox/hosts.yml <playbook>`
# 既定(`ansible.cfg` の `inventory`)は `inventories/homelab/hosts.yml` のままで、
# このファイルは**明示的に選んだときだけ**効く。付け忘れたら production 向けに
# なるのではなく、production 向けが既定で、こちらが明示指定である。
#
# **なぜこの形か**(2026-08-06、Yoshinobu と協議して決定):
# 代案は「ansy と quory の Semaphore に別々の Environment を割り当て、環境変数で
# 挙動を変える」だったが、採らなかった。理由は3つ。
#   1. 切り替えの正本が repo の外に出る。コードを読んでも、その playbook が
#      どこを向くのか分からなくなる(Semaphore の environment は git にも
#      AI にも見えない)
#   2. 壊れ方の向きが逆になる。「変数が立っていたら sandbox」は、変数の
#      付け忘れ・消失で production 向きになる(fail-open)。インベントリ選択は
#      明示しなければ sandbox にならない(fail-closed)
#   3. 全 playbook に手が入る。この方式は playbook を1本も触らない
#
# **これは安全機構ではない。** ansy が pve1 / pve2 / authy / quory / sophos-fw へ
# 届かないのは鍵が無いからであって、このファイルのおかげではない。ここが増やして
# いるのは「試せる範囲」であって「守り」ではない。
#
# **承知の上の性質**:
#   - `groups[...]` を直接参照する箇所(9ファイル)は sandbox に解決される。
#     テストとしては望ましいが、グループ構成を assert している playbook は落ちる。
#     **黙って妙なことをするのではなく落ちる**ので、それでよい
#   - `qm` / `pvesh` を叩く Proxmox 系は Ubuntu VM では当然落ちる。無害だが
#     得るものも無い
#   - **ホスト名をキーにした role 側の allow-list は、ここを替えても効いたまま**
#     (sandbox は名前が違うので拒否される)。これは正しい挙動であり、必要なら
#     role 側の一覧に明示的に足す(例: roles/time_sync_ntp_reference/defaults)
#   - 走らせた分だけ sandbox に machinery が溜まる。使い捨て前提で、要らなく
#     なったら消すかバックアップから戻す(`inventories/homelab/hosts.yml` の
#     `sandbox_nodes` コメント参照)
#
# **`quory` のように literal のホスト名を `hosts:` に書いている playbook は、
# ここでは救えない**(例: `incident_investigate_setup.yml`)。グループを
# 指しているものだけが対象になる。
all:
  children:
    control_nodes:
      hosts:
        sandbox:

    dev_nodes:
      hosts:
        sandbox:

    monitoring_servers:
      hosts:
        sandbox:

    radius_servers:
      hosts:
        sandbox:

    proxmox:
      hosts:
        sandbox:

    semaphore_servers:
      hosts:
        sandbox:

    sandbox_nodes:
      hosts:
        sandbox:
          ansible_host: sandbox.internal

    local:
      hosts:
        localhost:
          ansible_connection: local
