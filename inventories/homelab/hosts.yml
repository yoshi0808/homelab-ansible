---
all:
  children:
    proxmox:
      hosts:
        pve1:
          ansible_host: pve1.internal
        pve2:
          ansible_host: pve2.internal

    radius_servers:
      hosts:
        authy:
          ansible_host: authy.internal

    monitoring_servers:
      hosts:
        monnie:
          ansible_host: monnie.internal

    control_nodes:
      hosts:
        quory:
          ansible_host: quory.internal

    dev_nodes:
      hosts:
        ansy:
          ansible_host: ansy.internal

    semaphore_servers:
      hosts:
        ansy:
        quory:

    sophos:
      hosts:
        sophos-fw:
          ansible_host: sophos-fw.internal

    cloudkey_devices:
      hosts:
        cloudkey:
          ansible_host: cloudkey.internal

    # ansy から使う使い捨ての検証用VM。**壊しても困らないVMとして用意されている**
    # (Yoshinobu、2026-08-06)。家庭向けのサービスを何も提供していない。
    #
    # **専用グループにしてあるのは意図的である。** 監視対象にせず、quory から
    # このホストへ何かを流すこともしない。既存のplaybookは全て名前付きグループを
    # 指しており `hosts: all` を使うものは1本も無いため、このグループに置く限り
    # healthcheck・cert_renew・patching・ca_trust_deploy のいずれにも巻き込まれない。
    # **他のグループへ足さないこと** — 足した瞬間にそれらの対象になる。
    #
    # Proxmox 側では HA へ `state: ignored` で登録されており、パッチ中は停止される
    # (playbooks/recovery_probe_sandbox_setup.yml)。常時稼働を前提にしない。
    #
    # **バックアップがあるので、壊してよい範囲は「直せる範囲」まで広い**
    # (Yoshinobu、2026-08-06)。ローカルは毎日01:00・保持1週間、Synologyへは
    # 毎週・保持6か月。**AIからは検証できない** — Proxmoxのバックアップジョブは
    # ansyから見えず、この記述はYoshinobuの明示による。
    #
    # **壊したら、黙って直そうとせず壊したと報告すること。** 復旧はYoshinobuが
    # バックアップから行う。中途半端に修復すると、バックアップ時点とも現状とも
    # 一致しない状態が残り、次に触る人が何を前提にしてよいか分からなくなる。
    # **すぐ報告すれば直前の日次バックアップへ戻せる。** 逆に、壊したまま時間が
    # 経つほど戻せる地点は粗くなる(週次→6か月で消える)。
    #
    # **このVMへ恒久的な開発環境を作らないこと**(Yoshinobu、2026-08-06)。
    # **環境を作り込むと壊すのが惜しくなり、使い捨てであること自体の価値が
    # 失われる。** 特定プロダクトの開発環境が要るなら、sandboxとは別のVMを立てる。
    #
    # 2026-08-06時点で、このホストへ加えた変更のうち**repoに再現手段があるのは
    # `playbooks/serial_getty_mask.yml` だけである。** hostname を `ubuntu` から
    # `sandbox` に変え、`/etc/hosts` のループバック別名の行を `<fqdn> <short>` の
    # 形へ揃えたのは ansy からの ad-hoc 操作であり、playbook が無い(commit b20c43d)。
    # **古いバックアップから復元した場合、この2つは手でやり直すことになる。**
    sandbox_nodes:
      hosts:
        sandbox:
          ansible_host: sandbox.internal

    local:
      hosts:
        localhost:
          ansible_connection: local
