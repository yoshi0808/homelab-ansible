# Host variables for ansy

# ubuntu_vm_full_upgrade (roles/ubuntu_vm_full_upgrade/defaults/main.yml):
# how Ansible itself is installed here, so the role's important-component
# report/Slack output can say "apt管理: 判定対象" instead of leaving it
# ambiguous ("該当なし" vs "not yet confirmed"). Confirmed 2026-07-11 by
# tester (Phase A): ansible-core is dpkg-owned, /usr/bin/ansible is owned by
# the ansible-core package. See
# docs/ai/reviews/ubuntu_vm_full_upgrade/2026-07-11_009_test_result.md.
ubuntu_vm_full_upgrade_ansible_managed_by: apt

# ubuntu_vm_full_upgrade (roles/ubuntu_vm_full_upgrade/defaults/main.yml):
# expected distribution codename. Filling this arms the codename-drift signal
# of MAJOR_UPGRADE_DETECTED (tasks/classify.yml, task "Evaluate
# MAJOR_UPGRADE_DETECTED signals"), which is skipped while the default stays
# empty. A mismatch refuses manual apply outright (task "Reject manual apply
# if Status forbids it") — keep this in step with the host's actual release,
# or the monthly apply stops on a value nobody updated.
# Measured 2026-09-19 on ansy itself: /etc/os-release VERSION_CODENAME=resolute
# (Ubuntu 26.04.1 LTS). See docs/ai/reviews/ubuntu_codename_drift/.
ubuntu_vm_full_upgrade_expected_codename: resolute
