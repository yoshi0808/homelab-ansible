# Host variables for monnie

# ubuntu_vm_full_upgrade (roles/ubuntu_vm_full_upgrade/defaults/main.yml):
# expected distribution codename. Filling this arms the codename-drift signal
# of MAJOR_UPGRADE_DETECTED (tasks/classify.yml, task "Evaluate
# MAJOR_UPGRADE_DETECTED signals"), which is skipped while the default stays
# empty. A mismatch refuses manual apply outright (task "Reject manual apply
# if Status forbids it") — keep this in step with the host's actual release,
# or the monthly apply stops on a value nobody updated. Updating it after a
# release upgrade is docs/ai/context/operations/ubuntu-vm-patch.md
# "Release upgradeを行ったとき".
# Measured 2026-09-19 on monnie itself: /etc/os-release VERSION_CODENAME=resolute,
# VERSION_ID=26.04.
ubuntu_vm_full_upgrade_expected_codename: resolute
