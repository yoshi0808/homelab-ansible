---
# Incoming vars (required):
#   slack_channel: info / alerts / patches
#   slack_status:  ok / warning / critical / error / info
#   slack_title:   Notification title
#   slack_message: Notification body
#
# 2026-07-31 (R3, docs/ai/reviews/check_mode_semantics/
# 2026-07-31_001_requirement.md): ansible_check_mode is a second,
# unconditional suppression trigger alongside skip_notifications.
# Whenever --check is in effect, this file never sends to Slack — it shows
# the full text via the debug task below instead — regardless of playbook
# classification (check-mode-native or risk-accepted) and regardless of
# whether the caller wraps this include in check_mode: false. This closes
# the gap where a caller's check_mode: false on the surrounding block used
# to force a real send under --check; that decision now belongs to this
# file alone.
#
# 2026-08-02: suppression is now exactly these two triggers. A former third,
# now-removed trigger variable has no effect if passed — Ansible silently
# ignores unused extra vars.

- name: Capture notification evidence (best-effort, never fails the play)
  block:
    - name: Include notification evidence capture
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/capture.yml"
  rescue:
    - name: Notification evidence capture include failed (ignored)
      ansible.builtin.debug:
        msg: "Notification evidence capture include failed and was ignored. This does not affect the notification itself."

- name: "[skip_notifications] Show notification instead of sending"
  ansible.builtin.debug:
    msg:
      - "[skip_notifications] 通知スキップ（skip_notifications/ansible_check_modeのいずれかがtrue）"
      - "channel : {{ slack_channel }}"
      - "status  : {{ slack_status }}"
      - "title   : {{ slack_title }}"
      - "message : {{ slack_message }}"
  delegate_to: localhost
  become: false
  when: >-
    skip_notifications | default(false) | bool
    or ansible_check_mode | bool

- name: Send Slack notification (best-effort)
  when: >-
    not (skip_notifications | default(false) | bool
         or ansible_check_mode | bool)
  block:
    - name: Load Slack variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/../vars/slack.yml"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Set Slack color and icon
      ansible.builtin.set_fact:
        _slack_color: >-
          {{ {'ok': 'good', 'warning': 'warning', 'critical': 'danger',
              'error': 'danger', 'info': '#36a64f'}.get(slack_status, 'good') }}
        _slack_icon: >-
          {{ {'ok': '✅', 'warning': '⚠️', 'critical': '🔴',
              'error': '❌', 'info': '📋'}.get(slack_status, '📋') }}
      delegate_to: localhost
      become: false

    - name: Set Slack webhook URL
      ansible.builtin.set_fact:
        _slack_webhook: >-
          {{ {'info': slack_webhook_info, 'alerts': slack_webhook_alerts,
              'patches': slack_webhook_patches}.get(slack_channel, slack_webhook_alerts) }}
      delegate_to: localhost
      become: false
      no_log: true

    - name: Extract token from webhook URL
      ansible.builtin.set_fact:
        _slack_token: "{{ _slack_webhook | replace('https://hooks.slack.com/services/', '') }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Send Slack notification
      community.general.slack:
        token: "{{ _slack_token }}"
        attachments:
          - title: "{{ _slack_icon }} {{ slack_title }}"
            text: "{{ slack_message }}"
            color: "{{ _slack_color }}"
            fallback: "{{ slack_title }}"
            footer: "{{ 'capture: ' ~ _capture_written_id if _capture_written_id is defined else '' }}"
      delegate_to: localhost
      become: false
      no_log: true

  rescue:
    - name: Slack notification failed (ignored)
      ansible.builtin.debug:
        msg: "Slack notification failed and was ignored (channel={{ slack_channel }}, title={{ slack_title }})."
      delegate_to: localhost
      become: false
