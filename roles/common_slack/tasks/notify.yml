---
# Incoming vars (required):
#   slack_channel: info / alerts / patches
#   slack_status:  ok / warning / critical / error / info
#   slack_title:   Notification title
#   slack_message: Notification body
#
# Incoming vars (optional):
#   slack_force_send: true overrides suppression trigger 3 (AI agent session
#     detection) only. It cannot override trigger 1 (skip_notifications) or
#     trigger 2 (ansible_check_mode) — see TS-031
#     (docs/ai/policies/ansible_test_safety_policy.md). If either of those
#     is true, suppression wins regardless of slack_force_send.
#
# 2026-07-31 (R3, docs/ai/reviews/check_mode_semantics/
# 2026-07-31_001_requirement.md): ansible_check_mode is a second,
# unconditional suppression trigger alongside skip_notifications.
# Whenever --check is in effect, this file never sends to Slack — it shows
# the full text via the debug task below instead — regardless of playbook
# classification (check-mode-native or risk-accepted) and regardless of
# whether the caller wraps this include in check_mode: false. This closes
# the gap where a caller's check_mode: false on the surrounding block used
# to force a real send under --check; that decision now belongs to this
# file alone.
#
# 2026-08-02: a former third trigger variable (unrelated to the one added
# below) was removed; passing it has no effect — Ansible silently ignores
# unused extra vars.
#
# 2026-08-02 (R1, docs/ai/reviews/slack_send_optin/
# 2026-08-02_001_requirement.md): suppression now has three triggers —
# skip_notifications, ansible_check_mode, and a new third trigger: an AI
# agent session, detected via the CLAUDECODE environment variable (set by
# Claude Code's Bash tool; absent under systemd timer / Semaphore
# invocation, where INVOCATION_ID is set instead — this asymmetry is the
# detection signal). Detection reads the controller's environment via
# lookup('env', ...), which is unaffected by which host the surrounding
# play targets or by delegate_to (verified empirically; see implement
# record docs/ai/reviews/slack_send_optin/2026-08-02_003_implement.md).
# If the variable is unset or empty, this trigger does NOT fire — detection
# failure falls toward sending, never toward silence. slack_force_send=true
# overrides this trigger only (see "Incoming vars (optional)" above).

- name: Capture notification evidence (best-effort, never fails the play)
  block:
    - name: Include notification evidence capture
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/capture.yml"
  rescue:
    - name: Notification evidence capture include failed (ignored)
      ansible.builtin.debug:
        msg: "Notification evidence capture include failed and was ignored. This does not affect the notification itself."

- name: Detect AI agent session (CLAUDECODE env var; suppression trigger 3)
  ansible.builtin.set_fact:
    _slack_agent_session_detected: "{{ (lookup('env', 'CLAUDECODE') | default('', true) | trim | length) > 0 }}"
  delegate_to: localhost
  become: false

- name: "[suppressed] Show notification instead of sending"
  ansible.builtin.debug:
    msg:
      - "[suppressed] 通知スキップ（trigger1 skip_notifications / trigger2 ansible_check_mode / trigger3 AIエージェントセッション検出 のいずれかがtrue）"
      - "trigger1 skip_notifications      : {{ skip_notifications | default(false) | bool }}"
      - "trigger2 ansible_check_mode      : {{ ansible_check_mode | bool }}"
      - "trigger3 agent_session_detected  : {{ _slack_agent_session_detected }}（slack_force_send={{ slack_force_send | default(false) | bool }} で上書き可。trigger1/2は上書き不可）"
      - "channel : {{ slack_channel }}"
      - "status  : {{ slack_status }}"
      - "title   : {{ slack_title }}"
      - "message : {{ slack_message }}"
  delegate_to: localhost
  become: false
  when: >-
    skip_notifications | default(false) | bool
    or ansible_check_mode | bool
    or (_slack_agent_session_detected
        and not (slack_force_send | default(false) | bool))

- name: Send Slack notification (best-effort)
  when: >-
    not (skip_notifications | default(false) | bool
         or ansible_check_mode | bool
         or (_slack_agent_session_detected
             and not (slack_force_send | default(false) | bool)))
  block:
    - name: Load Slack variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/../vars/slack.yml"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Set Slack color and icon
      ansible.builtin.set_fact:
        _slack_color: >-
          {{ {'ok': 'good', 'warning': 'warning', 'critical': 'danger',
              'error': 'danger', 'info': '#36a64f'}.get(slack_status, 'good') }}
        _slack_icon: >-
          {{ {'ok': '✅', 'warning': '⚠️', 'critical': '🔴',
              'error': '❌', 'info': '📋'}.get(slack_status, '📋') }}
      delegate_to: localhost
      become: false

    - name: Set Slack webhook URL
      ansible.builtin.set_fact:
        _slack_webhook: >-
          {{ {'info': slack_webhook_info, 'alerts': slack_webhook_alerts,
              'patches': slack_webhook_patches}.get(slack_channel, slack_webhook_alerts) }}
      delegate_to: localhost
      become: false
      no_log: true

    - name: Extract token from webhook URL
      ansible.builtin.set_fact:
        _slack_token: "{{ _slack_webhook | replace('https://hooks.slack.com/services/', '') }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Send Slack notification
      community.general.slack:
        token: "{{ _slack_token }}"
        attachments:
          - title: "{{ _slack_icon }} {{ slack_title }}"
            text: "{{ slack_message }}"
            color: "{{ _slack_color }}"
            fallback: "{{ slack_title }}"
            footer: "{{ 'capture: ' ~ _capture_written_id if _capture_written_id is defined else '' }}"
      delegate_to: localhost
      become: false
      no_log: true

  rescue:
    - name: Slack notification failed (ignored)
      ansible.builtin.debug:
        msg: "Slack notification failed and was ignored (channel={{ slack_channel }}, title={{ slack_title }})."
      delegate_to: localhost
      become: false
