---
# T1: notification evidence capture (Step 1 of the incident auto-capture pipeline).
#
# Design authority (insertion form, failure isolation, condition, correlation-id
# ownership): docs/ai/adr/004-notify-capture-insertion.md — Decision (a-2) / (b-1) /
# (c-2) / (d-2) and 補1〜補5. Do not change this file's shape without re-reading that ADR.
#
# WHAT "best-effort, never fails the play" ACTUALLY COVERS (Coordinator decision,
# 2026-07-27, based on Implementer measurement against ansible-core 2.20.1):
#
#   Protected (play continues, rc unaffected):
#     - Any failure INSIDE this file's own block (write errors, unwritable/missing
#       spool dir, etc. — AC4's scenario) is caught by this file's own block/rescue.
#     - `capture.yml` itself being MISSING is caught by the block/rescue that wraps
#       the `include_tasks` call in notify.yml (not in this file). Measured: rc stays
#       equal to the pre-capture baseline (0), the play's later tasks (including the
#       actual Slack send) still run. The PLAY RECAP `failed` counter still goes 0→1
#       for that run even though the play does not abort — see AC1's requirement.md
#       note ("AC1のパリティは正常時に限る"): the 0→1 degrade is accepted, only the
#       *normal-path* run is required to match the W0 baseline exactly.
#
#   NOT protected (play dies):
#     - A YAML SYNTAX ERROR inside this file. Measured directly (temporarily broke
#       this file and ran playbooks/recovery_probe_notify.yml): `ansible.builtin.
#       include_tasks` fails at YAML-parse time, before the task-execution loop ever
#       starts, so this happens *outside* any block/rescue that wraps the include —
#       neither this file's rescue nor notify.yml's wrapping rescue ever runs. Result:
#       fatal error, rc=4, no further tasks in the play execute at all. This is a
#       known, accepted gap, not an oversight — do NOT "fix" it by adding a runtime
#       pre-parse check before the include (e.g. shelling out to validate the YAML
#       first). That was considered and rejected: (a) it would need a `when:` on the
#       include, which conflicts with ADR-004 (c) — capture is unconditional; (b) it
#       adds a subprocess call to every one of the 38 call sites; (c) `notify.yml`
#       itself already has this exact same exposure (a syntax error in notify.yml is
#       just as fatal, and always has been) — this file does not introduce a new class
#       of risk, only one more file in an already-existing one. The layer that is
#       supposed to catch this is commit-time YAML validation of dynamically-included
#       task files (tracked separately, not part of this Step), not a runtime guard
#       here. R5b (collector-side detection of "Semaphore has job rows but zero spool
#       records") is the safety net if this class of failure ever reaches production
#       despite that gate.
#
# This file is included unconditionally from the top of notify.yml, before the
# tester_mode/skip_notifications suppression gate. It writes ONE spool record per
# reached notification. A collector (Step 2) later reads these records from `_spool/`
# and folds them into `reports/incidents/<id>/`.
#
# TASK-COUNT REDUCTION (2026-07-27, W6, requirement.md AC8 "最適化を今行わない理由"
# candidates, executed once the multi-site cost (AC8) had been measured):
#
#   1. `.json.tmp` + `mv` collapsed into a single `ansible.builtin.copy` writing
#      straight to the final `.json` path. `copy` calls AnsibleModule.atomic_move(),
#      whose primary path is a plain `os.rename()` (atomic, no intermediate file) —
#      confirmed by reading module_utils/basic.py (atomic_move, ~line 1721). The
#      mkstemp+rename fallback only runs on EPERM/EXDEV/EACCES/ETXTBSY/EBUSY (cross-
#      filesystem or permission edge cases), and even then the temp file's suffix is
#      the destination's basename, so it still ends in `.json` and matches
#      `reports/**/*.json` in .gitignore. Measured directly (2026-07-27, W6): wrote a
#      500000-byte record with plain `copy` into this repo's real
#      `reports/incidents/_spool/` (same filesystem as production would use), listed
#      the directory before/after — no stray `.tmp`/hidden file ever appeared, the
#      final file's size matched exactly (no partial-write window observed), and
#      `git status --short` stayed unchanged (the file was gitignored, as expected).
#   2. The three `set_fact` tasks (spool dir resolution / timestamp / record+filename
#      construction) are collapsed into ONE `set_fact` task, `_capture_ctx`, using a
#      SINGLE Jinja expression with `{%- set … -%}` locals feeding one final
#      `{{ {...} }}` dict literal. This is not the same thing as splitting the same
#      value across multiple `set_fact` keys (or a task-level `vars:` referenced
#      twice) — both of those re-evaluate `lookup('pipe', ...)` once per reference
#      (see skills/ansible-implementation-style/SKILL.md, "task-level `vars:` の
#      lookup は複数回評価されうる"; the same non-caching applies to sibling keys of
#      a single `set_fact:` — measured separately: sibling keys in one `set_fact` task
#      do NOT see each other's values, each is templated against the pre-task
#      variable snapshot, confirmed empirically 2026-07-27). A `{% set %}` inside a
#      SINGLE field's Jinja render is different: it is a local variable scoped to
#      that one template evaluation, resolved once, and every reference to it within
#      that same render reuses the already-computed value — measured (2026-07-27):
#      wrapped a `lookup('pipe', ...)` in `{% set now = ... %}` inside one `set_fact`
#      field referencing `now` three times (date split into epoch/RFC3339 + used to
#      build the id), instrumented the piped command to append to a counter file, ran
#      the task, and the counter showed exactly ONE invocation. The resulting fact was
#      also confirmed to be a native mapping (`_capture_ctx is mapping` == True, not a
#      stringified dict), so `_capture_ctx.spool_dir` / `.id` / `.record` attribute
#      access works in the later tasks exactly like it would with separate facts.
#      Net effect: 6 block tasks → 3 (dir-exists / build-context / write-record), and
#      the play total (including the 1 `include_tasks` task in notify.yml) goes from
#      7 → 4 on the normal-completion path. Re-verified against the W0 baseline
#      (docs/ai/reviews/incident_auto_capture/2026-07-27_004_observation.md): rc/ok/
#      changed/failed/skipped/rescued/ignored unaffected by this refactor (only the
#      *count* within the T1-added `ok` bucket changed, from +7 to +4).
#      REVISED (2026-07-27, post-review): a 4th block task ("Mark capture id as
#      actually written") was added back after independent review reproduced a
#      footer/record mismatch (see `_capture_written_id` below and its task comment).
#      This raises the block to 4 tasks and the play total to 5 (T1-added `ok` bucket
#      +5, not +4). The task count above is kept as a record of what the pure
#      task-reduction pass achieved; it is not the current total.
#   NOT done: the spool-directory *creation* task was deliberately kept (not moved to
#   deploy-time-only), per Coordinator decision — moving it to the incident_capture
#   role's deploy-time setup would break capture on ansy (Tester's dev box), which
#   never runs that role.
#      **SUPERSEDED (2026-08-01).** The creation task still lives here, but the whole
#      block is now gated on a collector being deployed on this controller (see the
#      "Detect whether an incident collector is deployed" task below). The reason
#      recorded above did not hold: ansy has no collector at all (IC-004 — capture
#      runs on quory only), so "capture on ansy" had no consumer and the records
#      accumulated unread (15 of them by 2026-08-01, oldest from late July).
#      Requirement: docs/ai/reviews/common_slack_capture_scope/
#      2026-08-01_001_requirement.md.
#
# record_version 1 is the input contract for the collector (roles/incident_capture/
# files/incident-capture-collector.py). Field set below (based on
# docs/ai/reviews/incident_auto_capture/2026-07-27_003_investigation.md §5, extended
# 2026-07-27 W6 R6 with `id`):
#   record_version      int    schema version of this record
#   id                  str    the same `<epoch>-<rand8>` value used for this record's
#                               spool filename (added 2026-07-27, R6). This is an
#                               ADDITIVE field only — the collector's
#                               REQUIRED_SPOOL_FIELDS set was deliberately NOT updated
#                               to require it, so spool records already in flight at
#                               deploy time (written by the pre-R6 version of this
#                               file, which have no `id` key) keep parsing correctly.
#                               The collector does not currently use this value as the
#                               bundle_id (bundle numbering is collector-owned per
#                               ADR-004 (d) d-2 and is out of this file's scope); it
#                               flows through verbatim into
#                               summary.json["spool_records"][].id, which is what lets
#                               a human correlate the footer ID on Slack back to the
#                               bundle contents. `notify.yml`'s Slack footer surfaces
#                               this same value, but only via the `_capture_written_id`
#                               fact (see below and the "Mark capture id as actually
#                               written" task) — never `_capture_ctx.id` directly, so a
#                               footer ID is never shown unless the record with that id
#                               is confirmed on disk (2026-07-27, post-review fix).
#   written_at          str    RFC3339, offset-explicit JST ("+09:00", never bare Z/UTC)
#   controller          str    short hostname of the machine running ansible-playbook
#                               (quory in production, ansy under Tester) — distinguishes
#                               dev-side captures from production ones (RSK-16)
#   play_name           str    ansible_play_name (the play's `name:`, or its `hosts:`
#                               pattern if unset). Auxiliary only — T1 does not attempt
#                               to identify "the playbook" (playbook_dir is useless for
#                               that here: every playbook in this repo lives directly
#                               under playbooks/, so playbook_dir|basename is always
#                               literally "playbooks" and was rejected as a field for
#                               that reason, 2026-07-27 Coordinator decision). The
#                               authoritative playbook/template identification is the
#                               collector's job, taken from the Semaphore job row
#                               (template name, playbook path) — that data does not
#                               exist yet when T1 runs.
#   play_host           str    inventory_hostname of the play this notification is for
#   slack_channel       str    as passed to notify.yml (may be '')
#   slack_status        str    as passed to notify.yml (may be '') — recorded
#                               unconditionally, including "ok" (ADR-004 (c) / D7)
#   slack_title          str    as passed to notify.yml (may be '')
#   slack_message        str    as passed to notify.yml (may be '')
#   tester_mode          bool   flag only, not a filter (R1)
#   skip_notifications   bool   flag only, not a filter (R1)
#   check_mode           bool   ansible_check_mode; always false in practice because
#                               this file never sets check_mode: false, so it does not
#                               write anything under --check (ADR-004 補1)
#
# Invariants (do not violate when editing this file):
#   - This file CREATES the spool directory if missing, but never CHANGES an
#     existing directory's permissions. Ownership of `_spool/`'s permission
#     bits (mode/ACL) belongs solely to the incident_capture role (2026-07-28,
#     ACL mask incident — see docs/ai/reviews/incident_auto_capture/
#     2026-07-28_018_acl_mask_plan.md §2 C1). Do not add `mode:` (or any other
#     chmod-equivalent) to the "Ensure capture spool directory exists" task.
#   - No SSH, no HTTP, no external network I/O. Local filesystem + local subprocess
#     (date/hostname) only, same pattern already used for JST timestamps elsewhere in
#     this repo (e.g. roles/recovery_ha_failover/tasks/main.yml).
#   - **REVISED 2026-08-01.** Originally: "No `when:` anywhere in this file. Every
#     notification that reaches this include is captured (ADR-004 (c) / D7);
#     filtering is the collector's/Step 2's job." The rule now reads: **no `when:`
#     may branch on the notification itself** — status, channel, title, message,
#     tester_mode, skip_notifications are all off limits as conditions, and every
#     notification reaching this include on a capture-enabled controller is still
#     captured unconditionally. The single permitted `when:` is the **deployment
#     state of the controller** (is a collector present to consume the record),
#     which is a different axis from filtering and does not weaken ADR-004 (c) / D7.
#   - No `assert` / `fail` / `ignore_errors`. Failures are isolated by block/rescue only.
#   - `rescue:` contains exactly one `ansible.builtin.debug` task.
#   - Every task: `delegate_to: localhost`, `become: false`, `changed_when: false`.
#     Capture always happens on the controller, never on the remote target host.
#   - `check_mode: false` is intentionally NOT set anywhere in this file. Under
#     `--check`, `file`/`copy` auto-simulate (no real write) and `command` auto-skips
#     (module has no check_mode support), so the whole file no-ops under --check.
#   - All referenced notify.yml vars go through `| default('')` / `| default(false)`
#     so an undefined slack_channel/slack_status/slack_title/slack_message/
#     tester_mode/skip_notifications never breaks the caller (ADR-004 補2).
#   - Spool location is a variable (`capture_spool_dir`), not hardcoded, so it can be
#     redirected in tests (e.g. to a nonexistent/unwritable path for AC4 verification).
#   - Output extension is `.json` only — written directly by `copy` (atomic, see
#     TASK-COUNT REDUCTION above). No manual `.tmp` file is created by this file.
#   - `_capture_ctx` (spool_dir / id / record) is set via ONE `set_fact` task and
#     persists as a host fact after this include finishes successfully. It is used
#     internally by this file (directory path, filename) but is NOT what `notify.yml`
#     reads for the footer (R6) — `_capture_ctx.id` is assigned before the write can
#     fail, so on its own it cannot prove the record actually exists on disk.
#   - `_capture_written_id` is a SEPARATE fact, set by the last task in this block,
#     strictly AFTER the write succeeds. `notify.yml`'s footer reads this one, not
#     `_capture_ctx.id` (2026-07-27, post-review fix — an independent review
#     reproduced a case where `_capture_ctx.id` was defined but the write had failed,
#     i.e. the footer could show an id with no corresponding file). If ANY of the
#     tasks in this block raises — including the write itself — `rescue:` fires before
#     `_capture_written_id` is ever set, so it stays undefined and the footer degrades
#     to '' in that case too. This costs one extra task (accepted, 2026-07-27
#     Coordinator decision) specifically so that a non-empty footer is always backed
#     by a real file.

- name: Capture notification evidence (best-effort, never fails the play)
  delegate_to: localhost
  become: false
  block:
    # 2026-08-01: 収集器が配備されているcontrollerでだけ捕捉する。
    #
    # 判定に使うのは**収集器の設定ファイルの存在**であり、spoolディレクトリの
    # 存在ではない。**spoolの側で判定してはならない** — 上の不変条件が
    # 「`capture_spool_dir` を存在しない/書けないパスへ差し替えてAC4を検証する」
    # と定めており、AC4は「書き込みが試みられて失敗すること」に依存している。
    # spoolの存在で門を作ると、AC4の検証が「黙ってskip」に化けて成立しなくなる。
    #
    # 経緯: ansyには収集器(homelab-incident-capture)が無く、IC-004により
    # 捕捉はquoryでのみ行う。にもかかわらずこのファイルはcontroller側
    # (`delegate_to: localhost`)へ書くため、**ansyから流した実行の分が
    # 読み手のいないまま蓄積していた**(2026-08-01時点で15件、最古は7月下旬)。
    #
    # **この変更は過去のCoordinator判断を覆している。** 上のTASK-COUNT節は
    # 「spoolディレクトリ作成をdeploy時へ移すとansy(Testerの開発機)で
    # captureが壊れるので意図的に残した」と記録している。**その「capture」に
    # 実体が無かった** — ansyには読み手が存在せず、書いたものは誰にも
    # 消費されない。判断の記録は
    # docs/ai/reviews/common_slack_capture_scope/2026-08-01_001_requirement.md。
    # 不変条件「No `when:` anywhere in this file」の緩和(2026-08-01)。
    # 元の趣旨は「**どの通知を捕捉するか**を内容で絞らない(ADR-004 (c) / D7、
    # 絞り込みは収集器の仕事)」ことであり、ここで見ているのは通知の内容では
    # なく**配備状態**である。**通知の属性(status/channel/title等)を条件に
    # 使う `when:` は引き続き禁止**とする。
    #
    # `stat` + `register` ではなく Jinja の `is exists` を使う理由(2026-08-01、
    # 独立レビューF1を受けた差し替え): ①**タスクを1つも増やさない** —
    # このファイルはタスク数を減らすために設計を練った経緯があり(上の
    # TASK-COUNT節)、38箇所の通知経路すべてに乗る ②**新しい変数を作らない** —
    # `register` を足すと `ansible-lint` の `var-naming[no-role-prefix]` が
    # 1件増える(実測: HEAD版4件 → stat版5件)。`when:` は元々controller側で
    # 評価され、このblockは `delegate_to: localhost` なので、**判定する
    # ファイルシステムと書き込む先が同じ**である。
    - name: Capture only where a collector will consume the record
      when: "(capture_collector_marker | default('/etc/homelab-recovery/incident-capture.json')) is exists"
      block:
        - name: Resolve capture context (spool dir, id, record — single evaluation)
          ansible.builtin.set_fact:
            _capture_ctx: >-
              {%- set _spool_dir = capture_spool_dir | default(reports_base_dir ~ '/incidents/_spool') -%}
              {%- set _now = lookup('pipe', "TZ='Asia/Tokyo' date '+%s %Y-%m-%dT%H:%M:%S+09:00'") -%}
              {%- set _epoch = _now.split(' ')[0] -%}
              {%- set _written_at = _now.split(' ')[1] -%}
              {%- set _id = _epoch ~ '-' ~ ('%08x' | format(4294967296 | random)) -%}
              {{ {
                'spool_dir': _spool_dir,
                'id': _id,
                'record': {
                  'record_version': 1,
                  'id': _id,
                  'written_at': _written_at,
                  'controller': lookup('pipe', 'hostname -s'),
                  'play_name': ansible_play_name | default(''),
                  'play_host': inventory_hostname,
                  'slack_channel': slack_channel | default(''),
                  'slack_status': slack_status | default(''),
                  'slack_title': slack_title | default(''),
                  'slack_message': slack_message | default(''),
                  'tester_mode': tester_mode | default(false) | bool,
                  'skip_notifications': skip_notifications | default(false) | bool,
                  'check_mode': ansible_check_mode | default(false) | bool,
                }
              } }}
          delegate_to: localhost
          become: false
          changed_when: false

        # No `mode:` here (2026-07-28, ACL mask incident — see
        # docs/ai/reviews/incident_auto_capture/2026-07-28_016_t1_production_observation_test_result.md
        # and .../2026-07-28_018_acl_mask_plan.md §1). (a) On a directory that
        # carries POSIX ACLs, `file`'s chmod does not just set the requested bits
        # — it rewrites the ACL mask entry, which caps every named-user/
        # named-group entry's *effective* permission regardless of what that
        # entry itself grants. (b) Ownership of this directory's permission bits
        # belongs solely to the `incident_capture` role (plan §2 C1); this task's
        # only job is to create the directory when it is missing (e.g. on ansy,
        # which never runs that role) — never to modify an existing directory's
        # mode/ACL. (c) In production this caused `recovery-exec`'s named-user
        # ACL entry on `_spool/` to be silently truncated from rwx to r-x every
        # time this task ran against an already-ACL'd directory, which broke the
        # collector's ability to unlink consumed spool records. (d) Do NOT add
        # `mode:` back here "to be explicit/safe" — on an ACL'd directory that is
        # exactly the operation that reintroduces the incident; permissions for
        # an existing directory are the role's responsibility, not this file's.
        - name: Ensure capture spool directory exists
          ansible.builtin.file:
            path: "{{ _capture_ctx.spool_dir }}"
            state: directory
          delegate_to: localhost
          become: false
          changed_when: false

        - name: Write capture record directly to spool (atomic via copy's os.rename)
          ansible.builtin.copy:
            content: "{{ _capture_ctx.record | to_nice_json }}\n"
            dest: "{{ _capture_ctx.spool_dir }}/{{ _capture_ctx.id }}.json"
          delegate_to: localhost
          become: false
          changed_when: false

        - name: Mark capture id as actually written (2026-07-27, Coordinator decision post-review)
          # Deliberately a 4th, separate task instead of folding this into the
          # write task above. `notify.yml`'s footer must only ever show an id
          # that corresponds to a record that is actually on disk — if any of
          # the three tasks above this one raises, `rescue:` fires and this task
          # never runs, so `_capture_written_id` stays undefined and the footer
          # degrades to '' (see notify.yml). `_capture_ctx.id` alone could not be
          # used for that purpose: it is set by the very first task in this
          # block, before the directory-create/write tasks that can actually
          # fail, so a failure between "id computed" and "record written" left
          # `_capture_ctx.id` defined while no file existed — an independent
          # review (docs/ai/reviews/incident_auto_capture/2026-07-27_013_review_w6_notify.md)
          # reproduced this and the Coordinator decided the +1 task (ok 7->8) is
          # worth paying to close it. Cost accepted; do not re-collapse this into
          # the write task to save a task.
          ansible.builtin.set_fact:
            _capture_written_id: "{{ _capture_ctx.id }}"
          delegate_to: localhost
          become: false
          changed_when: false

  rescue:
    - name: Notification evidence capture failed (ignored)
      ansible.builtin.debug:
        msg: >-
          Notification evidence capture failed and was ignored
          (play={{ ansible_play_name | default('') }}, host={{ inventory_hostname }}).
          This does not affect the notification itself.
      delegate_to: localhost
      become: false
