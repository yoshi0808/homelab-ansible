---
# incident_capture: 証拠バンドル収集器の配備。quory専用(ADR-003 Consequences)。
# 設計の正本: docs/ai/adr/003-incident-capture-collector-runtime.md

# ---------------------------------------------------------------------------
# 出力先ディレクトリ(RSK-06: ACLはreports/incidents/配下にのみ付与し、
# reports/直下には絶対に付与しない — reports/直下は
# proxmox_patch_apply_node が fileglob で読むパッチ適用ゲートの入力を含む)。
#
# 不変条件(2026-07-28、review 2026-07-28_018_acl_mask_plan.md §2 C1・D3・D4。
# 先例: roles/recovery_exec/tasks/main.yml のmute dir作成、
# roles/recovery_mute/tasks/{deploy_cli,set}.yml、review 2026-07-14_008 F1):
# reports/incidents/ と _spool/ のパーミッションビット(mode/ACL)の
# 単独所有者はこのroleとする。両ディレクトリともACLを持つため、
# `mode:` を持つ file タスクで作成し続けると「毎回0755へchmodする」タスクに
# なり、ACLを持つディレクトリに対するchmodはACL maskエントリを書き換えて
# しまう(named entryの実効権限を `min(entry, mask)` へ切り詰める。
# incident-capture-collector.py のdocstring「spool消費方式」を参照)。
# roleが自分のACLタスクで直後にmaskを復旧するため単独実行では無害に見えるが、
# role外の書き手(roles/common_slack/tasks/capture.yml、通知のたびに実行)が
# 同じディレクトリをchmodすると復旧されないままmaskが壊れる。2026-07-28、
# 実際にこれで本番quoryの収集器がspool削除に失敗する障害が起きた
# (`2026-07-28_016_t1_production_observation_test_result.md`)。
# 対処として、mode指定は「初回作成時のみ」`mkdir -m 0755 -p` + `creates:`の
# create-onlyタスクで行い、既存ディレクトリに対する file タスクは
# owner/group だけを強制して mode には一切触れない。他の書き手
# (T1含む)は「ディレクトリが無ければ作ってよい」が「既存ディレクトリの
# パーミッションを変更してはならない」(T1側もこの原則に合わせて
# `mode:` 行を削除済み)。
# ---------------------------------------------------------------------------

- name: Ensure reports/incidents/ exists at 0755 (create-only, never re-chmod)
  ansible.builtin.command:
    cmd: mkdir -m 0755 -p "{{ incident_capture_bundle_dir }}"
    creates: "{{ incident_capture_bundle_dir }}"
  become: true
  # check-mode-native (TS-014): this creates real host state, so it is
  # skipped under --check rather than relying on command's partial
  # creates:-based check_mode support.
  when: not ansible_check_mode
  tags: [destructive]

- name: "Enforce reports/incidents/ owner (no mode: here — see create-only task above)"
  ansible.builtin.file:
    path: "{{ incident_capture_bundle_dir }}"
    state: directory
    # owner はansible_user_id(quoryの接続ユーザーはann)ではなく、reports/直下と
    # 同じ実オーナー yoshi に明示的に固定する(2026-07-27 W0実測:
    # reports/ は owner=yoshi group=homelab-ansible、サブディレクトリも概ね
    # yoshi:yoshi。ann所有にすると兄弟ディレクトリと所有者が食い違う)。
    # mode: を持たないため、file モジュールは既存ディレクトリのパーミッション
    # ビットに一切触れない(ansible-core module_utils/basic.py の
    # set_mode_if_different() は mode is None のとき即returnする)。
    owner: yoshi
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# T1(roles/common_slack/tasks/capture.yml)がこのroleより先に一度でも実行
# されていれば、_spool/ は既にコントローラ実行ユーザ(yoshi)所有・0755で
# 存在する。ここで作るのは「まだ一度もT1が呼ばれていない場合」に備えた
# 冪等な保証。owner は兄タスク(reports/incidents/ 本体)と同じ理由で明示的に
# yoshi を指定する(2026-07-27 独立レビューCritical #1: owner未指定のまま
# become: true で作ると root:root 0755 になり、delegate_to: localhost /
# become: false で動くT1(実行ユーザyoshi、W0実測 T-OQ2)が永久に書き込め
# なくなる。直後に付与するACLはrecovery-exec宛のみでyoshiには何も与えない。
# T1自身のrescueがこの書込み失敗を吸収し、R5bも「新規失敗ジョブがある周期」
# でしか気づけないため、この欠陥は外から極めて見えにくい。W0実測
# (2026-07-27_004_observation.md T-OQ4)で reports/incidents/ が当時未作成
# だったと確認済みであり、incident_capture_setup.yml がT1より先に走る配備
# 順序は仮説ではなく実際に起こりうる)。
# 補足2(2026-07-27 W6): 兄タスク(reports/incidents/ 本体、group=homelab-ansible)
# と同じ group を明示する。ここに group: が無いと、become: true実行時の
# プロセスの実効グループ(root)がそのまま採用され、_spool/ だけ group=root に
# なる食い違いが生じることが観測済み(2026-07-27_009_test_result.md 「副次観測」)。
# ACLで機能自体は成立するため実害はないが、兄弟ディレクトリと所有グループが
# 食い違ったまま放置しない。
# 補足3(2026-07-28、review 2026-07-28_018_acl_mask_plan.md §2 C1・D3・D4):
# create-only化。mode指定は上のブロックコメント(不変条件)のとおり
# create-onlyの mkdir タスクだけで行い、この file タスクは owner/group を
# 強制するだけで mode には触れない。かつて「補足(訂正)」としてここにあった
# 「mode: を明示している以上 file は既存ディレクトリにも owner/group/mode を
# 上書きする」という記述は、mode: を持たなくなった今は当てはまらないため
# 削除した(このタスクは既存ディレクトリのパーミッションビットに一切触れない)。
- name: Ensure reports/incidents/_spool/ exists at 0755 (create-only, never re-chmod)
  ansible.builtin.command:
    cmd: mkdir -m 0755 -p "{{ incident_capture_spool_dir }}"
    creates: "{{ incident_capture_spool_dir }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: "Enforce reports/incidents/_spool/ owner/group (no mode: here — see create-only task above)"
  ansible.builtin.file:
    path: "{{ incident_capture_spool_dir }}"
    state: directory
    owner: yoshi
    group: homelab-ansible
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# 収集器(recovery-exec)がバンドルディレクトリを作成できるようにする。
# 新規に与える権限は reports/incidents/ 配下(このタスク一式)だけ
# (ADR-003 (b) b-1)。access ACL(即時)と default ACL(将来このディレクトリ内に
# 作られるサブディレクトリへの継承)の両方を付与する。
- name: Grant recovery-exec ACL rwx on reports/incidents/ (access, immediate)
  ansible.posix.acl:
    path: "{{ incident_capture_bundle_dir }}"
    entity: "{{ incident_capture_user }}"
    etype: user
    permissions: rwx
    state: present
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Grant recovery-exec ACL rwx on reports/incidents/ (default, for future subdirs)
  ansible.posix.acl:
    path: "{{ incident_capture_bundle_dir }}"
    entity: "{{ incident_capture_user }}"
    etype: user
    permissions: rwx
    default: true
    state: present
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# _spool/ は reports/incidents/ の「サブディレクトリ」であり、上のdefault ACL
# は今後新規作成されるエントリにしか継承されない。T1がこのroleより先に
# _spool/ を作っていた場合(本番で先にcapture.ymlが動いていたケース)、
# default ACLだけでは既存の _spool/ には遡って効かないため、_spool/ 自体にも
# 同じ named-user ACL を明示的に付与する。詳細な理由は
# roles/incident_capture/files/incident-capture-collector.py の
# モジュールdocstring「spool消費方式」を参照(収集器はこのrwxを使って、
# sticky bitの無い通常ディレクトリのPOSIX規則によりyoshi所有のspoolファイルを
# rename/unlinkする — 各ファイル自体の所有者は変えない)。
- name: Grant recovery-exec ACL rwx on reports/incidents/_spool/ (access, covers pre-existing dir)
  ansible.posix.acl:
    path: "{{ incident_capture_spool_dir }}"
    entity: "{{ incident_capture_user }}"
    etype: user
    permissions: rwx
    state: present
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Grant recovery-exec ACL rwx on reports/incidents/_spool/ (default, for new spool files)
  ansible.posix.acl:
    path: "{{ incident_capture_spool_dir }}"
    entity: "{{ incident_capture_user }}"
    etype: user
    permissions: rwx
    default: true
    state: present
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# 期待値(2026-07-28、review 2026-07-28_018_acl_mask_plan.md §1.6・§4 U5 T3):
# create-only化により、上のディレクトリ作成2箇所はもはや毎回chmodしない
# (`creates:` が2回目以降no-opにする)。そのため4つのACLタスクは定常状態
# (mask::rwxが既に成立している)では `setfacl --test` が真のno-opを検出し、
# **このroleは2回目以降の実行で changed=0 になる。** 修正前は、file タスクの
# chmodがACL maskを毎回r-xへ落とし、access aclタスクがそれを毎回rwxへ
# 戻すという往復があったため、reports/incidents/ と _spool/ 双方のACL
# タスク(計2箇所)が永久に changed を報告し続けていた(それ自体が本欠陥の
# 観測可能な信号だった)。「2回目の実行でchanged=0」は、この往復が
# 止まったことの直接証拠として使える。

# ---------------------------------------------------------------------------
# 収集器のローカル実行状態(reports/とは別。recovery-execが単独所有するため
# 追加のACLは不要)。
# ---------------------------------------------------------------------------

- name: Ensure incident-capture state directory exists (recovery-exec owned)
  ansible.builtin.file:
    path: "{{ incident_capture_state_dir }}"
    state: directory
    owner: "{{ incident_capture_user }}"
    group: "{{ incident_capture_user }}"
    mode: "0750"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ incident_capture_config_dir }}"
    state: directory
    mode: "0755"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# ---------------------------------------------------------------------------
# スクリプト・設定・systemd unit
# ---------------------------------------------------------------------------

- name: Deploy incident-capture-collector.py
  ansible.builtin.copy:
    src: incident-capture-collector.py
    dest: "{{ incident_capture_script_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Reload systemd for incident capture
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy incident-capture config
  ansible.builtin.template:
    src: incident-capture.json.j2
    dest: "{{ incident_capture_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy incident-capture service unit
  ansible.builtin.template:
    src: incident-capture.service.j2
    dest: /etc/systemd/system/homelab-incident-capture.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for incident capture
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy incident-capture timer unit
  ansible.builtin.template:
    src: incident-capture.timer.j2
    dest: /etc/systemd/system/homelab-incident-capture.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for incident capture
  when: not ansible_check_mode
  tags: [destructive]

- name: Flush handlers so units are reloaded before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start incident-capture timer (production only)
  ansible.builtin.systemd:
    name: homelab-incident-capture.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true
  when:
    - not ansible_check_mode
    - incident_capture_service_enabled | bool
  tags: [destructive]
