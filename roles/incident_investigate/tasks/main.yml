---
# incident_investigate: 障害の一次調査(quory)。U2。
# 設計の正本: docs/ai/adr/009-per-incident-investigation-runtime.md
# 前提: playbooks/recovery_exec_setup.yml が既に実行済みであること
# (homelab-semaphore-query を配備するのは recovery_exec 側であり、この
# roleは呼ぶだけで新規に配備しない — ADR-009 (c) c-3 / ADR-003 (c) と同じ
# 「既存の読み取り口を呼ぶだけ」の流儀)。
#
# 前提2: roles/incident_inspect(U1)が調査専用ユーザー incident-inspect と
# Codex実行口(wrapper)、および yoshi からそのwrapperへのsudoersを
# 用意していること。本roleはこの前提が満たされているかを検査しない
# (満たされていなければLLM呼び出しがsudo/execの失敗として可視化される
# 形で失敗するだけであり、復旧アクションへの到達可能性は生じない —
# defaults/main.yml の「U1との結合値」コメントを参照)。

# ---------------------------------------------------------------------------
# キューディレクトリ(a-4)は、2026-07-31(方針C)以降このroleでは作らない
# (T8。docs/ai/reviews/incident_investigate_trigger/2026-07-31_001_requirement.md)。
# 起動契機がcallback plugin からバンドル走査へ切り替わり、キューを読む側
# (incident-investigate.py)が無くなったため。callback plugin自身は
# `/var/lib/homelab-recovery/incident-investigate/queue` の存在を「配備済み」
# の合図として見ているが(callback_plugins/incident_investigate_trigger.py)、
# このroleがディレクトリを作らなくなったことで、そのplugin単体としても
# 常にno-opになる(ansible.cfgでの無効化と合わせた二重の無効化)。
# quory上に既存のディレクトリが残っていても削除はしない(requirement §8 Q4
# — 空のまま残しても無害で、callback経路へ戻す判断が出たときに再利用できる。
# 削除はplaybook外の手作業になる)。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 成果物ディレクトリ(e-2: reports/incidents/_investigations/)。
#
# **mode: を持たせない**(2026-07-28 ACL mask障害の教訓、
# roles/incident_capture/tasks/main.yml 冒頭の不変条件C1と同じ理由)。
# ここは reports/incidents/ 本体でも _spool/ でもなく新規のサブディレクトリ
# であり、chmod は親ディレクトリのACL maskへ波及しない(chmod/chownは
# 対象パス自身にしか作用せず、親ディレクトリのACL maskは対象外)。それでも
# Coordinatorの指示(このディレクトリツリー配下でのchmod相当の操作を
# 一切禁じる)に文字どおり従い、mode: を一切持たせない設計とした
# (存在確認だけが目的であり、特定のmode値を強制する必要が無いため
# 実利上の損失も無い)。owner設定はchown相当でありACL maskに影響しない
# ため安全に使う(incident_capture の reports/incidents/ 本体タスクと同じ
# 理由づけ)。
- name: Ensure reports/incidents/_investigations/ exists (owner yoshi, no mode:)
  ansible.builtin.file:
    path: "{{ incident_investigate_artifact_dir }}"
    state: directory
    owner: yoshi
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# ---------------------------------------------------------------------------
# ローカル実行状態置き場(incident_capture と同じ /etc/homelab-recovery)。
# ---------------------------------------------------------------------------
- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ incident_investigate_config_dir }}"
    state: directory
    mode: "0755"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# ---------------------------------------------------------------------------
# R13/R14 (docs/ai/reviews/semaphore_query_api/2026-08-19_001_requirement.md):
# yoshi(incident_investigate_run_user、このroleのプロセス実行identity)の
# 読み取り・書き込みACL。sudoは使わない — incident-investigate.pyは
# yoshi自身のUIDでhomelab-semaphore-queryをsubprocess実行するだけで、
# 別identityへ切り替える経路がそもそも無い。
#
# R13: yoshiはSemaphore query tokenファイルを読む必要がある
# (homelab-semaphore-queryがこれを読むのはyoshiとして実行されたときも
# 同じ)。旧設計ではyoshiがsemaphore.dbの所有者として直接読めていたため
# ACLが要らなかったが、token file方式ではACLの明示付与が要る(3識別子
# しか付与されていなかった——このroleのdefaults/main.yml「既存の読み取り
# 口」節を参照)。
#
# R14(2026-08-19、独立レビューround2 High #1/#3是正): yoshiはSemaphoreの
# 先読み結果を書く必要があるが、**incident-inspectのworkspaceへは書かない**。
# workspaceにはincident-inspect所有のAGENTS.md(LLMが従う指示書)が同居して
# おり、workspace directory全体へのwrite権限は、そのAGENTS.mdをunlink/
# renameして別内容へ差し替える能力まで与えてしまう(round2 High #1)。
# 代わりに、このroleが単独で所有するSemaphore先読み専用directory
# (`incident_investigate_semaphore_context_dir`)を新設する。
#
# **このdirectoryのmode/ACLは、このrole(incident_investigate)だけが
# 触れる。** roles/incident_inspectはこのdirectoryの存在すら関知しない
# ——2roleが同じdirectoryのmode/ACLを別々に設定する状態を作らないことで、
# `incident_inspect → incident_investigate → incident_inspect`のように
# 再配備順が入れ替わっても、後から実行されたroleが先に設定したACLの
# 実効maskを狭めるという退行が構造的に起きない(round2 High #3是正
# ——POSIX access ACLではgroup class bitsがmaskになるため、`mode:`の
# 再適用はnamed-user entryの実効権限を狭め得る。ここでは`mode:`を
# 設定するtaskと`ansible.posix.acl`のtaskが同一role・同一実行順に
# 常に一緒に走るため、この2つの間でmaskが古いまま取り残される状態を
# 経由しない)。
- name: Install acl package (setfacl/getfacl; self-contained, idempotent even if another role already installed it)
  ansible.builtin.apt:
    name: acl
    state: present
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Grant yoshi ACL read on the Semaphore query token file (R13)
  ansible.posix.acl:
    path: "{{ incident_investigate_semaphore_query_token }}"
    entity: "{{ incident_investigate_run_user }}"
    etype: user
    permissions: r
    state: present
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Create the Semaphore pre-fetch context directory (R14; owned solely by this role)
  ansible.builtin.file:
    path: "{{ incident_investigate_semaphore_context_dir }}"
    state: directory
    owner: "{{ incident_investigate_run_user }}"
    mode: "0750"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Grant incident-inspect ACL traverse on the Semaphore pre-fetch context directory (R14; x only, no r — least privilege)
  ansible.posix.acl:
    path: "{{ incident_investigate_semaphore_context_dir }}"
    entity: "{{ incident_investigate_inspect_user }}"
    etype: user
    permissions: x
    state: present
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# ---------------------------------------------------------------------------
# スクリプト・設定・systemd unit
# ---------------------------------------------------------------------------
- name: Deploy incident-investigate.py
  ansible.builtin.copy:
    src: incident-investigate.py
    dest: "{{ incident_investigate_script_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy incident-investigate config
  ansible.builtin.template:
    src: incident-investigate.json.j2
    dest: "{{ incident_investigate_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy incident-investigate service unit
  ansible.builtin.template:
    src: incident-investigate.service.j2
    dest: /etc/systemd/system/homelab-incident-investigate.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for incident investigate
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy incident-investigate timer unit
  ansible.builtin.template:
    src: incident-investigate.timer.j2
    dest: /etc/systemd/system/homelab-incident-investigate.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for incident investigate
  when: not ansible_check_mode
  tags: [destructive]

- name: Flush handlers so units are reloaded before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start incident-investigate timer (production only)
  ansible.builtin.systemd:
    name: homelab-incident-investigate.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true
  when:
    - not ansible_check_mode
    - incident_investigate_service_enabled | bool
  tags: [destructive]
