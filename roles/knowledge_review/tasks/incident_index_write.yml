---
# 決定論的index(I-3)の書き出し。incident_metrics.yml(評価の前)が計算した
# incident_eval_index(evaluation_rc/evaluation_artifactを除く全フィールド)と、
# incident_evaluation.yml(U3・評価の後)が生成する incident_eval_rc /
# incident_eval_artifact を合わせて、
# {{ knowledge_review_incident_eval_dir }}/<YYYY-MM-DD>-index.json へ書く。
#
# 設計の正本: docs/ai/reviews/incident_auto_capture_step2/2026-07-28_007_step2_plan.md
#             §3 I-3(「評価が失敗・タイムアウトした場合もindexは必ず書く。
#             書かない経路を作らない」)。
#
# 呼び出し元(main.yml / playbooks/incident_evaluation.yml)は本タスクの
# when を not ansible_check_mode で必ずゲートしている。したがって本ファイルに
# 到達した時点で「実際にファイルを書いてよい」ことは呼び出し元が保証済みであり、
# 本ファイル自身は check_mode を判定しない。

- name: Merge evaluation outcome into incident_eval_index (defensive against skip)
  ansible.builtin.set_fact:
    knowledge_review_incident_index_final: >-
      {{ (incident_eval_index | default({}))
         | combine({
             'evaluation_rc': (incident_eval_rc | default(-1)) | int,
             'evaluation_artifact': incident_eval_artifact | default(None)
           }) }}
  # incident_eval_rc / incident_eval_artifact はU3(incident_evaluation.yml)が
  # 生成する契約上のfact名(I-5)であり、単純なスカラー値(int / str|None)
  # である。default() は第2引数(true)を付けない — 付けると rc=0 のような
  # 正当なJinja偽値までUndefined扱いと同じ経路で上書きされてしまうため
  # (自己検証でrc=0が-1に化けないことを確認済み)。
  #
  # incident_eval_index 自体への default({}) は、metrics.yml と本ファイルの
  # when条件が現状は完全に一致しているため理論上は常に定義済みだが、将来
  # どちらかのwhenだけが変更された場合に備えた防御であり、その場合でも
  # index書き出し自体は失敗させない(evaluation_rc/evaluation_artifactだけの
  # 縮退したindexになる。自己検証で3パターン— 成功/facts未定義/index自体
  # 未定義 — すべてクラッシュしないこととJSON型を確認済み)。

- name: Write incident evaluation index
  ansible.builtin.copy:
    content: "{{ knowledge_review_incident_index_final | to_nice_json }}\n"
    dest: "{{ knowledge_review_incident_eval_dir }}/{{ knowledge_review_started_at[:10] }}-index.json"
    mode: "0640"
