---
# 月次のきっかけ通知: 決定論的なメトリクス収集とMEMORY.md期日更新だけを行う。
# 判断・仕分け(Incidentの分類、auto-memoryの昇格判断、Policy改訂の要否)は
# このroleでは行わない — 2026-08-03、Yoshinobuが対話セッションと行う形へ変わった
# (docs/ai/policies/incident_capture_policy.md IC-005)。
#
# 廃止した機構とその理由:
#   - claude -p の起動2本(振り返り本体・障害の自動評価)。無人LLMセッションを
#     ここでは使わない(IC-005)。
#   - 作業ツリー清潔判定と中止(旧ABORTED_DIRTY)。無人LLMが作業ツリーへ書く
#     ことが前提の安全弁であり、書き手が消えたことで前提ごと外れた(IC-025退番)。
#   - auto-memoryスナップショット退避。無人セッションがauto-memoryを書き換える
#     経路が無くなったため、退避対象の操作自体が無い。
#   - 権限プロファイル(job-settings.json.j2 / incident-job-settings.json.j2)と
#     prompt(review-prompt.md.j2 / incident-review-prompt.md.j2)。無人LLMの
#     封じ込め機構であり、封じ込める対象が無い。
#
# git status は状態照会であり ansible.builtin.git では代替できないため command を
# 使う(roles/ubuntu_vm_full_upgrade 等と同じ扱い)。本ファイル自体はもう
# git statusを見ない(上記の理由で中止判定が不要になったため)。

- name: Ensure state directory exists
  ansible.builtin.file:
    path: "{{ knowledge_review_state_dir }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0750"
  check_mode: false

- name: Record run start timestamp (JST)
  ansible.builtin.set_fact:
    knowledge_review_started_at: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S%:z') }}"

# 期日の更新は LLM に任せず Ansible が確定的に行う。無人LLMセッションが
# 無くなったため「実行が成功したら更新する」というガードも不要になり、
# 常に更新する(--checkでは書かない)。
- name: Compute next review date (JST)
  ansible.builtin.set_fact:
    knowledge_review_next_date: "{{ lookup('pipe', 'date -d \"+1 month\" +%Y-%m-26') }}"

- name: Update next review date in MEMORY.md
  ansible.builtin.lineinfile:
    path: "{{ knowledge_review_automemory_dir }}/MEMORY.md"
    regexp: '^> \*\*⏰ 次回のKnowledge月次振り返り:'
    line: >-
      > **⏰ 次回のKnowledge月次振り返り: {{ knowledge_review_next_date }}**(前回:
      {{ knowledge_review_started_at[:10] }})
    backup: true
  when: not ansible_check_mode
  failed_when: false
  tags: [destructive]

# 障害バンドルの滞留状況(quoryへのdispatch経由でのライブ取得)。
# 通知の中身になる(playbooks/knowledge_review.yml post_tasks)。
- name: Compute incident notification metrics
  ansible.builtin.include_tasks: incident_metrics.yml
  when: knowledge_review_incident_notify_enabled | bool
