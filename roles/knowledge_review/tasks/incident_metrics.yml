---
# 障害バンドルの滞留状況: 決定論的メトリクスの算出。月次のきっかけ通知の
# 中身になる(playbooks/knowledge_review.yml post_tasks)。
# Policy: docs/ai/policies/incident_capture_policy.md(IC-021, IC-043, IC-044)
#
# 2026-08-03(Yoshinobu決定、claude -p 2本の廃止に伴う再設計): 以前は本ファイルの
# 出力(incident_eval_index)を2本目の claude -p(障害の自動評価)へ渡し、
# 評価結果と合わせて `_evaluations/<date>-index.json` へ書いていた。評価段
# 自体が無くなったため、本ファイルが直接すべてを完結させる — 出力は
# incident_notify_index / incident_notify_summary の2fact(Slack通知が直接
# 読む)であり、次回実行のための最小限の状態(knowledge_review_incident_notify_
# state_file)も本ファイル自身が末尾で書く。
#
# 新着判定はバンドルID(`semaphore-<job_id>`)の数列で行う(Semaphoreのjob idは
# 単調増加。実測: 2026-08-03時点で55件、常に新しいジョブほど大きいidを持つ)。
# 「前回見た最大id」より大きいidだけを数えれば「新着」と一致する。
#
# IC-043(証拠喪失の警告)は、新着かどうかに関わらず**現存する全バンドルのうち
# 最古のもの**を対象にする。保持期間はバンドルごとの年齢だけで決まり、
# 既に見直し済みかどうかとは無関係に失われるため。
#
# 呼び出し元は roles/knowledge_review/tasks/main.yml のみ。knowledge_review_started_at / knowledge_review_state_dir が
# 本ファイルの前に定義済みであることを前提にする。
#
# 本ファイル内部だけで使う中間factは knowledge_review_incident_metrics_ を
# 接頭辞にし、契約上の名前(incident_notify_index / incident_notify_summary)と
# 衝突しないようにする。

# --- 1. 前回状態(knowledge_review_incident_notify_state_file)を読む ---
#
# 前回本roleが自分で書いたものだが、手動編集・部分書き込み等で壊れている
# 可能性を排除しないため block/rescue で防御する。ファイルが存在しない
# (初回)場合と、存在するが壊れている場合を区別する。

- name: Check for an existing incident notify state file
  ansible.builtin.stat:
    path: "{{ knowledge_review_incident_notify_state_file }}"
  register: knowledge_review_incident_metrics_state_stat

- name: Read previous incident notify state (safe against a corrupt/partial file)
  block:
    - name: Read previous state file content
      ansible.builtin.slurp:
        src: "{{ knowledge_review_incident_notify_state_file }}"
      register: knowledge_review_incident_metrics_state_raw
      when: knowledge_review_incident_metrics_state_stat.stat.exists

    - name: Parse previous state
      ansible.builtin.set_fact:
        knowledge_review_incident_metrics_previous_generated_at: >-
          {{ (knowledge_review_incident_metrics_state_raw.content | b64decode | from_json).get('generated_at') }}
        knowledge_review_incident_metrics_previous_last_bundle_id: >-
          {{ (knowledge_review_incident_metrics_state_raw.content | b64decode | from_json).get('last_bundle_id_seen') }}
      when: knowledge_review_incident_metrics_state_stat.stat.exists
  rescue:
    - name: Fall back to "no known previous state" after a parse failure
      ansible.builtin.set_fact:
        knowledge_review_incident_metrics_previous_generated_at:
        knowledge_review_incident_metrics_previous_last_bundle_id:
        knowledge_review_incident_metrics_state_parse_error: >-
          {{ ansible_failed_result.msg | default('previous incident notify state file could not be parsed', true) }}

# previous_last_bundle_id は正当な値として 0 を取りうる整数であり、
# `default(x, true)` は「偽と評価される値」も置換対象にするため実在する0を
# 巻き戻してしまう(2026-07-26 None/Undefined混同事故と同種の罠)。代わりに
# `is defined` で明示的に判定する(ブロック内でも rescue でも一度も
# set_factされない経路 = 初回・ファイル無しを埋める)。
- name: Default previous state facts and parse-error flag when unset
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_previous_generated_at: >-
      {{ knowledge_review_incident_metrics_previous_generated_at
         if knowledge_review_incident_metrics_previous_generated_at is defined else None }}
    knowledge_review_incident_metrics_previous_last_bundle_id: >-
      {{ knowledge_review_incident_metrics_previous_last_bundle_id
         if knowledge_review_incident_metrics_previous_last_bundle_id is defined else None }}
    knowledge_review_incident_metrics_state_parse_error: >-
      {{ knowledge_review_incident_metrics_state_parse_error | default('', true) }}

- name: Derive previous_notify_date (date portion of previous generated_at, or null)
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_previous_notify_date: >-
      {{ knowledge_review_incident_metrics_previous_generated_at[:10]
         if knowledge_review_incident_metrics_previous_generated_at is not none else None }}

# --- 2. quoryへのdispatch経由でバンドル一覧を取得する ---
#
# --check では実行しない(check-mode-native) — これは実本番ホスト(quory)への
# 実ネットワーク接続を伴う。main.ymlの他タスクとの一貫性のため、同じ
# `not ansible_check_mode` ゲートに揃える。

- name: Query bundle list from quory via dispatch (must return real data — 55+ bundles observed 2026-08-03)
  ansible.builtin.command:
    argv:
      - "{{ knowledge_review_incident_dispatch_ssh_bin }}"
      - "-o"
      - "BatchMode=yes"
      - "-o"
      - "ConnectTimeout={{ knowledge_review_incident_dispatch_connect_timeout_s }}"
      - "{{ knowledge_review_incident_dispatch_alias }}"
      - "bundle-list"
  register: knowledge_review_incident_metrics_bundle_list_raw
  changed_when: false
  failed_when: false
  timeout: "{{ knowledge_review_incident_dispatch_timeout_s }}"
  when: not ansible_check_mode

- name: Default bundle-list result when not attempted (--check)
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_bundle_list_raw: "{{ knowledge_review_incident_metrics_bundle_list_raw | default({}) }}"

# 取得失敗と「取得できて0件」を区別する(V3・IC-011)。--check で skip
# された場合は rc が未定義になり default(-1) で非0側へ倒れる — これは
# 「未実施」であって「失敗」ではないため、下のエラー詳細で明示的に別扱いする。
- name: Determine whether the bundle-list dispatch call produced usable output
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_bundle_list_ok: >-
      {{ (not ansible_check_mode)
         and ((knowledge_review_incident_metrics_bundle_list_raw.rc | default(-1) | int) == 0) }}

- name: Build bundle-list fetch error detail (empty string when the call succeeded)
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_bundle_fetch_error: >-
      {{ '' if knowledge_review_incident_metrics_bundle_list_ok | bool
         else ('not attempted under --check (no real host contacted)' if ansible_check_mode
               else ('bundle-list dispatch failed rc=' ~ (knowledge_review_incident_metrics_bundle_list_raw.rc | default('n/a'))
                     ~ ' stderr=' ~ (knowledge_review_incident_metrics_bundle_list_raw.stderr | default('(no stderr)') | trim))) }}

- name: Parse bundle IDs from dispatch output (numeric ids only; lines not matching the pattern are ignored)
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_bundle_ids: >-
      {{ (knowledge_review_incident_metrics_bundle_list_raw.stdout_lines | default([])
          | select('match', '^semaphore-[0-9]+$')
          | map('regex_replace', '^semaphore-', '')
          | map('int')
          | list)
         if knowledge_review_incident_metrics_bundle_list_ok | bool else [] }}

- name: Compute bundle_total (null when the fetch failed — distinguishable from a genuine zero)
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_bundle_total: >-
      {{ (knowledge_review_incident_metrics_bundle_ids | length | int) if knowledge_review_incident_metrics_bundle_list_ok | bool else None }}

# 次回比較の基準として持ち越すid。今回取得できた最大idがあればそれを使い、
# 取得できなかった(失敗/0件)場合は前回値をそのまま引き継ぐ(基準を
# 失わない — 0件やエラーで巻き戻ると、次回に本来「新着でない」ものまで
# 新着扱いしてしまう。IC-044)。
- name: Determine last_bundle_id_seen to persist for next run
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_last_bundle_id_seen: >-
      {{ (knowledge_review_incident_metrics_bundle_ids | max)
         if (knowledge_review_incident_metrics_bundle_list_ok | bool and (knowledge_review_incident_metrics_bundle_ids | length > 0))
         else knowledge_review_incident_metrics_previous_last_bundle_id }}

# --- 3. bundles_new_since_last_notify(バンドルID比較) ---
#
# 初回(previous_last_bundle_id が null)は現存する全バンドルを新着として扱う。
# 取得失敗時は0件(bundle_fetch_errorで別途表現する)。
- name: Compute bundles newly observed since last notification (by bundle id)
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_new_bundle_ids: >-
      {{ (knowledge_review_incident_metrics_bundle_ids | select('gt', knowledge_review_incident_metrics_previous_last_bundle_id) | list)
         if (knowledge_review_incident_metrics_bundle_list_ok | bool and knowledge_review_incident_metrics_previous_last_bundle_id is not none)
         else (knowledge_review_incident_metrics_bundle_ids
               if (knowledge_review_incident_metrics_bundle_list_ok | bool and knowledge_review_incident_metrics_previous_last_bundle_id is none)
               else []) }}

- name: Compute bundles_new_since_last_notify count (null when the fetch failed)
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_bundles_new_count: >-
      {{ (knowledge_review_incident_metrics_new_bundle_ids | length | int) if knowledge_review_incident_metrics_bundle_list_ok | bool else None }}

# --- 4. oldest_bundle(現存する全バンドルのうち最古。IC-043) ---
#
# 新着かどうかに関わらず、現存する全バンドルの中で最小id = 最古(idは
# 単調増加のため時系列の最古と一致する)を対象にする。

- name: Determine the globally oldest bundle id (smallest id among all currently listed bundles, or null)
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_oldest_bundle_id: >-
      {{ (knowledge_review_incident_metrics_bundle_ids | min) if (knowledge_review_incident_metrics_bundle_ids | length > 0) else None }}

# 追加で1往復だけ dispatch を叩き、最古バンドルの generated_at を得る
# (age_days・保持期限までの残り日数の算出に要る)。他のバンドルのsummary.json
# は取得しない(IC-021が求める「滞留の検知」に必要な最小限に絞る)。
- name: Fetch the oldest bundle's summary.json via dispatch (single extra round trip)
  ansible.builtin.command:
    argv:
      - "{{ knowledge_review_incident_dispatch_ssh_bin }}"
      - "-o"
      - "BatchMode=yes"
      - "-o"
      - "ConnectTimeout={{ knowledge_review_incident_dispatch_connect_timeout_s }}"
      - "{{ knowledge_review_incident_dispatch_alias }}"
      - "bundle-show semaphore-{{ knowledge_review_incident_metrics_oldest_bundle_id }} summary.json"
  register: knowledge_review_incident_metrics_oldest_summary_raw
  changed_when: false
  failed_when: false
  timeout: "{{ knowledge_review_incident_dispatch_timeout_s }}"
  when:
    - not ansible_check_mode
    - knowledge_review_incident_metrics_oldest_bundle_id is not none

# summary.json はrecovery-execが書く非信頼データ(IC-016)であり、内容が
# 壊れていてもここで機構全体を止めない。
- name: Parse the oldest bundle's generated_at and compute age / retention remaining (defensive — non-trusted data, IC-016)
  block:
    # bundle-show自体が非0終了した場合(denied・接続不可等)を、単に
    # 「値が取れなかった」ではなく明示的な失敗として fail させ、rescue で
    # 理由付きの記録に変える。この fail が無いと、rc!=0のケースは「JSONが
    # 壊れていた」のと見分けが付かないまま黙って null に落ちる。
    - name: Fail explicitly if the oldest bundle's summary.json fetch itself did not succeed
      ansible.builtin.fail:
        msg: >-
          bundle-show for semaphore-{{ knowledge_review_incident_metrics_oldest_bundle_id }} summary.json
          failed rc={{ knowledge_review_incident_metrics_oldest_summary_raw.rc | default('n/a') }}
          stderr={{ knowledge_review_incident_metrics_oldest_summary_raw.stderr | default('(no stderr)') | trim }}
      when:
        - knowledge_review_incident_metrics_oldest_bundle_id is not none
        - not ansible_check_mode
        - (knowledge_review_incident_metrics_oldest_summary_raw.rc | default(-1) | int) != 0

    - name: Extract generated_at from the oldest bundle's summary.json
      ansible.builtin.set_fact:
        knowledge_review_incident_metrics_oldest_generated_at: >-
          {{ (knowledge_review_incident_metrics_oldest_summary_raw.stdout | from_json).generated_at }}
      when:
        - knowledge_review_incident_metrics_oldest_bundle_id is not none
        - not ansible_check_mode
        - (knowledge_review_incident_metrics_oldest_summary_raw.rc | default(-1) | int) == 0

    - name: Compute oldest bundle age in days and retention remaining (IC-043)
      ansible.builtin.set_fact:
        knowledge_review_incident_metrics_oldest_age_days: >-
          {{ (((knowledge_review_started_at | to_datetime('%Y-%m-%dT%H:%M:%S%z'))
               - (knowledge_review_incident_metrics_oldest_generated_at | to_datetime('%Y-%m-%dT%H:%M:%S%z'))).days) }}
      when: knowledge_review_incident_metrics_oldest_generated_at | default(None) is not none

    - name: Compute retention days remaining (may be negative if past the retention window)
      ansible.builtin.set_fact:
        knowledge_review_incident_metrics_oldest_remaining_days: >-
          {{ knowledge_review_incident_retention_days | int - knowledge_review_incident_metrics_oldest_age_days | int }}
      when: knowledge_review_incident_metrics_oldest_age_days | default(None) is not none
  rescue:
    - name: Fall back to unknown age after a parse failure (non-trusted data — IC-016)
      ansible.builtin.set_fact:
        knowledge_review_incident_metrics_oldest_generated_at:
        knowledge_review_incident_metrics_oldest_age_days:
        knowledge_review_incident_metrics_oldest_remaining_days:
        knowledge_review_incident_metrics_oldest_summary_parse_error: >-
          {{ ansible_failed_result.msg | default('oldest bundle summary.json could not be parsed', true) }}

# age_days / remaining_days は正当な値として 0 やマイナスを取りうるため、
# 上と同じ理由で `default(x, true)` は使わない — `is defined` で判定する。
- name: Default oldest-bundle facts and parse-error flag when the block above never set them
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_oldest_generated_at: >-
      {{ knowledge_review_incident_metrics_oldest_generated_at
         if knowledge_review_incident_metrics_oldest_generated_at is defined else None }}
    knowledge_review_incident_metrics_oldest_age_days: >-
      {{ knowledge_review_incident_metrics_oldest_age_days
         if knowledge_review_incident_metrics_oldest_age_days is defined else None }}
    knowledge_review_incident_metrics_oldest_remaining_days: >-
      {{ knowledge_review_incident_metrics_oldest_remaining_days
         if knowledge_review_incident_metrics_oldest_remaining_days is defined else None }}
    knowledge_review_incident_metrics_oldest_summary_parse_error: >-
      {{ knowledge_review_incident_metrics_oldest_summary_parse_error | default('', true) }}

- name: Build final oldest_bundle (dict, or null if there are no bundles / age could not be determined)
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_oldest_bundle: >-
      {{ ({'id': 'semaphore-' ~ (knowledge_review_incident_metrics_oldest_bundle_id | string),
           'generated_at': knowledge_review_incident_metrics_oldest_generated_at,
           'age_days': knowledge_review_incident_metrics_oldest_age_days,
           'retention_days': knowledge_review_incident_retention_days | int,
           'remaining_days': knowledge_review_incident_metrics_oldest_remaining_days})
         if (knowledge_review_incident_metrics_oldest_bundle_id is not none
             and knowledge_review_incident_metrics_oldest_age_days is not none) else None }}

# --- 5. 通知が直接読む契約を確定させる ---

- name: Build incident_notify_index
  ansible.builtin.set_fact:
    incident_notify_index: >-
      {{ {
           'generated_at': knowledge_review_started_at,
           'previous_notify_date': knowledge_review_incident_metrics_previous_notify_date,
           'bundle_total': knowledge_review_incident_metrics_bundle_total,
           'bundles_new_since_last_notify': knowledge_review_incident_metrics_bundles_new_count,
           'oldest_bundle': knowledge_review_incident_metrics_oldest_bundle,
           'last_bundle_id_seen': knowledge_review_incident_metrics_last_bundle_id_seen,
           'bundle_fetch_error': knowledge_review_incident_metrics_bundle_fetch_error,
           'oldest_bundle_summary_parse_error': knowledge_review_incident_metrics_oldest_summary_parse_error
         } }}

# FETCH_ERROR(取得失敗。件数は不明であり0件と混同しない — V3・V4)を
# NO_DATA(取得は成功したが実際に0件)より先に判定する。
- name: Build incident_notify_summary
  ansible.builtin.set_fact:
    incident_notify_summary: >-
      {{ 'FETCH_ERROR' if (incident_notify_index.bundle_fetch_error | trim | length > 0)
         else ('NO_DATA' if ((incident_notify_index.bundle_total | default(0, true) | int) == 0)
         else 'OK') }}

# --- 6. 次回実行のための最小限の状態を持ち越す(IC-044) ---
#
# ここで持ち越すのは last_bundle_id_seen だけであり、判断結果(何が
# 昇格されたか等)は一切含まない — 見直しの判断は人が行い、その記録の
# 正本は docs/ai/memory/incidents/ 等repo内(IC-032)であってこの状態
# ファイルではない。

- name: Build incident notify state to persist
  ansible.builtin.set_fact:
    knowledge_review_incident_metrics_state_to_persist:
      generated_at: "{{ knowledge_review_started_at }}"
      last_bundle_id_seen: "{{ knowledge_review_incident_metrics_last_bundle_id_seen }}"

- name: Persist incident notify state for next run's differencing
  ansible.builtin.copy:
    content: "{{ knowledge_review_incident_metrics_state_to_persist | to_nice_json }}\n"
    dest: "{{ knowledge_review_incident_notify_state_file }}"
    mode: "0640"
  when: not ansible_check_mode
  tags: [destructive]
