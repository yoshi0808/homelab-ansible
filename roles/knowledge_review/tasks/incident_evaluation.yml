---
# 障害の自動評価: 2本目の claude -p を起動し、標準出力を Ansible がファイル化する
# (F10と同じ形。IC-005 — LLMを使ってよいのはこの段だけ)。
# 設計の正本: docs/ai/reviews/incident_auto_capture_step2/2026-07-28_007_step2_plan.md
#             §2.4・§2.5、argvは §3 I-8 が正本(実装者に委ねない・確定済み)。
#
# 呼び出し元は2経路ある。どちらでも knowledge_review_aborted /
# knowledge_review_state_dir / knowledge_review_started_at / incident_eval_index
# が本ファイルの前に定義済みであることを前提にする。
#   1. roles/knowledge_review/tasks/main.yml(月次本体。Save reportの直後、
#      incident_metrics.yml の直後に include_tasks で呼ばれる)
#   2. playbooks/incident_evaluation.yml(手動専用。main.yml は経由せず
#      include_role: tasks_from で直接呼ばれる。同playbook側で上記facts相当を用意する)
#
# 権限プロファイル(incident-job-settings.json.j2)には Edit を1つも置かない
# — 「書かせない」を禁止の列挙でなく許可の不在で実現する(IC-018、Lesson
# claude-code-unattended-session-confinement.md)。封じ込めのCLI側2条件
# (--setting-sources を空にする / --permission-mode acceptEdits を付けない)は
# JSONに書けないため、下のargv自体が担保する。既存の月次本体タスク
# (main.yml:119-150)と同じ形を踏襲し、引き継ぐ項目は明示する(査読F-5)。

- name: Ensure incident evaluation output directory exists
  ansible.builtin.file:
    path: "{{ knowledge_review_incident_eval_dir }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: "0750"
  # --check でもディレクトリだけは実際に作る(既存「Ensure state directory
  # exists」と同じ扱い)。ansyのリポジトリ作業ツリー内・gitignore済みパスであり
  # 副作用は無害。
  check_mode: false

- name: Render incident evaluation prompt
  ansible.builtin.template:
    src: incident-review-prompt.md.j2
    dest: "{{ knowledge_review_state_dir }}/incident-review-prompt.md"
    mode: "0644"
  check_mode: false

- name: Render incident evaluation permission profile
  ansible.builtin.template:
    src: incident-job-settings.json.j2
    dest: "{{ knowledge_review_state_dir }}/incident-job-settings.json"
    mode: "0644"
  check_mode: false

# --check では走らせない(check-mode-native)。timeout超過時にindex書き出し・
# summaryが消えないよう ignore_errors は必須(failed_when: false だけでは
# 足りない — ansible-core 2.20 では task timeout が TaskTimeoutError
# (BaseException)として failed_when の評価経路の外で捕捉され、致命的失敗に
# なる。既存の main.yml:140-145 と同じ実測結果による)。
# when は I-8 で固定済み(実装者に委ねない): not ansible_check_mode /
# not knowledge_review_aborted / knowledge_review_incident_eval_enabled の3条件のみ。
- name: Run incident evaluation
  ansible.builtin.command:
    argv:
      - "{{ knowledge_review_claude_bin }}"
      - "-p"
      - "--output-format"
      - "text"
      - "--model"
      - "{{ knowledge_review_incident_model }}"
      - "--setting-sources"
      - ""
      - "--settings"
      - "{{ knowledge_review_state_dir }}/incident-job-settings.json"
    chdir: "{{ knowledge_review_repo_dir }}"
    stdin: "{{ lookup('file', knowledge_review_state_dir + '/incident-review-prompt.md') }}"
  environment:
    HOME: "/home/{{ ansible_user_id }}"
  register: knowledge_review_incident_run
  changed_when: knowledge_review_incident_run.rc | default(1) == 0
  failed_when: false
  ignore_errors: true
  timeout: "{{ knowledge_review_incident_timeout }}"
  when:
    - not ansible_check_mode
    - not (knowledge_review_aborted | bool)
    - knowledge_review_incident_eval_enabled | bool
  tags: [destructive]

- name: Save incident evaluation artifact
  ansible.builtin.copy:
    content: |
      # 障害の自動評価 {{ knowledge_review_started_at[:10] }}

      評価対象ミラー: {{ knowledge_review_incident_mirror_dir }}
      rc: {{ knowledge_review_incident_run.rc | default('n/a') }}

      ## 評価結果
      {{ knowledge_review_incident_run.stdout | default('(出力なし)') }}

      ## stderr
      {{ knowledge_review_incident_run.stderr | default('') }}
    dest: "{{ knowledge_review_incident_eval_dir }}/{{ knowledge_review_started_at[:10] }}-incident-evaluation.md"
    mode: "0640"
  when:
    - not ansible_check_mode
    - not (knowledge_review_aborted | bool)
    - knowledge_review_incident_eval_enabled | bool
  tags: [destructive]

# incident_index_write.yml(U4)へ渡すfact。評価が失敗・タイムアウト・skipの
# いずれでも必ず計算する(I-3「評価が失敗してもindexは必ず書く」の前提)。
# rc が未定義になるケース(timeoutで致命的失敗→ignore_errorsで継続、または
# --check/中止/無効化でタスク自体がskip)を確実にFAILED側へ倒すため default(-1)
# を使う(main.ymlの「Build summary」と同じ考え方。default(0)だと「正常終了」に
# 化ける)。incident_eval_artifact は成功時のみ実際のパス、それ以外は Python の
# None(JSON化すると null になることを自己検証済み — 空文字列にしない)。
- name: Determine incident evaluation outcome facts
  ansible.builtin.set_fact:
    incident_eval_rc: "{{ knowledge_review_incident_run.rc | default(-1) | int }}"
    incident_eval_artifact: >-
      {{ (knowledge_review_incident_eval_dir ~ '/' ~ knowledge_review_started_at[:10] ~ '-incident-evaluation.md')
         if (knowledge_review_incident_run.rc | default(-1) | int) == 0 else None }}

# incident_eval_index の各フィールドは .get()(ドット表記ではない)で読む。
# incident_metrics.yml が生成するdictへドット表記でアクセスすると、キーが
# 無い場合に「object of type 'dict' has no attribute」で即座に例外化する
# ことを自己検証で確認済み(2026-07-26のNone/Undefined混同事故と同種の罠)。
# .get() + default(..., true) なら値が無くても・null でも安全に既定値へ落ちる。
#
# 既知の無害な挙動: --check のとき「Run incident evaluation」はskipされ
# rc未定義となるため summary は FAILED になる(main.yml「Build summary」と同じ
# 扱い)。成果物・通知とも not ansible_check_mode でガードされるため外部影響は
# 無い。--check でFAILEDを見ても障害ではない。
- name: Determine incident evaluation summary
  ansible.builtin.set_fact:
    incident_eval_summary: >-
      {{ 'FAILED' if (incident_eval_rc | int) != 0
         else ('STALE' if (incident_eval_index.get('mirror_stale') | default(false, true) | bool)
         else ('NO_DATA' if ((incident_eval_index.get('mirror_bundle_total') | default(0, true) | int) == 0)
         else 'OK')) }}
