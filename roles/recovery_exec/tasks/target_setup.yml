---
# target_setup.yml: Sets up recovery-exec user, dispatch/action scripts,
# and SSH authorized_keys on each target node (authy, monnie).
# Called from main.yml when recovery_exec_setup_targets is true.
#
# Runs on: ansy/quory (for slurp + known_hosts) and delegates to target nodes.

# ---------------------------------------------------------------------------
# Read public keys generated by main.yml
# ---------------------------------------------------------------------------

# These three slurps are read-only (no host state change) but are gated with
# `when: not ansible_check_mode` anyway, contrary to the usual R5 pattern
# (TS-017) of keeping read-only diagnostics running under --check. Reason,
# verified empirically (decoy test, see the implement record): unlike
# command/shell without creates:/removes:, ansible.builtin.slurp is NOT
# auto-skipped under --check (it supports check_mode and always attempts the
# real read). On a fresh host where main.yml's key-generation tasks were
# themselves skipped under --check (they are gated, since key generation is
# destructive), the source .pub files do not exist yet, and an ungated slurp
# here would fail the whole --check run with "File not found" — not a
# downstream problem, a direct crash of this task. Gating the slurp itself is
# the only way to make --check safe on a never-deployed host.
- name: Slurp investigate public key
  ansible.builtin.slurp:
    src: "{{ recovery_exec_investigate_key }}.pub"
  register: _investigate_pubkey
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Slurp action public key
  ansible.builtin.slurp:
    src: "{{ recovery_exec_action_key }}.pub"
  register: _action_pubkey
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Slurp PVE investigate public key
  ansible.builtin.slurp:
    src: "{{ recovery_exec_investigate_pve_key }}.pub"
  register: _investigate_pve_pubkey
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# ---------------------------------------------------------------------------
# Per-target setup
# ---------------------------------------------------------------------------

- name: Create recovery-exec user on target nodes
  ansible.builtin.user:
    name: "{{ recovery_exec_user }}"
    shell: /bin/sh
    create_home: true
    password: "!"
    comment: "Recovery SSH landing account"
    groups: systemd-journal
    append: true
  loop: "{{ recovery_exec_targets }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Create .ssh directory on target nodes
  ansible.builtin.file:
    path: "/home/{{ recovery_exec_user }}/.ssh"
    state: directory
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0700"
  loop: "{{ recovery_exec_targets }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy investigate dispatch script on target nodes
  ansible.builtin.template:
    src: recovery-investigate-dispatch.sh.j2
    dest: /usr/local/sbin/recovery-investigate-dispatch.sh
    owner: root
    group: root
    mode: "0755"
  loop: "{{ recovery_exec_targets }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy recovery-loki-helper on target nodes with Loki (Loki横断ログ調査, AR-095〜AR-101)
  ansible.builtin.copy:
    src: recovery-loki-helper
    dest: /usr/local/sbin/recovery-loki-helper
    owner: root
    group: root
    mode: "0755"
  loop: "{{ recovery_exec_targets }}"
  loop_control:
    loop_var: target_item
  when:
    - "'loki' in target_item.investigate_services"
    - not ansible_check_mode
  delegate_to: "{{ target_item.name }}"
  become: true
  tags: [destructive]

- name: Deploy action script on target nodes
  ansible.builtin.template:
    src: recovery-action.sh.j2
    dest: /usr/local/sbin/recovery-action.sh
    owner: root
    group: root
    mode: "0755"
  loop: "{{ recovery_exec_targets }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy sudoers for recovery-exec on target nodes
  ansible.builtin.template:
    src: sudoers-recovery-exec-target.j2
    dest: /etc/sudoers.d/recovery-exec
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ recovery_exec_targets }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# THE authorized_keys distribution task at the center of the 2026-07-08
# incident. Its template (authorized_keys.j2) reads _investigate_pubkey and
# _action_pubkey (slurped above), so it is also gated to skip together with
# the slurp tasks under --check — but the incident-prevention mechanism
# itself is the hardcoded `quory` guard in main.yml/target_setup.yml's
# inclusion, not this `when:`. This `when:` only controls the check-mode
# dry-run/apply distinction; it does not relax or replace the quory guard.
# Phase 3 (dev_prod_boundary) added a third entry — the Claude Code
# investigate key (files/claude-investigate.pub, committed to the repo, read
# directly with lookup('file', ...) inside authorized_keys.j2 rather than
# slurped like the other two, since it is not generated per-run). It points
# at the same forced-command dispatch script as the existing investigate
# key; the two identities are distinguished only by which key they hold.
# deployment_drift_check_forced_command_keys (entries: 3) tracks this count.
- name: Deploy authorized_keys on target nodes (exactly 3 keys, drift-safe)
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "/home/{{ recovery_exec_user }}/.ssh/authorized_keys"
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0600"
  loop: "{{ recovery_exec_targets }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# ---------------------------------------------------------------------------
# Per-target setup: pve1/pve2 (investigate-only, no action key/script,
# read-only Proxmox investigation via a separate dedicated key — §4.6)
# ---------------------------------------------------------------------------

# pve_unreachable_handling (2026-08-16, R1-R3): pve1 has a scheduled weekday
# shutdown. Looping the six tasks below directly over
# recovery_exec_pve_targets with delegate_to: "{{ target_item.name }}"
# promotes a single unreachable loop item to a task-level UNREACHABLE, which
# aborts the play for quory before the remaining tasks run - even though the
# other pve node succeeded within the same loop (observed: task 675,
# 2026-08-11, rc=4; see requirement doc). This probe filters the loop target
# down to reachable nodes only, once, before any of the six tasks run.
#
# Q1 (probe method, decided here; decoy evidence in the implement record):
# wait_for's host/port TCP check, not ansible.builtin.ping + delegate_to +
# ignore_unreachable. ping would still require Ansible to establish a real
# connection to the delegate target for each loop item - the same
# delegate_to-loop shape that causes the UNREACHABLE promotion in the first
# place, and whether ignore_unreachable actually suppresses that promotion in
# a loop was unverified. wait_for takes only host/port as arguments, so its
# execution (delegated to localhost - i.e. wherever ansible-playbook itself
# runs; see the ansible_connection comment in
# inventories/homelab/host_vars/quory.yml for why this, and not
# inventory_hostname, is the host that must match where the six tasks'
# delegate_to connections actually originate from) never opens an Ansible
# connection to pve1/pve2 at all, so the UNREACHABLE-promotion machinery is
# never invoked for the probe itself. Confirmed with a decoy reproduction of
# both the failure and the fix (implement record).
#
# wait_for does not support check_mode (attributes.check_mode.support: none):
# without check_mode: false it auto-skips under --check, and a skipped
# result's `failed` key is still false - which would make the reachability
# calculation below misreport every pve target as reachable under --check
# (confirmed via decoy). check_mode: false forces a real TCP probe every
# time; it is read-only (a socket connect, no state left on either side) so
# always running it under --check is safe (same reasoning as TS-017).
- name: Probe TCP reachability of pve target nodes (explicit probe; establishes no Ansible connection to the target)
  ansible.builtin.wait_for:
    host: "{{ target_item.host }}"
    port: 22
    timeout: "{{ recovery_exec_pve_probe_timeout }}"
    state: started
  loop: "{{ recovery_exec_pve_targets }}"
  loop_control:
    loop_var: target_item
  register: recovery_exec_pve_probe
  ignore_errors: true
  delegate_to: localhost
  become: false
  check_mode: false

- name: Compute reachable/unreachable pve target lists
  ansible.builtin.set_fact:
    recovery_exec_pve_targets_reachable: >-
      {{ recovery_exec_pve_probe.results
         | selectattr('failed', 'equalto', false)
         | map(attribute='target_item') | list }}
    recovery_exec_pve_targets_unreachable: >-
      {{ recovery_exec_pve_probe.results
         | selectattr('failed', 'equalto', true)
         | map(attribute='target_item') | list }}

# R3: both the targeted and the excluded hosts must be readable from the
# output by name, including the all-excluded case (AC3 - not a silent
# success).
- name: Show which pve target nodes are targeted vs excluded this run
  ansible.builtin.debug:
    msg:
      - "対象としたpveホスト: {{ _reachable_names | join(', ') if (_reachable_names | length > 0) else '(なし)' }}"
      - "外したpveホスト    : {{ _unreachable_names | join(', ') if (_unreachable_names | length > 0) else '(なし)' }}"
  vars:
    _reachable_names: "{{ recovery_exec_pve_targets_reachable | map(attribute='name') | list }}"
    _unreachable_names: "{{ recovery_exec_pve_targets_unreachable | map(attribute='name') | list }}"

- name: Create recovery-exec user on pve target nodes
  ansible.builtin.user:
    name: "{{ recovery_exec_user }}"
    shell: /bin/sh
    create_home: true
    password: "!"
    comment: "Recovery SSH landing account (Proxmox investigation, read-only)"
  loop: "{{ recovery_exec_pve_targets_reachable }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Create .ssh directory on pve target nodes
  ansible.builtin.file:
    path: "/home/{{ recovery_exec_user }}/.ssh"
    state: directory
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0700"
  loop: "{{ recovery_exec_pve_targets_reachable }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy investigate dispatch script on pve target nodes
  ansible.builtin.template:
    src: recovery-investigate-dispatch-pve.sh.j2
    dest: /usr/local/sbin/recovery-investigate-dispatch-pve.sh
    owner: root
    group: root
    mode: "0755"
  loop: "{{ recovery_exec_pve_targets_reachable }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy sudoers for recovery-exec read-only investigation on pve target nodes
  ansible.builtin.template:
    src: sudoers-recovery-exec-pve-target.j2
    dest: /etc/sudoers.d/recovery-exec-pve
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ recovery_exec_pve_targets_reachable }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# Same rationale as "Deploy authorized_keys on target nodes" above: consumes
# _investigate_pve_pubkey (slurped above), gated to skip together with it
# under --check. The quory guard (main.yml) is the incident-prevention
# mechanism; this `when:` only governs check-mode dry-run/apply.
# Phase 3 added a second entry — the Claude Code pve investigate key
# (files/claude-investigate-pve.pub, committed to the repo, read via
# lookup('file', ...) in authorized_keys-pve.j2), pointing at the same
# forced-command dispatch script as the existing investigate-only key.
# deployment_drift_check_forced_command_keys (entries: 2) tracks this count.
- name: Deploy authorized_keys on pve target nodes (2 keys - Codex + Claude Code investigate, drift-safe)
  ansible.builtin.template:
    src: authorized_keys-pve.j2
    dest: "/home/{{ recovery_exec_user }}/.ssh/authorized_keys"
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0600"
  loop: "{{ recovery_exec_pve_targets_reachable }}"
  loop_control:
    loop_var: target_item
  delegate_to: "{{ target_item.name }}"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# ---------------------------------------------------------------------------
# known_hosts on ansy/quory for both keys
# ---------------------------------------------------------------------------

# `key:` embeds lookup('pipe', 'ssh-keyscan -H ' + target_item.host) — a live
# network probe against the target, executed at task-argument-templating
# time. Ansible evaluates `when:` before templating the rest of a task's
# args, so gating this task also prevents the ssh-keyscan probe itself from
# firing under --check (verified against documented Ansible executor
# behavior; not just the known_hosts write is skipped, the probe never
# runs). Also protects "Set known_hosts ownership" below: on a fresh host
# where this task is skipped, the known_hosts file may not exist yet, and
# that ownership task is gated identically so it skips together rather than
# failing on a nonexistent path (implicit state=file).
- name: Add target host keys to recovery-exec known_hosts
  ansible.builtin.known_hosts:
    name: "{{ target_item.host }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -H ' + target_item.host) }}"
    path: "{{ recovery_exec_ssh_dir }}/known_hosts"
    state: present
  loop: "{{ recovery_exec_targets }}"
  loop_control:
    loop_var: target_item
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Add pve target host keys to recovery-exec known_hosts
  ansible.builtin.known_hosts:
    name: "{{ target_item.host }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -H ' + target_item.host) }}"
    path: "{{ recovery_exec_ssh_dir }}/known_hosts"
    state: present
  loop: "{{ recovery_exec_pve_targets_reachable }}"
  loop_control:
    loop_var: target_item
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Set known_hosts ownership
  ansible.builtin.file:
    path: "{{ recovery_exec_ssh_dir }}/known_hosts"
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0644"
  become: true
  when: not ansible_check_mode
  tags: [destructive]
