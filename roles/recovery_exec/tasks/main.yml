---
# recovery_exec: Codex runner for autonomous recovery pipeline (§4.2)
#
# Creates recovery-exec user, generates two shared SSH keys (investigate/action),
# deploys wrapper scripts, Codex config and AGENTS.md.
# Calls target_setup.yml to register keys and deploy scripts on authy/monnie.
#
# Authentication: Codex uses browser OAuth. The token is stored in
# /home/recovery-exec/.codex/ (managed by Codex itself). No API key required.

# ---------------------------------------------------------------------------
# Service user (home at /home/recovery-exec for SSH config + Codex config)
# ---------------------------------------------------------------------------

- name: Create recovery-exec user (restricted shell, home in /home)
  ansible.builtin.user:
    name: "{{ recovery_exec_user }}"
    shell: /bin/sh
    create_home: true
    home: "{{ recovery_exec_home }}"
    password: "!"
    comment: "Recovery Codex runner service account"
  become: true

# ---------------------------------------------------------------------------
# SSH key directories
# ---------------------------------------------------------------------------

- name: Create .ssh directory for recovery-exec
  ansible.builtin.file:
    path: "{{ recovery_exec_ssh_dir }}"
    state: directory
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0700"
  become: true

- name: Generate investigation SSH key (shared, parameterized forced command)
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519 -N ''
      -C "recovery-investigate"
      -f {{ recovery_exec_investigate_key }}
    creates: "{{ recovery_exec_investigate_key }}"
  become: true

- name: Generate action SSH key (shared, fixed forced commands)
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519 -N ''
      -C "recovery-action"
      -f {{ recovery_exec_action_key }}
    creates: "{{ recovery_exec_action_key }}"
  become: true

- name: Generate PVE investigation SSH key (shared across pve1/pve2, read-only cluster/HA status only)
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519 -N ''
      -C "recovery-investigate-pve"
      -f {{ recovery_exec_investigate_pve_key }}
    creates: "{{ recovery_exec_investigate_pve_key }}"
  become: true

- name: Lock down SSH key permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0600"
  loop:
    - "{{ recovery_exec_investigate_key }}"
    - "{{ recovery_exec_action_key }}"
    - "{{ recovery_exec_investigate_pve_key }}"
  become: true

# ---------------------------------------------------------------------------
# Codex configuration directory (OAuth token stored here by Codex itself)
# ---------------------------------------------------------------------------

- name: Create .codex directory (OAuth token stored by Codex)
  ansible.builtin.file:
    path: "{{ recovery_exec_codex_dir }}"
    state: directory
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0700"
  become: true

- name: Deploy Codex config.toml (model + execpolicy)
  ansible.builtin.template:
    src: codex-config.toml.j2
    dest: "{{ recovery_exec_codex_dir }}/config.toml"
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0600"
  become: true

# ---------------------------------------------------------------------------
# Codex execution wrapper (restricts args to "exec" subcommand only)
# ---------------------------------------------------------------------------

- name: Deploy codex-exec-wrapper
  ansible.builtin.template:
    src: codex-exec-wrapper.j2
    dest: "{{ recovery_exec_codex_wrapper }}"
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0500"
  become: true

# ---------------------------------------------------------------------------
# Workspace + AGENTS.md (Codex reads this for tool documentation)
# ---------------------------------------------------------------------------

- name: Create Codex workspace directory
  ansible.builtin.file:
    path: "{{ recovery_exec_workspace }}"
    state: directory
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0770"
  become: true

- name: Add group members to recovery-exec group (for workspace read/write)
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ recovery_exec_user }}"
    append: true
  loop: "{{ recovery_exec_group_members }}"
  become: true

- name: Deploy AGENTS.md (tool documentation for Codex)
  ansible.builtin.template:
    src: AGENTS.md.j2
    dest: "{{ recovery_exec_workspace }}/AGENTS.md"
    owner: "{{ recovery_exec_user }}"
    group: "{{ recovery_exec_user }}"
    mode: "0640"
  become: true

# ---------------------------------------------------------------------------
# Local wrapper scripts: homelab-investigate-* and homelab-recover-*
# ---------------------------------------------------------------------------

- name: Deploy homelab-investigate-* wrapper scripts
  ansible.builtin.template:
    src: homelab-investigate.sh.j2
    dest: "/usr/local/bin/homelab-investigate-{{ target.name }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ recovery_exec_targets }}"
  loop_control:
    loop_var: target
  become: true

- name: Deploy homelab-investigate-pve{1,2} wrapper scripts (read-only cluster/HA status)
  ansible.builtin.template:
    src: homelab-investigate-pve.sh.j2
    dest: "/usr/local/bin/homelab-investigate-{{ target.name }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ recovery_exec_pve_targets }}"
  loop_control:
    loop_var: target
  become: true

- name: Deploy homelab-recover-* wrapper scripts
  ansible.builtin.copy:
    src: "homelab-recover-{{ item.name }}"
    dest: "/usr/local/bin/homelab-recover-{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ recovery_exec_targets }}"
  become: true

- name: Deploy homelab-monitoring-{pause,resume,status} scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - homelab-monitoring-pause
    - homelab-monitoring-resume
    - homelab-monitoring-status
  become: true

# ---------------------------------------------------------------------------
# Investigation helpers: reports/ JSON lookup + Semaphore failure lookup
# (quory-local; no SSH hop to a target node).
#
# These do NOT use sudo: Codex invokes them inside a sandbox with
# no_new_privileges set, which blocks sudo unconditionally regardless of
# sudoers config (confirmed via a live failure: "sudo: The 'no new
# privileges' flag is set, which prevents sudo from running as root").
# Access to otherwise-unreadable paths is instead granted via POSIX ACL,
# which is a plain permission bit recovery-exec's own UID already holds
# (no escalation happens), so no_new_privileges does not affect it.
# ---------------------------------------------------------------------------

- name: Install acl package (setfacl/getfacl, needed for ansible.posix.acl)
  ansible.builtin.apt:
    name: acl
    state: present
  become: true

- name: Grant recovery-exec ACL traverse on /home/yoshi (for reports/ read access, no sudo)
  ansible.posix.acl:
    path: /home/yoshi
    entity: "{{ recovery_exec_user }}"
    etype: user
    permissions: x
    state: present
  become: true

- name: Grant recovery-exec ACL traverse on /var/lib/semaphore (no sudo)
  ansible.posix.acl:
    path: /var/lib/semaphore
    entity: "{{ recovery_exec_user }}"
    etype: user
    permissions: x
    state: present
  become: true

- name: Grant recovery-exec ACL read on semaphore.db (no sudo; journal_mode=delete, no -wal/-shm to also grant)
  ansible.posix.acl:
    path: /var/lib/semaphore/semaphore.db
    entity: "{{ recovery_exec_user }}"
    etype: user
    permissions: r
    state: present
  become: true

- name: Deploy homelab-reports wrapper (Codex-facing, validates then reads directly)
  ansible.builtin.copy:
    src: homelab-reports
    dest: /usr/local/bin/homelab-reports
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy recovery-reports-helper (privileged, re-validates independently)
  ansible.builtin.copy:
    src: recovery-reports-helper
    dest: /usr/local/sbin/recovery-reports-helper
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy homelab-semaphore-query wrapper (fixed queries, reads semaphore.db directly)
  ansible.builtin.copy:
    src: homelab-semaphore-query
    dest: /usr/local/bin/homelab-semaphore-query
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Remove legacy homelab-mute-exec wrapper
  ansible.builtin.file:
    path: /usr/local/bin/homelab-mute-exec
    state: absent
  become: true

- name: Remove legacy sudoers for mute-exec
  ansible.builtin.file:
    path: /etc/sudoers.d/recovery-exec-mute
    state: absent
  become: true

- name: Remove legacy sudoers for recovery-exec investigation helpers (replaced by ACL; sudo is blocked by Codex sandbox's no_new_privileges)
  ansible.builtin.file:
    path: /etc/sudoers.d/recovery-exec-investigate
    state: absent
  become: true

# ---------------------------------------------------------------------------
# Target node setup (authy/monnie)
# ---------------------------------------------------------------------------

- name: Setup recovery-exec on target nodes
  ansible.builtin.include_tasks: target_setup.yml
  when: recovery_exec_setup_targets | default(true) | bool
