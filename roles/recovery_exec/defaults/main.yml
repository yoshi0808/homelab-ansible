---
recovery_exec_user: recovery-exec
recovery_exec_home: /home/recovery-exec
recovery_exec_ssh_dir: /home/recovery-exec/.ssh
recovery_exec_codex_dir: /home/recovery-exec/.codex
recovery_exec_workspace: /var/lib/recovery-exec/workspace
recovery_exec_investigate_key: /home/recovery-exec/.ssh/id_recovery_investigate
recovery_exec_action_key: /home/recovery-exec/.ssh/id_recovery_action
# Separate dedicated key for pve1/pve2 (read-only cluster/HA/replication/
# VM/task/storage/ZFS/journal investigation only).
# Kept apart from recovery_exec_investigate_key: the allowlist contents are
# completely different (pvesh/ha-manager vs freeradius/journal checks), so a
# distinct key prevents mixing up which host a compromised/misused key could
# reach.
recovery_exec_investigate_pve_key: /home/recovery-exec/.ssh/id_recovery_investigate_pve
recovery_exec_codex_bin: /usr/bin/codex
recovery_exec_codex_wrapper: /usr/local/bin/codex-exec-wrapper
recovery_exec_codex_model: gpt-5.5

# Set to false to skip target node setup (e.g. when target is unreachable, or
# when running from a non-production controller like ansy for local-only
# verification). Left true, target distribution is still gated in
# tasks/main.yml to quory only — a restricted -l ansy run cannot clobber the
# production controller's key on targets even if this stays at its true
# default (2026-07-08 incident, see
# docs/ai/reviews/autonomous_recovery/2026-07-11_002_ssh_key_investigation.md).
#
# NOTE: the identity of the one host allowed to distribute target
# authorized_keys is intentionally NOT a variable here (there is no
# recovery_exec_setup_authoritative_host default). A role default — like any
# variable — can be overridden by an extra var at the CLI (-e ...), which
# has higher precedence than role defaults. A 2026-07-11 review caught that
# exact gap: `-e recovery_exec_setup_authoritative_host=ansy` would have let
# ansy pass both the assert and the include guard in tasks/main.yml,
# reproducing the original incident through the "fix" itself. The trust
# anchor for who may overwrite this shared credential must not be something
# the invoker can change with a flag, so it is hardcoded as the literal
# `quory` at both check sites in tasks/main.yml instead.
recovery_exec_setup_targets: true

# Users to add to the recovery-exec group (for workspace read access).
# recovery-probe runs as yoshi and needs to read the monitoring pause flag.
recovery_exec_group_members: []

# Per-node investigation and action configuration.
# investigate_services: services for which check/journal-<svc>/status are allowed.
# action_services:      services restarted by the action wrapper (all at once).
#
# Loki横断ログ調査(loki-count / loki-window, AR-095〜AR-101)は、固定named
# checkとして dispatch/wrapper template側で直接case文に追加してあり、
# investigate_extra の仕組み(name/cmd固定文字列)ではparameterを取れない
# ため使っていない。有効化の条件は "investigate_services に 'loki' を含む
# target であること" のみで(recovery-loki-helperの配備も同条件でtarget_
# setup.ymlがgateする)、この配下のtarget一覧に新しいkeyは増やしていない
# — monnieの`- loki`エントリを外すとLoki調査も同時に無効化される。
recovery_exec_targets:
  - name: authy
    host: authy.internal
    investigate_services:
      - freeradius
      - sshd
    investigate_extra:
      - name: radius-port
        cmd: "ss -ltnup | grep -E '1812|1813' || echo 'no RADIUS ports listening'"
      - name: radius-config-check
        cmd: "sudo freeradius -XC 2>&1"
    action_services:
      - freeradius
  - name: monnie
    host: monnie.internal
    investigate_services:
      - prometheus
      - grafana-server
      - loki
      - unpoller
    investigate_extra:
      - name: prometheus-targets
        cmd: "curl -fsS --max-time 10 http://localhost:9090/api/v1/targets || echo 'prometheus-targets: request failed or timed out'"
      - name: grafana-health
        cmd: "curl -fsS --max-time 10 https://monnie.internal:3000/api/health || echo 'grafana-health: request failed or timed out'"
      - name: loki-health
        cmd: "curl -fsS --max-time 10 http://localhost:3100/metrics | head -10 || echo 'loki-health: request failed or timed out'"
      - name: unpoller-config
        cmd: "systemctl show unpoller --property=ExecStart --no-pager; echo '---'; ss -ltnup | grep 9130 || echo 'port 9130 not listening'"
    action_services:
      - prometheus
      - grafana-server
      - loki
      - unpoller

# Proxmox investigate-only targets (read-only; pve1/pve2
# are out of scope for autonomous recovery actions — see
# autonomous_recovery_policy.md §2/§4.6). No investigate_extra, no
# action_services: only the fixed 12 and validated parameterized 9 named
# checks in recovery-investigate-dispatch-pve.sh.j2 are ever allowed.
recovery_exec_pve_targets:
  - name: pve1
    host: pve1.internal
  - name: pve2
    host: pve2.internal
