---
# Runs radius-healthcheck.sh, parses output, classifies results, builds report.
# Does NOT send Slack notifications, save the report, or fail — callers
# decide what to do with the result (mirrors monitoring_healthcheck's split,
# extracted 2026-07-11 so ubuntu_vm_full_upgrade can reuse this without the
# side effects radius_healthcheck.yml's own main.yml still performs).
# Exports: radius_health, radius_criticals, radius_warnings, radius_report

- name: Copy radius healthcheck script
  ansible.builtin.copy:
    src: radius-healthcheck.sh
    dest: /usr/local/sbin/radius-healthcheck.sh
    mode: "0750"
    owner: root
    group: root

- name: Run radius healthcheck
  ansible.builtin.command:
    cmd: /usr/local/sbin/radius-healthcheck.sh
  register: healthcheck_raw
  changed_when: false

- name: Fail if healthcheck returned no output
  ansible.builtin.fail:
    msg: "radius-healthcheck.sh on {{ inventory_hostname }} returned empty output (rc={{ healthcheck_raw.rc }}). Run the script manually on the host to diagnose."
  when: healthcheck_raw.stdout | length == 0

- name: Parse healthcheck JSON
  ansible.builtin.set_fact:
    radius_health: "{{ healthcheck_raw.stdout | from_json }}"

- name: Classify criticals and warnings
  ansible.builtin.set_fact:
    radius_criticals: "{{ []
      + ([] if radius_health.freeradius.service_active == 'active'
             else ['freeradius service is not active: ' + radius_health.freeradius.service_active])
      + ([] if radius_health.ports.udp_1812 == 'yes'
             else ['port 1812/udp is not listening'])
      + ([] if radius_health.ports.udp_1813 == 'yes'
             else ['port 1813/udp is not listening'])
      + ([] if radius_health.memory.collection_ok
             else ['memory collection failed (free -b returned no data)'])
      + ([] if radius_health.memory.used_percent | int < 90
             else ['memory used_percent is ' + (radius_health.memory.used_percent | string) + '%'])
      + ([] if radius_health.disk.collection_ok
             else ['disk collection failed (df -B1 -P / returned no data)'])
      + ([] if radius_health.disk.used_percent | int < 90
             else ['disk used_percent is ' + (radius_health.disk.used_percent | string) + '%'])
      }}"
    radius_warnings: "{{ []
      + ([] if radius_health.journal.error_count_1h | int == 0
             else ['journal errors in last 1h: ' + (radius_health.journal.error_count_1h | string)])
      + ([] if radius_health.memory.used_percent | int < 80 or radius_health.memory.used_percent | int >= 90
             else ['memory used_percent is ' + (radius_health.memory.used_percent | string) + '%'])
      + ([] if radius_health.disk.used_percent | int < 80 or radius_health.disk.used_percent | int >= 90
             else ['disk used_percent is ' + (radius_health.disk.used_percent | string) + '%'])
      }}"

- name: Build report
  ansible.builtin.set_fact:
    radius_report:
      host: "{{ inventory_hostname }}"
      collected_at: "{{ radius_health.collected_at }}"
      freeradius:
        service_active: "{{ radius_health.freeradius.service_active }}"
        version: "{{ radius_health.freeradius.version }}"
      ports:
        udp_1812: "{{ radius_health.ports.udp_1812 }}"
        udp_1813: "{{ radius_health.ports.udp_1813 }}"
      journal:
        error_count_1h: "{{ radius_health.journal.error_count_1h }}"
        errors: "{{ radius_health.journal.errors }}"
      memory:
        collection_ok: "{{ radius_health.memory.collection_ok }}"
        total_mb: "{{ radius_health.memory.total_mb }}"
        used_mb: "{{ radius_health.memory.used_mb }}"
        available_mb: "{{ radius_health.memory.available_mb }}"
        used_percent: "{{ radius_health.memory.used_percent }}"
      disk:
        collection_ok: "{{ radius_health.disk.collection_ok }}"
        total_mb: "{{ radius_health.disk.total_mb }}"
        used_mb: "{{ radius_health.disk.used_mb }}"
        available_mb: "{{ radius_health.disk.available_mb }}"
        used_percent: "{{ radius_health.disk.used_percent }}"
      result:
        status: "{{ 'CRITICAL' if radius_criticals | length > 0
                    else ('WARNING' if radius_warnings | length > 0
                    else 'OK') }}"
        criticals: "{{ radius_criticals }}"
        warnings: "{{ radius_warnings }}"

- name: Print health summary
  ansible.builtin.debug:
    msg:
      - "Host    : {{ inventory_hostname }}"
      - "Status  : {{ radius_report.result.status }}"
      - "Service : freeradius={{ radius_health.freeradius.service_active }} version={{ radius_health.freeradius.version }}"
      - "Ports   : 1812/udp={{ radius_health.ports.udp_1812 }} 1813/udp={{ radius_health.ports.udp_1813 }}"
      - "Journal : error_count_1h={{ radius_health.journal.error_count_1h }}"
      - "Memory  : collection_ok={{ radius_health.memory.collection_ok }} total={{ radius_health.memory.total_mb }}MB used={{ radius_health.memory.used_mb }}MB available={{ radius_health.memory.available_mb }}MB used_percent={{ radius_health.memory.used_percent }}%"
      - >-
        Disk    : collection_ok={{ radius_health.disk.collection_ok }}
        total={{ radius_health.disk.total_mb }}MB
        used={{ radius_health.disk.used_mb }}MB
        available={{ radius_health.disk.available_mb }}MB
        used_percent={{ radius_health.disk.used_percent }}%
      - "Criticals: {{ radius_criticals }}"
      - "Warnings : {{ radius_warnings }}"
