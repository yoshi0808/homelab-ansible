---
- name: Reject the removed dry_run argument
  ansible.builtin.assert:
    that: dry_run is not defined
    fail_msg: >-
      dry_run is no longer supported. Use Ansible --check (Semaphore UI Dry
      Run) for read-only diagnostics, or omit --check for an approved normal
      upgrade/rollback.
  tags: [always]

- name: Require exactly one Semaphore upgrade target
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all | length == 1
    fail_msg: >-
      semaphore_upgrade requires exactly one target host. Select one host with
      --limit before running diagnostics, upgrade, or rollback.
  tags: [always]

- name: Validate Semaphore upgrade inputs
  ansible.builtin.assert:
    that:
      - semaphore_upgrade_target_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - semaphore_upgrade_target_edition in ['community', 'pro']
      - semaphore_upgrade_rollback_to | length == 0 or semaphore_upgrade_rollback_to is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: >-
      target version/edition must be valid. Rollback requires -e rollback=true.

- name: Validate detached job wait timeout
  ansible.builtin.assert:
    that:
      - semaphore_upgrade_job_wait_timeout | string is match('^[0-9]+$')
      - semaphore_upgrade_job_wait_timeout | int > 0
      - semaphore_upgrade_job_wait_timeout | int <= 600
    fail_msg: >-
      semaphore_upgrade_job_wait_timeout must be an integer from 1 through 600
      seconds. Got {{ semaphore_upgrade_job_wait_timeout }}.

- name: Decide detached notification suppression in Ansible
  ansible.builtin.set_fact:
    semaphore_upgrade_notifications_suppressed: >-
      {{ skip_notifications | default(false) | bool
         or ansible_check_mode
         or (lookup('env', 'CLAUDECODE') | default('', true) | trim | length > 0) }}

- name: Diagnose Semaphore rollback
  ansible.builtin.include_tasks: rollback_diagnose.yml
  when: semaphore_upgrade_rollback | bool

- name: Diagnose Semaphore upgrade
  ansible.builtin.include_tasks: upgrade_diagnose.yml
  when: not (semaphore_upgrade_rollback | bool)

- name: Run normal Semaphore rollback preparation
  ansible.builtin.include_tasks:
    file: rollback.yml
    apply:
      tags: [destructive]
  when:
    - semaphore_upgrade_rollback | bool
    - not ansible_check_mode
  tags: [destructive]

- name: Run normal Semaphore upgrade preparation
  ansible.builtin.include_tasks:
    file: upgrade.yml
    apply:
      tags: [destructive]
  when:
    - not (semaphore_upgrade_rollback | bool)
    - not ansible_check_mode
  tags: [destructive]
