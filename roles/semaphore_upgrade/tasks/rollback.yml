---
- name: Set normal rollback transaction generation
  ansible.builtin.set_fact:
    semaphore_upgrade_rollback_generation: >-
      {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y%m%dT%H%M%S+0900'") }}

- name: Identify launching rollback job
  ansible.builtin.include_tasks: capture_origin.yml
  vars:
    semaphore_upgrade_origin_reading_path_available: "{{ semaphore_upgrade_rollback_reading_path_available }}"
    semaphore_upgrade_origin_query_user: >-
      {{ semaphore_upgrade_rollback_query_user_raw.stdout | default('') | trim }}

- name: Create pre-rollback backup directory
  ansible.builtin.file:
    path: "{{ semaphore_upgrade_backup_root }}/{{ semaphore_upgrade_rollback_generation }}-pre-rollback"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write rollback transaction metadata
  ansible.builtin.copy:
    dest: "{{ semaphore_upgrade_backup_root }}/{{ semaphore_upgrade_rollback_generation }}-pre-rollback/rollback.json"
    owner: root
    group: root
    mode: "0600"
    content: >-
      {{ semaphore_upgrade_rollback_source | combine({
        'mode': 'rollback',
        'origin_job_id': semaphore_upgrade_origin_job_id,
        'job_wait_timeout': semaphore_upgrade_job_wait_timeout | int,
        'pre_rollback_dir': semaphore_upgrade_backup_root + '/' + semaphore_upgrade_rollback_generation + '-pre-rollback',
        'webhook_file': semaphore_upgrade_webhook_file,
        'notification_suppress_marker': semaphore_upgrade_notification_suppress_marker,
        'skip_notifications': semaphore_upgrade_notifications_suppressed | bool,
        'skip_reading_path_check': not (semaphore_upgrade_rollback_reading_path_available | bool),
        'query_user': (semaphore_upgrade_rollback_query_user_raw.stdout | trim)
          if semaphore_upgrade_rollback_reading_path_available else '',
        'query_baseline_keys': semaphore_upgrade_rollback_query_baseline_keys | default([]),
        'service_owner': (semaphore_upgrade_rollback_service_owner.stdout | trim)
          if semaphore_upgrade_rollback_reading_path_available else semaphore_upgrade_rollback_source.service_owner,
        'result_file': semaphore_upgrade_result_file
      }) | to_nice_json }}

- name: Set detached rollback config path
  ansible.builtin.set_fact:
    semaphore_upgrade_detached_config: "{{ semaphore_upgrade_backup_root }}/{{ semaphore_upgrade_rollback_generation }}-pre-rollback/rollback.json"

- name: Prepare and start detached rollback transaction
  ansible.builtin.include_tasks: prepare_detached.yml
