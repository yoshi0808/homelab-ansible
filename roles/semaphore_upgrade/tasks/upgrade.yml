---
- name: Set normal upgrade transaction generation
  ansible.builtin.set_fact:
    semaphore_upgrade_generation: >-
      {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y%m%dT%H%M%S+0900'") }}

- name: Set transaction paths
  ansible.builtin.set_fact:
    semaphore_upgrade_backup_dir: "{{ semaphore_upgrade_backup_root }}/{{ semaphore_upgrade_generation }}-from-{{ semaphore_upgrade_current_version }}"
    semaphore_upgrade_work_dir: "{{ semaphore_upgrade_work_root }}/{{ semaphore_upgrade_generation }}"

- name: Create transaction directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ semaphore_upgrade_backup_dir }}"
    - "{{ semaphore_upgrade_work_dir }}"

- name: Collect current database ownership and mode
  ansible.builtin.stat:
    path: "{{ semaphore_upgrade_db }}"
  register: semaphore_upgrade_current_db

- name: Download both current-edition candidates and target package
  ansible.builtin.get_url:
    url: "{{ semaphore_upgrade_release_base }}/v{{ item.version }}/{{ item.name }}"
    dest: "{{ semaphore_upgrade_work_dir }}/{{ item.name }}"
    mode: "0600"
    checksum: "{{ ('sha256:' + semaphore_upgrade_target_deb_sha256) if item.target else omit }}"
  loop:
    - version: "{{ semaphore_upgrade_current_version }}"
      name: "semaphore_{{ semaphore_upgrade_current_version }}_linux_amd64.deb"
      target: false
    - version: "{{ semaphore_upgrade_current_version }}"
      name: "semaphore_community_{{ semaphore_upgrade_current_version }}_linux_amd64.deb"
      target: false
    - version: "{{ semaphore_upgrade_target_version }}"
      name: "semaphore_{{ 'community_' if semaphore_upgrade_target_edition == 'community' else '' }}{{ semaphore_upgrade_target_version }}_linux_amd64.deb"
      target: true
  register: semaphore_upgrade_downloads

- name: Extract candidate packages for edition verification
  ansible.builtin.command:
    argv:
      - dpkg-deb
      - --extract
      - "{{ semaphore_upgrade_work_dir }}/{{ item }}"
      - "{{ semaphore_upgrade_work_dir }}/extract-{{ item | regex_replace('[^A-Za-z0-9]+', '-') }}"
  loop:
    - "semaphore_{{ semaphore_upgrade_current_version }}_linux_amd64.deb"
    - "semaphore_community_{{ semaphore_upgrade_current_version }}_linux_amd64.deb"
    - "semaphore_{{ 'community_' if semaphore_upgrade_target_edition == 'community' else '' }}{{ semaphore_upgrade_target_version }}_linux_amd64.deb"
  changed_when: false

- name: Check candidate binary hashes
  ansible.builtin.stat:
    path: "{{ semaphore_upgrade_work_dir }}/extract-{{ item | regex_replace('[^A-Za-z0-9]+', '-') }}/usr/bin/semaphore"
    checksum_algorithm: sha256
  loop:
    - "semaphore_{{ semaphore_upgrade_current_version }}_linux_amd64.deb"
    - "semaphore_community_{{ semaphore_upgrade_current_version }}_linux_amd64.deb"
    - "semaphore_{{ 'community_' if semaphore_upgrade_target_edition == 'community' else '' }}{{ semaphore_upgrade_target_version }}_linux_amd64.deb"
  register: semaphore_upgrade_candidate_hashes

- name: Determine current edition and verify target binary
  ansible.builtin.set_fact:
    semaphore_upgrade_current_edition: >-
      {{ 'pro' if semaphore_upgrade_current_binary.stat.checksum == semaphore_upgrade_candidate_hashes.results[0].stat.checksum
         else 'community' if semaphore_upgrade_current_binary.stat.checksum == semaphore_upgrade_candidate_hashes.results[1].stat.checksum
         else 'unknown' }}
    semaphore_upgrade_target_hash_observed: "{{ semaphore_upgrade_candidate_hashes.results[2].stat.checksum }}"

- name: Fail closed on unknown edition or target mismatch
  ansible.builtin.assert:
    that:
      - semaphore_upgrade_current_edition != 'unknown'
      - semaphore_upgrade_target_hash_observed == semaphore_upgrade_target_binary_sha256
    fail_msg: "Current edition is unknown or target package binary hash is not the pinned edition hash."

- name: Check Pro-only state before an edition switch
  ansible.builtin.command:
    argv:
      - sqlite3
      - "{{ semaphore_upgrade_db }}"
      - >-
        select count(*) from runner;
        select count(*) from project__template
        where coalesce(executor_image, '') != '';
  register: semaphore_upgrade_pro_state_raw
  changed_when: false

- name: Refuse community switch while Pro-only state is present
  ansible.builtin.assert:
    that:
      - semaphore_upgrade_pro_state_raw.stdout_lines | length == 2
      - semaphore_upgrade_pro_state_raw.stdout_lines | select('equalto', '0') | list | length == 2
    fail_msg: "runner or executor_image state exists; refusing the Pro-to-community switch."
  when:
    - semaphore_upgrade_current_edition == 'pro'
    - semaphore_upgrade_target_edition == 'community'

- name: Create online database backup
  ansible.builtin.command:
    argv:
      - sqlite3
      - "{{ semaphore_upgrade_db }}"
      - ".backup '{{ semaphore_upgrade_backup_dir }}/semaphore.db'"
  changed_when: true

- name: Back up config and current binary
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ semaphore_upgrade_backup_dir }}/{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: preserve
  loop:
    - { src: "{{ semaphore_upgrade_config }}", dest: config.json }
    - { src: "{{ semaphore_upgrade_binary }}", dest: semaphore.bin }

- name: Identify launching job before package installation
  ansible.builtin.include_tasks: capture_origin.yml
  vars:
    semaphore_upgrade_origin_reading_path_available: "{{ semaphore_upgrade_reading_path_available }}"
    semaphore_upgrade_origin_query_user: "{{ semaphore_upgrade_query_user_raw.stdout | trim }}"

- name: Write detached transaction metadata
  ansible.builtin.copy:
    dest: "{{ semaphore_upgrade_backup_dir }}/transaction.json"
    owner: root
    group: root
    mode: "0600"
    content: >-
      {{ {
        'mode': 'upgrade',
        'origin_job_id': semaphore_upgrade_origin_job_id,
        'job_wait_timeout': semaphore_upgrade_job_wait_timeout | int,
        'service': semaphore_upgrade_service,
        'binary': semaphore_upgrade_binary,
        'db': semaphore_upgrade_db,
        'db_uid': semaphore_upgrade_current_db.stat.uid,
        'db_gid': semaphore_upgrade_current_db.stat.gid,
        'db_mode': semaphore_upgrade_current_db.stat.mode,
        'backup_dir': semaphore_upgrade_backup_dir,
        'current_version': semaphore_upgrade_current_version,
        'current_binary_sha256': semaphore_upgrade_current_binary.stat.checksum,
        'current_edition': semaphore_upgrade_current_edition,
        'target_version': semaphore_upgrade_target_version,
        'target_binary_sha256': semaphore_upgrade_target_binary_sha256,
        'target_edition': semaphore_upgrade_target_edition,
        'http_url': semaphore_upgrade_http_url,
        'health_timeout': semaphore_upgrade_health_timeout,
        'stability_seconds': semaphore_upgrade_stability_seconds,
        'query_command': semaphore_upgrade_query_command,
        'query_user': semaphore_upgrade_query_user_raw.stdout | trim,
        'query_baseline_keys': semaphore_upgrade_query_baseline_keys,
        'skip_reading_path_check': not (semaphore_upgrade_reading_path_available | bool),
        'service_owner': semaphore_upgrade_service_owner.stdout | trim,
        'baseline': {
          'templates': semaphore_upgrade_baseline_raw.stdout_lines[0] | int,
          'schedules': semaphore_upgrade_baseline_raw.stdout_lines[1] | int,
          'active_schedules': semaphore_upgrade_baseline_raw.stdout_lines[2] | int
        },
        'webhook_file': semaphore_upgrade_webhook_file,
        'notification_suppress_marker': semaphore_upgrade_notification_suppress_marker,
        'skip_notifications': semaphore_upgrade_notifications_suppressed | bool,
        'result_file': semaphore_upgrade_result_file
      } | to_nice_json }}

- name: Read MainPID after preflight and backup
  ansible.builtin.command: systemctl show semaphore.service --property=MainPID --value  # noqa command-instead-of-module
  register: semaphore_upgrade_preflight_pid_after
  changed_when: false

- name: Assert preflight and backup did not restart Semaphore
  ansible.builtin.assert:
    that:
      - semaphore_upgrade_preflight_pid_before.stdout | trim | length > 0
      - semaphore_upgrade_preflight_pid_before.stdout | trim == semaphore_upgrade_preflight_pid_after.stdout | trim
    fail_msg: "MainPID changed during preflight/backup."

- name: Report already-current idempotent result
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      status: already_current
      version: "{{ semaphore_upgrade_current_version }}"
      edition: "{{ semaphore_upgrade_current_edition }}"
      action: no_install_no_restart
  when:
    - semaphore_upgrade_current_version == semaphore_upgrade_target_version
    - semaphore_upgrade_current_edition == semaphore_upgrade_target_edition

- name: Apply package and detach restart transaction
  when:
    - semaphore_upgrade_current_version != semaphore_upgrade_target_version or semaphore_upgrade_current_edition != semaphore_upgrade_target_edition
  block:
    - name: Read MainPID before install
      ansible.builtin.command: systemctl show semaphore.service --property=MainPID --value  # noqa command-instead-of-module
      register: semaphore_upgrade_pid_before
      changed_when: false

    - name: Reinstall pinned Semaphore package without needrestart restart
      ansible.builtin.command:  # noqa command-instead-of-module
        argv:
          - apt-get
          - install
          - --yes
          - --reinstall
          - --allow-downgrades
          - --no-remove
          - >-
            {{ semaphore_upgrade_work_dir }}/semaphore_{{ 'community_' if semaphore_upgrade_target_edition == 'community' else ''
            }}{{ semaphore_upgrade_target_version }}_linux_amd64.deb
      changed_when: true
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: l

    - name: Read MainPID after install
      ansible.builtin.command: systemctl show semaphore.service --property=MainPID --value  # noqa command-instead-of-module
      register: semaphore_upgrade_pid_after
      changed_when: false

    - name: Read installed binary checksum instead of trusting package state
      ansible.builtin.stat:
        path: "{{ semaphore_upgrade_binary }}"
        checksum_algorithm: sha256
      register: semaphore_upgrade_installed_binary

    - name: Assert install replaced the binary without restarting Semaphore
      ansible.builtin.assert:
        that:
          - semaphore_upgrade_pid_before.stdout | trim | length > 0
          - semaphore_upgrade_pid_before.stdout | trim == semaphore_upgrade_pid_after.stdout | trim
          - semaphore_upgrade_installed_binary.stat.checksum == semaphore_upgrade_target_binary_sha256
        fail_msg: >-
          Install did not place the pinned target binary or changed MainPID;
          detached restart boundary is no longer valid.

    - name: Set detached config path
      ansible.builtin.set_fact:
        semaphore_upgrade_detached_config: "{{ semaphore_upgrade_backup_dir }}/transaction.json"

    - name: Prepare and start detached transaction
      ansible.builtin.include_tasks: prepare_detached.yml
