---
# ubuntu_vm_full_upgrade: monthly full-upgrade judgement/notification (§5.1)
# + manual apply (§6/§7). See
# docs/ai/reviews/ubuntu_vm_full_upgrade/2026-07-11_002_implement.md for the
# full Phase design rationale.
#
# Phase 0    : argument validation
# Phase 0.5  : manual-apply confirmation string check (apply target only)
# Phase 1-8  : common processing (healthcheck / simulate / classify / notify)
#              — runs on all 4 hosts when dry_run=true, or on the single
#              apply target only when dry_run=false. check_mode: false below
#              makes this always run for real even under --check, because
#              none of it mutates installed packages (apt-get update/check/
#              -s full-upgrade only touch the package index cache, matching
#              proxmox_patch_dryrun's semi-safe classification precedent).
# Phase 9-13 : manual apply (tasks/apply.yml) — apply target only, and only
#              when NOT ansible_check_mode (this is the actual destructive
#              boundary; tester-gate: check-mode-native, see the playbook
#              header for the full classification rationale).

- name: Assert dry_run is defined
  ansible.builtin.assert:
    that: dry_run is defined
    fail_msg: >-
      dry_run must be specified explicitly: -e dry_run=true (monthly
      judgement, all nodes, read-only) or -e dry_run=false -e node=<node>
      (manual apply, single node). See playbooks/ubuntu_vm_full_upgrade.yml.
    quiet: true

- name: Assert node is a known target when performing a manual apply
  ansible.builtin.assert:
    that:
      - node is defined
      - node in ['ansy', 'monnie', 'authy', 'quory']
    fail_msg: >-
      Manual apply (dry_run=false) requires -e node=<ansy|monnie|authy|quory>
      (single node only — requirement §4). Got node={{ node | default('undefined') }}.
    quiet: true
  when: not (dry_run | bool)

- name: Determine whether this host is the manual-apply target
  ansible.builtin.set_fact:
    ubuntu_vm_full_upgrade_is_apply_target: "{{ (not (dry_run | bool)) and (inventory_hostname == (node | default(''))) }}"

- name: Determine whether this host participates in this run
  ansible.builtin.set_fact:
    ubuntu_vm_full_upgrade_participates: "{{ (dry_run | bool) or ubuntu_vm_full_upgrade_is_apply_target }}"

# Confirmation string is a safety device against accidental apply, not a
# Status pre-declaration (requirement §4). It must match `node` exactly —
# typing the target twice (once as -e node, once as -e ...confirm) guards
# against a copy-pasted/stale -e set silently targeting the wrong host.
# Checked before any other processing, per requirement §6 step 1, and
# regardless of --check (it's a pure validation, not a mutation) so testers
# can verify the rejection path under --check too.
- name: Abort manual apply if confirmation string does not match node
  ansible.builtin.assert:
    that:
      - (ubuntu_vm_full_upgrade_confirm | default('')) == node
    fail_msg: >-
      Manual apply requires -e ubuntu_vm_full_upgrade_confirm=<node> matching
      -e node={{ node }} exactly. Got
      ubuntu_vm_full_upgrade_confirm={{ ubuntu_vm_full_upgrade_confirm | default('') }}
      (empty means not supplied).
    quiet: true
  when: ubuntu_vm_full_upgrade_is_apply_target

- name: Common processing (healthcheck, simulation, classification)
  when: ubuntu_vm_full_upgrade_participates
  check_mode: false
  block:
    - name: Run node healthcheck
      ansible.builtin.include_tasks: healthcheck.yml

    - name: Abort if healthcheck reported criticals (send alert first)
      when: ubuntu_vm_full_upgrade_healthcheck_criticals | length > 0
      block:
        - name: Send healthcheck-failure notification
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
          vars:
            slack_channel: "alerts"
            slack_status: "critical"
            slack_title: "[ubuntu_vm_full_upgrade] healthcheck FAILED - {{ inventory_hostname }}"
            slack_message: |
              Host: {{ inventory_hostname }}
              full-upgrade判定を中止しました(healthcheck失敗)。

              Criticals:
              {% for item in ubuntu_vm_full_upgrade_healthcheck_criticals %}
              - {{ item }}
              {% endfor %}

        - name: Fail this host
          ansible.builtin.fail:
            msg: >-
              ubuntu_vm_full_upgrade: healthcheck failed on {{ inventory_hostname }},
              aborting before touching apt: {{ ubuntu_vm_full_upgrade_healthcheck_criticals | join(', ') }}

    - name: Deploy full-upgrade simulation script
      ansible.builtin.copy:
        src: ubuntu-full-upgrade-simulate.sh
        dest: /usr/local/sbin/ubuntu-full-upgrade-simulate.sh
        owner: root
        group: root
        mode: "0750"

    - name: Run full-upgrade simulation (apt-get update + check + -s full-upgrade; collection only)
      ansible.builtin.command:
        cmd: /usr/local/sbin/ubuntu-full-upgrade-simulate.sh
      register: ubuntu_vm_full_upgrade_sim_raw
      changed_when: false

    - name: Parse simulation JSON
      ansible.builtin.set_fact:
        ubuntu_vm_full_upgrade_sim: "{{ ubuntu_vm_full_upgrade_sim_raw.stdout | from_json }}"

    # Non-apt checks are intentionally limited to the monthly dry-run path.
    # The manual apply path stays apt-only, and every collector is best-effort
    # read-only HTTP GET (requirement 035). Initializing on every participating
    # host keeps report/notification rendering schema-stable when a host has no
    # registry entries or when dry_run=false.
    - name: Initialize non-apt product results
      ansible.builtin.set_fact:
        ubuntu_vm_full_upgrade_nonapt_results: []

    - name: Collect registered non-apt product versions (monthly dry-run only)
      ansible.builtin.include_tasks: collect_nonapt_product.yml
      loop: "{{ ubuntu_vm_full_upgrade_nonapt_per_node[inventory_hostname] | default([]) }}"
      loop_control:
        loop_var: ubuntu_vm_full_upgrade_nonapt_product
        label: "{{ ubuntu_vm_full_upgrade_nonapt_product.name }}"
      when: dry_run | bool

    - name: Classify packages and determine Status
      ansible.builtin.include_tasks: classify.yml

    # ------------------------------------------------------------------
    # Pre-render this host's per-package version block ("pkg  old → new" /
    # "pkg  ver (remove)" / "pkg  installed → candidate (phasing保留)",
    # npm outdated style — 2026-07-12_014 §実施3 + 2026-07-12_019 §実施1)
    # once, as a fact, so the three notifications that show it (per-node
    # report below, apply summaries in reboot_local.yml / reboot_quory.yml)
    # share exactly one definition of the format and the display cap. The
    # ``` fence gives monospaced alignment on Slack; names are ljust-padded
    # to the widest shown name. Order: Inst, Remv, then phased (phased
    # versions come from the read-only apt-cache policy lookup in
    # simulate.sh — apt -s itself prints no versions for phased-back
    # packages — and phased entries are display/reconciliation only, see
    # classify.yml header). Lines
    # beyond ubuntu_vm_full_upgrade_notify_detail_max_lines collapse into
    # "…他N件(レポートJSON参照)" — with the raised default this is a safety
    # valve for abnormal months, not the normal reading path (019 §実施4);
    # the full structured list is always in the per-host report JSON saved
    # below. Rendering is presentation only; classification/judgement stays
    # in classify.yml.
    # ------------------------------------------------------------------
    # default('', true) before trim: when _block renders to nothing (no
    # candidates), native templating resolves it to None, and trim would
    # stringify that into a literal "None" (caught by the disposable
    # verification playbook, 2026-07-12_015 implement).
    - name: Build per-package version detail block for notifications
      ansible.builtin.set_fact:
        ubuntu_vm_full_upgrade_notify_detail_block: "{{ _block | default('', true) | trim }}"
      vars:
        _limit: "{{ ubuntu_vm_full_upgrade_notify_detail_max_lines | int }}"
        _details: >-
          {{ ubuntu_vm_full_upgrade_sim.simulation.inst_detail
             + ubuntu_vm_full_upgrade_sim.simulation.remv_detail
             + ubuntu_vm_full_upgrade_sim.simulation.phased_detail }}
        _shown: "{{ _details[:(_limit | int)] }}"
        _omitted: "{{ (_details | length) - (_shown | length) }}"
        _name_w: "{{ ((_shown | map(attribute='name') | map('length') | list) + [0]) | max }}"
        # inst_detail entries carry old/new, remv_detail entries carry
        # version, phased_detail entries carry installed/candidate (from
        # apt-cache policy) — the key checks below tell the three apart.
        _block: |-
          {% if _shown | length > 0 %}
          ```
          {% for d in _shown %}
          {% if 'new' in d %}
          {{ d.name.ljust(_name_w | int) }}  {{ d.old if d.old else '(新規)' }} → {{ d.new }}
          {% elif 'version' in d %}
          {{ d.name.ljust(_name_w | int) }}  {{ d.version if d.version else '?' }} (remove)
          {% else %}
          {{ d.name.ljust(_name_w | int) }}  {{ d.installed if d.installed else '?' }} → {{ d.candidate if d.candidate else '?' }} (phasing保留)
          {% endif %}
          {% endfor %}
          ```
          {% if _omitted | int > 0 %}
          …他{{ _omitted }}件(レポートJSON参照)
          {% endif %}
          {% endif %}

    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ ubuntu_vm_full_upgrade_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Save per-host report
      ansible.builtin.copy:
        content: >-
          {{ {
            'host': inventory_hostname,
            'collected_at': ubuntu_vm_full_upgrade_sim.collected_at,
            'status': ubuntu_vm_full_upgrade_status,
            'status_reason': ubuntu_vm_full_upgrade_status_reason,
            'inst': ubuntu_vm_full_upgrade_sim.simulation.inst,
            'remv': ubuntu_vm_full_upgrade_sim.simulation.remv,
            'inst_detail': ubuntu_vm_full_upgrade_sim.simulation.inst_detail,
            'remv_detail': ubuntu_vm_full_upgrade_sim.simulation.remv_detail,
            'phased_detail': ubuntu_vm_full_upgrade_sim.simulation.phased_detail,
            'hold': ubuntu_vm_full_upgrade_sim.simulation.hold,
            'hold_collection_rc': ubuntu_vm_full_upgrade_sim.apt_mark_showhold.rc,
            'nonapt': ubuntu_vm_full_upgrade_nonapt_results,
            'inst_important': ubuntu_vm_full_upgrade_inst_important,
            'remv_classified': ubuntu_vm_full_upgrade_remv_classified | default([]),
            'product_impact': ubuntu_vm_full_upgrade_product_impact,
            'reboot_expected': ubuntu_vm_full_upgrade_sim.reboot_required_flag,
          } | to_nice_json }}
        dest: "{{ ubuntu_vm_full_upgrade_report_dir }}/{{ inventory_hostname }}_{{ ansible_facts['date_time']['iso8601_basic_short'] }}.json"
      delegate_to: localhost
      become: false

    # ------------------------------------------------------------------
    # Phase 8: per-node report notification (2026-07-12_019 §実施2・3) —
    # one message per participating node, replacing the former 4-node
    # aggregated message: with per-package version lines in the body, a
    # combined message no longer fits Slack-readable length, and Yoshinobu
    # asked for per-node delivery. Channel policy mirrors
    # roles/proxmox_patch_dryrun/tasks/main.yml: only BLOCKED is an
    # abnormal report -> #alerts; every other outcome (NO_UPDATES /
    # UPGRADE_READY / REVIEW_REQUIRED / MAJOR_UPGRADE_DETECTED) is a
    # normal patch-cycle report -> #patches (MAJOR follows the proxmox
    # precedent, which routes it to #patches with warning level — the
    # apply rejection for it stays enforced below regardless). Existing
    # abnormal per-host alerts are untouched (healthcheck failure above,
    # post-reboot criticals / reboot failures in reboot_local.yml /
    # reboot_quory.yml — all #alerts). A host that failed healthcheck
    # never reaches this task — its own #alerts message was already sent —
    # so "a node missing from #patches after the monthly run" means "check
    # #alerts / the Semaphore job result". No cross-node summary message
    # is kept (019 §実施3 left it to implementer judgement): it would
    # preserve exactly the hostvars/anchor-host aggregation complexity
    # this change removes, while failure visibility is already covered by
    # the per-host alerts and the job status.
    # ------------------------------------------------------------------
    - name: Send per-node report notification
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
      vars:
        slack_channel: "{{ 'alerts' if ubuntu_vm_full_upgrade_status == 'BLOCKED' else 'patches' }}"
        slack_status: >-
          {%- if ubuntu_vm_full_upgrade_status == 'BLOCKED' -%}
          critical
          {%- elif ubuntu_vm_full_upgrade_status in ['MAJOR_UPGRADE_DETECTED', 'REVIEW_REQUIRED'] -%}
          warning
          {%- elif ubuntu_vm_full_upgrade_status == 'NO_UPDATES' -%}
          info
          {%- else -%}
          ok
          {%- endif -%}
        slack_title: >-
          [ubuntu_vm_full_upgrade] {{ 'dry-run (monthly)' if (dry_run | bool) else 'apply target' }} - {{ inventory_hostname }}: {{ ubuntu_vm_full_upgrade_status }}
        slack_message: |
          {{ ubuntu_vm_full_upgrade_status_reason }}
          候補: install={{ ubuntu_vm_full_upgrade_sim.simulation.inst | length }} remove={{ ubuntu_vm_full_upgrade_sim.simulation.remv | length }} / 保留(phasing)={{ ubuntu_vm_full_upgrade_sim.simulation.phased_detail | length }}
          {% if ubuntu_vm_full_upgrade_sim.simulation.hold | length > 0 %}
          holdにより保留: {{ ubuntu_vm_full_upgrade_sim.simulation.hold | length }}件（{{ ubuntu_vm_full_upgrade_sim.simulation.hold | join(', ') }}）
          {% endif %}
          {% for product in ubuntu_vm_full_upgrade_nonapt_results %}
          {% if product.state == 'update_available' %}
          apt外: {{ product.name }} {{ product.current }} → {{ product.latest }} (更新あり・手動更新が必要)
          {% elif product.state == 'up_to_date' %}
          apt外: {{ product.name }} {{ product.current }} (最新)
          {% else %}
          apt外: {{ product.name }} 取得/比較失敗(current rc={{ product.current_rc }} / latest rc={{ product.latest_rc }})
          {% endif %}
          {% endfor %}
          {% if ubuntu_vm_full_upgrade_notify_detail_block %}
          {{ ubuntu_vm_full_upgrade_notify_detail_block }}
          {% endif %}
          {% for p in ubuntu_vm_full_upgrade_product_impact %}
          {{ p.label }}{{ '(' + p.note + ')' if p.note | default('') else '' }}: {{ (p.packages | join(', ')) if p.packages | length > 0 else '該当なし' }}
          {% endfor %}

- name: Reject manual apply if Status forbids it (BLOCKED / MAJOR_UPGRADE_DETECTED)
  ansible.builtin.assert:
    that:
      - ubuntu_vm_full_upgrade_status not in ['BLOCKED', 'MAJOR_UPGRADE_DETECTED']
    fail_msg: >-
      ubuntu_vm_full_upgrade: apply rejected on {{ inventory_hostname }} —
      Status={{ ubuntu_vm_full_upgrade_status }} ({{ ubuntu_vm_full_upgrade_status_reason }}).
      BLOCKED / MAJOR_UPGRADE_DETECTED can never be applied, regardless of
      confirmation (requirement §6 step 3).
    quiet: true
  when: ubuntu_vm_full_upgrade_is_apply_target

- name: Send check-mode "would apply" notification (destructive steps skipped under --check)
  when: ubuntu_vm_full_upgrade_is_apply_target and ansible_check_mode
  check_mode: false
  block:
    # include_tasks (dynamic include) cannot take check_mode: directly
    # ("'check_mode' is not a valid attribute for a TaskInclude") — wrapping
    # in a block and setting check_mode: false at the block level is the
    # documented workaround (core.md §18.2) and cascades to the included
    # tasks.
    # Channel patches (2026-07-12_019 §実施2): this is the --check stand-in
    # for the apply summary, i.e. a normal patch-cycle report.
    - name: Send notification
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
      vars:
        slack_channel: "patches"
        slack_status: "info"
        slack_title: "[ubuntu_vm_full_upgrade] check-mode: would apply - {{ inventory_hostname }}"
        slack_message: |
          Host: {{ inventory_hostname }}
          Status: {{ ubuntu_vm_full_upgrade_status }} ({{ ubuntu_vm_full_upgrade_status_reason }})
          check-mode: apply条件を満たしていますが --check のため実行していません。

- name: Manual apply (skipped under --check; destructive)
  ansible.builtin.include_tasks: apply.yml
  when: ubuntu_vm_full_upgrade_is_apply_target and not ansible_check_mode
