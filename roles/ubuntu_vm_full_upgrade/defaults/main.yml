---
# ubuntu_vm_full_upgrade: monthly full-upgrade judgement/notification + manual
# apply for ansy/monnie/authy/quory. See:
#   docs/ai/reviews/ubuntu_vm_full_upgrade/2026-07-11_001_requirement.md
#   docs/ai/reviews/ubuntu_vm_full_upgrade/2026-07-11_002_implement.md

ubuntu_vm_full_upgrade_report_dir: "{{ reports_base_dir }}/ubuntu-vm-full-upgrade"

# ---------------------------------------------------------------------------
# Non-apt product update registry (2026-07-17_035). Each entry describes two
# read-only JSON endpoints and the JMESPath expressions used to extract their
# versions. Collection runs only during the monthly dry_run=true path; it
# never downloads or installs an artifact. The schema is product-agnostic so
# future manually managed products can be registered without changing the
# collection flow. The first registered product is monnie's manually
# installed Prometheus.
# ---------------------------------------------------------------------------
ubuntu_vm_full_upgrade_nonapt_per_node:
  monnie:
    - name: prometheus
      current_url: "http://localhost:9090/api/v1/status/buildinfo"
      current_version_query: "data.version"
      current_use_proxy: false
      latest_url: "https://api.github.com/repos/prometheus/prometheus/releases/latest"
      latest_version_query: "tag_name"
      latest_tag_strip_prefix: "v"
      timeout_seconds: 10
      note: "手動インストール。更新は人間作業（Notion『Prometheus / Grafana / unifi-poller セットアップ手順』参照）"

# ---------------------------------------------------------------------------
# Important-component patterns (requirement §5.2). Stored as UNANCHORED regex
# fragments (not glob, no leading ^ / trailing $) — classify.yml combines all
# applicable fragments for a host into one alternation and wraps it in
# ^(?:...)$ once at match time, so a package name must match a fragment over
# its *entire* length. `.` in a real package name is escaped; `.*` is the
# intentional wildcard.
# ---------------------------------------------------------------------------
ubuntu_vm_full_upgrade_important_common:
  - 'linux-image-.*'
  - 'linux-generic'
  - 'systemd.*'
  - 'udev'
  - 'netplan\.io'
  - 'network-manager'
  - 'openssh-server'
  - 'openssh-client'
  - 'sudo'
  - 'libc6.*'

# Node-specific additions layered on top of the common list, keyed by
# inventory_hostname. Final package-name confirmation against each host's
# actual installed set is deferred to the tester (requirement §5.2: "実装時に
# CCが対象ホストの実インストール状況を確認して行ってよい" — implementer does
# not touch real hosts, core.md §17).
ubuntu_vm_full_upgrade_important_per_node:
  authy:
    - 'freeradius.*'
    - 'libssl.*'
    - 'openssl'
    - 'sssd.*'
    - 'wpa.*'
  monnie:
    - 'prometheus.*'
    - 'grafana.*'
    - 'loki.*'
    - 'alloy.*'
    - 'docker.*'
  ansy:
    - 'python3.*'
    - 'ansible.*'
  quory:
    - 'python3.*'
    - 'ansible.*'
    - 'chrony'
    - 'ntp.*'
    # quory runs the QDevice *server* daemon corosync-qnetd; corosync-qdevice
    # is the cluster-node-side daemon (pve1/pve2) and is not installed on
    # quory (2026-07-12_027_test_result.md quory §5).
    - 'corosync-qnetd'
    - 'corosync'

# Node -> primary product label(s), for the "主力プロダクトへの影響明示"
# requirement (§5.2.1). quory intentionally lists 3 separate products (not
# merged) per requirement. Each product's patterns are the same unanchored
# fragment style as above.
#
# `managed_by_note: true` marks the Ansible-related product entries on
# ansy/quory (requirement §5.2 + 2026-07-11 review must-fix 5): whether
# `ansible`/`python3` matches are apt full-upgrade candidates at all depends
# on how Ansible itself is installed there (apt vs pip venv). classify.yml
# attaches a `note` field to these entries so the report/Slack message can
# say "apt管理: 判定対象" / "pip管理: apt full-upgrade判定対象外" /
# "管理方式未確認" instead of silently rendering an ambiguous "該当なし" that
# can't be told apart from "checked, apt-managed, nothing matched this run".
ubuntu_vm_full_upgrade_products:
  authy:
    - label: "FreeRADIUS/WPA3認証基盤"
      patterns: "{{ ubuntu_vm_full_upgrade_important_per_node.authy }}"
  monnie:
    - label: "Prometheus/Grafana/Loki監視基盤"
      patterns: "{{ ubuntu_vm_full_upgrade_important_per_node.monnie }}"
  ansy:
    - label: "Ansible開発環境"
      patterns: "{{ ubuntu_vm_full_upgrade_important_per_node.ansy }}"
      managed_by_note: true
  quory:
    - label: "本番Ansible実行基盤"
      patterns:
        - 'python3.*'
        - 'ansible.*'
      managed_by_note: true
    - label: "QDevice"
      patterns:
        - 'corosync-qnetd'
        - 'corosync'
    - label: "NTP基準"
      patterns:
        - 'chrony'
        - 'ntp.*'

# How Ansible itself is installed on this host: "apt" (apt full-upgrade
# candidate), "pip" (installed in a venv/pip — not an apt full-upgrade
# candidate at all), or "unknown" (not yet confirmed). Defaults to
# "unknown" because the implementer cannot inspect real hosts (core.md §17)
# — override per host once the tester confirms, e.g. in
# inventories/homelab/host_vars/ansy.yml:
#   ubuntu_vm_full_upgrade_ansible_managed_by: apt
ubuntu_vm_full_upgrade_ansible_managed_by: unknown

# ---------------------------------------------------------------------------
# MAJOR_UPGRADE_DETECTED thresholds (requirement §5.4: "閾値はimplement時に
# CCが提案"). A routine monthly full-upgrade on a lightly-maintained Ubuntu VM
# is expected to touch on the order of 10s of packages; a release upgrade
# (do-release-upgrade / edited sources.list) touches 100s and typically
# removes dozens of obsolete packages as a side effect of the suite change.
# These are intentionally conservative starting points — tune after
# observing a few real monthly runs (see implement.md "未対応事項").
# ---------------------------------------------------------------------------
ubuntu_vm_full_upgrade_major_total_threshold: 100
ubuntu_vm_full_upgrade_major_remove_threshold: 30

# Expected distribution codename per host (e.g. "noble"), used to detect an
# unexpected codename drift (requirement §5.4 "codename変化疑い"). Left empty
# by default (check skipped) because the implementer cannot confirm the
# actual installed codename on real hosts (core.md §17) — populate via
# host_vars/<node>.yml once the tester confirms current codenames.
ubuntu_vm_full_upgrade_expected_codename: ""

# ---------------------------------------------------------------------------
# Per-package version detail in notifications (2026-07-12_014 + _019): the
# per-node report and the apply summaries (reboot_local.yml /
# reboot_quory.yml) all embed the same pre-rendered block (built once per
# host in tasks/main.yml). Each node's Inst/Remv/phased candidates are
# rendered one per line ("pkg  old → new" / "pkg  ver (remove)" /
# "pkg  installed → candidate (phasing保留)") inside a ``` code fence. This caps the rendered
# lines per node; the excess collapses to "…他N件(レポートJSON参照)".
# Default 100 = ubuntu_vm_full_upgrade_major_total_threshold (below): any
# month that stays under the MAJOR_UPGRADE threshold renders in full, so
# normal operation never needs the report JSON (which is repositioned as a
# troubleshooting artifact — 019: Yoshinobu cannot SSH to it while out).
# Anything larger is MAJOR_UPGRADE territory (abnormal, apply-forbidden)
# where truncation is acceptable as a safety valve. If the MAJOR thresholds
# are ever tuned, consider keeping this aligned.
# ---------------------------------------------------------------------------
ubuntu_vm_full_upgrade_notify_detail_max_lines: 100

# ---------------------------------------------------------------------------
# Manual apply (dry_run=false) safety
# ---------------------------------------------------------------------------
# Confirmation required for manual apply: the caller must pass
# -e ubuntu_vm_full_upgrade_confirm=<node> where <node> matches -e node=<node>
# exactly (typing the node name twice, once as the target and once as
# confirmation, guards against copy-pasted/stale -e sets targeting the wrong
# node — see implement.md design rationale). Left empty by default so a run
# without this var fails closed.
ubuntu_vm_full_upgrade_confirm: ""

# ---------------------------------------------------------------------------
# quory delayed-reboot (requirement §7.2)
# ---------------------------------------------------------------------------
ubuntu_vm_full_upgrade_quory_reboot_delay_seconds: 60
ubuntu_vm_full_upgrade_quory_flag_file: /var/lib/ubuntu-vm-full-upgrade/quory-reboot-pending.flag

# Root-only secrets file read directly by the Ansible-external post-reboot
# check script on quory (scripts/quory_post_upgrade_check/). Not deployed by
# this role (requirement §9 excludes Ansible-managed deployment of that
# script this round) — documented for manual placement in implement.md,
# following the same "quory-local file, not git-managed, mode 0600" pattern
# already used for the cert_renew intermediate CA key
# (docs/ai/policies/cert_renew_policy.md §4.4).
ubuntu_vm_full_upgrade_quory_postcheck_webhook_conf: /etc/ubuntu-vm-full-upgrade/slack-webhook-quory.conf
