---
systemd_timers_working_dir: /home/yoshi/homelab-ansible
systemd_timers_run_user: yoshi
systemd_timers_playbook_bin: /usr/bin/ansible-playbook

# nonsemaphore_job_capture案件(2026-08-05、R8。ただしこの「R8」は障害捕捉
# Step 1 requirement側の番号であり、semaphore_templatesのclass_reason用R8や
# deployment_drift_checkのR8/R9とは無関係の別ファイルの別R8なので、以後は
# 案件名で参照する)。roles/systemd_timers が生成する
# 全serviceに効くOnFailure=ハンドラの配備先。ansible-timer.service.j2の
# OnFailure=と、ansible-timer-failure-capture@.service.j2のExecStartの
# 両方がこの値を参照する(値の重複を避ける)。
systemd_timers_failure_capture_script_path: /usr/local/sbin/ansible-timer-failure-capture.sh

systemd_ansible_timers:
  # 以下のエントリは Semaphore UI スケジュールに移行済み
  # - name: authy-healthcheck
  #   description: Run authy healthcheck
  #   schedule: "*-*-* 05:30:00"
  #   playbook: playbooks/radius_healthcheck.yml
  #   persistent: true
  # - name: proxmox-healthcheck
  #   description: Run Proxmox healthcheck
  #   schedule: "*-*-* 05:40:00"
  #   playbook: playbooks/proxmox_healthcheck.yml
  #   persistent: true
  # - name: proxmox-patch-dryrun
  #   description: Run Proxmox patch dry-run
  #   schedule: "Fri *-*-* 17:30:00"
  #   playbook: playbooks/proxmox_patch_dryrun.yml
  #   persistent: true
  # - name: authy-reboot-if-required
  #   description: Reboot authy if required
  #   schedule: "*-*-* 03:30:00"
  #   playbook: playbooks/ubuntu_nightly.yml
  #   persistent: false
  # - name: proxmox-hw-check
  #   description: Run Proxmox hardware check
  #   schedule: "*-*-* 05:45:00"
  #   playbook: playbooks/proxmox_hw_check.yml
  #   persistent: true
  # - name: monitoring-healthcheck
  #   description: Run monitoring healthcheck
  #   schedule: "*-*-* 05:35:00"
  #   playbook: playbooks/monitoring_healthcheck.yml
  #   persistent: true
  # - name: codex-update-check
  #   description: Check and update Codex CLI on ansy and quory
  #   schedule: "Fri *-*-* 17:00:00"
  #   playbook: playbooks/codex_update_check.yml
  #   persistent: false
  # persistent: true(2026-08-06にfalseから変更)。
  # **月次かつ `Persistent=false` だと、00:35にquoryが停止していればその月の
  # 更新が丸ごと飛び、飛んだことを知る手段も無かった。** 証明書は有効45日なので、
  # 1回飛ぶと次の機会は期限のほぼ直前になる。`Persistent=true` は、発火時刻に
  # 停止していた分をquory起動時に実行する。
  #
  # `cert_renew.yml`(Semaphore、週次)側は「対象ホストが落ちている」問題を
  # 頻度と曜日で解いたが、**こちらは実行主体そのものが落ちている問題**であり、
  # 頻度を上げても解けない。規範は docs/ai/policies/cert_renew_policy.md CERT-024。
  #
  # 副作用: quory起動直後に証明書更新とsemaphore再起動が走りうる。
  - name: cert-renew-quory
    description: Renew quory semaphore TLS certificate
    schedule: "*-*-01 00:35:00"
    playbook: playbooks/cert_renew_quory.yml
    persistent: true
