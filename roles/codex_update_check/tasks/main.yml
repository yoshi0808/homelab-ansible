---
# codex_update_check: Codex CLI(npm globalパッケージ)のバージョン確認・
# 差分があれば更新する。バージョン取得はcommandモジュールで収集のみ行い、
# 判定(比較・changed/failed)はAnsible側(本ファイル)で行う(skills/ansible-implementation-style/SKILL.md)。
# npm本体についても同様にバージョンを確認し、メジャーバージョンが上がって
# いる場合のみ更新する(マイナー/パッチ差分は静かにスキップ)。
# 参照:
#   docs/ai/reviews/codex_update_check/2026-07-09_001_requirement.md
#   docs/ai/reviews/codex_update_check/2026-07-10_005_requirement.md

# ---------------------------------------------------------------------------
# Phase 1: 現在インストールされているバージョンを取得する
# ---------------------------------------------------------------------------
- name: Get currently installed Codex CLI version
  ansible.builtin.command:
    cmd: "npm list -g {{ codex_update_check_package }} --depth=0 --json"
  register: codex_update_check_current_raw
  changed_when: false
  failed_when: false
  # R5 (check_mode_semantics round2): command is check_mode-unsupported and
  # would otherwise auto-skip under --check. The next task reads
  # codex_update_check_current_raw.rc directly (not through | default), so a
  # skipped result here would break it. This task is read-only (npm list),
  # so forcing real execution under --check is safe.
  check_mode: false

- name: Parse currently installed version
  ansible.builtin.set_fact:
    codex_update_check_current_version: >-
      {{ (codex_update_check_current_raw.stdout | default('{}') | from_json)
         .get('dependencies', {}).get(codex_update_check_package, {}).get('version', '') }}
  when: codex_update_check_current_raw.rc == 0

# ---------------------------------------------------------------------------
# Phase 2: npmレジストリの最新バージョンを取得する
# ---------------------------------------------------------------------------
- name: Get latest Codex CLI version from npm registry
  ansible.builtin.command:
    cmd: "npm view {{ codex_update_check_package }} version"
  register: codex_update_check_latest_raw
  changed_when: false
  failed_when: false
  # R5: same reason as "Get currently installed Codex CLI version" above —
  # read-only registry lookup, consumed directly by .rc below.
  check_mode: false

- name: Parse latest version
  ansible.builtin.set_fact:
    codex_update_check_latest_version: "{{ codex_update_check_latest_raw.stdout | trim }}"
  when: codex_update_check_latest_raw.rc == 0

# ---------------------------------------------------------------------------
# Phase 3: バージョン比較(shellでは判定しない。Ansible側で判定する)
# ---------------------------------------------------------------------------
- name: Judge collection status and whether an update is needed
  ansible.builtin.set_fact:
    codex_update_check_collected: "{{ _collected }}"
    codex_update_check_needs_update: "{{ _collected and (codex_update_check_current_version != codex_update_check_latest_version) }}"
  vars:
    _collected: >-
      {{ (codex_update_check_current_raw.rc == 0) and (codex_update_check_latest_raw.rc == 0)
         and (codex_update_check_current_version | default('', true) | length > 0)
         and (codex_update_check_latest_version | default('', true) | length > 0) }}

# ---------------------------------------------------------------------------
# Phase 4: 差分があるホストのみ更新する
# ---------------------------------------------------------------------------
- name: Update Codex CLI to the latest version
  ansible.builtin.command:
    cmd: "npm install -g {{ codex_update_check_package }}@latest"
  become: true
  register: codex_update_check_install_result
  changed_when: codex_update_check_install_result.rc == 0
  failed_when: false
  # R4: destructive (npm install -g). command auto-skips under --check even
  # without this when, but it is added explicitly per TS-014 / R4.
  when:
    - codex_update_check_needs_update | default(false)
    - not ansible_check_mode
  tags: [destructive]

- name: Record per-host update status
  ansible.builtin.set_fact:
    codex_update_check_status: >-
      {{ 'would_update' if (codex_update_check_needs_update | default(false)) and (ansible_check_mode | bool)
         else 'update_failed' if (codex_update_check_needs_update | default(false)) and (codex_update_check_install_result.rc | default(1)) != 0
         else 'updated' if (codex_update_check_needs_update | default(false)) and (codex_update_check_install_result.rc | default(1)) == 0
         else 'up_to_date' if (codex_update_check_collected | default(false))
         else 'collection_failed' }}
    # R1/AC1 note: without the 'would_update' branch, a host that genuinely
    # needs an update would be classified 'update_failed' under --check
    # (the install task above is skipped, so .rc stays undefined -> default
    # 1 -> "!= 0"), which then lands in codex_update_check_all_failed_hosts
    # below and trips the final `fail:` task, breaking AC1 (exit 0 under
    # --check). The ansible_check_mode branch is evaluated first and only
    # ever true when --check is passed, so normal-run behavior (AC2) is
    # unchanged.

# ---------------------------------------------------------------------------
# Phase 1n: npm本体 - 現在バージョン取得
# ---------------------------------------------------------------------------
- name: Get currently installed npm version
  ansible.builtin.command:
    cmd: "npm --version"
  register: codex_update_check_npm_current_raw
  changed_when: false
  failed_when: false
  # R5: read-only, consumed downstream (Parse currently installed npm
  # version, Judge npm collection status). See the Codex CLI version tasks
  # above for the same reasoning.
  check_mode: false

- name: Parse currently installed npm version
  ansible.builtin.set_fact:
    codex_update_check_npm_current_version: "{{ codex_update_check_npm_current_raw.stdout | trim }}"
  when: codex_update_check_npm_current_raw.rc == 0

# 情報収集のみ(判定・更新可否には使わない)。npm本体がdpkg管理下にある場合、
# npm自身のself-updateがdpkg管理ファイルと競合し得るため(要求仕様の制約事項)、
# 実ホストでの管理主体をtest_planで確認できるよう記録だけ残す。
- name: Locate npm binary path (for dpkg ownership check, informational)
  ansible.builtin.command:
    cmd: "which npm"
  register: codex_update_check_npm_path_raw
  changed_when: false
  failed_when: false
  # R5: read-only, gates the dpkg-ownership check below.
  check_mode: false

- name: Check whether npm binary is managed by dpkg (informational only; does not gate the update)
  ansible.builtin.command:
    cmd: "dpkg -S {{ codex_update_check_npm_path_raw.stdout | trim }}"
  register: codex_update_check_npm_dpkg_raw
  changed_when: false
  failed_when: false
  when: (codex_update_check_npm_path_raw.rc == 0) and (codex_update_check_npm_path_raw.stdout | trim | length > 0)
  # R5: read-only informational check; keep it real under --check now that
  # its source (Locate npm binary path) is also forced real above.
  check_mode: false

- name: Record npm dpkg-managed fact (informational)
  ansible.builtin.set_fact:
    codex_update_check_npm_dpkg_managed: "{{ (codex_update_check_npm_dpkg_raw is defined) and (codex_update_check_npm_dpkg_raw.rc | default(1) == 0) }}"

# ---------------------------------------------------------------------------
# Phase 2n: npmレジストリの最新バージョンを取得する
# ---------------------------------------------------------------------------
- name: Get latest npm version from npm registry
  ansible.builtin.command:
    cmd: "npm view {{ codex_update_check_npm_package }} version"
  register: codex_update_check_npm_latest_raw
  changed_when: false
  failed_when: false
  # R5: read-only registry lookup, consumed downstream.
  check_mode: false

- name: Parse latest npm version
  ansible.builtin.set_fact:
    codex_update_check_npm_latest_version: "{{ codex_update_check_npm_latest_raw.stdout | trim }}"
  when: codex_update_check_npm_latest_raw.rc == 0

# ---------------------------------------------------------------------------
# Phase 3n: メジャーバージョン判定(shellでは判定しない。Ansible側で判定する)
# 「上昇」判定であること(latest_major > current_major の場合のみ true)。
# メジャー部が数値として検証できない出力は collection_failed 扱いにする。
# マイナー/パッチのみの差分・ダウングレードは「差分あり」として扱わない
# (更新もしない・通知もしない)。
# ---------------------------------------------------------------------------
- name: Judge npm collection status and whether a major version bump is available
  ansible.builtin.set_fact:
    codex_update_check_npm_collected: "{{ _collected }}"
    codex_update_check_npm_needs_update: "{{ _collected and ((_latest_major | int) > (_current_major | int)) }}"
  vars:
    _current_major: "{{ (codex_update_check_npm_current_version | default('', true)).split('.')[0] }}"
    _latest_major: "{{ (codex_update_check_npm_latest_version | default('', true)).split('.')[0] }}"
    _collected: >-
      {{ (codex_update_check_npm_current_raw.rc == 0) and (codex_update_check_npm_latest_raw.rc == 0)
         and (_current_major is match('^[0-9]+$'))
         and (_latest_major is match('^[0-9]+$')) }}

# ---------------------------------------------------------------------------
# Phase 4n: メジャーバージョンが上がっている場合のみnpm本体を更新する
# ---------------------------------------------------------------------------
- name: Update npm itself to the latest major version
  ansible.builtin.command:
    cmd: "npm install -g {{ codex_update_check_npm_package }}@latest"
  become: true
  register: codex_update_check_npm_install_result
  changed_when: codex_update_check_npm_install_result.rc == 0
  failed_when: false
  # R4: destructive (npm install -g).
  when:
    - codex_update_check_npm_needs_update | default(false)
    - not ansible_check_mode
  tags: [destructive]

- name: Record per-host npm update status
  ansible.builtin.set_fact:
    codex_update_check_npm_status: >-
      {{ 'would_update' if (codex_update_check_npm_needs_update | default(false)) and (ansible_check_mode | bool)
         else 'update_failed' if (codex_update_check_npm_needs_update | default(false)) and (codex_update_check_npm_install_result.rc | default(1)) != 0
         else 'updated' if (codex_update_check_npm_needs_update | default(false)) and (codex_update_check_npm_install_result.rc | default(1)) == 0
         else 'up_to_date' if (codex_update_check_npm_collected | default(false)) and (codex_update_check_npm_current_version == codex_update_check_npm_latest_version)
         else 'minor_patch_skip' if (codex_update_check_npm_collected | default(false))
         else 'collection_failed' }}
    # R1/AC1 note: same reasoning as codex_update_check_status above — the
    # ansible_check_mode branch prevents a genuinely-needed npm major bump
    # from being misclassified as 'update_failed' under --check (which
    # would otherwise trip the final `fail:` task and break AC1).

# ---------------------------------------------------------------------------
# Phase 5: 結果集約・Slack通知
# ---------------------------------------------------------------------------
- name: Aggregate results and notify
  run_once: true
  delegate_to: localhost
  block:
    - name: Build per-host summary
      ansible.builtin.set_fact:
        codex_update_check_results: >-
          {{ (codex_update_check_results | default([])) + [{
            'host': item,
            'status': hostvars[item].codex_update_check_status | default('collection_failed'),
            'current': hostvars[item].codex_update_check_current_version | default('?'),
            'latest': hostvars[item].codex_update_check_latest_version | default('?'),
          }] }}
      loop: "{{ ansible_play_hosts_all }}"
      loop_control:
        label: "{{ item }}"

    - name: Classify updated / failed hosts
      ansible.builtin.set_fact:
        codex_update_check_updated_hosts: "{{ codex_update_check_results | selectattr('status', 'equalto', 'updated') | list }}"
        codex_update_check_failed_hosts: "{{ codex_update_check_results | selectattr('status', 'in', ['update_failed', 'collection_failed']) | list }}"

    - name: Build per-host npm summary
      ansible.builtin.set_fact:
        codex_update_check_npm_results: >-
          {{ (codex_update_check_npm_results | default([])) + [{
            'host': item,
            'status': hostvars[item].codex_update_check_npm_status | default('collection_failed'),
            'current': hostvars[item].codex_update_check_npm_current_version | default('?'),
            'latest': hostvars[item].codex_update_check_npm_latest_version | default('?'),
            'dpkg_managed': hostvars[item].codex_update_check_npm_dpkg_managed | default(false),
          }] }}
      loop: "{{ ansible_play_hosts_all }}"
      loop_control:
        label: "{{ item }}"

    - name: Classify updated / failed npm hosts
      ansible.builtin.set_fact:
        codex_update_check_npm_updated_hosts: "{{ codex_update_check_npm_results | selectattr('status', 'equalto', 'updated') | list }}"
        codex_update_check_npm_failed_hosts: "{{ codex_update_check_npm_results | selectattr('status', 'in', ['update_failed', 'collection_failed']) | list }}"

    - name: Combine failed hosts across Codex CLI and npm checks
      ansible.builtin.set_fact:
        codex_update_check_all_failed_hosts: "{{ codex_update_check_failed_hosts + codex_update_check_npm_failed_hosts }}"

    - name: Print codex_update_check summary
      ansible.builtin.debug:
        msg:
          codex: "{{ codex_update_check_results }}"
          npm: "{{ codex_update_check_npm_results }}"

    - name: Send Slack notification (update performed and/or failures)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
      vars:
        slack_channel: "{{ 'alerts' if codex_update_check_all_failed_hosts | length > 0 else 'info' }}"
        slack_status: "{{ 'error' if codex_update_check_all_failed_hosts | length > 0 else 'info' }}"
        slack_title: >-
          [codex_update_check] {{ 'ERROR' if codex_update_check_all_failed_hosts | length > 0 else 'Codex CLI / npm updated' }}
        slack_message: |
          Codex CLI 更新実施:
          {% for r in codex_update_check_updated_hosts %}
          - {{ r.host }}: {{ r.current }} → {{ r.latest }}
          {% else %}
          (なし)
          {% endfor %}
          npm本体 メジャー更新実施:
          {% for r in codex_update_check_npm_updated_hosts %}
          - {{ r.host }}: {{ r.current }} → {{ r.latest }}
          {% else %}
          (なし)
          {% endfor %}
          失敗:
          {% for r in codex_update_check_failed_hosts %}
          - {{ r.host }}: Codex CLI status={{ r.status }} (current={{ r.current }}, latest={{ r.latest }})
          {% endfor %}
          {% for r in codex_update_check_npm_failed_hosts %}
          - {{ r.host }}: npm status={{ r.status }} (current={{ r.current }}, latest={{ r.latest }})
          {% endfor %}
          {% if (codex_update_check_failed_hosts | length == 0) and (codex_update_check_npm_failed_hosts | length == 0) %}
          (なし)
          {% endif %}
          {% if codex_update_check_npm_updated_hosts | length > 0 %}

          注意: npm本体はNodeSource(nodejs)dpkgパッケージ配下のため、self-updateは
          dpkg管理ファイルを上書きします。今後のapt upgrade(nodejsパッケージ更新)で
          バンドル版に巻き戻る可能性があります。巻き戻った場合は次回週次実行で
          メジャー差分を再検知し自動的に再更新します(自己修復)。
          {% endif %}
      when: (codex_update_check_updated_hosts | length > 0) or (codex_update_check_npm_updated_hosts | length > 0) or (codex_update_check_all_failed_hosts | length > 0)

    - name: Fail if any host failed collection or update
      ansible.builtin.fail:
        msg: >-
          codex_update_check: 以下のホストで失敗しました:
          {{ codex_update_check_all_failed_hosts | map(attribute='host') | join(', ') }}
      when: codex_update_check_all_failed_hosts | length > 0
