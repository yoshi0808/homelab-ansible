---
- name: Install Docker Engine, the Compose v2 plugin, and nginx
  ansible.builtin.apt:
    name: "{{ agmsg_server_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Enable and start Docker (R15 — must survive an ansy reboot without human action)
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode
  tags: [destructive]
