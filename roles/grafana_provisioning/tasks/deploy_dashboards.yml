---
# deploy_dashboards.yml — dashboard JSON 7枚を /var/lib/grafana/dashboards へ
# 複製する(requirement R2/R3、Step 1)。
#
# 配備は複製に限る。テンプレート展開・変換は行わない(ansible.builtin.copy を使い
# template は使わない)。dashboard providerが updateIntervalSeconds 間隔でpollして
# 反映するため、restart/reloadは不要(R5)。owner/modeは計画§1-8の実測値
# (/var/lib/grafana/dashboards のlisting、grafana:grafana 0644)をそのまま使う。
#
# ansible.builtin.copy はchecksum比較でidempotentなので、AC1(repoとホストの内容が
# 一致していれば changed=0)は追加ロジック無しで満たされる。

- name: Deploy dashboard JSON to monnie
  ansible.builtin.copy:
    src: "dashboards/{{ item }}"
    dest: "{{ grafana_provisioning_dashboards_dir }}/{{ item }}"
    owner: grafana
    group: grafana
    mode: "0644"
  loop: "{{ grafana_provisioning_dashboard_files }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode
  tags: [dashboards, destructive]
