---
# deploy_provider.yml — dashboard provider yaml群を
# /etc/grafana/provisioning/dashboards/ へ配る(requirement R2/R10、
# 計画§1-3、§3 U3、§4 U6)。
#
# unifiエントリ: name / folder / type / path / orgId は現行の unifi.yaml から
# 1文字も変えない。追加するのは allowUiUpdates: false と
# updateIntervalSeconds: 10 の2行のみ — 現在Grafanaの既定値に依存している
# 挙動を明文化するだけで、挙動そのものを変えるものではない(計画§1-3)。
#
# 「既定値と一致する」という確度は文献レベルに留まる旨が計画§1-3に明記されて
# いる。ただし updateIntervalSeconds: 10 が実際に効くことは、Step 1のAC2
# (2026-07-30 実機検証、docs/ai/reviews/grafana_provisioning/
# 2026-07-30_008_test_result_step1.md 後日追記)で既に実地確認済み
# (restart無しでGrafanaがJSONを読み直すことを`resource`テーブルの
# `generation`/`updatedTimestamp`遷移で確認している)。allowUiUpdates: false の
# 方は「UI編集が実際に拒否される」ことの確認手段がYoshinobuのUI操作しかない
# ため、現状追認として扱う(計画§1-3)。
#
# infra-syslogエントリ(2026-07-30、U6で新設): folder: '' はU5の実測
# (docs/ai/reviews/grafana_provisioning/2026-07-30_013_syslog_dashboard_investigation.md
# — resourceテーブルの当該dashboardのfolder列が空文字列であり、folder
# リソーステーブルにはUniFiの1行しか存在しない)で確定。path は既存unifi
# providerのpathと衝突しない新設ディレクトリ
# (defaults/main.yml の grafana_provisioning_infra_syslog_dashboards_dir)を指す
# — 同じpathを指すとsyslogダッシュボードがUniFi folderに入ってしまう
# (requirement R10)。
#
# owner/modeは両エントリ共通で計画§1-8の表のとおり(root:grafana 0640、
# docs/ai/reviews/grafana_provisioning/2026-07-30_002_investigation.md R1-1の
# directory listingで実測済み)。infra-syslogエントリは新規provider yamlだが
# 配置先ディレクトリ(/etc/grafana/provisioning/dashboards/)はunifiエントリと
# 同じであり、そのディレクトリのowner/mode実測値をそのまま適用できるため
# 新たな類推を要しない。
#
# unifiエントリは「Ansible外で配置されたファイルをAnsibleが初めて上書きする」
# ため、内容は実質無変更(2行追加のみ)でも初回は changed=true になる
# (計画§1-8)。infra-syslogエントリはホスト上に存在しないファイルへの新規
# 配置なので、当然初回は changed=true になる。
#
# 複数provider対応へのループ化(2026-07-30、U6): register先の
# grafana_provisioning_provider_result はループ化後も `.changed`
# (いずれかのitemがchangedならtrue)と `.results`(item別詳細)の両方を持つ
# ことを scratchpad decoy(ansible_connection: local)で実測確認済み
# (implement記録に記載)。restart_and_verify.yml側の
# `grafana_provisioning_provider_result.changed | default(false)` は
# 変更不要でそのまま正しく機能する。
#
# ホスト上のファイル名は各providerで固定する。unifiは現行のまま `unifi.yaml`
# を維持する(provider名/パスの無変化がR2の要件のため、repo側のファイル名
# `dashboards-provider-unifi.yml` とは意図的に異なる)。infra-syslogは
# 対称的に `infra-syslog.yaml` とした(新設のため衝突回避以外の制約は無い)。
# 対応表は defaults/main.yml の grafana_provisioning_providers が唯一の入力。

- name: Deploy dashboard provider yaml to monnie
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ grafana_provisioning_provider_dir }}/{{ item.dest }}"
    owner: root
    group: grafana
    mode: "0640"
  loop: "{{ grafana_provisioning_providers }}"
  loop_control:
    label: "{{ item.dest }}"
  register: grafana_provisioning_provider_result
  when: not ansible_check_mode
  tags: [provider, destructive]
