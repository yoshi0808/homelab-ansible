---
cert_renew_ca_dir: /run/semaphore-ca
cert_renew_ca_host: quory
cert_renew_valid_days: 45
cert_renew_renew_threshold: 15
force_renew: false

cert_renew_ca_src_crt: /home/yoshi/.cert/ca/home_tls_ca.crt
cert_renew_root_ca_src_crt: /home/yoshi/.cert/ca/radius_ca.crt
# **中間CAの秘密鍵は cert_renew_ca_host(quory)にしか置かない。ansy へ複製しない。**
# 2026-08-05まで ansy にも残っていた — 中間CAをansyで生成し、テストが通ってから
# quoryへ証明書を配った当時の名残である(Yoshinobu、同日削除)。
# 消してよいと判断した根拠: repo内でこの鍵を参照するのは cert_renew_ca_host 上の
# パスだけで、cert_renew.yml / cert_renew_quory.yml とも同ホストは localhost
# (=quory上での実行)である。ansyを前提にした参照は1つも無い。quoryが鍵を持つ
# ことは、quoryのleaf証明書の notBefore が月次timerの発火時刻(2026-08-01
# 00:35:11 JST)と一致し、issuerが Home-TLS-CA であることで確認した。
# **なぜ気にするか**: この鍵があれば内部のどんな名前でも、全ホストが信頼する
# 証明書を発行できる。SSH鍵より強い。ansyはAIエージェントがシェルを持つホスト
# であり、Phase 4 で開発側の認証情報を全廃した意味がここだけ抜けていた。
cert_renew_ca_src_key: /home/yoshi/.cert/ca/home_tls_ca.key
cert_renew_intermediate_ca_warn_days: 90

cert_renew_hosts_config:
  ansy:
    cert_path: /etc/semaphore/tls/ansy.internal.crt
    key_path: /etc/semaphore/tls/ansy.internal.key
    cert_check_path: /etc/semaphore/tls/ansy.internal.crt
    cn: ansy.internal
    san_dns:
      - ansy.internal
      - ansy
    san_ip: []
    deploy_type: semaphore
  quory:
    cert_path: /etc/semaphore/tls/quory.internal.crt
    key_path: /etc/semaphore/tls/quory.internal.key
    cert_check_path: /etc/semaphore/tls/quory.internal.crt
    cn: quory.internal
    san_dns:
      - quory.internal
      - quory
    san_ip: []
    deploy_type: semaphore
  pve1:
    cert_check_path: /etc/pve/local/pveproxy-ssl.pem
    cn: pve1.internal
    san_dns:
      - pve1.internal
      - pve1
    san_ip: []
    deploy_type: proxmox
  pve2:
    cert_check_path: /etc/pve/local/pveproxy-ssl.pem
    cn: pve2.internal
    san_dns:
      - pve2.internal
      - pve2
    san_ip: []
    deploy_type: proxmox
  monnie:
    cert_path: /etc/grafana/certs/monnie.crt
    key_path: /etc/grafana/certs/monnie.key
    cert_check_path: /etc/grafana/certs/monnie.crt
    cn: monnie.internal
    san_dns:
      - monnie.internal
      - monnie
    san_ip: []
    deploy_type: grafana
