---
# issue_check.yml - determines whether a per-host certificate needs
# renewal (cert_needs_renewal) and resolves the SAN IP, without generating
# or signing anything. Split out of the former issue.yml
# (check_mode_semantics round2, playbooks/cert_renew.yml) so this
# diagnostic half can run under --check while issue_apply.yml (the actual
# keygen/CSR/sign chain) is gated separately. This is the "分離可能な更新
# 要否チェック" that OQ2 (docs/ai/reviews/check_mode_semantics/
# 2026-07-31_006_round2_requirement.md) asked to confirm for cert_renew.yml.
#
# Shared file: also imported (unconditionally, via issue.yml, which now
# just imports this file followed by issue_apply.yml) by
# playbooks/cert_renew_quory.yml and roles/homelab_cert_renew/tasks/main.yml
# (out of scope for this batch). None of the tasks below are check-mode-
# gated, so their behavior is unchanged by this split.
- name: Set host cert config
  ansible.builtin.set_fact:
    cert_host_config: "{{ cert_renew_hosts_config[inventory_hostname] }}"

- name: Check cert file exists on remote host
  ansible.builtin.stat:
    path: "{{ cert_host_config.cert_check_path }}"
  register: cert_file_stat

- name: Check cert days remaining
  ansible.builtin.shell: |
    EXPIRE_DATE=$(openssl x509 -enddate -noout -in "{{ cert_host_config.cert_check_path }}" | sed 's/notAfter=//')
    EXPIRE_EPOCH=$(date -d "$EXPIRE_DATE" +%s)
    NOW=$(date +%s)
    echo $(( (EXPIRE_EPOCH - NOW) / 86400 ))
  register: cert_days_left
  changed_when: false
  failed_when: false
  when: cert_file_stat.stat.exists
  # R5 (check_mode_semantics round2): shell is check_mode-unsupported and
  # would otherwise auto-skip under --check. "Determine if cert renewal is
  # needed" below already defends the read with | default('0'), so a skip
  # here would not crash it -- but it would silently make
  # cert_needs_renewal true for every host with days left (0 <=
  # cert_renew_renew_threshold is almost always true), destroying the
  # dry-run value that is the whole reason cert_renew.yml is being moved to
  # check-mode-native (OQ2). Read-only, so forcing real execution is safe.
  check_mode: false

- name: Determine if cert renewal is needed
  ansible.builtin.set_fact:
    cert_needs_renewal: >-
      {{ force_renew | bool
         or not cert_file_stat.stat.exists
         or (cert_days_left.stdout | default('0') | trim | int) <= cert_renew_renew_threshold }}

- name: Log cert status
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: exists={{ cert_file_stat.stat.exists }},
      days_left={{ cert_days_left.stdout | default('N/A') | trim }},
      needs_renewal={{ cert_needs_renewal }}

- name: Resolve hostname IPv4 address from CA host
  ansible.builtin.command:
    cmd: getent ahostsv4 {{ cert_host_config.cn }}
  register: cert_hostname_resolve
  delegate_to: "{{ cert_renew_ca_host }}"
  changed_when: false
  when: cert_needs_renewal
  failed_when: cert_hostname_resolve.rc != 0
  # R5: read-only DNS lookup on the CA host. "Set resolved IPv4 fact" below
  # calls .stdout.split()[0] directly (not through | default), which raises
  # on an Undefined attribute (unlike a plain | default filter) if this
  # task were skipped, so it must run for real whenever cert_needs_renewal.
  check_mode: false

- name: Set resolved IPv4 fact
  ansible.builtin.set_fact:
    cert_resolved_san_ip: "{{ cert_hostname_resolve.stdout.split()[0] }}"
  when: cert_needs_renewal
