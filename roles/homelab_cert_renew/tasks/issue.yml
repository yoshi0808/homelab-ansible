---
# issue.yml - combined entry point, preserved for callers that want
# "always run the whole thing" semantics (playbooks/cert_renew_quory.yml,
# tasks/main.yml). Split into issue_check.yml (cert_needs_renewal
# determination) and issue_apply.yml (destructive: keygen/CSR/sign) so
# that playbooks/cert_renew.yml (check_mode_semantics round2) can gate
# only the apply half under --check while still running the check half.
# This file imports both unconditionally, in their original order, so
# behavior for existing callers (cert_renew_quory.yml, main.yml) is
# unchanged.
- name: Run issue_check.yml
  ansible.builtin.import_tasks: issue_check.yml

- name: Run issue_apply.yml
  ansible.builtin.import_tasks: issue_apply.yml
