---
# issue_apply.yml - generates the EC key, CSR, and signs the certificate on
# the CA host. Split out of the former issue.yml (check_mode_semantics
# round2, playbooks/cert_renew.yml) so this destructive part can be gated
# with `when: not ansible_check_mode` at the playbooks/cert_renew.yml call
# site, while issue_check.yml (cert_needs_renewal determination) stays
# ungated.
#
# Shared file: playbooks/cert_renew_quory.yml and
# roles/homelab_cert_renew/tasks/main.yml (out of scope for this batch)
# import this unconditionally too, via issue.yml -> here, under their own
# `check_mode: false` at the import_role call site, so they keep forcing
# real execution regardless of --check exactly as before this split.
#
# TS-033: tasks 1-7 below (Template OpenSSL config through Set fullchain
# file permissions) form one contiguous dependent chain (each step
# consumes files the previous step wrote) and were already contiguous and
# in this order in the pre-split issue.yml. They are gated as a single
# unit at the playbooks/cert_renew.yml call site (one
# `when: not ansible_check_mode` on the import_role task that pulls in
# this whole file, combined with the deploy_* role in the same named block
# -- see playbooks/cert_renew.yml) rather than reordered or wrapped in an
# additional nested block here.
- name: Template OpenSSL config on quory
  ansible.builtin.template:
    src: openssl-san.cnf.j2
    dest: "{{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.cnf"
    mode: "0600"
  delegate_to: "{{ cert_renew_ca_host }}"
  when: cert_needs_renewal

- name: Generate EC private key on quory
  ansible.builtin.command:
    cmd: >
      openssl ecparam -genkey -name secp384r1 -noout
      -out {{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.key
  delegate_to: "{{ cert_renew_ca_host }}"
  no_log: true
  when: cert_needs_renewal
  changed_when: true

- name: Set key file permissions
  ansible.builtin.file:
    path: "{{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.key"
    mode: "0600"
  delegate_to: "{{ cert_renew_ca_host }}"
  when: cert_needs_renewal

- name: Generate CSR on quory
  ansible.builtin.command:
    cmd: >
      openssl req -new
      -key {{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.key
      -out {{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.csr
      -config {{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.cnf
  delegate_to: "{{ cert_renew_ca_host }}"
  when: cert_needs_renewal
  changed_when: true

- name: Sign certificate with CA on quory
  ansible.builtin.command:
    cmd: >
      openssl x509 -req
      -in {{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.csr
      -CA {{ cert_renew_ca_dir }}/ca.crt
      -CAkey {{ cert_renew_ca_dir }}/ca.key
      -days {{ cert_renew_valid_days }}
      -extensions v3_req
      -extfile {{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.cnf
      -out {{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.crt
      -CAcreateserial
  delegate_to: "{{ cert_renew_ca_host }}"
  no_log: true
  when: cert_needs_renewal
  changed_when: true

- name: Create fullchain certificate on quory
  ansible.builtin.shell: |
    cat "{{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.crt" \
        "{{ cert_renew_ca_dir }}/ca.crt" \
        > "{{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.fullchain.crt"
  delegate_to: "{{ cert_renew_ca_host }}"
  when: cert_needs_renewal
  changed_when: true

- name: Set fullchain file permissions
  ansible.builtin.file:
    path: "{{ cert_renew_ca_dir }}/certs/{{ inventory_hostname }}.fullchain.crt"
    mode: "0600"
  delegate_to: "{{ cert_renew_ca_host }}"
  when: cert_needs_renewal

- name: Record renewal status
  ansible.builtin.set_fact:
    cert_renewed: "{{ cert_needs_renewal }}"
