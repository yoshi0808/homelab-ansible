---
# prepare_ca.yml - combined entry point, preserved for callers that want
# "always run the whole thing" semantics (playbooks/cert_renew_quory.yml,
# tasks/main.yml). Split into prepare_ca_check.yml (diagnostics) and
# prepare_ca_apply.yml (destructive: stages CA cert/key onto tmpfs) so that
# playbooks/cert_renew.yml (check_mode_semantics round2) can gate only the
# apply half under --check while still running the check half. This file
# imports both unconditionally, in their original order, so behavior for
# existing callers (cert_renew_quory.yml, main.yml) is unchanged.
- name: Run prepare_ca_check.yml
  ansible.builtin.import_tasks: prepare_ca_check.yml

- name: Run prepare_ca_apply.yml
  ansible.builtin.import_tasks: prepare_ca_apply.yml
