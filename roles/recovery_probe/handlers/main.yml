---
# 設定・daemon 本体・unit のいずれかが変わったら、稼働中の daemon へ必ず届ける。
#
# 条件が `recovery_probe_service_enabled` だけだった頃は、本番(quory)への配備で
# `-e recovery_probe_service_enabled=true` を渡し忘れるとファイルだけが新しくなり、
# daemon は旧コードのまま走り続けた(2026-07-29 実測。
# docs/ai/reviews/recovery_probe_external_check/2026-07-29_002_test_result_deployed.md)。
# sha256sum や git diff では「配備済み」に見えるため、検出できない。
#
# 「現に動いているなら反映する」を条件に加えることで、フラグの渡し忘れが反映漏れに
# ならないようにする。dev(ansy)は daemon を起動していないため、ここで start される
# ことはない(state: restarted は停止中のサービスを起動してしまうため、この区別が要る)。
- name: Restart recovery-probe
  ansible.builtin.systemd:
    name: "{{ recovery_probe_unit_name }}"
    daemon_reload: true
    state: restarted
  become: true
  # check-mode-native: `check_mode: false` alone would force a real restart
  # if this handler were ever notified while ansible_check_mode is true.
  # In the current design it never is (the notifying tasks in tasks/main.yml
  # are themselves gated on `when: not ansible_check_mode` and therefore
  # never report changed under --check), but the `when:` below closes the
  # gap explicitly rather than depending only on that upstream gating
  # (audit 2026-07-31_004_classification_audit.md §2.12).
  when: >-
    not ansible_check_mode
    and (
      recovery_probe_service_enabled | bool
      or recovery_probe_running_before | default(false) | bool
    )
  check_mode: false
