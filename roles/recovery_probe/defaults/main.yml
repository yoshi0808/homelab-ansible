---
# recovery-probe (pull 検知 daemon) の設定
# 設計: docs/ai/reviews/autonomous_recovery/2026-07-02_001_requirement.md

# 60 秒間隔 × 5 回連続失敗で発火(Yoshinobu 判断 2026-07-02。
# mute を忘れて Sophos GUI パッチを開始しても、通常のパッチリブートなら
# 発火前に復帰するマージン)
recovery_probe_interval_s: 60
recovery_probe_threshold: 5

# ラダー実行後、probe 応答の回復を待つ秒数
recovery_probe_recovery_wait_s: 300

# ansible-playbook / ansible を実行するリポジトリ(quory / ansy とも checkout あり)
recovery_probe_repo_dir: /home/yoshi/homelab-ansible

# probe サービスの実行ユーザー(repo・vault パスワード・SSH 鍵を持つ)
recovery_probe_user: yoshi

# 外部到達性チェック(ISP 切り分け・通知 flush 判定)。
# ホスト名解決は sophos-fw の DNS に依存してよい: この URL を評価するのは
# LAN 側が健全な分岐と通知 flush 時のみ(requirement 参照)
recovery_probe_external_check_url: https://one.one.one.one

# pvesh 確証に使う pve ホスト候補(inventory 名、定義順)。ラダー発火の
# たびに先頭から read-only probe し(recovery-probe.py の
# pick_pve_host)、最初に到達可能なノードへ以降の pvesh 呼び出しを送る。
# 全滅なら pve-unreachable として既存の critical 通知経路へ合流する。
# pve1 が平日日中シャットダウン運用でも pve2 へ自動でフォールバックする
# ため、pve1 の起動状態に合わせて値を書き換える運用は不要
# (docs/ai/reviews/proxmox_exec_node_selection/2026-07-29_001_requirement.md
# R9)。
recovery_probe_pve_hosts:
  - pve1
  - pve2

# true にすると systemd サービスを enable + start する(本番 quory)。
# 開発(ansy)では配置のみで起動しない(recovery_io_setup と同じ流儀)。
# 本番の true は inventories/homelab/host_vars/quory.yml が持つ — CLI の -e に
# 頼ると渡し忘れが「配備したのに旧コードのまま」を生むため(2026-07-29)。
# なお、このフラグが false でも「既に走っている daemon」への反映は行われる
# (handlers/main.yml)。この値が決めるのは enable + 起動の有無だけである。
recovery_probe_service_enabled: false

# インスタンス名。空文字列は本番インスタンスを意味し、既定値のままなら unit 名・
# 設定パス・状態ディレクトリはすべて従来と同一の値になる(値を変えないこと自体が
# 要件である — ここがずれると本番 daemon が別物として再配備される)。
#
# 値を入れると第2インスタンスになる。**daemon 本体は共有する** — 同じ
# recovery-probe.py を別の設定で起動するのであって、コードは複製しない。
#
# 分離が必要なのは state_dir である。fire_ladder の実行中ロックは
# `state_dir/ladder.lock` であり target 別ではない(flapping の
# `firings-<target>.json` とは異なる)。検証用インスタンスを本番の state_dir で
# 動かすと、検証中に本番の障害が起きたときラダーが `LADDER skip: lock held` で
# 見送られる。
recovery_probe_instance: ""

recovery_probe_unit_name: "recovery-probe{{ ('-' ~ recovery_probe_instance) if recovery_probe_instance else '' }}"
recovery_probe_config_path: "/etc/homelab-recovery/{{ recovery_probe_unit_name }}.json"
recovery_probe_state_dir: "/var/lib/homelab-recovery/probe{{ ('-' ~ recovery_probe_instance) if recovery_probe_instance else '' }}"

# mute と監視一時停止フラグも既定は本番の値。第2インスタンスで本番と共有すると、
# 本番の mute が検証側を黙らせる(逆も同様)ため、分けるなら明示的に上書きする。
recovery_probe_mute_dir: /var/lib/homelab-recovery/mute
recovery_probe_monitoring_pause_flag: /var/lib/recovery-exec/workspace/monitoring-paused

# 検知対象。action: ladder = 決定論ラダー(VM reboot → hacritical なら failover)/
# notify = 通知のみ
#
# ladder は「ping 無応答 = VM/ネットワークスタック自体が無応答」を検知して
# 対応するもので、対象 VM 上でどのサービスが動いているかは問わない
# (VM reboot → 必要なら failover のみ、サービス種別non依存)。
# 個別サービス(freeradius/grafana-server 等)のクラッシュはこの経路では
# 扱わない — それは各 VM 内部の自己回復の話であり、recovery_push の
# OnFailure 経由(サービス restart のみ)で別途カバーする。
recovery_probe_targets:
  sophos-fw:
    host: sophos-fw.internal
    probes: ["icmp", "dns"]
    dns_check_name: quory.internal
    action: ladder
    failover: true
  authy:
    host: authy.internal
    probes: ["icmp", "tcp:22"]
    action: ladder
    failover: true
  monnie:
    host: monnie.internal
    probes: ["icmp", "tcp:3000"]
    action: ladder
    failover: false
