---
# Semaphoreテンプレート定義カタログ。
#
# **正本はこのファイル。** Semaphore UI上のテンプレートは、このカタログを
# roles/semaphore_templates/tasks/ がSemaphore REST API へreconcileした結果
# である。UIでの手編集は次回適用時に上書きされる(R2「人が命名するとドリフト
# の元になる」)。
#
# 転記元: docs/ai/reviews/semaphore_templates_as_code/2026-08-04_002_observed_templates.md
# (2026-08-04, `semaphore-query template-list` による read-only 観測)。
#
# **観測データは34行だった。** requirement文中の「36本」という記述と、実際に
# 読めた project__template の行数(34、id 1-36のうち13と18が欠番)は食い違う。
# SQLiteのAUTOINCREMENTは削除後のidを再利用しないため、13と18はこの観測より
# 前に削除された2件のテンプレートの痕跡である可能性が高いが、Semaphore側の
# 削除履歴を見る手段が無く確認できていない(未確認。
# docs/ai/reviews/semaphore_templates_as_code/2026-08-04_003_implement.md参照)。
# このカタログは実際に観測できた34件だけを転記し、存在しない2件を作らない。
#
# **2026-08-04追補(R1の読み方が1点変わった):** 「実スキーマに存在する列だけを
# 扱う」は、project__templateのDBスキーマではなく**Semaphore APIの応答形式**を
# 指すものとして読む。ansy(project id=2)での実測で、APIは`environment_id` /
# `environment_ids`という、DBスキーマ実測(2026-08-04時点)には無い列も返す
# ことが分かったため。このカタログ自体は引き続きplaybook/class/variant/
# title/arguments/survey_vars/class_reasonだけを持ち、`environment_id`等を
# 新しいカタログフィールドとして追加してはいない — R13の「取得→マージ→送信」
# (roles/semaphore_templates/tasks/apply.yml)が、カタログが関知しない列を
# 観測値のまま素通しするため、カタログ側に追加の列を持たせる必要が無い。
#
# --- class の決め方(2026-08-04 Yoshinobu確認) -----------------------------
#
# **軸は「押したときにサービスが受ける影響の大きさ」ひとつである。**
# 元に戻しやすいかどうかは決め手にしない — 戻すのが大変でも、サービスが
# 止まらないなら SEMI-SAFE である(実例: codex update check)。
#
#   SAFE       押しても本番の状態が変わらない。観測・診断・シミュレーション
#   SEMI-SAFE  状態は変わるが、サービスへの影響が小さい。大きくトラブらない
#   UN-SAFE    サービスに大きく影響しうる。停止・再起動・移行・パッチ適用
#   SANDBOX    対象が sandbox に固定されており、本番へ触れない
#
# **この class は `tester-gate` とは別の軸であり、一致検査はしない。**
# `tester-gate` は「Testerがどう実行してよいか」を表す。両者が食い違う
# エントリには `class_reason` を1行持たせる(R8)。
#
# 新しいplaybookを足す人へ: このカタログにエントリを足す差分そのものが、
# 分類の提案である。**分類の承認はcommitの承認、ボタンになるのはreconcileを
# 流したとき**の2段階で、どちらもYoshinobuが行う。
#
# --- フィールドの意味 -----------------------------------------------------
# playbook:     playbooks/*.yml の相対パス(必須)
# class:        SAFE / SEMI-SAFE / UN-SAFE / SANDBOX のいずれか(必須)
# variant:      同じplaybookに複数テンプレートがあるときのラベル。
#               playbook単位で一意であること(reconcileの同定キー、R3)
# title:        表題の上書き。省略時は playbook のbasenameから機械変換する
#               (.yml除去、_を空白へ、先頭大文字。R2)
# arguments:    CLI引数の配列。既定は空
# survey_vars:  SemaphoreのSurvey Variables定義。観測値をそのまま転記
# class_reason: class と tester-gate が食い違うエントリにだけ持たせる1行理由
#               (R8。一致検査はしない)
# legacy_name:  2026-08-04観測時点でSemaphore上にあった手作業の名前。
#               R1のスキーマ表には無いフィールドだが、reconcile role の
#               ブートストラップ照合(R3/R11)にだけ使う内部データで、現在
#               存在しない9件(R7で新規追加)には持たせない。存在する34件は
#               このフィールドで初回だけ既存テンプレートと対応付けられる。
#               2026-08-04追補(R11): 以後の追跡はSemaphoreオブジェクト
#               自身の`description`列に書き込む識別マーカーで行う(側ファイル
#               を廃止した)。初回適用でmarkerが書き込まれた後は、この
#               フィールドは参照されなくなる(vestigialだが監査証跡として残す)。

semaphore_templates_catalog:
  # --- 監視・healthcheck系(既存、単一template) ---------------------------
  - playbook: playbooks/proxmox_healthcheck.yml
    class: SAFE
    legacy_name: "SAFE: Proxmox healthcheck"

  # R2の実例そのもの: ファイル名(radius)と対象ホスト名(Authy)が食い違うため
  # title上書きを使う。
  - playbook: playbooks/radius_healthcheck.yml
    class: SAFE
    title: "Authy healthcheck"
    legacy_name: "SAFE: Authy healthcheck"

  - playbook: playbooks/monitoring_healthcheck.yml
    class: SAFE
    legacy_name: "SAFE: Monitoring healthcheck"

  - playbook: playbooks/proxmox_hw_check.yml
    class: SAFE
    legacy_name: "SAFE: Proxmox hardware check"

  - playbook: playbooks/ubuntu_nightly.yml
    class: SEMI-SAFE
    legacy_name: "SEMI-SAFE: Ubuntu nightly reboot if required"

  # R8既知の食い違い1/2: apt-get updateでパッケージリストを更新するため
  # 厳密にはread-onlyではないが、パッケージ状態は変わらない
  # (tester-gate: safe-readonly)。2026-08-04 Yoshinobu判断済み。
  # 現在のSemaphore上はSEMI-SAFEだが、このカタログではSAFEへ是正する
  # (次回適用でclassが変わる — R6の差分に現れる)。
  - playbook: playbooks/proxmox_patch_dryrun.yml
    class: SAFE
    class_reason: >-
      apt-get updateでパッケージリストを更新するため厳密にはread-onlyでは
      ないが、パッケージ状態は変わらない(tester-gate: safe-readonly)。
      Policy §7「分類名から副作用ゼロを推定しない」の範囲内。R8既知の食い違い
    legacy_name: "SEMI-SAFE: Proxmox patch dry-run"

  # --- Proxmoxパッチ・退避系 ------------------------------------------------
  - playbook: playbooks/proxmox_patch_weekly_full.yml
    class: UN-SAFE
    legacy_name: "UN-SAFE:Proxmox Weekly Full Patch"

  - playbook: playbooks/proxmox_patch_apply_node.yml
    class: UN-SAFE
    legacy_name: "UN-SAFE:Proxmox patch apply (Manual)"
    survey_vars:
      - { name: target_node, title: target_node, required: true, type: enum, description: "pve1 or pve2",
          values: [{ name: pve1, value: pve1 }, { name: pve2, value: pve2 }] }
      - { name: proxmox_patch_apply_mode, title: proxmox_patch_apply_mode, required: true, default_value: manual }
      - { name: proxmox_patch_apply_manual_confirm, title: proxmox_patch_apply_manual_confirm, required: true, type: enum,
          default_value: MAJOR_UPGRADE_DETECTED,
          values: [{ name: MAINTENANCE_REQUIRED, value: MAINTENANCE_REQUIRED }, { name: MAJOR_UPGRADE_DETECTED, value: MAJOR_UPGRADE_DETECTED }] }

  - playbook: playbooks/proxmox_evacuate_node.yml
    class: UN-SAFE
    legacy_name: "UN-SAFE:Proxmox evacuate node(Manual)"
    survey_vars:
      - { name: target_node, title: target_node, required: true, type: enum,
          values: [{ name: pve1, value: pve1 }, { name: pve2, value: pve2 }] }

  - playbook: playbooks/proxmox_restore_vm_placement.yml
    class: UN-SAFE
    legacy_name: "UN-SAFE:Proxmox restore vm placement(Manual)"
    survey_vars:
      - { name: target_node, title: target_node, required: true, type: enum,
          values: [{ name: pve1, value: pve1 }, { name: pve2, value: pve2 }] }

  # --- 証明書・CA ------------------------------------------------------------
  # 2026-08-06、既定を true から false へ変えた(Yoshinobu判断)。
  #
  # **狙いは「月1回の強制置き換え」から「週1回の、期限が近いときだけ置き換え」へ
  # 移すこと。** 証明書は有効45日・残り15日で更新する設計
  # (roles/homelab_cert_renew/defaults/main.yml)なので、更新猶予の窓は15日ある。
  # 月次だとその窓に当たる機会が1回しかなく、**外すと次の機会は期限の後になる** —
  # 2026-08-01に実際にそうなった(pve1が到達不能で4回連続中断し、pve2とmonnieが
  # 更新されないまま8月中旬の期限へ向かっていた)。週次なら窓の中に2〜3回入る。
  #
  # **survey自体は残す。** 8/5の手動更新のように、期限に関係なく強制的に置き換えたい
  # 場面がある(ROOT CA差し替え後の全ホスト再発行など)。既定をfalseにするだけで、
  # 打てば従来どおりtrueにできる。
  #
  # **scheduleは下の`semaphore_schedules_catalog`が持つ(2026-08-10)。** 該当
  # エントリの`environment`が`force_renew`の値を自分で持つため、**このsurvey
  # 既定値はschedule実行には効かない。** 変えるときは両方を合わせること。
  # **曜日は週末を選ぶこと** — pve1は夏季に平日
  # シャットダウンされるため、平日に走らせると週次にしてもpve1だけ毎回外す。
  - playbook: playbooks/cert_renew.yml
    class: SEMI-SAFE
    legacy_name: "SEMI-SAFE:Cert_renew (only on Quory)"
    survey_vars:
      - { name: force_renew, title: force_renew, default_value: "false" }

  # 2026-08-05追加。ROOT CAの差し替え(root_ca_keyusage案件)に必要だが、
  # そのときボタンが無いことが判明したため。押すと全ホストの信頼ストアへ
  # ROOT CAを配り update-ca-certificates を走らせる。classは同じ証明書系の
  # cert_renew / cloudkey_cert_deploy に揃えてSEMI-SAFE(状態は変わるが
  # サービスは止まらない。誤った証明書を配った場合も、正しいものを置いて
  # 押し直せば戻る)。引数・surveyは持たない — 対象はplaybookのhosts:が決める。
  - playbook: playbooks/ca_trust_deploy.yml
    class: SEMI-SAFE

  - playbook: playbooks/sophos_trim.yml
    class: SEMI-SAFE
    legacy_name: "SEMI-SAFE:Sophos trim"

  - playbook: playbooks/cloudkey_cert_deploy.yml
    class: SEMI-SAFE
    legacy_name: "SEMI-SAFE:Cloudkey_cert_deploy"

  # R8既知の食い違い2/2: 復元先VMIDは999に固定(assertで他の値を拒否)、
  # NIC切断で起動し判定後に破棄する。既存VMには影響しない
  # (tester-gate: risk-accepted)。2026-08-04 Yoshinobu判断済み。classは既に
  # SAFEで一致しているため、ここではclass_reasonだけを持たせる(class自体は
  # 変えない)。
  - playbook: playbooks/proxmox_backup_restore_verify.yml
    class: SAFE
    class_reason: >-
      復元先VMIDは999に固定(assertで他の値を拒否)、NIC切断で起動し判定後に
      破棄する。既存VMには影響しない(tester-gate: risk-accepted)。R8既知の食い違い
    legacy_name: "SAFE:Proxmox backup restore verify"

  - playbook: playbooks/unifi_backup_fetch.yml
    class: SEMI-SAFE
    legacy_name: "SEMI-SAFE:Unifi backup fetch"

  # semaphore_db_backup案件(2026-08-17)。quoryのSemaphoreを3点セット
  # (semaphore.db / projects export JSON / config.json)でSynology NFSへ退避
  # する。unifi_backup_fetchと同じ骨格(quoryのSemaphoreから起動→pveが
  # NFSへ書く→世代ローテーション→Slack通知)のためclass・survey_vars/argumentsの
  # 有無ともunifi_backup_fetchに揃える(引数・surveyなし。対象ノードの選定は
  # roles/proxmox_exec_nodeに委ねplaybook自身のhosts:には現れない)。
  - playbook: playbooks/semaphore_db_backup.yml
    class: SEMI-SAFE

  - playbook: playbooks/proxmox_snapshot_check.yml
    class: SAFE
    legacy_name: "SAFE:Proxmox snapshot check"

  - playbook: playbooks/time_sync_check.yml
    class: SAFE
    legacy_name: "SAFE: Time sync check"

  # --- 自律復旧: 承認された手動実行(apply) / sandbox の2template ------------
  # 同じplaybookを共有する2テンプレートは、class(UN-SAFE/SANDBOX)に加えて
  # variantで一意化する(R3の同定キー)。
  - playbook: playbooks/recovery_ha_failover.yml
    class: UN-SAFE
    variant: apply
    legacy_name: "UN-SAFE:Recovery ha failover(Manual)"
    survey_vars:
      - { name: target, title: target, required: true, type: enum,
          values: [{ name: authy, value: authy }, { name: sophos-fw, value: sophos-fw }] }

  - playbook: playbooks/recovery_service_restart.yml
    class: UN-SAFE
    variant: apply
    legacy_name: "UN-SAFE:Recovery service restart(Manual)"
    survey_vars:
      - { name: target, title: target, required: true, type: enum,
          values: [{ name: authy, value: authy }, { name: monnie, value: monnie }] }

  - playbook: playbooks/recovery_vm_reboot.yml
    class: UN-SAFE
    variant: apply
    legacy_name: "UN-SAFE:Recovery vm reboot(Manual)"
    survey_vars:
      - { name: target, title: target, required: true, type: enum,
          values: [{ name: authy, value: authy }, { name: monnie, value: monnie }, { name: sophos-fw, value: sophos-fw }] }

  - playbook: playbooks/codex_update_check.yml
    class: SEMI-SAFE
    legacy_name: "SEMI-SAFE:Codex update check(Only on Quory)"

  # --- Ubuntu VM full upgrade: dry-run / apply の2template -------------------
  - playbook: playbooks/ubuntu_vm_full_upgrade.yml
    class: SEMI-SAFE
    variant: dry-run
    legacy_name: "SEMI-SAFE:Ubuntu vm full upgrade(dry_run=true)"
    survey_vars:
      - { name: dry_run, title: dry_run, required: true, description: "アップグレードせずに情報収集を行います", default_value: "true" }

  - playbook: playbooks/ubuntu_vm_full_upgrade.yml
    class: UN-SAFE
    variant: apply
    legacy_name: "UN-SAFE:Ubuntu vm full upgrade(Manual)"
    survey_vars:
      - { name: dry_run, title: dry_run, required: true, description: "実際にアップグレードを適用します", default_value: "false" }
      - { name: node, title: node, required: true, type: enum, description: "対象ノードを指定します",
          values: [{ name: ansy, value: ansy }, { name: monnie, value: monnie }, { name: authy, value: authy }, { name: quory, value: quory }] }
      - { name: ubuntu_vm_full_upgrade_confirm, title: ubuntu_vm_full_upgrade_confirm, required: true, description: "アップグレードの対象ノードを指定します" }

  # --- Prometheus update/rollback: apply / check / rollback の3template -----
  # AC3の実例そのもの(variant: rollback)。titleは3件とも省略時の機械変換
  # ("Prometheus update check")に揃う — 手作業では"Prometheus update"と
  # "Prometheus update check"の2表記が混在していたのが解消される。
  - playbook: playbooks/prometheus_update_check.yml
    class: UN-SAFE
    variant: apply
    legacy_name: "UN-SAFE:Prometheus update(Manual)"
    survey_vars:
      - { name: dry_run, title: dry_run, required: true, description: update適用, default_value: "false" }

  - playbook: playbooks/prometheus_update_check.yml
    class: SAFE
    variant: check
    legacy_name: "SAFE:Prometheus update check"
    survey_vars:
      - { name: dry_run, title: dry_run, required: true, description: チェックのみ, default_value: "true" }

  # legacy_nameの "UNSAFE:" は表記ゆれ。UN-SAFE として扱う(依頼文の指示どおり)。
  - playbook: playbooks/prometheus_update_check.yml
    class: UN-SAFE
    variant: rollback
    legacy_name: "UNSAFE:Prometheus rollback(Manual)"
    survey_vars:
      - { name: dry_run, title: dry_run, required: true, description: ロールバック実行, default_value: "false" }
      - { name: rollback, title: rollback, description: ロールバック指定, default_value: "true" }
      - { name: rollback_to, title: rollback_to, description: 指定バージョンへのRollback }

  - playbook: playbooks/recovery_monitoring_check.yml
    class: SAFE
    legacy_name: "SAFE:Recovery monitoring check"

  # semaphore_update_check案件(2026-08-24)。ansy/quoryのSemaphore自身の
  # 新版検知。`semaphore version`のローカル実行とGitHub releases/latestへの
  # read-only GETのみで、適用・ダウンロード・サービス操作を一切持たない。
  # 唯一の副作用はSlack通知であり、common_slackの抑止guardで止まる
  # (tester-gate: role-guarded、TS-005。ここでのclass: SAFEはSemaphore
  # template UI上の分類でtester-gateとは別軸、一致検査はしない)。
  # dry_runのような実行パラメータを持たないため引数・survey_varsとも無し
  # (roles/prometheus_update_checkのapply/check/rollbackの3template構成
  # とは異なり、このplaybookはtemplateも
  # scheduleも1本で足りる)。
  - playbook: playbooks/semaphore_update_check.yml
    class: SAFE

  # --- sandbox版(recovery_*系のapplyと同じplaybookを共有) -------------------
  - playbook: playbooks/recovery_vm_reboot.yml
    class: SANDBOX
    variant: sandbox
    legacy_name: "SANDBOX: Recovery vm reboot"
    survey_vars:
      - { name: target, title: target, type: enum, default_value: sandbox, values: [{ name: sandbox, value: sandbox }] }

  - playbook: playbooks/recovery_ha_failover.yml
    class: SANDBOX
    variant: sandbox
    legacy_name: "SANDBOX: Recovery ha failover (check)"
    survey_vars:
      - { name: target, title: target, type: enum, default_value: sandbox, values: [{ name: sandbox, value: sandbox }] }

  - playbook: playbooks/recovery_service_restart.yml
    class: SANDBOX
    variant: sandbox
    legacy_name: "SANDBOX: Recovery service restart"
    survey_vars:
      - { name: target, title: target, type: enum, default_value: sandbox, values: [{ name: sandbox, value: sandbox }] }

  - playbook: playbooks/deployment_drift_check.yml
    class: SAFE
    legacy_name: "SAFE: Deployment drift check"

  # --- setup系: 既にtemplateがある3本(R7の対象外、既存の転記) ---------------
  # このエントリだけ、転記ではなく **意図的に既存値を捨てている**
  # (Coordinator判断、2026-08-04)。観測時点の実物は arguments: ["-l quory"]
  # だったが、
  #   1. `-l quory` は無効果である。playbookのplayが `hosts: quory` 単独であり、
  #      `--list-hosts` で付けても付けなくても hosts(1): quory になることを実測した
  #   2. 2026-08-04にCoordinatorの誤った助言で当日設定されたものであり、
  #      積み上がった運用ではない
  #   3. 他の全テンプレートは arguments: [] で、パラメータはsurvey側に持つ。
  #      これがこの環境の既存の流儀である
  # したがって空へ揃える。転記の原則の例外はこの1件のみで、他は観測値のまま。
  - playbook: playbooks/incident_investigate_setup.yml
    class: SEMI-SAFE
    legacy_name: "SEMI-SAFE:Incident investigate setup"

  - playbook: playbooks/recovery_exec_setup.yml
    class: SEMI-SAFE
    legacy_name: "SEMI-SAFE:Recovery exec setup"

  - playbook: playbooks/dev_investigate_setup.yml
    class: SEMI-SAFE
    legacy_name: "SEMI-SAFE:Dev investigate setup"

  # --- operator_request_channel案件(2026-08-08) -------------------------------
  # quory限定のserver setup(requirement §12.4)。既存9本のR7 setup系と同じ
  # 理由でSEMI-SAFE・引数なし・survey無し(対象はplaybook自身のhosts: quory
  # に委ねる)。**このカタログへエントリを足すのはrepoの変更であり、
  # Semaphoreへの登録はSEMI-SAFE: Semaphore templates setupをYoshinobuが
  # 実行したときに起きる(このセッションでは実行しない、requirement §12.5
  # ステップ3)。** scheduleを表現するフィールドがこのカタログに無いため、
  # 「server setup templateにscheduleを登録しない」(requirement §12.4)は
  # 構造的に満たされる。
  - playbook: playbooks/operator_request_channel_server_setup.yml
    class: SEMI-SAFE

  # --- setup系: R7で新たにボタンを与える9本 ----------------------------------
  # 引数は空、対象は各playbookの hosts: に委ねる(R7。2026-08-04に -l を巡る
  # 混乱があったため)。classは既存3本のsetup系templateに倣いSEMI-SAFEで揃える
  # (tester-gateは全9本ともcheck-mode-native — configure/deployするが破壊的
  # ではない、という既存3本と同じ性質のため。R8のとおりclass≠tester-gateの
  # 一致検査はしないが、選定の理由としてここに書く)。
  - playbook: playbooks/alloy_setup.yml
    class: SEMI-SAFE
  - playbook: playbooks/incident_capture_setup.yml
    class: SEMI-SAFE
  - playbook: playbooks/incident_inspect_setup.yml
