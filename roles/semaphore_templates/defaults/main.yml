# --- API接続設定 -------------------------------------------------------------
# 2026-08-04追補: ansy の Semaphore(project id=2)で実測できたことにより、
# OQ1は「テンプレート定義のAPI操作」に関する範囲では解消した(§8を参照)。
# ただしこれは quory 向けの値そのものを確定させたわけではない —
# ansyとquoryは別インスタンスであり、この既定値は**quory(本番)向けの
# 未確認の仮定のまま**である。実測できたのはURLのスキーム要件
# (HTTPSでないと400。ansyで実測)と、エンドポイント・認証ヘッダ・
# ボディ形状(下記各taskのコメント参照)。quoryが同じHTTPS要件を持つかは
# 未確認だが、姉妹インスタンスであることから合わせた(以前のhttp仮定より
# 確度は上がったが、実測ではない)。誤っていれば
# roles/semaphore_templates/tasks/read.yml の最初のGETが失敗し、推測で
# 書き込みへ進まず停止する。
#
# **接続先はホスト名で書く。IPアドレスにしない。** このリポジトリは証明書に
# IPのSANを一切入れない(`roles/homelab_cert_renew/defaults/main.yml` の
# `san_ip: []`)ため、IPで接続すると `validate_certs: true` のもとで
# ホスト名検証が必ず失敗する。使う名前は inventory がそのホストへ与えている
# 名前(`inventories/homelab/hosts.yml` の `ansible_host`)に揃える。
#
# **2026-08-09追補(semaphore_schedules_as_code案件): 実行先を1つのつまみ
# `semaphore_target`(playbooks/semaphore_templates_setup.ymlの`hosts:`が
# 直接この変数を読む。既定quory)へ一本化した。** api_base_urlの既定値は
# `semaphore_target`から導出する — quory向けの値(下記)は従来から変えて
# いない。`semaphore_target`はplaybookの`hosts:`解決時点(role defaultsが
# 読み込まれる前)にも要るため、playbook側にも同じ既定値'quory'をinlineで
# 持たせている(2箇所化はhosts:がrole defaultsを参照できないという構造上の
# 制約であり、値は常に一致させる)。
#
# **token_pathは同じ導出をしない**(下記「tokenの置き場」節、
# 2026-08-09の査読差し戻しで撤回した理由を参照)。
#
# **`-e`での個別上書きは従来どおり効く** — `semaphore_templates_api_base_url`
# を直接`-e`で渡せば、この導出式より優先される(extra-varsの優先順位は
# role defaultsより常に高い)。
#
# ansy(検証用)へ向けるときの上書き例(いずれか一方でよい):
#   -e semaphore_target=ansy
#   # または個別に:
#   -e semaphore_templates_api_base_url=https://ansy.internal:3000/api
#   -e semaphore_templates_project_name=homelab-ansible
#
# **未知の`semaphore_target`を渡すと、この導出式はJinjaの
# `UndefinedError`(dict object has no attribute ...)で停止する** —
# 辞書に無いキーで添字アクセスしているため。playbook側の`hosts:`解決も
# 別途fail-closedにしてある(playbookヘッダ参照。既定のAnsibleの挙動は
# 未知のhostパターンをexit 0で黙ってskipするため、それだけでは停止しない
# ことを実測で確認した)。
#
# **2026-08-05に検証を切る回避を撤去した。** 2026-08-04時点ではこの例が
# 通らず(ROOT CAがKeyUsage拡張を持たず、Pythonのsslが証明書検証に失敗
# した)、ループバック+`validate_certs=false` を併記していた。同日ROOT CAを
# 同じ鍵のままKeyUsage付きで再発行し配布したため、**名前で引いたまま
# `validate_certs: true`(既定)で通る**。ansy / quory の両方でPythonのssl
# による検証成功を実測済み。案件: docs/ai/reviews/root_ca_keyusage/。
semaphore_templates_api_base_url: >-
  {{ {
    'quory': 'https://quory.internal:3000/api',
    'ansy': 'https://ansy.internal:3000/api',
  }[semaphore_target | default('quory')] }}
semaphore_templates_api_validate_certs: true

# R12(2026-08-04追補): project_id / inventory_id / repository_id は固定値を
# 持たない。ansyで project_id=2, quoryで project_id=1 と実測され(旧OQ4の
# 「全て1」という前提が崩れた)、固定値では通用しないことが確定したため。
# 名前で解決する(roles/semaphore_templates/tasks/resolve.yml、
# GET /api/projects → GET /api/project/{id}/inventory → .../repositories)。
# 名前そのものはこのhomelabで安定していると仮定した既定値であり、
# ansyでの実測は project_name=homelab-ansible / inventory_name=homelab /
# repository_name=homelab-ansible。**quoryが同じ名前を使っているかは
# 未確認**(read.yml以前のresolve.ymlが失敗すれば、ここでも推測で先に
# 進まず停止する)。
semaphore_templates_project_name: homelab-ansible
semaphore_templates_inventory_name: homelab
semaphore_templates_repository_name: homelab-ansible
semaphore_templates_app: ansible

# --- tokenの置き場(R4) --------------------------------------------------------
# トークンはrepoに置かない。root専用ファイルから読む
# (roles/recovery_push の push-key と同じ /etc/homelab-recovery/ 配下の
# 慣例に倣う)。読めない・空のときは推測せず停止する(R4/AC6)。
#
# **2026-08-09、査読差し戻し(`2026-08-09_017_review_implementation.md`
# Critical #4/High #4)を受けて、per-target分岐を撤回した。** 一度は
# api_base_urlと同じ`semaphore_target`辞書分岐(ansy向けに`~/.semaphore-
# api-token-ansy`)を導入したが、(1) `~` は`become: true`下での展開先が
# 曖昧、(2) `tasks/token.yml`のroot所有0600検査をansyのホームディレクトリ
# 配下のファイルは通らない、の2点で「ansy/quory双方へ同じroleで反映する」
# というゴールを満たせなかった。**この解決はCoordinatorが環境側で行う方向
# で調整中**(ansy上にroot所有0600の実体を`/etc/homelab-recovery/`配下へ
# 置く)。コード側の所有権検査(R4)は緩めない — 環境側の配置が済むまでは
# ansyでtoken読み取りがfail-closedするが、それが正しい状態である。
#
# したがって既定値は**両ホスト共通の同一絶対パス**(従来のquory向けの値)
# に戻した。ansy検証時に別のtokenファイルを使いたい場合は、
# `-e semaphore_templates_token_path=<root所有0600の絶対path>` で個別に
# 上書きする(`~`を含む値を渡さないこと)。
semaphore_templates_token_path: /etc/homelab-recovery/semaphore-templates-api-token

# R11(2026-08-04追補): 同定情報の永続はSemaphoreオブジェクト自身の
# `description`列に持たせる(playbook_state.json等の側ファイルは廃止)。
# 側ファイルが失われても、Semaphoreへ問い合わせれば同定情報自体が返ってくる
# ため、Critical #1(state file喪失時の重複作成)の構造そのものが無くなる。
# ここに置く変数は無い(state fileが要らなくなったため)。

# レポート保存先(deployment_drift_checkと同じ reports_base_dir 配下 — quory向け)。
#
# **2026-08-09、4回目の査読差し戻し(Tester実機`2026-08-09_022_test_
# result.md` §1)への対応。** `reports_base_dir`の既定値
# (`/home/yoshi/homelab-ansible/reports`)は`yoshi:yoshi`所有・mode 0775
# であり、ansyへSSH接続する`ansible_user`(`ann`、
# inventories/homelab/group_vars/semaphore_servers.yml)からは書けない
# (Coordinator実測: `test -w`がrc 1)。この既定値のままでは
# `-e semaphore_target=ansy`だけではreport保存の手前で全実行が停止し、
# 「つまみを1つにする」設計が成立しない。
#
# **quory側の既定値(`reports_base_dir`基準)は変えていない。**
# ansy向けだけ、`ann`が実際に作成・書き込みできることを確認済みの
# 別pathへ切り替える(`semaphore_target`辞書分岐、api_base_urlと同じ
# パターン)。
#
# **確認手段(実ホストへansibleを実行していない)**: このセッションは
# ansy自身(`hostname`=ansy)の上で`yoshi`として動作しており、`ann`は
# 同じマシンのローカルUnixユーザーである。`ansible-playbook`は一切
# 使わず、`sudo -u ann mkdir -p /home/ann/homelab-reports-probe/... `
# → `sudo -u ann test -w ...` → `sudo -u ann` でのファイル書き込み
# → `sudo -n -u ann rm -rf ...`(後始末)という素のシェル操作だけで、
# `/home/ann/`配下の新規ディレクトリを`ann`自身が作成・書き込み・削除
# できることを実測した(2026-08-09)。**ただしこれはこのマシン上の
# ローカル権限の実測であり、SSH経由の接続そのもの(鍵・sshd設定等)は
# 確認していない** — その点はTester/Coordinatorの範囲。
semaphore_templates_report_dir: >-
  {{ {
    'quory': reports_base_dir ~ '/semaphore-templates',
    'ansy': '/home/ann/homelab-reports/semaphore-templates',
  }[semaphore_target | default('quory')] }}

# =============================================================================
# semaphore_schedules_as_code案件: scheduleのカタログとreconcile設定
#
# 正本: docs/ai/reviews/semaphore_schedules_as_code/2026-08-09_001_requirement.md
# (以下R番号・AC番号はすべてこの文書を指す)。ロジック本体は
# roles/semaphore_templates/filter_plugins/semaphore_schedules.py。
# =============================================================================

# --- R1/R2: scheduleカタログ --------------------------------------------------
# **主目的はドリフトを起こさないこと**(Yoshinobu、2026-08-10)。UIで一時的に
# 変えることはあってよく、それを禁じる仕組みではない — **一時的な変更が恒久化
# しない**ことを保証する。次の適用でカタログの値へ戻る。「開発側からいつ何が
# 実行されるか読める」のは副次的な効果である。
#
# **新しいplaybookを足すときは、templateとscheduleをここで同時に決める**
# (Yoshinobu、2026-08-10)。定期実行させるなら、上のtemplateカタログへ足す差分と
# 同じ変更でこちらへもエントリを足し、**既存の実行時刻と競合しないcronを選ぶ**。
# 19件の実行時刻がこのファイルで一望できることが、その判断を可能にしている。
# **schedule を先に作ってはならない** — R10により、schedule が指すtemplateは
# 適用時点でSemaphoreに実在していなければならず、同一変更で両方を足す場合は
# template側を先に適用する2段階になる。
#
# 1エントリが持つのは name(scheduleの同定キー、R2) / template(対象template名。
# roles/semaphore_templatesのrender_nameが生成する現在名 "{class}: {title}"
# 形式と一致していること) / cron / active / task_params の5項目。
#
# **同定はschedule自身のnameで行う。templateの同定方式(descriptionへ埋め込む
# マーカー)とは別物。** scheduleオブジェクトはdescriptionを持たない(6.5節、
# 実測)。
#
# **段階適用(§11)の第1バッチ: SAFE分類の3件だけ。** quoryは19件全てが
# active=trueで稼働中だが、削除を行わない設計(R5)のため、カタログに載って
# いる分だけが管理対象になる。残り16件は移行が進むにつれ後続バッチで追加する
# (SEMI-SAFE→UN-SAFEの順、requirement §11)。
#
# 転記元: 2026-08-09、ansy(quoryのRestore複製)のSemaphore APIから実測。
# **name欄の空白の有無は実物どおり** — 3件のうち2件は "SAFE:" の直後に
# 空白が無い。対象templateの実際の名前("SAFE: X"、空白あり)とズレている
# 実例であり、「同定はnameで行う」ことの根拠そのものである(手で命名された
# scheduleの名前と、role側が機械生成するtemplate名は独立している)。
#
# **activeは3件ともquoryの実状(19件全てtrue)に合わせてtrue。**
# (2026-08-24追補、semaphore_activation_gate_removal案件 R1: かつては
# 移行期間中は管理外scheduleが常に存在するため、false→trueの発行が有効化
# ゲートにより見送られる旨をここに書いていたが、そのゲート自体を撤去した。
# いまはこのカタログのactiveが、既存・新規を問わずそのまま単一のapplyで
# 反映される。)
#
# **task_params.environmentはJSON文字列("{}")であり、dictではない**
# (6.5節の実測どおり)。YAML側でも文字列のまま(クォート必須)で持つ —
# dictに変えるとAPIの実データ形状と一致しなくなる。
#
# --- cronを決める・変えるときの義務(2026-08-25、docs/ai/context/system/semaphore.md
# から移設) -------------------------------------------------------------------
# **`cron`を決めるとき、このカタログだけで衝突を判定しない。** 定期実行の窓は
# Semaphoreの外にも広がっている — UniFi(Console / Device / Protectの自動update)、
# Proxmox(ローカル/NASバックアップ、ZFS TRIM・scrub)、systemd timer、Ubuntuの
# unattended-upgradesとfstrim。横断して見えるのはYoshinobuが維持する「バッチ処理
# 工程管理表」だけである(このリポジトリの外にあり、所在はCoordinatorが持つ。
# 公開リポジトリのためここへは書かない)。**時刻を提案・変更するときは、その表に
# 照らしてもらうこと。** 照らさずに「カタログ上は空いている」を根拠にしない —
# 2026-08-18、02時台をUniFiのAP・スイッチ自動update(ネットワークが揺れうる)と
# 重ねかけた。
#
# **scheduleを追加・変更したら、同じ表へも反映する。** カタログだけを更新すると、
# **次に窓を選ぶ者がその枠を空いていると読む。** この反映はリポジトリの外で行われる
# ため、gitの履歴からは追えない。**2026-08-24、Yoshinobuの決定でCoordinatorが都度
# 確認なく反映する。**
semaphore_schedules_catalog:
  - name: "SAFE: Time sync check"
    template: "SAFE: Time sync check"
    cron: "50 5 * * *"
    active: true
    task_params:
      environment: "{}"

  - name: "SAFE:Recovery monitoring check"
    template: "SAFE: Recovery monitoring check"
    cron: "30 6 * * *"
    active: true
    task_params:
      environment: "{}"

  - name: "SAFE:Deployment drift check"
    template: "SAFE: Deployment drift check"
    cron: "40 0 * * *"
    active: true
    task_params:
      environment: "{}"

  # --- 第2バッチ(2026-08-10追加): 実行パラメータを持つ3件 ---------------------
  #
  # **ここから先の`task_params`は、押したときに何が起きるかを変える値を持つ。**
  # requirementが「査読が止めた本番事故」の筆頭に挙げたのがこの3件で、6項目だけの
  # PUTは`task_params`を消す — `dry_run`が失われれば本番のfull upgradeが定期実行
  # される(requirement 6.5 / R8)。転記を1文字も間違えないこと。
  #
  # **`environment`と`params`は層が違う。** `environment`はplaybookへ`-e`で渡る
  # Ansible変数(値は文字列)。`params`はSemaphore自身の起動オプションで、
  # `dry_run`は`--check`、`debug_level`は冗長度を指す(値はnative型)。
  # `SAFE:Prometheus update check`は両方を持ち、**同じ`dry_run`という名前が別の
  # 意味で2つある**。片方だけ写すと意味が変わる。
  #
  # 値の出所: ansy(quoryのSemaphoreをRestoreした複製)のAPIから2026-08-10に取得。
  # quory自身のscheduleを読む手段は現在無い(dispatchのカタログにschedule照会が
  # 無いため)。**転記が違っていればquoryの`--check`が差分として見せる**ので、
  # 適用前に必ず差分を読むこと。第1バッチの3件はこの方法で一致を確認済み。
  - name: "SEMI-SAFE:Cert_renew (only on Quory)"
    template: "SEMI-SAFE: Cert renew"
    cron: "0 6 * * 0"
    active: true
    task_params:
      environment: '{"force_renew":"false"}'

  - name: "SEMI-SAFE:Ubuntu vm full upgrade(dry_run=true)"
    template: "SEMI-SAFE: Ubuntu vm full upgrade (dry-run)"
    cron: "15 18 2 * *"
    active: true
    task_params:
      environment: '{"dry_run":"true"}'

  - name: "SAFE:Prometheus update check"
    template: "SAFE: Prometheus update check (check)"
    cron: "5 17 * * 5"
    active: true
    task_params:
      environment: '{"dry_run":"true"}'
      params:
        debug_level: 4
        dry_run: false

  # --- 第3バッチ(2026-08-10追加): 残るSAFE / SEMI-SAFE の12件 ----------------
  #
  # いずれも`task_params`は空の`environment`のみで、実行パラメータを持たない。
  # 値の出所と検証の手順は第2バッチと同じ(ansyから取得し、quoryの`--check`で
  # 差分が出ないことを確認してから適用する)。
  #
  # **`SEMI-SAFE: Proxmox patch dry-run weekly`が指すtemplateは`SAFE: Proxmox
  # patch dryrun`である。** schedule名の接頭辞とtemplateの分類が食い違って
  # 見えるが、誤りではない — template側の分類を2026-08-04にSEMI-SAFEからSAFEへ
  # 是正したとき、schedule名は当時のまま残った。**renameは全フェーズで非対応
  # (R2/R20)なので、ここは実物どおりに転記する。**
  #
  # これで残るはUN-SAFEの`Proxmox Weekly Full Patch`1件だけになる。19件目を
  # 足す差分が、そのまま「本番の週次フルパッチをカタログ管理下に入れる」という
  # 提案になるよう、意図的に最後の単独バッチへ回している。
  - name: "SAFE: Authy healthcheck daily"
    template: "SAFE: Authy healthcheck"
    cron: "30 5 * * *"
    active: true
    task_params:
      environment: "{}"

  - name: "SAFE: Monitoring healthcheck daily"
    template: "SAFE: Monitoring healthcheck"
    cron: "35 5 * * *"
    active: true
    task_params:
      environment: "{}"

  - name: "SAFE: Proxmox hardware check daily"
    template: "SAFE: Proxmox hw check"
    cron: "45 5 * * *"
    active: true
    task_params:
      environment: "{}"

  - name: "SAFE: Proxmox healthcheck daily"
    template: "SAFE: Proxmox healthcheck"
    cron: "40 5 * * *"
    active: true
    task_params:
      environment: "{}"

  - name: "SEMI-SAFE: Ubuntu nightly reboot if required daily"
    template: "SEMI-SAFE: Ubuntu nightly"
    cron: "30 3 * * *"
    active: true
    task_params:
      environment: "{}"

  - name: "SEMI-SAFE: Proxmox patch dry-run weekly"
    template: "SAFE: Proxmox patch dryrun"
    cron: "30 17 * * 5"
    active: true
    task_params:
      environment: "{}"

  - name: "SEMI-SAFE:Sophos trim"
    template: "SEMI-SAFE: Sophos trim"
    cron: "15 18 * * 5"
    active: true
    task_params:
      environment: "{}"

  - name: "SEMI-SAFE:Cloudkey_cert_deploy"
    template: "SEMI-SAFE: Cloudkey cert deploy"
    cron: "10 0 1 * *"
    active: true
    task_params:
      environment: "{}"

  - name: "SAFE:Proxmox backup restore verify"
    template: "SAFE: Proxmox backup restore verify"
    cron: "30 18 28 * *"
    active: true
    task_params:
      environment: "{}"

  - name: "SEMI-SAFE:Unifi backup fetch"
    template: "SEMI-SAFE: Unifi backup fetch"
    cron: "30 18 * * 5"
    active: true
    task_params:
      environment: "{}"

  - name: "SAFE:Proxmox snapshot check"
    template: "SAFE: Proxmox snapshot check"
    cron: "0 18 * * 4"
    active: true
    task_params:
      environment: "{}"

  - name: "SEMI-SAFE:Codex update check(Only on Quory)"
    template: "SEMI-SAFE: Codex update check"
    cron: "0 17 * * 5"
    active: true
    task_params:
      environment: "{}"

  # --- 第4バッチ(2026-08-10追加): 最後の1件。これで管理外が0件になる ---------
  #
  # **本番のProxmox週次フルパッチ。** pve1 / pve2 にパッチを当て、再起動を伴う、
  # この環境でいちばん重い定期実行である。形は他の18件と同じで実行パラメータも
  # 持たないが、**「毎週土曜6時に走る」という事実がGitに載ることがこのバッチの
  # 意味**であり、そのため単独のバッチにしてある。
  #
  # 載ることで、cron・対象template・task_params・activeの4つはUIで変えても
  # 次の適用でカタログの値へ戻る(2026-08-24追補、semaphore_activation_
  # gate_removal案件 R1: 有効化<false→true>だけを別扱いにするゲートは
  # 撤去済み)。
  - name: "UN-SAFE:Proxmox Weekly Full Patch"
    template: "UN-SAFE: Proxmox patch weekly full"
    cron: "00 06 * * 6"
    active: true
    task_params:
      environment: "{}"

  # --- semaphore_db_backup案件(2026-08-17追加): 第4バッチ後、初のclosed-world
  # 下での新規追加 ---------------------------------------------------------------
  #
  # quoryのSemaphore自身を退避する新規template(上のsemaphore_templates_catalog
  # 参照)のschedule。template・scheduleの両方を同じ変更で登録する
  # (R10「新しいplaybookを足すときはtemplateとscheduleをここで同時に決める」)。
  # 日次 "0 12 * * *"。**02時台は選ばない**(2026-08-18 Yoshinobu指摘で変更) —
  # そこはUniFiのAP・スイッチ自動Updateの窓であり、この playbook は quory →
  # 選定pveノード → NFS と3ホストをまたいで通信するため、スイッチの更新中に
  # 重ねない。加えて01時台(UniFi Console更新・Proxmoxローカルバックアップ)、
  # 03時台(UniFi Protect更新・quoryの条件付き自動reboot)、05-06時台
  # (healthcheck群)、金17-19時台(週次群)も埋まっている。
  # 選定時点で06:30〜17:00が空だったため、その中央の12:00を取った。
  # **この窓はもう空ではない** — 埋めたのは下の本バッチ自身(12:00)であり、
  # 境界の06:30には "SAFE:Recovery monitoring check" が既にいる。次にここから
  # 選ぶときは、この2本がいる前提で見ること。
  # 窓の一覧はSemaphoreの外(UniFi・Proxmox・systemd timer)にも広がっており、
  # このカタログだけでは衝突を判定できない。**Yoshinobuが別途管理している
  # バッチ処理工程管理表が全体の正本である。**
  - name: "SEMI-SAFE: Semaphore db backup daily"
    template: "SEMI-SAFE: Semaphore db backup"
    cron: "0 12 * * *"
    active: true
    task_params:
      environment: "{}"

  # --- semaphore_update_check案件(2026-08-24追加) ----------------------------
  #
  # 正本: docs/ai/reviews/semaphore_update_check/2026-08-24_001_requirement.md
  # §7「月次を採る」(UV-085: バージョンを跨ぐ変化はアップグレード側=月次)。
  # template・scheduleを同じ変更で登録する(R10、上のsemaphore_templates_
  # catalog参照)。task_paramsを持たない — 実行パラメータそのものが無い
  # (roles/semaphore_update_check/defaults/main.ymlのヘッダ参照)。
  #
  # **選定: 毎月10日 20:00 JST。この行自身が毎月10日20:00の枠を使う。**
  # カタログ内では、この時刻は(本エントリを除いて)載る20件のいずれの実行
  # 時刻とも重ならない(00:10=1日Cloudkey、00:40=毎日drift check、
  # 03:30=毎日nightly、05:30-05:50=毎日healthcheck群、06:00=土曜Weekly Full
  # Patch/日曜Cert renew、06:30=毎日recovery monitoring check、12:00=毎日db
  # backup、17:00-18:30=金曜週次群、18:00=木曜Proxmox snapshot check、
  # 18:15=2日Ubuntu vm full upgrade dry-run、18:30=28日Proxmox backup restore
  # verify。木曜18:00のProxmox snapshot checkは当初この列挙から抜けており、
  # レビュー2026-08-24_003指摘で補った。比較対象は本エントリ追加前の20件)。
  #
  # **ただしカタログだけでは全体の衝突を判定できない。** 横断する窓の一覧は
  # Semaphoreの外(UniFi・Proxmox・systemd timer・unattended-upgrades等)にも
  # 広がっており、横断して持つ正本はYoshinobuが別途管理するNotionの
  # 「バッチ処理工程管理表」(このリポジトリの外)だけである
  # (本ファイル冒頭の「cronを決める・変えるときの義務」ヘッダコメント参照)。
  #
  # **2026-08-24、Yoshinobuがこの表を実際に確認し、20時台にこの表側の予定が
  # 無いことを確かめた上でこの時刻を選んだ。** これは選定時点で確認した事実
  # であり、「20時台は空いている」という恒久の性質として書いているのではない
  # — **この行自身が毎月10日20:00の枠を占有する**ため、次に別の用途で
  # この枠(またはその前後)を検討する者は、この行がいる前提で、改めて同じ
  # 表を確認すること。カタログのコメントを更新した変更自身が、その回のコメント
  # が指す枠を埋めていないかを毎回確かめる(2026-08-23、commit `7676c78`で
  # 直した「コメントを書いた変更自身がその枠を埋めていた」誤りを再現しない)。
  - name: "SAFE: Semaphore update check monthly"
    template: "SAFE: Semaphore update check"
    cron: "0 20 10 * *"
    active: true
    task_params:
      environment: "{}"

# --- R17: closed-worldフェーズへの移行フラグ ----------------------------------
# 単調で明示的なフラグ。**人がコミットで立て、実装はいかなる条件でも降ろさない。**
# エントリ数などから推測して自動判定しない(将来正規に20件目を追加した時点で
# 検査が解除されてしまうため、R17本文)。既定false(移行期間)。
semaphore_schedules_closed_world: true

# --- R2: allowlist型のcanonical本番URL(2026-08-24、独立レビュー Finding 1
# を受けてrequirement改訂・復元) -----------------------------------------------
# **2026-08-24、有効化ゲート撤去の一次実装でこの変数ごと撤去したが、独立
# レビューが差し戻した。** 実装者は「唯一の消費箇所がゲートだった」ことを
# 根拠に「目的も消えた」としたが、それは誤り ―― 消費箇所の有無と、守って
# いる境界の有無は別の話である。旧R15の目的は「API base URLを`-e`で
# 切り替えられる設計の下で、Restore複製のansyのようなcanonicalでない接続先
# へ`active: true`を書かないこと」であり、**ゲート(実行ごとの明示的な許可)
# を撤去してカタログのactiveを直接反映するようになった分、誤ったインスタンス
# へ書き込む危険はむしろ増えている。**
#
# **したがって、この変数と、それを使う接続先検査は残す。** ただし旧設計の
# 「実行ごとの明示的な許可・closed-world・管理外0件・schedule集合の非変化」
# という他の4条件とは束ねない ―― それらはR1で撤去されたままである
# (Yoshinobu承認済み、2026-08-24)。ここで検査するのは接続先の一致だけ
# (`semaphore_schedules_url_matches_canonical`、filter_plugins/
# semaphore_schedules.py)。
#
# **判定は各schedule書き込みの直前に取得したfresh値で行う。**
# `schedules_canonical_check.yml`はこの変数と接続先URLの一致(静的な文字
# 列比較)だけを一度計算し、実際に「このwriteは有効化か」の判定は
# `semaphore_schedules_would_newly_activate` を使って
# `schedules_apply_item.yml` / `schedules_apply_new_item.yml` が個別に
# 行う(2026-08-24再追補、独立レビュー`2026-08-24_004_review.md` High 1
# — diff時点のスナップショットで判定すると、diffと実際の書き込みの間に
# UIでactiveが変えられた場合に見逃す競合が実測された)。
#
# **他の変数(semaphore_target等)からは導出しない** ―― 導出すると
# 「ansyでなければ許可」という否定判定(denylist型)に近づき、別名・
# 別表記のDNS名で同じサーバへ到達したときfail-openする(旧R15本文、
# 独立レビューが今回も支持した判断)。値はquoryの現在のcanonical URLへの
# リテラル。
semaphore_schedules_canonical_api_base_url: "https://quory.internal:3000/api"

# --- R11: cronを解釈するtimezoneの前提値 --------------------------------------
# GET /api/info の schedule_timezone。**ansy(2026-08-09)とquory(2026-08-10、
# task 659の--check)の双方で実測し、一致を確認済み。** 不一致ならAC10のとおり
# 停止するのが設計どおりの挙動であり、この値を「正しいはず」と決め打ちしない。
semaphore_schedules_expected_timezone: "Asia/Tokyo"

# --- R19: レポート保存先 -------------------------------------------------------
# semaphore_templates_report_dir(上記)とは別の置き場にする
# (「既存のlatest.jsonを上書きしない」)。ansy向けの分岐・確認手段は
# semaphore_templates_report_dir(上記コメント)と同じ。
semaphore_schedules_report_dir: >-
  {{ {
    'quory': reports_base_dir ~ '/semaphore-schedules',
    'ansy': '/home/ann/homelab-reports/semaphore-schedules',
  }[semaphore_target | default('quory')] }}
