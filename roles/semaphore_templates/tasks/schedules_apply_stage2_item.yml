---
# Included with `loop: semaphore_schedules_diff_result.pending_activation`
# from schedules_apply_stage2.yml. `item` is {name, id}. Only reached when
# schedules_apply_stage2.yml's own activation_gate evaluation was `allowed`
# (R12/R15/R16 all satisfied globally) -- this file still performs the
# *per-schedule* R8-3 stage-2 precheck, which is a separate, narrower check
# (do this one schedule's stage-1 fields still match what stage 1 already
# verified, right now).
#
# R8-3: a stage-2 precheck mismatch (including the schedule having
# disappeared, HTTP 404) always aborts *all* remaining activation PUTs and
# ends non-zero -- unlike stage 1, there is no migration-vs-closed-world
# branch here, because stage 2 only ever runs in closed-world (gated by
# schedules_apply_stage2.yml's activation_gate check, R12 condition ①).
#
# Task names below are deliberately static (ansible-lint name[template]:
# Jinja belongs only at the very end of a name) -- the calling loop's
# `loop_control: label: "{{ item.name }}"` (schedules_apply_stage2.yml)
# already shows which schedule each console line belongs to; `item.name`
# still appears in fail messages where it matters for diagnosis.

- name: Fetch fresh detail immediately before the stage-2 (activation) PUT
  ansible.builtin.uri:
    url: "{{ semaphore_templates_api_base_url }}/project/{{ semaphore_templates_project_id }}/schedules/{{ item.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ semaphore_templates_token }}"
    status_code: [200, 404]
    validate_certs: "{{ semaphore_templates_api_validate_certs }}"
  register: _semaphore_schedules_stage2_fresh
  no_log: true

- name: Stage-2 precheck (R8-3 — management 4 fields + active must still be False)
  ansible.builtin.set_fact:
    _semaphore_schedules_stage2_mismatched: >-
      {{ [] if _semaphore_schedules_stage2_fresh.status != 200 else
         (_semaphore_schedules_stage2_fresh.json
          | semaphore_schedules_stage2_precheck(semaphore_schedules_stage1_desired_by_id[item.id])) }}

- name: Abort all remaining activation PUTs if the stage-2 precheck failed (R8-3/AC23)
  ansible.builtin.fail:
    msg: >-
      schedule {{ item.name }}(id={{ item.id }})の第2段階直前チェックが
      不一致です:
      {{ _semaphore_schedules_stage2_mismatched
         | default(['HTTP ' ~ (_semaphore_schedules_stage2_fresh.status | string) ~ ' (取得不可)'], true)
         | join(', ') }}。
      有効化せず、残りの有効化PUTもすべて中止します(R8-3)。
  when: (_semaphore_schedules_stage2_fresh.status != 200) or ((_semaphore_schedules_stage2_mismatched | length) > 0)

- name: Build the stage-2 (activation-only) desired state (R8-2 — always active:true)
  ansible.builtin.set_fact:
    _semaphore_schedules_stage2_desired: >-
      {{ (semaphore_schedules_catalog | selectattr('name', 'equalto', item.name) | first)
         | semaphore_schedules_desired(None, semaphore_schedules_preflight_result.template_ids[item.name], 2) }}

- name: PUT the stage-2 activation (R8 get-then-merge-then-send)
  ansible.builtin.uri:
    url: "{{ semaphore_templates_api_base_url }}/project/{{ semaphore_templates_project_id }}/schedules/{{ item.id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ semaphore_templates_token }}"
    body_format: json
    body: "{{ _semaphore_schedules_stage2_fresh.json | semaphore_schedules_payload(_semaphore_schedules_stage2_desired) }}"
    status_code: [200, 201, 204]
    validate_certs: "{{ semaphore_templates_api_validate_certs }}"
  register: _semaphore_schedules_stage2_put
  no_log: true

- name: Verify the stage-2 activation (R16-2)
  ansible.builtin.uri:
    url: "{{ semaphore_templates_api_base_url }}/project/{{ semaphore_templates_project_id }}/schedules/{{ item.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ semaphore_templates_token }}"
    status_code: [200]
    validate_certs: "{{ semaphore_templates_api_validate_certs }}"
  register: _semaphore_schedules_stage2_verify
  no_log: true

- name: Fail closed if the stage-2 activation did not verify (R16-2)
  ansible.builtin.fail:
    msg: >-
      schedule {{ item.name }}(id={{ item.id }})の有効化PUT直後GETが
      期待値と一致しません: {{ (_semaphore_schedules_stage2_verify.json
      | semaphore_schedules_verify(_semaphore_schedules_stage2_desired)) | join(', ') }}。
      ここで停止します(R16-2)。
  when: >-
    ((_semaphore_schedules_stage2_verify.json | semaphore_schedules_verify(_semaphore_schedules_stage2_desired)) | length) > 0

# 2026-08-09、査読差し戻し(High #4)への対応。schedules_apply_stage1_item.
# ymlと同じ理由・同じ契約(semaphore_schedules_nonmanaged_diff)を、有効化
# PUTの直前/直後rawにも適用する(AC17)。
- name: Fail closed if non-managed fields changed during the stage-2 activation PUT (AC17)
  ansible.builtin.fail:
    msg: >-
      schedule {{ item.name }}(id={{ item.id }})の有効化PUTで、管理5項目
      以外のフィールドが変化しました: {{ (_semaphore_schedules_stage2_fresh.json
      | semaphore_schedules_nonmanaged_diff(_semaphore_schedules_stage2_verify.json)) | join(', ') }}。
      非管理フィールドの保持が確認できません。ここで停止します(AC17)。
  when: >-
    ((_semaphore_schedules_stage2_fresh.json
      | semaphore_schedules_nonmanaged_diff(_semaphore_schedules_stage2_verify.json)) | length) > 0

- name: Record the successful stage-2 activation
  ansible.builtin.set_fact:
    semaphore_schedules_stage2_activated: "{{ semaphore_schedules_stage2_activated + [{'name': item.name, 'id': item.id}] }}"
