---
# R8-3 stage 1: management fields (name/template_id/cron_format/task_params)
# plus the stage-1 `active` (immediate true->false only, never activates).
# Caller (tasks/main.yml) gates this whole file with `when: not
# ansible_check_mode` (R7 — writes only happen outside --check).
#
# Order: new (POST) before stage1 (PUT). R6 guarantees `new` is only ever
# non-empty in closed-world; `stage1` occurs in both phases. Each loop uses
# `include_tasks` so a per-item `ansible.builtin.fail` (closed-world
# identity-drift abort, or a verify mismatch) stops that loop and every
# subsequent task in this play -- including schedules_apply_stage2.yml,
# which is a later import in the same block (main.yml).

- name: Create schedules that do not exist yet (R13 — always active:false)
  ansible.builtin.include_tasks: schedules_apply_new_item.yml
  loop: "{{ semaphore_schedules_diff_result.new }}"
  loop_control:
    label: "{{ item.name }}"

- name: Update schedules whose stage-1 managed fields differ (R8-3 stage 1)
  ansible.builtin.include_tasks: schedules_apply_stage1_item.yml
  loop: "{{ semaphore_schedules_diff_result.stage1 }}"
  loop_control:
    label: "{{ item.name }}"
