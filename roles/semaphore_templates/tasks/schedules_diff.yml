---
# R8: get-then-merge-then-send の「取得」を、比較のためにここで一度行う。
# **これは各PUTの直前に取り直す取得(R8本文、schedules_apply_item.yml)
# とは別物** — ここでの取得は差分の計算とレポートのためのものであり、実際の
# 書き込みの直前にはさらに一度、個別に取り直す(鮮度の要求はR8/R16参照)。
#
# read-only: --checkの有無にかかわらず常に実行する(R7)。
#
# 2026-08-24(semaphore_activation_gate_removal案件 R1): 有効化ゲート撤去に
# 伴い、このfileが持っていた「stage-2 precheckが参照するstage-1desired」
# と「activation-eligibilityのpreview」の2つの計算を削除した。撤去後は
# `semaphore_schedules_diff`が返す`changed`の`after`がそのまま最終的な
# 書き込み対象であり、別段階のためにここで先取りして保持しておく値は無い。

- name: Build the list of existing schedules matched to the catalog (for per-schedule detail fetch, R8)
  ansible.builtin.set_fact:
    semaphore_schedules_matched_existing: >-
      {%- set out = [] -%}
      {%- for entry in semaphore_schedules_catalog -%}
        {%- if entry.name in semaphore_schedules_preflight_result.observed_by_name -%}
          {%- set _ = out.append({'name': entry.name,
                                   'id': semaphore_schedules_preflight_result.observed_by_name[entry.name].id}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: "GET single-object detail for each existing matched schedule (R8 — task_params only appears on this endpoint)"
  ansible.builtin.uri:
    url: "{{ semaphore_templates_api_base_url }}/project/{{ semaphore_templates_project_id }}/schedules/{{ item.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ semaphore_templates_token }}"
    status_code: [200]
    validate_certs: "{{ semaphore_templates_api_validate_certs }}"
  register: _semaphore_schedules_detail_raw
  loop: "{{ semaphore_schedules_matched_existing }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  check_mode: false

- name: Build the detail-by-id map (R8 merge source, keyed by schedule id)
  ansible.builtin.set_fact:
    semaphore_schedules_detail_by_id: >-
      {%- set m = {} -%}
      {%- for r in (_semaphore_schedules_detail_raw.results | default([])) -%}
        {%- set _ = m.update({r.item.id: r.json}) -%}
      {%- endfor -%}
      {{ m }}

- name: Compute the schedules diff (R8-2 — new / changed / unchanged)
  ansible.builtin.set_fact:
    semaphore_schedules_diff_result: >-
      {{ semaphore_schedules_catalog | semaphore_schedules_diff(
           semaphore_schedules_preflight_result.observed_by_name,
           semaphore_schedules_detail_by_id,
           semaphore_schedules_preflight_result.template_ids) }}

# Apply-outcome accumulators: stay empty under --check (schedules_apply.yml
# is `when: not ansible_check_mode` and never runs), populated under a
# real apply. Set here (unconditionally) so schedules_report.yml can
# always reference them without an "undefined variable" error regardless
# of check mode.
- name: Initialize apply-outcome accumulators
  ansible.builtin.set_fact:
    semaphore_schedules_created: []
    semaphore_schedules_updated: []
    semaphore_schedules_update_skipped: []
