---
# R3: reconcile role。実行順序が安全境界そのもの — 書き込み(apply.yml)は
# 読み取り(token/resolve/read/reconcile)がすべて終わり、diffが報告された後
# にしか走らない。OQ1の指示(まず読み取り系だけで到達性と応答形式を確かめて
# から書き込みへ進む)をtaskの並び自体で強制する。
#
# 2026-08-04追補: state.ymlは廃止した(R11 — 側ファイルによる同定を、
# Semaphoreオブジェクト自身の`description`に置き換えたため、読み込む
# ローカル状態が無くなった)。resolve.ymlを新設した(R12 — project_id等の
# 名前解決)。
#
# 2026-08-04追補2(Tester `2026-08-04_005_test_result.md` §4): このrole最初の
# API呼び出し(resolve.yml)からapply.ymlまでをblock/rescueで包んでいる。
# 目的はTLS証明書検証エラーを分かりやすくすること**だけ**であり、
# `semaphore_templates_api_validate_certs`の既定値(true)を弱める意図は
# 無い。
#
# **rescueの文面で原因を断定しない。** 証明書検証の失敗はホスト名/SAN不一致・
# KeyUsage拡張の欠如・期限切れ・信頼チェーンの欠落のいずれでも起こり、Pythonの
# sslモジュールはすべてを同じ`certificate verify failed`の接頭辞で報告する。
# 読み手を、Pythonが返す具体的な理由文言(`_semaphore_templates_scrubbed_failure`
# に含まれる)へ誘導する。
#
# **rescue内のtoken漏えいに注意して書いてある**: `no_log: true`が付いた
# taskが失敗しても、コンソール出力は隠されるが`ansible_failed_result.msg`
# 自体はrescueブロック内から読める(実測確認済み — no_logはコンソール表示
# を隠すだけで、rescue変数までは隠さない)。このrole内のuri taskの失敗
# メッセージにAuthorizationヘッダの値が含まれることは通常想定しにくい
# (TLSハンドシェイク失敗はHTTPリクエスト送信より前に起きる)が、
# 2026-08-04にTesterが`curl -v`でtokenを対話ログへ露出させた実インシデント
# (docs/ai/memory/incidents/2026-08-04_ansy-semaphore-api-token-exposed-in-transcript.md)
# を踏まえ、**万一含まれていても表示前に確実に取り除く**ため、rescue内で
# 表示するメッセージは必ずtoken文字列を`regex_replace`で置換してから出す。

- name: Load the Semaphore API token (fails closed if missing/unreadable — R4/AC6)
  ansible.builtin.import_tasks: token.yml

- name: Resolve, read, reconcile, report, and (optionally) apply
  block:
    - name: Resolve project_id / inventory_id / repository_id by name (R12)
      ansible.builtin.import_tasks: resolve.yml

    - name: Read the current templates from the Semaphore API (read-only — OQ1)
      ansible.builtin.import_tasks: read.yml

    - name: Compute the diff between the catalog and the observed state (R3/R11)
      ansible.builtin.import_tasks: reconcile.yml

    - name: Report the diff (always runs, even under --check — R6/AC2)
      ansible.builtin.import_tasks: report.yml

    - name: Apply create/update requests (skipped under --check — AC1/AC2)
      ansible.builtin.import_tasks: apply.yml
      when: not ansible_check_mode

    # --- semaphore_schedules_as_code案件: schedule系(R10 — templateの
    # apply/--checkが確定した後に走らせる。requirement
    # docs/ai/reviews/semaphore_schedules_as_code/2026-08-09_001_requirement.md) --
    #
    # **2026-08-09、査読差し戻し(`2026-08-09_017_review_implementation.md`
    # High #3)を受けてnested block/rescue/alwaysへ変更した。** 以前は
    # schedules_report.ymlをこのtaskリストの末尾に置いていたため、
    # preflight/stage1/stage2のいずれかがfailすると、周囲のblockの残りが
    # skipされ外側のrescueへ移り、レポートが一切保存されなかった
    # (R8の「既に発行済みの書き込みをレポートへ明記する」、R18の管理外
    # レポート、AC22の「適用済みの1件目が具体的に記録される」を満たせない)。
    #
    # **2026-08-09、再査読差し戻し(`2026-08-09_019_review_implementation_
    # r2.md`)で、このalways化自体が新しい欠陥を2件生んでいたことが判明し、
    # 以下のとおり修正した。**
    #
    # (1) High: inner rescueの`fail`が`ansible_failed_result.msg`を
    # そのまま表示していたため、外側(このrole既存)のtoken scrubより手前で
    # 未scrub のメッセージがコンソールへ出る経路になっていた。同様に
    # `schedules_report.yml`も生のメッセージを`failed_msg`としてmode 0644の
    # JSONへ保存していた。**修正: inner rescueでは`fail`を呼ばず、まず
    # このrole既存のscrubパターン(下記outer rescueと同一の
    # `regex_replace`+`no_log: true`)でメッセージをscrubし、
    # `semaphore_schedules_run_failed*`という3つのfactへ格納するだけに
    # した。** `schedules_report.yml`はこのscrub済みfactを読むだけに変更し、
    # 自分で`ansible_failed_result`から再構築しない(そちらが元の漏えい元
    # だった)。
    #
    # (2) Medium: 元のrescueがこの場で`fail`し、その直後に`always:`の
    # レポート保存が別の理由(ディスク容量・権限等)で失敗すると、外側から
    # 見える`ansible_failed_task`/`ansible_failed_result`はレポート保存の
    # 失敗だけになり、元のschedule失敗と既適用分のoutcomeが診断から消える
    # ことをレビューがlocalhost decoyで再現した。**修正: レポート保存
    # (`schedules_report.yml`のimport)自体をnested block/rescueで包み、
    # 保存が失敗してもその場でfailさせず、scrub済みメッセージを別の
    # 独立したfact(`semaphore_schedules_report_save_failed*`)へ格納するに
    # 留める。** このnamed blockの外(このtaskリスト内、outer blockの
    # 兄弟task)に置いた最終taskが、schedule失敗・レポート保存失敗の
    # どちらか一方または両方が起きていれば、両方の内容を含めて非ゼロで
    # `fail`する — 元の失敗が後発の失敗に上書きされない。
    - name: Read, preflight, diff, and (optionally) apply schedules — capture (not swallow) any failure
      block:
        - name: Validate semaphore_schedules_closed_world / semaphore_schedules_allow_activation are unambiguous booleans (R15/R17)
          ansible.builtin.import_tasks: schedules_validate_config.yml

        - name: Read the current Semaphore schedules and a fresh template list (R10, read-only)
          ansible.builtin.import_tasks: schedules_read.yml

        - name: Check the schedule_timezone precondition against the same API used for writes (R11/AC10)
          ansible.builtin.import_tasks: schedules_timezone_check.yml

        - name: Preflight the schedules catalog; stop before any write on error (R9)
          ansible.builtin.import_tasks: schedules_preflight.yml

        - name: Compute the schedules diff (R8/R8-2/R8-3) and the activation-eligibility preview
          ansible.builtin.import_tasks: schedules_diff.yml

        - name: Apply schedule stage 1 (create/update, skipped under --check — R7)
          ansible.builtin.import_tasks: schedules_apply_stage1.yml
          when: not ansible_check_mode

        - name: Apply schedule stage 2 (activation only, skipped under --check — R7/R8-3)
          ansible.builtin.import_tasks: schedules_apply_stage2.yml
          when: not ansible_check_mode
      rescue:
        - name: "Build a token-scrubbed copy of the original schedule failure (does not re-raise here — always: must still run)"
          ansible.builtin.set_fact:
            semaphore_schedules_run_failed: true
            semaphore_schedules_run_failed_task: "{{ ansible_failed_task.name | default('不明') }}"
            semaphore_schedules_run_failed_msg: >-
              {{ (ansible_failed_result.msg | default('(取得できず)'))
                 | regex_replace((semaphore_templates_token | regex_escape), '***REDACTED-TOKEN***')
                 if (semaphore_templates_token | default('') | length) > 0
                 else (ansible_failed_result.msg | default('(取得できず)')) }}
          no_log: true
      always:
        - name: Save the schedules report; a failure here must not erase the original schedule failure above (R19)
          block:
            - name: Report the schedules diff and outcome (always runs — success, --check, or a schedule failure above)
              ansible.builtin.import_tasks: schedules_report.yml
          rescue:
            - name: Build a token-scrubbed copy of the report-save failure (kept separate from the original schedule failure)
              ansible.builtin.set_fact:
                semaphore_schedules_report_save_failed: true
                semaphore_schedules_report_save_failed_msg: >-
                  {{ (ansible_failed_result.msg | default('(取得できず)'))
                     | regex_replace((semaphore_templates_token | regex_escape), '***REDACTED-TOKEN***')
                     if (semaphore_templates_token | default('') | length) > 0
                     else (ansible_failed_result.msg | default('(取得できず)')) }}
              no_log: true

    # **2026-08-09、3回目の査読差し戻し(`2026-08-09_020_review_
    # implementation_r3.md` Critical #1)への対応。** 上記2つのフラグ
    # (`semaphore_schedules_run_failed`/`_report_save_failed`)は素朴な
    # `set_fact`であり、`-e '{"semaphore_schedules_run_failed": false}'`
    # のようなnativeなfalseをextra-varsで渡されると、Ansibleの変数優先順位
    # (extra-varsが最上位、`set_fact`より常に強い)により`set_fact`の結果を
    # 上書きしてしまう。schedule自身の`task_params`がジョブ実行時に`-e`と
    # して渡る設計(実データで`Ubuntu vm full upgrade`の`environment`が
    # `{"dry_run":"true"}`であることから、この仕組み自体は既に実在する)
    # のため、この2フラグの名前空間がscheduleの設定値と共有されているのは
    # 机上の懸念ではない。前回のフラグ修正(`_bool`正規化)と同じ欠陥
    # クラスであり、Reviewerが同型のfixtureで実際にrc 0への吸収を再現した。
    #
    # **修正: 最終的な再送出の可否(`when:`)を、外部から上書き可能な素の
    # 変数の真偽値だけでは決めない。** `ansible_failed_result`は
    # rescueが発火したときにansible-coreのengine自身が設定する特別変数で
    # あり、`-e`でその**値**を汚すことはできても(実測済み)、`is defined`
    # という**存在の有無**をfalseへ偽装することはできない(存在しない名前を
    # 「未定義にする」extra-varsは無い。ローカルdecoyで
    # `-e '{"ansible_failed_result": false}'`を渡しても`ansible_failed_
    # result is defined`はtrueのまま残ることを確認済み)。したがって
    # `when:`は「いずれかのフラグがtrue」**または**「`ansible_failed_
    # result`が定義されている(=このblock自身のrescueが実際に発火した)」
    # のORとし、フラグが外部からfalseに固定されていても、schedule block
    # 自身が本当に失敗していれば`ansible_failed_result is defined`だけで
    # 再送出が成立する。メッセージ本文がフラグ汚染により空になる場合の
    # フォールバック文言も用意した(rawな`ansible_failed_result.msg`を
    # フォールバックに使うとscrubを回避する新しい経路になるため、
    # フォールバックは固定文言のみとし生データは使わない)。
    - name: Re-raise the original schedule failure and/or the report-save failure (both scrubbed, neither absorbed into success — R8/R18/AC22)
      ansible.builtin.fail:
        msg: >-
          {{
            (
              'semaphore_schedules task失敗(task: ' ~ (semaphore_schedules_run_failed_task | default('不明')) ~ '): '
              ~ (semaphore_schedules_run_failed_msg | default('(詳細不明)'))
              ~ ' 既に発行済みの書き込みは取り消しません。'
            ) if (semaphore_schedules_run_failed | default(false)) else ''
          }}
          {{
            ('/ さらにレポート保存も失敗しました: ' ~ (semaphore_schedules_report_save_failed_msg | default('(詳細不明)')))
            if (semaphore_schedules_report_save_failed | default(false)) else
            ('/ レポートは保存できました(semaphore_schedules_report_dir/latest.json)。'
             if (semaphore_schedules_run_failed | default(false)) else '')
          }}
          {{
            (
              '/ schedule処理でエラーが検出されましたが、詳細を保持するfactが空です'
              ~ '(semaphore_schedules_run_failed等の内部変数が外部の-eで上書きされて'
              ~ 'いる可能性があります)。ansible_failed_taskとレポート'
              ~ '(semaphore_schedules_report_dir)を直接確認してください。'
            ) if (
              (not (semaphore_schedules_run_failed | default(false)))
              and (not (semaphore_schedules_report_save_failed | default(false)))
              and (ansible_failed_result is defined)
            ) else ''
          }}
      when: >-
        (semaphore_schedules_run_failed | default(false))
        or (semaphore_schedules_report_save_failed | default(false))
        or (ansible_failed_result is defined)

  rescue:
    - name: Build a token-scrubbed copy of the failure message (defense in depth)
      ansible.builtin.set_fact:
        _semaphore_templates_scrubbed_failure: >-
          {{ (ansible_failed_result.msg | default('(取得できず)'))
             | regex_replace((semaphore_templates_token | regex_escape), '***REDACTED-TOKEN***')
             if (semaphore_templates_token | default('') | length) > 0
             else (ansible_failed_result.msg | default('(取得できず)')) }}
      no_log: true

    - name: Detect a TLS certificate verification failure and explain it (does not weaken validate_certs)
      ansible.builtin.fail:
        msg: >-
          Semaphore APIへのHTTPS接続で証明書検証に失敗しました。
          「元のエラー」に含まれる具体的な理由文言(コロンの後ろ)を読んで
          原因を特定してください — 証明書検証の失敗は複数の独立した原因を
          同じ接頭辞("certificate verify failed")で報告するため、
          このメッセージだけでは原因を1つに決め付けられません。
          既知の原因の例(いずれか1つとは限らない):
          (a) 接続先のホスト名/IPが証明書のSAN(Subject Alternative Name)
          と一致しない — 例えばIPアドレスで接続すると、このrepoの証明書は
          IPのSANを持たない方針(`roles/homelab_cert_renew/defaults/main.yml`
          の全エントリが`san_ip: []`)のため必ず失敗する。
          (b) CA証明書にKeyUsage拡張が無い(2026-08-04にTesterがansyで
          実際に踏んだ原因。role実行環境のPython sslモジュールはcurlより
          厳格に検証する)。
          (c) 証明書の期限切れ、信頼チェーンの欠落など、その他の一般的な
          TLS trust issue。
          いずれもrole自体の不具合ではなくPKI証明書・接続設定側の事実であり、
          この役割はここで停止する以外の対応をしない。恒久対応は原因に応じて
          証明書側(homelab_cert_renew)または接続先設定側(defaults/main.yml
          のapi_base_url)で行う。応急には
          `-e semaphore_templates_api_validate_certs=false` で一時的に検証を
          無効化できるが、既定値(true)は変更していない — 判断根拠は
          docs/ai/reviews/semaphore_templates_as_code/2026-08-04_003_implement.md
          の追補を参照。
          元のエラー(task: {{ ansible_failed_task.name | default('不明') }}):
          {{ _semaphore_templates_scrubbed_failure }}
      when: >-
        'certificate verify failed' in _semaphore_templates_scrubbed_failure
        or 'CERTIFICATE_VERIFY_FAILED' in _semaphore_templates_scrubbed_failure

    - name: Re-raise the original failure unchanged (not a TLS verification failure)
      ansible.builtin.fail:
        msg: >-
          semaphore_templates task失敗
          (task: {{ ansible_failed_task.name | default('不明') }}):
          {{ _semaphore_templates_scrubbed_failure }}
