---
# Canonical URL is a filter-plugin constant, not an Ansible variable. This
# keeps -e from changing which endpoint receives production active values.
- name: Determine whether the connection URL used matches the canonical production URL (P0-15)
  ansible.builtin.set_fact:
    semaphore_schedules_canonical_url_ok: >-
      {{ semaphore_templates_api_base_url | semaphore_schedules_url_matches_canonical }}
