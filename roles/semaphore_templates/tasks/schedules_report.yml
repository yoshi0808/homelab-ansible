---
# R19: schedule の差分レポートを、template のレポート
# (semaphore_templates_report_dir、latest.json)とは別の置き場
# (semaphore_schedules_report_dir)へ、同時に読める形で保存する。既存の
# latest.json は上書きしない。
#
# **2026-08-09、査読差し戻し(`2026-08-09_017_review_implementation.md`
# High #3)への対応。** このfileは`tasks/main.yml`のnested block/rescue/
# alwaysの`always:`から(さらにその内側の独自block/rescueに包まれて)呼ば
# れ、**成功経路・`--check`・schedule blockが失敗した経路のすべてで実行
# される。** 失敗経路では、preflight/diff/applyのどの時点で
# 止まったかにより、これ以降で参照する事実の一部がまだ`set_fact`されて
# いないことがある(例: `schedules_preflight.yml`自体が失敗すれば
# `semaphore_schedules_diff_result`は存在しない)。**このfileが自分自身
# 「未定義変数」で失敗すると、元の失敗がその新しいエラーに隠れてしまう**
# ため、参照する変数すべてに`default(...)`を付けている。これは「安全に
# 生成できる範囲のレポートを保存する」(査読の要求)の実装そのものであり、
# 値が空/既定であること自体が「ここまでしか進まなかった」という情報に
# なる。
#
# **2026-08-09、再査読差し戻し(`2026-08-09_019_review_implementation_
# r2.md` High #1)への対応。** 以前はこのfile自身が`ansible_failed_result.
# msg`を直接読んで(未scrubbedのまま)`failed_msg`へ入れ、mode 0644の
# JSONへ保存していた — これがtoken漏えいの経路だった。**修正: この
# failedの3つの事実(`semaphore_schedules_run_failed` /
# `_run_failed_task` / `_run_failed_msg`)はもうこのfileでは計算しない。**
# `tasks/main.yml`のschedule block自身のrescueが、`ansible_failed_result`
# から読み取った直後にscrub済みのfactとして`set_fact`する(このrole既存の
# token scrubパターンと同一)。このfileは、そのscrub済みfactを
# `default(...)`で読むだけであり、生の`ansible_failed_result`には一切
# 触れない。
#
# Runs after every other schedules task (including schedules_apply.yml)
# so it can show the actual outcome, not just the pre-apply diff. Under
# --check the outcome lists are simply empty (schedules_diff.yml
# initialized them; schedules_apply.yml never ran).
#
# copy/file support check_mode simulation (skill "check_modeの実装上の
# 落とし穴" 1) so both need an explicit check_mode: false to actually save
# under --check (R7 — report saving is a read-side/diagnostic action).

- name: Freeze the schedules report timestamp (JST; repo規約でUTC/リテラルZは使わない)
  ansible.builtin.set_fact:
    semaphore_schedules_ts_iso: "{{ lookup('pipe', \"TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'\") }}"
    semaphore_schedules_ts: "{{ lookup('pipe', \"TZ='Asia/Tokyo' date '+%Y%m%d_%H%M%S+0900'\") }}"

# 2026-08-24(semaphore_activation_gate_removal案件 R1): 有効化ゲート撤去に
# 伴い、「作成したが有効化は別段階待ち」という状態が無くなったため、その
# 注記リストを計算する task を削除した。作成された schedule は、カタログの
# active が true ならその時点で既に active=true として作成されている。
- name: Show the schedules diff/outcome summary
  ansible.builtin.debug:
    msg:
      - "mode                 : {{ 'check (適用なし)' if ansible_check_mode else 'apply' }}"
      - >-
          failed : {{ semaphore_schedules_run_failed | default(false) }}
          {{ ('(' ~ (semaphore_schedules_run_failed_task | default('')) ~ ')')
             if (semaphore_schedules_run_failed | default(false)) else '' }}
      - "phase                : {{ 'closed-world' if (semaphore_schedules_closed_world_bool | default(false)) else '移行期間' }}"
      - "api_base_url         : {{ semaphore_templates_api_base_url }}"
      - >-
          timezone expected/observed/version :
          {{ semaphore_schedules_expected_timezone | default('(未取得)') }} /
          {{ semaphore_schedules_observed_timezone | default('(未取得)') }}
          / {{ semaphore_schedules_observed_api_version | default('(未取得)') }}
      - >-
          新規作成 : {{ (semaphore_schedules_diff_result | default({})).new | default([]) | length }} 件
          (作成={{ semaphore_schedules_created | default([]) | length }} 件)
      - >-
          更新 : {{ (semaphore_schedules_diff_result | default({})).changed | default([]) | length }} 件
          (書込={{ semaphore_schedules_updated | default([]) | length }} 件、
          見送り={{ semaphore_schedules_update_skipped | default([]) | length }} 件)
      - "無変更               : {{ (semaphore_schedules_diff_result | default({})).unchanged | default([]) | length }} 件"
      - "管理外(削除しない)   : {{ (semaphore_schedules_preflight_result | default({})).unmanaged | default([]) | length }} 件"
      - >-
          canonical接続先一致(R2) : {{ semaphore_schedules_canonical_url_ok | default('(未評価)') }}
          (canonical={{ semaphore_schedules_canonical_api_base_url | default('(未設定)') }}、
          api_base_url={{ semaphore_templates_api_base_url }})
          -- 有効化を伴う書き込みが実際に非canonical接続先へブロック
          された場合は、上のfailed/failed_msgに個別のschedule名で出る
          (2026-08-24再追補: 判定はwrite直前のfresh値で行うため、diff
          時点の静的な「有効化対象」一覧はもう保持しない。独立レビュー
          `2026-08-24_004_review.md` High 1参照)

- name: Show unmanaged schedules (defined nowhere in the catalog — R18, report only)
  ansible.builtin.debug:
    msg: "? id={{ item.id }} name={{ item.name }} (このカタログに定義が無い。削除しない)"
  loop: "{{ (semaphore_schedules_preflight_result | default({})).unmanaged | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Show skipped writes (identity changed since preflight — migration only, R8)
  ansible.builtin.debug:
    msg: "! {{ item.name }}(id={{ item.id }}): {{ item.reason }}"
  loop: "{{ semaphore_schedules_update_skipped | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# **2026-08-09、3回目の査読差し戻し(`2026-08-09_020_review_
# implementation_r3.md`、`_019` Medium #2がopenのまま再指摘)への対応。**
# `ansible.builtin.block`の`rescue:`はUNREACHABLE(接続先でremote temp
# directoryが作れない等)を捕捉しない — 通常のFAILEDとは別の状態であり、
# 発生した瞬間にplay全体が即座に終了し、`main.yml`側のrescue/always/最終
# 合成taskのいずれにも到達しない。ローカルdecoy(`connection: local`+
# 書き込み不可な`ansible_remote_tmp`)で、`ignore_unreachable`を付けない
# 版が`rescue`/`always`のどちらも実行せずplayごと終了することを実測した
# 上で、以下の対策を採った。
#
# `ignore_unreachable: true`(ansible-core既存の task attribute)を
# 3つのtaskすべてへ付け、`register:`した結果の`.unreachable`を後続task
# から明示的に判定する。これによりUNREACHABLEでもplayが即死せず、この
# 同じblock内の後続task(このファイル自身の続き)が通常どおり実行される
# ことを実測確認済み — `rescue:`は(ignore_unreachableにより)発火しない
# が、それは元々「通常のFAILED」用の経路(main.yml側のnested block/
# rescueが既に担当)であり、ここではUNREACHABLE専用の別経路として
# `semaphore_schedules_report_save_failed*`を直接`set_fact`する。

- name: Ensure the schedules report directory exists
  ansible.builtin.file:
    path: "{{ semaphore_schedules_report_dir }}"
    state: directory
    mode: "0755"
  become: false
  check_mode: false
  ignore_unreachable: true
  register: _semaphore_schedules_report_dir_result
  # safe-readonly: レポート保存は読み取り診断の一部であり、--checkでも実行する
  # (roles/semaphore_templates/tasks/report.yml と同じ扱い)

- name: Save the schedules diff/outcome report
  ansible.builtin.copy:
    content: "{{ semaphore_schedules_report | to_nice_json }}"
    dest: "{{ semaphore_schedules_report_dir }}/{{ semaphore_schedules_ts }}.json"
    mode: "0644"
  vars:
    semaphore_schedules_report:
      generated_at: "{{ semaphore_schedules_ts_iso }}"
      mode: "{{ 'check' if ansible_check_mode else 'apply' }}"
      failed: "{{ semaphore_schedules_run_failed | default(false) }}"
      failed_task: "{{ semaphore_schedules_run_failed_task | default('') }}"
      failed_msg: "{{ semaphore_schedules_run_failed_msg | default('') }}"
      phase: "{{ 'closed-world' if (semaphore_schedules_closed_world_bool | default(false)) else '移行期間' }}"
      api_base_url: "{{ semaphore_templates_api_base_url }}"
      timezone:
        expected: "{{ semaphore_schedules_expected_timezone | default('(未取得)') }}"
        observed: "{{ semaphore_schedules_observed_timezone | default('(未取得)') }}"
        api_version: "{{ semaphore_schedules_observed_api_version | default('(未取得)') }}"
      diff:
        new: "{{ (semaphore_schedules_diff_result | default({})).new | default([]) }}"
        changed: "{{ (semaphore_schedules_diff_result | default({})).changed | default([]) }}"
        unchanged_count: "{{ (semaphore_schedules_diff_result | default({})).unchanged | default([]) | length }}"
      unmanaged: "{{ (semaphore_schedules_preflight_result | default({})).unmanaged | default([]) }}"
      outcome:
        created: "{{ semaphore_schedules_created | default([]) }}"
        updated: "{{ semaphore_schedules_updated | default([]) }}"
        update_skipped: "{{ semaphore_schedules_update_skipped | default([]) }}"
      # R2(2026-08-24追補、独立レビュー Finding 1で復元): 判定に使った
      # 接続先とcanonical URLの一致結果を必ず記録する(旧R15と同じ要求)。
      # `url_matches`が`null`のまま保存されるのは、schedule処理そのものが
      # canonical_check.ymlへ到達する前に失敗した場合のみ(default(none))。
      #
      # **2026-08-24再追補(独立レビュー`2026-08-24_004_review.md` High
      # 1): `activation_targets`キーは削除した。** diff時点のスナップ
      # ショットから静的に列挙する設計だったが、diffと実際の書き込みの
      # 間の競合を見逃す(このファイルのヘッダコメント参照)。有効化判定は
      # 今はwrite直前のfresh値で個別に行われ(`schedules_apply_item.yml`
      # / `schedules_apply_new_item.yml`)、ブロックされた場合は下の
      # `failed`/`failed_msg`(このJSONの上部)に対象のschedule名入りで
      # 記録される -- 別の場所へ二重に持たない。
      canonical_check:
        canonical_url: "{{ semaphore_schedules_canonical_api_base_url | default('') }}"
        url_matches: "{{ semaphore_schedules_canonical_url_ok | default(none) }}"
  become: false
  check_mode: false
  ignore_unreachable: true
  register: _semaphore_schedules_report_save_result
  when: not (_semaphore_schedules_report_dir_result.unreachable | default(false))
  # safe-readonly: 上と同じ理由

- name: Publish the latest schedules report under a stable name
  ansible.builtin.copy:
    src: "{{ semaphore_schedules_report_dir }}/{{ semaphore_schedules_ts }}.json"
    dest: "{{ semaphore_schedules_report_dir }}/latest.json"
    remote_src: true
    mode: "0644"
  become: false
  check_mode: false
  ignore_unreachable: true
  register: _semaphore_schedules_report_publish_result
  when: >-
    not (_semaphore_schedules_report_dir_result.unreachable | default(false))
    and not (_semaphore_schedules_report_save_result.unreachable | default(false))
  # safe-readonly: 上と同じ理由

- name: Record an UNREACHABLE report-save failure (rescue cannot catch UNREACHABLE — must be handled explicitly)
  ansible.builtin.set_fact:
    semaphore_schedules_report_save_failed: true
    semaphore_schedules_report_save_failed_msg: >-
      {{ (
           (_semaphore_schedules_report_dir_result.msg | default('(取得できず)'))
           if (_semaphore_schedules_report_dir_result.unreachable | default(false))
           else (_semaphore_schedules_report_save_result.msg | default('(取得できず)'))
           if (_semaphore_schedules_report_save_result.unreachable | default(false))
           else (_semaphore_schedules_report_publish_result.msg | default('(取得できず)'))
         )
         | regex_replace((semaphore_templates_token | regex_escape), '***REDACTED-TOKEN***')
         if (semaphore_templates_token | default('') | length) > 0
         else (
           (_semaphore_schedules_report_dir_result.msg | default('(取得できず)'))
           if (_semaphore_schedules_report_dir_result.unreachable | default(false))
           else (_semaphore_schedules_report_save_result.msg | default('(取得できず)'))
           if (_semaphore_schedules_report_save_result.unreachable | default(false))
           else (_semaphore_schedules_report_publish_result.msg | default('(取得できず)'))
         ) }}
  no_log: true
  when: >-
    (_semaphore_schedules_report_dir_result.unreachable | default(false))
    or (_semaphore_schedules_report_save_result.unreachable | default(false))
    or (_semaphore_schedules_report_publish_result.unreachable | default(false))
