---
# Included with loop_var: scenario by test_blocked_removes.yml.

- name: Expand bulk filler updates for major-upgrade scenarios (AC6c)
  ansible.builtin.set_fact:
    _scenario_updates: >-
      {%- set ns = namespace(items=scenario.updates) -%}
      {%- for i in range(1, (scenario.bulk_update_count | default(0) | int) + 1) -%}
      {%- set ns.items = ns.items + [{'name': 'bulk-pkg-' ~ i, 'nodes': [scenario.node], 'important_component': false}] -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Alias the scenario as a unified-dry-run fragment
  ansible.builtin.set_fact:
    unified_dryrun:
      updates: "{{ _scenario_updates }}"
      removes: "{{ scenario.removes }}"
    codex_output:
      status_inputs:
        major_upgrade_suspected: "{{ scenario.major_upgrade_suspected | default(false) }}"
    _pre_status: "NEEDS_CLASSIFICATION"

# --- Verbatim from roles/proxmox_patch_dryrun/tasks/main.yml ---

- name: Determine mechanical status from package flags
  ansible.builtin.set_fact:
    _has_important_component: "{{ unified_dryrun.updates | selectattr('important_component', 'equalto', true) | list | length > 0 }}"
    _has_removes: "{{ unified_dryrun.removes | length > 0 }}"

- name: Find important removes without an in-node replacement
  ansible.builtin.set_fact:
    _blocked_important_removes: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for remove in unified_dryrun.removes -%}
      {%- set exact = remove.name in proxmox_patch_dryrun_important_components -%}
      {%- for prefix in proxmox_patch_dryrun_important_component_prefixes if remove.name.startswith(prefix) -%}
      {%- set missing_nodes = namespace(value=[]) -%}
      {%- for node in remove.nodes -%}
      {%- set replacements = unified_dryrun.updates | selectattr('name', 'match', '^' + (prefix | regex_escape)) | selectattr('nodes', 'contains', node) | list -%}
      {%- if replacements | length == 0 -%}
      {%- set missing_nodes.value = missing_nodes.value + [node] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if missing_nodes.value | length > 0 -%}
      {%- set ns.items = ns.items + [{'name': remove.name, 'nodes': missing_nodes.value}] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if exact -%}
      {%- set ns.items = ns.items + [{'name': remove.name, 'nodes': remove.nodes}] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set merged = namespace(by_name={}) -%}
      {%- for item in ns.items -%}
      {%- set existing = merged.by_name[item.name] | default([]) -%}
      {%- set _ = merged.by_name.update({item.name: existing + item.nodes}) -%}
      {%- endfor -%}
      {%- set result = namespace(items=[]) -%}
      {%- for name, nodes in merged.by_name.items() -%}
      {%- set result.items = result.items + [{'name': name, 'nodes': nodes | unique | list}] -%}
      {%- endfor -%}
      {{ result.items }}

- name: Set mechanical major findings for blocked-remove regression fixtures
  ansible.builtin.set_fact:
    _major_upgrade_findings: []

- name: Compute final status
  ansible.builtin.set_fact:
    _final_status: >-
      {%- if _pre_status != 'NEEDS_CLASSIFICATION' -%}
      {{ _pre_status }}
      {%- elif _blocked_important_removes | length > 0 -%}
      BLOCKED
      {%- elif _major_upgrade_findings | default([]) | length > 0 -%}
      MAJOR_UPGRADE_DETECTED
      {%- elif _has_important_component | bool or _has_removes | bool -%}
      MAINTENANCE_REQUIRED
      {%- else -%}
      PATCH_READY
      {%- endif -%}

- name: Set dummy notification context vars used by the verbatim notify block
  ansible.builtin.set_fact:
    dryrun_timestamp: "2026-09-26T00-00-00"
    _reached_nodes: "{{ scenario.updates | map(attribute='nodes') | list | sum(start=[]) + scenario.removes | map(attribute='nodes') | list | sum(start=[]) }}"
    unified_dryrun: "{{ unified_dryrun | combine({'node_summaries': {}}) }}"

# --- Verbatim from roles/proxmox_patch_dryrun/tasks/main.yml (BLOCKED notify) ---

- name: Set notification content for BLOCKED
  ansible.builtin.set_fact:
    _notify_subject: >-
      {{ '[Proxmox Patch Dry-run][BLOCKED] 置換先の無い重要package remove - 適用停止'
         if (_blocked_important_removes | default([]) | length > 0)
         else '[Proxmox Patch Dry-run][BLOCKED] apt シミュレーション失敗 - 手動確認が必要' }}
    _notify_body: |
      {% if _blocked_important_removes | default([]) | length > 0 %}
      Proxmox Patch Dry-run で置換先の無い重要packageのremoveを検出しました。自動・手動とも適用しません。

      実行日時: {{ dryrun_timestamp }}
      対象ノード: {{ _reached_nodes | join(', ') }}

      Status: BLOCKED
      {% for item in _blocked_important_removes %}
      - remove: {{ item.name }} (node: {{ item.nodes | join(', ') }})
      {% endfor %}
      {% else %}
      Proxmox Patch Dry-run で apt シミュレーションが失敗しました。

      実行日時: {{ dryrun_timestamp }}
      対象ノード: {{ _reached_nodes | join(', ') }}

      Status: BLOCKED
      自動パッチ適用は停止します。手動で apt の状態を確認してください。

      ノード状態:
      {% for node_name, summary in unified_dryrun.node_summaries.items() %}
      - {{ node_name }}: apt_update_ok={{ summary.apt_update_ok }}, apt_check_ok={{ summary.apt_check_ok }}, sim_ok={{ summary.sim_ok }}
      {% endfor %}
      {% endif %}
  when: _final_status == 'BLOCKED'

- name: Set Slack channel for dryrun result (verbatim)
  ansible.builtin.set_fact:
    _notify_channel: "{{ 'alerts' if _final_status == 'BLOCKED' else 'patches' }}"

# --- End verbatim block ---

- name: Record scenario result
  ansible.builtin.set_fact:
    _dryrun_results: >-
      {{ (_dryrun_results | default([])) +
         [{'id': scenario.id, 'status': (_final_status | trim), 'expected': scenario.expected_status,
           'blocked_important_removes': _blocked_important_removes}] }}
