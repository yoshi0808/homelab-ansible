---
# =============================================================================
# Healthcheck gate: abort if either node is not OK
# =============================================================================

- name: Fail if healthcheck is not OK
  ansible.builtin.fail:
    msg: "Healthcheck is {{ proxmox_report.result.status }} on {{ inventory_hostname }}, dryrun aborted."
  when: proxmox_report.result.status != 'OK'

# =============================================================================
# Phase 1: Collect dry-run data on each proxmox host in parallel (normally
# pve1+pve2; a host that fails healthcheck/gather_facts/this phase is simply
# excluded from Phase 2 onward, see _reached_nodes below)
# =============================================================================

- name: Copy dryrun collect script
  ansible.builtin.copy:
    src: proxmox-dryrun-collect.sh
    dest: /usr/local/sbin/proxmox-dryrun-collect.sh
    mode: "0750"
    owner: root
    group: root

- name: Run dryrun collect
  ansible.builtin.command:
    cmd: /usr/local/sbin/proxmox-dryrun-collect.sh
  register: dryrun_raw
  changed_when: false

- name: Fail if collect returned no output
  ansible.builtin.fail:
    msg: "proxmox-dryrun-collect.sh on {{ inventory_hostname }} returned empty output."
  when: dryrun_raw.stdout | length == 0

- name: Parse dryrun JSON
  ansible.builtin.set_fact:
    node_dryrun: "{{ dryrun_raw.stdout | from_json }}"

# =============================================================================
# Phase 2: Merge on localhost
# =============================================================================

# _expected_nodes: hosts targeted at play start (after --limit, before any
# in-play failure). _reached_nodes: hosts that actually produced node_dryrun
# in Phase 1. Their difference is a node that was targeted but did not get
# here with data -- either truly UNREACHABLE or a healthcheck/collect task
# failure (requirement.md AC1; review 2026-07-26_004 Critical Issue #1: these
# two causes are NOT distinguished, the wording below deliberately does not
# assert which one happened); a node missing from _expected_nodes entirely
# was never targeted, i.e. excluded by an explicit --limit (requirement.md
# AC3). ADR-002 decision d-2.
#
# 2026-07-26: _reached_nodes was ansible_play_hosts (still-active hosts), a
# proxy for "has data" that held only because a node that dropped out always
# dropped out of the play too. Since the playbook gained ignore_unreachable
# (see playbooks/proxmox_patch_dryrun.yml), a node can be a play member and
# still have no node_dryrun, and everything below -- the merge input above
# all -- needs the data, not the membership. Decoy runs of exactly that state
# crash the merge input on the old definition ("object of type 'HostVarsVars'
# has no attribute 'node_dryrun'") and pass on this one; see implement record
# §9. Asking hostvars directly also keeps this correct no matter what future
# handling of unreachable hosts the play chooses.
- name: Determine expected and reached proxmox node sets
  ansible.builtin.set_fact:
    _expected_nodes: "{{ ansible_play_hosts_all }}"
    _reached_nodes: >-
      {{ ansible_play_hosts_all
         | map('extract', hostvars)
         | selectattr('node_dryrun', 'defined')
         | map(attribute='inventory_hostname')
         | list }}
  run_once: true
  delegate_to: localhost
  become: false

# Guard (ADR-002 decision a-1): any_errors_fatal was removed from the play so
# that one unreachable node no longer aborts the whole run. That means Phase 2
# must explicitly refuse to proceed when no proxmox node survived Phase 1,
# instead of silently producing an empty or misleading report (requirement.md
# AC4).
#
# WHERE AC4 IS ACTUALLY ENFORCED (2026-07-26 update): the both-nodes-gone
# case is now caught earlier, by `Fail if no proxmox node could be reached`
# in playbooks/proxmox_patch_dryrun.yml, which runs while every node is still
# a play member and therefore does fire (verified with a decoy inventory --
# implement record §9). This task cannot be the one to catch it: reaching
# Phase 2 at all requires a surviving host to carry the run_once, and if both
# nodes fail in-play (rather than being unreachable up front) Ansible's linear
# strategy stops scheduling the play's remaining tasks entirely. It is kept as
# a cheap last-resort assertion for any future path that reaches Phase 2 with
# no node data; on that path Ansible's own UNREACHABLE/FAILED reporting plus
# the non-zero exit code remain the backstop.
- name: Fail if no proxmox node reached the merge phase
  ansible.builtin.fail:
    msg: >-
      Proxmox patch dry-run: no node reached the merge phase
      (expected={{ _expected_nodes | join(', ') }}, reached=none).
      Stopping instead of producing an empty or misleading report.
  run_once: true
  delegate_to: localhost
  become: false
  when: _reached_nodes | length == 0

- name: Determine node reachability for notification text and report
  ansible.builtin.set_fact:
    _unreachable_nodes: "{{ _expected_nodes | difference(_reached_nodes) }}"
    _limit_excluded_nodes: "{{ groups['proxmox'] | difference(_expected_nodes) }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Build node reachability note text
  ansible.builtin.set_fact:
    _node_reachability_note: >-
      {%- if _unreachable_nodes | length > 0 -%}
      {{ _unreachable_nodes | join(', ') }} は今回の結果に含まれていません(到達不能または健全性チェック失敗)。{{ _reached_nodes | join(', ') }} のみの結果です。
      {%- elif _limit_excluded_nodes | length > 0 -%}
      --limit により {{ _limit_excluded_nodes | join(', ') }} を明示的に除外した単一ノード実行です({{ _reached_nodes | join(', ') }} のみ対象)。
      {%- else -%}
      {%- endif -%}
  run_once: true
  delegate_to: localhost
  become: false

# BUG FIX (2026-07-26, Tester report 2026-07-26_005_test_result.md, confirmed
# by real pve1/pve2 execution): when the `else` branch above is taken (both
# _unreachable_nodes and _limit_excluded_nodes empty -- the normal fixed-pair
# case, i.e. every single day both nodes are healthy), the template above
# consists entirely of Jinja control markup with zero rendered characters.
# Ansible's Templar converts such a "pure Jinja, empty result" template to
# Python None instead of an empty string, so _node_reachability_note becomes
# None rather than ''. Every `| length` check on it downstream then crashes
# with "object of type 'NoneType' has no len()" -- decoy verification during
# implementation only inspected the value, it never piped it through an
# actual `| length` filter the way the real tasks below do, so this was
# missed until Tester ran it against real, healthy pve1/pve2. This task
# re-coerces None back to a real '' immediately after the value is built, so
# _node_reachability_note is never None from this point on.
- name: Coerce None (from an empty pure-Jinja template) back to a real empty string
  ansible.builtin.set_fact:
    _node_reachability_note: "{{ _node_reachability_note | default('', true) }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Record run timestamp
  ansible.builtin.set_fact:
    dryrun_timestamp: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Ensure report directory exists
  ansible.builtin.file:
    path: "{{ proxmox_patch_dryrun_report_dir }}"
    state: directory
    mode: "0755"
  run_once: true
  delegate_to: localhost
  become: false

- name: Save node dryrun data to temp file for merging
  ansible.builtin.copy:
    content: "{{ _reached_nodes | map('extract', hostvars, 'node_dryrun') | list | to_json }}"
    dest: "/tmp/proxmox_dryrun_nodes_{{ dryrun_timestamp }}.json"
  run_once: true
  delegate_to: localhost
  become: false

- name: Merge node data into unified dryrun JSON
  ansible.builtin.command:
    cmd: >-
      python3 {{ role_path }}/files/proxmox-dryrun-merge.py
      /tmp/proxmox_dryrun_nodes_{{ dryrun_timestamp }}.json
      {{ proxmox_patch_dryrun_report_dir }}/{{ dryrun_timestamp }}_unified_dryrun.json
  environment:
    IMPORTANT_COMPONENTS: "{{ proxmox_patch_dryrun_important_components | to_json }}"
    IMPORTANT_COMPONENT_PREFIXES: "{{ proxmox_patch_dryrun_important_component_prefixes | to_json }}"
  register: merge_result
  run_once: true
  delegate_to: localhost
  become: false
  changed_when: true

- name: Load unified dryrun JSON
  ansible.builtin.set_fact:
    unified_dryrun: "{{ lookup('file', proxmox_patch_dryrun_report_dir + '/' + dryrun_timestamp + '_unified_dryrun.json') | from_json }}"
  run_once: true
  delegate_to: localhost
  become: false

# Pre-determine cluster status before Codex (mechanical checks). Iterates
# unified_dryrun.node_summaries (dict keyed by node name, already node-count
# agnostic per proxmox-dryrun-merge.py) instead of a fixed pve1/pve2 pair, so
# this holds unchanged whether one node or the full fixed pair took part.
- name: Determine pre-Codex cluster status
  ansible.builtin.set_fact:
    _pre_status: >-
      {%- set _ns = namespace(all_ok=true) -%}
      {%- for _summary in unified_dryrun.node_summaries.values() -%}
      {%- if not (_summary.apt_update_ok | bool) or
             not (_summary.apt_check_ok | bool) or
             not (_summary.sim_ok | bool) -%}
      {%- set _ns.all_ok = false -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if not _ns.all_ok -%}
      BLOCKED
      {%- elif unified_dryrun.cluster_summary.total_unique_updates == 0 and
               unified_dryrun.cluster_summary.total_unique_removes == 0 -%}
      NO_UPDATES
      {%- else -%}
      NEEDS_CLASSIFICATION
      {%- endif -%}
  run_once: true
  delegate_to: localhost
  become: false

- name: Show pre-status
  ansible.builtin.debug:
    msg: "Pre-Codex cluster status: {{ _pre_status }}"
  run_once: true
  delegate_to: localhost
  become: false

# =============================================================================
# Phase 3: Codex CLI classification (only when there are updates to classify)
# =============================================================================

- name: Call codex-classify.sh
  ansible.builtin.command:
    cmd: >-
      {{ playbook_dir }}/../scripts/codex-classify.sh
      {{ proxmox_patch_dryrun_report_dir }}/{{ dryrun_timestamp }}_unified_dryrun.json
      {{ proxmox_patch_dryrun_report_dir }}/{{ dryrun_timestamp }}_codex_output.json
  register: codex_result
  run_once: true
  delegate_to: localhost
  become: false
  changed_when: true
  when: _pre_status == 'NEEDS_CLASSIFICATION'

- name: Load Codex output
  ansible.builtin.set_fact:
    codex_output: "{{ lookup('file', proxmox_patch_dryrun_report_dir + '/' + dryrun_timestamp + '_codex_output.json') | from_json }}"
  run_once: true
  delegate_to: localhost
  become: false
  when: _pre_status == 'NEEDS_CLASSIFICATION'

# =============================================================================
# Phase 4: Final Status/Urgency determination (Ansible tasks)
# =============================================================================

# --- Mechanical Status from unified data ---
- name: Determine mechanical status from package flags
  ansible.builtin.set_fact:
    _has_important_component: "{{ unified_dryrun.updates | selectattr('important_component', 'equalto', true) | list | length > 0 }}"
    _has_removes: "{{ unified_dryrun.removes | length > 0 }}"
  run_once: true
  delegate_to: localhost
  become: false
  when: _pre_status == 'NEEDS_CLASSIFICATION'

# URGENT conditions from policy (cve_types_detected and urgency_candidate)
- name: Determine final cluster status and urgency
  ansible.builtin.set_fact:
    _urgent_cve_types: ["RCE", "LPE", "VM escape", "認証バイパス", "auth bypass", "exploit公開", "ransomware"]
    _cve_types_all: >-
      {{ codex_output.package_classifications
         | map(attribute='cve_types_detected') | flatten | unique | list }}
    _urgency_candidates_all: >-
      {{ codex_output.package_classifications
         | map(attribute='urgency_candidate') | list }}
  run_once: true
  delegate_to: localhost
  become: false
  when: _pre_status == 'NEEDS_CLASSIFICATION'

- name: Compute final status
  ansible.builtin.set_fact:
    _final_status: >-
      {%- if _pre_status != 'NEEDS_CLASSIFICATION' -%}
      {{ _pre_status }}
      {%- elif codex_output.status_inputs.major_upgrade_suspected | bool -%}
      MAJOR_UPGRADE_DETECTED
      {%- elif _has_important_component | bool or _has_removes | bool -%}
      MAINTENANCE_REQUIRED
      {%- else -%}
      PATCH_READY
      {%- endif -%}
    _final_urgency: >-
      {%- if _pre_status != 'NEEDS_CLASSIFICATION' -%}
      NORMAL
      {%- elif (_cve_types_all | intersect(_urgent_cve_types)) | length > 0 -%}
      URGENT
      {%- elif 'URGENT' in _urgency_candidates_all -%}
      URGENT
      {%- elif 'HIGH' in _urgency_candidates_all -%}
      HIGH
      {%- elif _pre_status == 'NEEDS_CLASSIFICATION' and
               (unified_dryrun.updates | selectattr('security_repo', 'equalto', true) | list | length > 0) -%}
      HIGH
      {%- elif 'NORMAL' in _urgency_candidates_all -%}
      NORMAL
      {%- else -%}
      LOW
      {%- endif -%}
  run_once: true
  delegate_to: localhost
  become: false

- name: Show final determination
  ansible.builtin.debug:
    msg:
      - "Final Status  : {{ _final_status }}"
      - "Final Urgency : {{ _final_urgency }}"
  run_once: true
  delegate_to: localhost
  become: false

# =============================================================================
# Phase 5: Save reports
# =============================================================================

- name: Build final report JSON
  ansible.builtin.set_fact:
    _final_report:
      run_timestamp: "{{ dryrun_timestamp }}"
      cluster_status: "{{ _final_status }}"
      cluster_urgency: "{{ _final_urgency }}"
      node_summaries: "{{ unified_dryrun.node_summaries }}"
      classification: "{{ unified_dryrun.classification }}"
      update_count: "{{ unified_dryrun.cluster_summary.total_unique_updates }}"
      remove_count: "{{ unified_dryrun.cluster_summary.total_unique_removes }}"
      # Schema intentionally kept as fixed pve1/pve2 keys (requirement.md P1
      # scope; a dynamic node-keyed redesign is deferred until repo-external
      # consumers, e.g. a Semaphore dashboard, are confirmed absent). Only the
      # value derivation is made node-count agnostic: read from
      # unified_dryrun.node_summaries (already dynamically keyed by
      # proxmox-dryrun-merge.py) instead of hostvars['pve1']/['pve2'], which
      # do not exist for a node that never reached Phase 1. A node absent from
      # this run yields null ("not evaluated this run"), never false.
      reboot_required_pve1: "{{ unified_dryrun.node_summaries['pve1'].reboot_required if 'pve1' in unified_dryrun.node_summaries else none }}"
      reboot_required_pve2: "{{ unified_dryrun.node_summaries['pve2'].reboot_required if 'pve2' in unified_dryrun.node_summaries else none }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Save final report JSON
  ansible.builtin.copy:
    content: "{{ _final_report | to_nice_json }}"
    dest: "{{ proxmox_patch_dryrun_report_dir }}/{{ dryrun_timestamp }}_final.json"
  run_once: true
  delegate_to: localhost
  become: false

# Build MD report for NEEDS_CLASSIFICATION cases (Codex generates report_md)
- name: Save Codex MD report
  ansible.builtin.copy:
    content: "{{ codex_output.report_md }}"
    dest: "{{ proxmox_patch_dryrun_report_dir }}/{{ dryrun_timestamp }}_report.md"
  run_once: true
  delegate_to: localhost
  become: false
  when: _pre_status == 'NEEDS_CLASSIFICATION'

# Minimal MD report for NO_UPDATES / BLOCKED
- name: Save minimal MD report for NO_UPDATES or BLOCKED
  ansible.builtin.copy:
    content: |
      # Proxmox Patch Dry-run レポート

      実行日時: {{ dryrun_timestamp }}
      クラスター Status: {{ _final_status }}

      {% if _final_status == 'NO_UPDATES' %}
      {% if _node_reachability_note | default('', true) | length == 0 %}
      pve1/pve2 ともに更新候補なし。
      {% else %}
      {{ _reached_nodes | join('/') }} に更新候補なし。{{ _node_reachability_note }}
      {% endif %}
      {% elif _final_status == 'BLOCKED' %}
      apt シミュレーションが失敗しました。手動確認が必要です。

      ## ノード状態

      {% for node_name, summary in unified_dryrun.node_summaries.items() %}
      - {{ node_name }}: apt_update_ok={{ summary.apt_update_ok }}, apt_check_ok={{ summary.apt_check_ok }}, sim_ok={{ summary.sim_ok }}
      {% endfor %}
      {% endif %}
    dest: "{{ proxmox_patch_dryrun_report_dir }}/{{ dryrun_timestamp }}_report.md"
  run_once: true
  delegate_to: localhost
  become: false
  when: _pre_status != 'NEEDS_CLASSIFICATION'

# =============================================================================
# Phase 6: Send Slack notification
# =============================================================================

- name: Set notification content for Codex-classified results
  ansible.builtin.set_fact:
    _notify_subject: "{{ codex_output.mail_subject }}"
    _notify_body: "{{ codex_output.mail_body }}"
  run_once: true
  delegate_to: localhost
  become: false
  when: _pre_status == 'NEEDS_CLASSIFICATION'

- name: Set notification content for NO_UPDATES
  ansible.builtin.set_fact:
    _notify_subject: "[Proxmox Patch Dry-run] NO_UPDATES - {{ _reached_nodes | join(', ') }} 更新候補なし"
    _notify_body: |
      Proxmox Patch Dry-run を実行しました。

      実行日時: {{ dryrun_timestamp }}
      対象ノード: {{ _reached_nodes | join(', ') }}

      {% if _node_reachability_note | default('', true) | length == 0 -%}
      pve1/pve2 ともに更新候補がありません。パッチ適用は不要です。
      {%- else -%}
      {{ _reached_nodes | join('/') }} に更新候補がありません。パッチ適用は不要です。
      {%- endif %}
  run_once: true
  delegate_to: localhost
  become: false
  when: _final_status == 'NO_UPDATES'

- name: Set notification content for BLOCKED
  ansible.builtin.set_fact:
    _notify_subject: "[Proxmox Patch Dry-run][BLOCKED] apt シミュレーション失敗 - 手動確認が必要"
    _notify_body: |
      Proxmox Patch Dry-run で apt シミュレーションが失敗しました。

      実行日時: {{ dryrun_timestamp }}
      対象ノード: {{ _reached_nodes | join(', ') }}

      Status: BLOCKED
      自動パッチ適用は停止します。手動で apt の状態を確認してください。

      ノード状態:
      {% for node_name, summary in unified_dryrun.node_summaries.items() %}
      - {{ node_name }}: apt_update_ok={{ summary.apt_update_ok }}, apt_check_ok={{ summary.apt_check_ok }}, sim_ok={{ summary.sim_ok }}
      {% endfor %}
  run_once: true
  delegate_to: localhost
  become: false
  when: _final_status == 'BLOCKED'

# Applies to every status branch above (Codex-classified, NO_UPDATES,
# BLOCKED) so a node missing from this run (AC1 -- UNREACHABLE or healthcheck
# failure, cause not asserted, see review 2026-07-26_004 Critical Issue #1)
# or an intentional --limit single-node run (AC3) is disclosed regardless of
# the resulting Status. A
# no-op (unchanged _notify_body) whenever both nodes took part normally, so
# fixed-pair notifications are byte-for-byte unchanged (AC2).
- name: Append node reachability note to notification body
  ansible.builtin.set_fact:
    _notify_body: "{{ _notify_body }}\n{{ _node_reachability_note }}"
  run_once: true
  delegate_to: localhost
  become: false
  when: _node_reachability_note | default('', true) | length > 0

- name: Set Slack channel and status for dryrun result
  ansible.builtin.set_fact:
    _notify_channel: "{{ 'alerts' if _final_status == 'BLOCKED' else 'patches' }}"
    _notify_status: >-
      {%- if _final_status == 'BLOCKED' -%}
      critical
      {%- elif _final_status in ['MAINTENANCE_REQUIRED', 'MAJOR_UPGRADE_DETECTED'] -%}
      warning
      {%- elif _final_status == 'NO_UPDATES' -%}
      info
      {%- else -%}
      ok
      {%- endif -%}
  run_once: true
  delegate_to: localhost
  become: false

- name: Send Slack notification
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
  vars:
    slack_channel: "{{ _notify_channel }}"
    slack_status: "{{ _notify_status }}"
    slack_title: "{{ _notify_subject }}"
    slack_message: "{{ _notify_body }}"
  run_once: true

- name: Cleanup temp nodes file
  ansible.builtin.file:
    path: "/tmp/proxmox_dryrun_nodes_{{ dryrun_timestamp }}.json"
    state: absent
  run_once: true
  delegate_to: localhost
  become: false
