---
proxmox_patch_apply_report_dir: "{{ reports_base_dir }}/proxmox-patch"
proxmox_patch_dryrun_report_dir: "{{ reports_base_dir }}/proxmox-dryrun"

# Hostname of the control node VM to detect on target_node
proxmox_patch_apply_control_node_name: "ansy"

# Reboot wait timeout in seconds (15 minutes)
proxmox_patch_apply_reboot_timeout: 900

# Apply mode: controls behavior when the re-dry-run classifies the result as
# MAINTENANCE_REQUIRED-with-removes or MAJOR_UPGRADE_DETECTED (requirement.md
# 2026-08-01 proxmox_auto_apply_widening §2.1: MAINTENANCE_REQUIRED without
# removes no longer needs this — it auto-applies regardless of mode).
# auto:   abort with notification (default)
# manual: require the matching explicit confirmation string, then continue
#         (policy deviation — use with care)
proxmox_patch_apply_mode: "auto"

# Explicit confirmation required when apply_mode=manual and the re-dry-run
# detects MAINTENANCE_REQUIRED-with-removes or MAJOR_UPGRADE_DETECTED. Must
# equal exactly the detected status string to proceed (§2.3): either
# "MAINTENANCE_REQUIRED" or "MAJOR_UPGRADE_DETECTED". A value that does not
# match the detected status still stops the run.
# Usage: -e proxmox_patch_apply_mode=manual -e proxmox_patch_apply_manual_confirm=MAINTENANCE_REQUIRED
proxmox_patch_apply_manual_confirm: ""

# Package count threshold for major upgrade suspicion
proxmox_patch_apply_major_upgrade_threshold: 50

# Important component exact names (mirrors policy section 7)
proxmox_patch_apply_important_components:
  - proxmox-ve
  - pve-manager
  - pve-cluster
  - pve-ha-manager
  - qemu-server
  - pve-container
  - corosync
  - zfsutils-linux
  - zfs-zed
  - ifupdown2
  - intel-microcode
  - amd64-microcode
  - systemd
  - udev

# Important component name prefixes
proxmox_patch_apply_important_component_prefixes:
  - proxmox-kernel-
  - libpve-
  - firmware-

# Post-healthcheck retry on CRITICAL/UNKNOWN after reboot.
# Retried only when status is CRITICAL or UNKNOWN and reboot was performed.
# retry_count: maximum retry attempts; loop runs range(N+1) times (each preceded by retry_delay pause).
# retry_delay: seconds to wait before each retry attempt (including the first).
# max wait = (retry_count + 1) * retry_delay seconds.
proxmox_patch_apply_hc_retry_count: 2
proxmox_patch_apply_hc_retry_delay: 60

# Optional same-day deb cache on the existing Proxmox-managed NAS mount.
# This is only an optimization: every node still validates cached debs against
# its own refreshed apt indexes and downloads any missing/different versions.
proxmox_patch_apply_nas_cache_enabled: true
proxmox_patch_apply_nas_mount_path: /mnt/pve/Synology-nfs
proxmox_patch_apply_nas_cache_dir: "{{ proxmox_patch_apply_nas_mount_path }}/proxmox-patch-cache"
proxmox_patch_apply_nas_cache_keep: 3
proxmox_patch_apply_nas_io_timeout: 300
proxmox_patch_apply_nas_timeout_kill_after: 5

# Persistent target-node logs for the separated download and apply phases.
proxmox_patch_apply_log_dir: /var/log/proxmox-patch

# Select the lowest-RTT address returned at runtime for the Proxmox CDN and pin
# it only around apt-get -d. No address is stored in Git or retained in hosts.
proxmox_patch_apply_mirror_probe_enabled: true
proxmox_patch_apply_mirror_probe_count: 5
proxmox_patch_apply_mirror_ping_count: 3
proxmox_patch_apply_mirror_ping_timeout: 2
proxmox_patch_apply_mirror_host: download.proxmox.com
