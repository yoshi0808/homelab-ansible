---
# =============================================================================
# Safety gate: validate target_node before any work
# =============================================================================

- name: Validate target_node is pve1 or pve2
  ansible.builtin.assert:
    that:
      - target_node is defined
      - target_node in ['pve1', 'pve2']
    fail_msg: "target_node must be 'pve1' or 'pve2', got: '{{ target_node | default('undefined') }}'"
  delegate_to: localhost
  become: false

- name: Validate download, cache, log, and mirror inputs
  ansible.builtin.assert:
    that:
      - proxmox_patch_apply_nas_mount_path is match('^/mnt/pve/[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?$')
      - proxmox_patch_apply_nas_cache_dir == proxmox_patch_apply_nas_mount_path + '/proxmox-patch-cache'
      - proxmox_patch_apply_nas_cache_keep | int >= 1
      - proxmox_patch_apply_nas_io_timeout | int >= 30
      - proxmox_patch_apply_nas_timeout_kill_after | int >= 1
      - proxmox_patch_apply_nas_timeout_kill_after | int <= 30
      - proxmox_patch_apply_log_dir is match('^/var/log/[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?$')
      - proxmox_patch_apply_mirror_probe_count | int >= 1
      - proxmox_patch_apply_mirror_probe_count | int <= 10
      - proxmox_patch_apply_mirror_ping_count | int >= 1
      - proxmox_patch_apply_mirror_ping_count | int <= 10
      - proxmox_patch_apply_mirror_ping_timeout | int >= 1
      - proxmox_patch_apply_mirror_ping_timeout | int <= 10
      - proxmox_patch_apply_mirror_host is match('^[A-Za-z0-9.-]+$')
    fail_msg: "Invalid Proxmox patch cache, log, or mirror configuration."
    quiet: true

# =============================================================================
# Initialize: set all result facts before block so always-block can reference them
# =============================================================================

- name: Set run timestamp and initialize result facts
  ansible.builtin.set_fact:
    _apply_run_ts: "{{ lookup('pipe', 'TZ=Asia/Tokyo date +%Y%m%dT%H%M%S') }}"
    _apply_failed: false
    _apply_abort_type: "none"
    _apply_error_msg: ""
    _predryrun: {}
    _sim_updates: []
    _sim_removes: []
    _important_updates: []
    _new_vs_dryrun: []
    _unchanged_vs_dryrun: []
    _download_stdout: ""
    _download_stderr: ""
    _download_bytes: 0
    _download_seconds: 0
    _download_cache_hit: false
    _apply_seconds: 0
    _apply_stdout: ""
    _apply_collect: {}
    _reboot_required_before: false
    _apply_reboot_done: false
    _post_hc_status: "UNKNOWN"
    _pre_hc_status: "UNKNOWN"
    _running_on_target: []
    _notify_subject: "[UNKNOWN] {{ inventory_hostname }}: パッチ適用結果不明"
    _notify_body: "パッチ適用の結果を取得できませんでした。ログを確認してください。"
    _post_hc_retry_status: "CRITICAL"
    _post_hc_retry_json: {}
    _nas_cache_available: false
    _nas_cache_warnings: []
    _mirror_candidates: []
    _mirror_probe_results: []
    _mirror_selected_address: ""
    _mirror_selected_rtt_ms: ""

- name: Set JST cache key and persistent phase log paths
  ansible.builtin.set_fact:
    _apply_cache_date: "{{ _apply_run_ts[0:8] }}"
    _download_log_path: "{{ proxmox_patch_apply_log_dir }}/{{ _apply_run_ts }}-download.log"
    _apply_log_path: "{{ proxmox_patch_apply_log_dir }}/{{ _apply_run_ts }}-apply.log"
    _nas_cache_run_dir: "{{ proxmox_patch_apply_nas_cache_dir }}/{{ _apply_run_ts[0:8] }}"

- name: Ensure report directory exists
  ansible.builtin.file:
    path: "{{ proxmox_patch_apply_report_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  check_mode: false

# =============================================================================
# Main block: Phases 1-3. Rescue catches any failure. Always runs Phase 4.
# =============================================================================

- block:

    # =========================================================================
    # Phase 1: Pre-check — control node placement
    # =========================================================================

    - name: Get cluster resources (VMs and CTs)
      ansible.builtin.command:
        cmd: pvesh get /cluster/resources --output-format json
      register: _pvesh_raw
      changed_when: false
      check_mode: false

    - name: Detect control node running on target
      ansible.builtin.set_fact:
        _control_node_vms: >-
          {{ _pvesh_raw.stdout | from_json |
             selectattr('type', 'defined') |
             selectattr('type', 'equalto', 'qemu') |
             selectattr('node', 'defined') |
             selectattr('node', 'equalto', inventory_hostname) |
             selectattr('name', 'defined') |
             selectattr('name', 'search', proxmox_patch_apply_control_node_name) |
             list }}

    - name: Abort if control node is on target
      when: _control_node_vms | length > 0
      block:
        - ansible.builtin.set_fact:
            _apply_abort_type: "control_node"
            _apply_error_msg: >-
              Control node '{{ proxmox_patch_apply_control_node_name }}' is running on
              {{ inventory_hostname }} ({{ _control_node_vms | map(attribute='name') | join(', ') }}).
              Cannot apply patch to a node hosting the control node.
        - ansible.builtin.fail:
            msg: "{{ _apply_error_msg }}"

    - name: Detect running VMs/CTs on target node (evacuation check)
      ansible.builtin.set_fact:
        _running_on_target: >-
          {{ _pvesh_raw.stdout | from_json |
             selectattr('type', 'defined') |
             selectattr('type', 'in', ['qemu', 'lxc']) |
             selectattr('node', 'defined') |
             selectattr('node', 'equalto', inventory_hostname) |
             selectattr('status', 'defined') |
             selectattr('status', 'equalto', 'running') |
             list }}

    - name: Abort if running VMs/CTs found on target (evacuation required)
      when: _running_on_target | length > 0
      block:
        - ansible.builtin.set_fact:
            _apply_abort_type: "vms_not_evacuated"
            _apply_error_msg: >-
              Running VMs/CTs found on {{ inventory_hostname }}:
              {{ _running_on_target | map(attribute='name') | join(', ') }}.
              Evacuate all VMs/CTs before applying patch.
        - ansible.builtin.fail:
            msg: "{{ _apply_error_msg }}"

    # =========================================================================
    # Phase 1: Pre-check — healthcheck gate
    # =========================================================================

    - name: Run pre-apply healthcheck
      ansible.builtin.include_role:
        name: proxmox_healthcheck

    - name: Record pre-healthcheck status
      ansible.builtin.set_fact:
        _pre_hc_status: "{{ proxmox_report.result.status }}"

    - name: Abort if healthcheck is not OK
      when: proxmox_report.result.status != 'OK'
      block:
        - ansible.builtin.set_fact:
            _apply_abort_type: "healthcheck"
            _apply_error_msg: >-
              Healthcheck {{ proxmox_report.result.status }} on {{ inventory_hostname }}:
              {{ (proxmox_report.result.criticals + proxmox_report.result.warnings) | join(' | ') }}
        - ansible.builtin.fail:
            msg: "{{ _apply_error_msg }}"

    # =========================================================================
    # Phase 2: Pre-apply dry-run
    # =========================================================================

    - name: Copy pre-apply dry-run collect script
      ansible.builtin.copy:
        src: proxmox-patch-predryrun-collect.sh
        dest: /usr/local/sbin/proxmox-patch-predryrun-collect.sh
        mode: "0750"
        owner: root
        group: root
      check_mode: false

    - name: Copy post-apply collect script
      ansible.builtin.copy:
        src: proxmox-patch-apply-collect.sh
        dest: /usr/local/sbin/proxmox-patch-apply-collect.sh
        mode: "0750"
        owner: root
        group: root
      check_mode: false

    - name: Copy apt phase runner
      ansible.builtin.copy:
        src: proxmox-patch-apt-phase.sh
        dest: /usr/local/sbin/proxmox-patch-apt-phase.sh
        mode: "0750"
        owner: root
        group: root

    - name: Copy optional NAS cache helper
      ansible.builtin.copy:
        src: proxmox-patch-cache.sh
        dest: /usr/local/sbin/proxmox-patch-cache.sh
        mode: "0750"
        owner: root
        group: root

    - name: Run pre-apply dry-run collect
      ansible.builtin.command:
        cmd: /usr/local/sbin/proxmox-patch-predryrun-collect.sh
      register: _predryrun_raw
      changed_when: false
      check_mode: false

    - name: Parse pre-apply dry-run JSON
      ansible.builtin.set_fact:
        _predryrun: "{{ _predryrun_raw.stdout | from_json }}"

    - name: Abort if apt-get update failed
      when: not (_predryrun.apt_update_ok | bool)
      block:
        - ansible.builtin.set_fact:
            _apply_abort_type: "apt_update"
            _apply_error_msg: "apt-get update failed: {{ _predryrun.apt_update_output | truncate(400) }}"
        - ansible.builtin.fail:
            msg: "{{ _apply_error_msg }}"

    - name: Abort if apt-get check failed
      when: not (_predryrun.apt_check_ok | bool)
      block:
        - ansible.builtin.set_fact:
            _apply_abort_type: "apt_check"
            _apply_error_msg: "apt-get check failed: {{ _predryrun.apt_check_output | truncate(400) }}"
        - ansible.builtin.fail:
            msg: "{{ _apply_error_msg }}"

    - name: Abort if apt simulation failed
      when: not (_predryrun.sim_ok | bool)
      block:
        - ansible.builtin.set_fact:
            _apply_abort_type: "sim_failed"
            _apply_error_msg: "apt-get -s dist-upgrade failed on {{ inventory_hostname }}"
        - ansible.builtin.fail:
            msg: "{{ _apply_error_msg }}"

    - name: Parse simulation output for package changes
      ansible.builtin.set_fact:
        _sim_updates: >-
          {{ _predryrun.sim_output.splitlines() |
             select('match', '^Inst ') |
             map('regex_replace', '^Inst (\S+).*', '\1') | list }}
        _sim_removes: >-
          {{ _predryrun.sim_output.splitlines() |
             select('match', '^Remv ') |
             map('regex_replace', '^Remv (\S+).*', '\1') | list }}

    - name: Detect important components in update list
      ansible.builtin.set_fact:
        _important_updates: >-
          {{ (_sim_updates | select('in', proxmox_patch_apply_important_components) | list) +
             (_sim_updates | select('match', '^(' + (proxmox_patch_apply_important_component_prefixes | join('|')) + ')') | list) }}

    - name: Determine if re-dry-run shows MAINTENANCE_REQUIRED
      ansible.builtin.set_fact:
        _redryrun_is_mr: >-
          {{ (_sim_updates | length > proxmox_patch_apply_major_upgrade_threshold | int) or
             (_important_updates | length > 0) or
             (_sim_removes | length > 0) }}
        _redryrun_mr_reason: >-
          {%- if _sim_updates | length > proxmox_patch_apply_major_upgrade_threshold | int -%}
          major upgrade suspected ({{ _sim_updates | length }} packages exceed threshold {{ proxmox_patch_apply_major_upgrade_threshold }})
          {%- elif _important_updates | length > 0 -%}
          important components detected: {{ _important_updates | unique | join(', ') }}
          {%- elif _sim_removes | length > 0 -%}
          removes detected: {{ _sim_removes | join(', ') }}
          {%- else -%}
          none
          {%- endif -%}

    # Compare with latest dry-run JSON when MAINTENANCE_REQUIRED
    - name: Find latest unified dry-run JSON
      ansible.builtin.set_fact:
        _latest_dryrun_packages: >-
          {%- set files = query('fileglob', proxmox_patch_dryrun_report_dir + '/*_unified_dryrun.json') | sort -%}
          {%- if files | length > 0 -%}
          {{ (lookup('file', files | last) | from_json).updates | map(attribute='name') | list }}
          {%- else -%}
          []
          {%- endif -%}
      when: _redryrun_is_mr | bool

    - name: Compute package diff vs latest dry-run
      ansible.builtin.set_fact:
        _new_vs_dryrun: "{{ _sim_updates | difference(_latest_dryrun_packages | default([])) }}"
        _unchanged_vs_dryrun: "{{ _sim_updates | intersect(_latest_dryrun_packages | default([])) }}"
      when: _redryrun_is_mr | bool

    - name: Abort if MAINTENANCE_REQUIRED detected (auto mode)
      when: (_redryrun_is_mr | bool) and proxmox_patch_apply_mode == 'auto'
      block:
        - ansible.builtin.set_fact:
            _apply_abort_type: "maintenance_required"
            _apply_error_msg: "MAINTENANCE_REQUIRED: {{ _redryrun_mr_reason }}"
        - ansible.builtin.fail:
            msg: "{{ _apply_error_msg }}"

    - name: Abort if manual mode used without explicit confirmation
      when: >-
        (_redryrun_is_mr | bool) and
        proxmox_patch_apply_mode == 'manual' and
        proxmox_patch_apply_manual_confirm != 'MAINTENANCE_REQUIRED'
      block:
        - ansible.builtin.set_fact:
            _apply_abort_type: "manual_not_confirmed"
            _apply_error_msg: >-
              apply_mode=manual requires explicit confirmation when MAINTENANCE_REQUIRED is detected.
              Add: -e proxmox_patch_apply_manual_confirm=MAINTENANCE_REQUIRED
        - ansible.builtin.fail:
            msg: "{{ _apply_error_msg }}"

    - name: Warn and continue (manual mode, confirmed)
      ansible.builtin.debug:
        msg: >-
          [WARNING] apply_mode=manual confirmed: MAINTENANCE_REQUIRED detected but continuing.
          Reason: {{ _redryrun_mr_reason }}
      when: >-
        (_redryrun_is_mr | bool) and
        proxmox_patch_apply_mode == 'manual' and
        proxmox_patch_apply_manual_confirm == 'MAINTENANCE_REQUIRED'

    # =========================================================================
    # Phase 2a/2b: optional seed -> download -> publish -> apply
    # =========================================================================

    - name: Download and apply the package transaction
      when: not ansible_check_mode
      tags: [destructive]
      block:
        - name: Set abort type for download phase
          ansible.builtin.set_fact:
            _apply_abort_type: "download_failed"

        - name: Resolve persistent log directory before root write
          ansible.builtin.command:
            argv:
              - /usr/bin/readlink
              - -m
              - --
              - "{{ proxmox_patch_apply_log_dir }}"
          register: _log_dir_canonical
          changed_when: false
          failed_when: false

        - name: Abort when persistent log directory is non-canonical
          when: >-
            (_log_dir_canonical.rc | default(1)) != 0 or
            (_log_dir_canonical.stdout | default('') | trim) != proxmox_patch_apply_log_dir
          block:
            - ansible.builtin.set_fact:
                _apply_error_msg: >-
                  Refusing non-canonical persistent log directory before root write:
                  {{ proxmox_patch_apply_log_dir }}
            - ansible.builtin.fail:
                msg: "{{ _apply_error_msg }}"

        - name: Ensure persistent patch log directory exists
          ansible.builtin.file:
            path: "{{ proxmox_patch_apply_log_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0750"

        - name: Locate the configured NAS mount without mounting it
          ansible.builtin.command:
            argv:
              - /usr/bin/timeout
              - "--kill-after={{ proxmox_patch_apply_nas_timeout_kill_after | int }}s"
              - "15s"
              - /usr/bin/findmnt
              - -rn
              - -T
              - "{{ proxmox_patch_apply_nas_mount_path }}"
              - -o
              - TARGET
          register: _nas_findmnt
          changed_when: false
          failed_when: false
          when: proxmox_patch_apply_nas_cache_enabled | bool

        - name: Probe NAS path with a bounded wait
          ansible.builtin.command:
            argv:
              - /usr/bin/timeout
              - "--kill-after={{ proxmox_patch_apply_nas_timeout_kill_after | int }}s"
              - "15s"
              - /usr/bin/test
              - -d
              - "{{ proxmox_patch_apply_nas_mount_path }}"
          register: _nas_path_probe
          changed_when: false
          failed_when: false
          when:
            - proxmox_patch_apply_nas_cache_enabled | bool
            - (_nas_findmnt.rc | default(1)) == 0
            - (_nas_findmnt.stdout | default('') | trim) == proxmox_patch_apply_nas_mount_path

        - name: Safely prepare same-day NAS cache directory with a bounded wait
          ansible.builtin.command:
            argv:
              - /usr/bin/timeout
              - "--kill-after={{ proxmox_patch_apply_nas_timeout_kill_after | int }}s"
              - "{{ proxmox_patch_apply_nas_io_timeout | int }}s"
              - /usr/local/sbin/proxmox-patch-cache.sh
              - prepare
              - "{{ proxmox_patch_apply_nas_mount_path }}"
              - "{{ _nas_cache_run_dir }}"
              - "{{ proxmox_patch_apply_nas_cache_dir }}"
          register: _nas_cache_prepare
          changed_when: >-
            (_nas_cache_prepare.rc | default(1)) == 0 and
            not ((_nas_cache_prepare.stdout | default('')) is search('created=0'))
          failed_when: false
          when:
            - proxmox_patch_apply_nas_cache_enabled | bool
            - (_nas_path_probe.rc | default(1)) == 0

        - name: Record NAS cache availability
          ansible.builtin.set_fact:
            _nas_cache_available: >-
              {{ (proxmox_patch_apply_nas_cache_enabled | bool) and
                 ((_nas_findmnt.rc | default(1)) == 0) and
                 ((_nas_findmnt.stdout | default('') | trim) == proxmox_patch_apply_nas_mount_path) and
                 ((_nas_path_probe.rc | default(1)) == 0) and
                 ((_nas_cache_prepare.rc | default(1)) == 0) }}

        - name: Warn and continue when optional NAS cache is unavailable
          ansible.builtin.debug:
            msg: >-
              [WARNING] Optional NAS deb cache is unavailable on {{ inventory_hostname }};
              continuing with direct repository download.
          when:
            - proxmox_patch_apply_nas_cache_enabled | bool
            - not (_nas_cache_available | bool)

        - name: Record NAS availability warning
          ansible.builtin.set_fact:
            _nas_cache_warnings: >-
              {{ _nas_cache_warnings + ['NAS cache unavailable; direct download used'] }}
          when:
            - proxmox_patch_apply_nas_cache_enabled | bool
            - not (_nas_cache_available | bool)

        - name: Seed local apt archives from same-day NAS cache
          ansible.builtin.command:
            argv:
              - /usr/bin/timeout
              - "--kill-after={{ proxmox_patch_apply_nas_timeout_kill_after | int }}s"
              - "{{ proxmox_patch_apply_nas_io_timeout | int }}s"
              - /usr/local/sbin/proxmox-patch-cache.sh
              - seed
              - "{{ _nas_cache_run_dir }}"
              - /var/cache/apt/archives
              - "{{ proxmox_patch_apply_nas_cache_dir }}"
          register: _nas_seed
          changed_when: >-
            (_nas_seed.rc | default(1)) == 0 and
            not ((_nas_seed.stdout | default('')) is search('copied=0'))
          failed_when: false
          when: _nas_cache_available | bool

        - name: Warn and continue when NAS seed fails
          ansible.builtin.debug:
            msg: >-
              [WARNING] NAS deb seed failed on {{ inventory_hostname }};
              apt will validate existing files and download missing archives directly.
          when:
            - _nas_cache_available | bool
            - (_nas_seed.rc | default(0)) != 0

        - name: Record NAS seed warning
          ansible.builtin.set_fact:
            _nas_cache_warnings: "{{ _nas_cache_warnings + ['NAS seed failed; direct download used'] }}"
          when:
            - _nas_cache_available | bool
            - (_nas_seed.rc | default(0)) != 0

        - name: Resolve runtime mirror candidates repeatedly
          ansible.builtin.command:
            argv:
              - /usr/bin/getent
              - ahostsv4
              - "{{ proxmox_patch_apply_mirror_host }}"
          loop: "{{ range(proxmox_patch_apply_mirror_probe_count | int) | list }}"
          loop_control:
            label: "resolution {{ item + 1 }}"
          register: _mirror_resolve
          changed_when: false
          failed_when: false
          when: proxmox_patch_apply_mirror_probe_enabled | bool

        - name: Build unique runtime mirror candidate list
          ansible.builtin.set_fact:
            _mirror_candidates: >-
              {{ ((_mirror_resolve.results | default([]) |
                   selectattr('rc', 'equalto', 0) |
                   map(attribute='stdout_lines') | flatten |
                   map('regex_replace', '^\s*([0-9.]+)\s+.*$', '\1') |
                   select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$') |
                   unique | list)
                  [:proxmox_patch_apply_mirror_probe_count | int])
                 if (proxmox_patch_apply_mirror_probe_enabled | bool) else [] }}

        - name: Probe candidate RTT
          ansible.builtin.command:
            argv:
              - /usr/bin/ping
              - -n
              - -c
              - "{{ proxmox_patch_apply_mirror_ping_count | string }}"
              - -W
              - "{{ proxmox_patch_apply_mirror_ping_timeout | string }}"
              - "{{ item }}"
          loop: "{{ _mirror_candidates }}"
          loop_control:
            label: "runtime candidate {{ ansible_loop.index }}"
            extended: true
          register: _mirror_ping
          changed_when: false
          failed_when: false

        - name: Record successful runtime mirror probes
          ansible.builtin.set_fact:
            _mirror_probe_results: >-
              {{ _mirror_probe_results + [{
                   'address': item.item,
                   'rtt_ms': (item.stdout | regex_findall('= [0-9.]+/([0-9.]+)/') | first | float)
                 }] }}
          loop: "{{ _mirror_ping.results | default([]) }}"
          loop_control:
            label: "successful runtime candidate"
          when:
            - item.rc == 0
            - item.stdout is search('= [0-9.]+/[0-9.]+/')

        - name: Select lowest-RTT runtime mirror
          ansible.builtin.set_fact:
            _mirror_selected_address: >-
              {{ ((_mirror_probe_results | sort(attribute='rtt_ms') | first).address)
                 if (_mirror_probe_results | length > 0) else '' }}
            _mirror_selected_rtt_ms: >-
              {{ ((_mirror_probe_results | sort(attribute='rtt_ms') | first).rtt_ms)
                 if (_mirror_probe_results | length > 0) else '' }}

        - name: Warn and continue without pin when mirror probe has no result
          ansible.builtin.debug:
            msg: >-
              [WARNING] No usable RTT probe result for {{ proxmox_patch_apply_mirror_host }};
              continuing with normal DNS selection.
          when:
            - proxmox_patch_apply_mirror_probe_enabled | bool
            - _mirror_selected_address | length == 0

        - name: Checksum hosts before temporary mirror pin
          ansible.builtin.stat:
            path: /etc/hosts
            get_checksum: true
            checksum_algorithm: sha256
          register: _hosts_before_download

        - name: Download package archives with persistent log
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/proxmox-patch-apt-phase.sh
              - download
              - "{{ _download_log_path }}"
              - "{{ proxmox_patch_apply_mirror_host }}"
              - "{{ _mirror_selected_address }}"
          register: _download_raw
          changed_when: true
          failed_when: false

        - name: Record download command diagnostics
          ansible.builtin.set_fact:
            _download_stdout: "{{ _download_raw.stdout | default('') }}"
            _download_stderr: "{{ _download_raw.stderr | default('') }}"

        - name: Checksum hosts after temporary mirror pin
          ansible.builtin.stat:
            path: /etc/hosts
            get_checksum: true
            checksum_algorithm: sha256
          register: _hosts_after_download

        - name: Abort if hosts was not restored exactly
          when: >-
            not (_hosts_before_download.stat.exists | default(false)) or
            not (_hosts_after_download.stat.exists | default(false)) or
            (_hosts_before_download.stat.checksum | default('before-missing')) !=
            (_hosts_after_download.stat.checksum | default('after-missing')) or
            (_hosts_before_download.stat.mode | default('before-mode-missing')) !=
            (_hosts_after_download.stat.mode | default('after-mode-missing')) or
            (_hosts_before_download.stat.uid | default(-1)) !=
            (_hosts_after_download.stat.uid | default(-2)) or
            (_hosts_before_download.stat.gid | default(-1)) !=
            (_hosts_after_download.stat.gid | default(-2))
          block:
            - ansible.builtin.set_fact:
                _apply_error_msg: >-
                  Download phase did not restore /etc/hosts exactly; manual recovery is required
                  before any later apt operation. stderr excerpt:
                  {{ ((_download_stderr | trim)[:400])
                     if ((_download_stderr | trim | length) > 0)
                     else '(none)' }}.
                  Log: {{ _download_log_path }}
            - ansible.builtin.fail:
                msg: "{{ _apply_error_msg }}"

        - name: Record download output and statistics
          ansible.builtin.set_fact:
            _download_bytes: >-
              {{ (_download_raw.stdout | default('') |
                  regex_findall('(?m)^PROXMOX_PATCH_DOWNLOAD_BYTES=([0-9]+)$') |
                  last | default('0')) | int }}
            _download_seconds: >-
              {{ (_download_raw.stdout | default('') |
                  regex_findall('(?m)^PROXMOX_PATCH_DOWNLOAD_SECONDS=([0-9]+)$') |
                  last | default('0')) | int }}
            _download_cache_hit: >-
              {{ (_download_raw.stdout | default('') |
                  regex_findall('(?m)^PROXMOX_PATCH_CACHE_HIT=(true|false)$') |
                  last | default('false')) == 'true' }}

        - name: Abort when archive download fails
          when: (_download_raw.rc | default(1)) != 0
          block:
            - ansible.builtin.set_fact:
                _apply_error_msg: >-
                  apt-get -d dist-upgrade failed with rc={{ _download_raw.rc | default('unknown') }}.
                  stderr excerpt:
                  {{ ((_download_raw.stderr | default('') | trim)[:400])
                     if ((_download_raw.stderr | default('') | trim | length) > 0)
                     else '(none)' }}.
                  Persistent log: {{ _download_log_path }}
            - ansible.builtin.fail:
                msg: "{{ _apply_error_msg }}"

        - name: Publish local apt archives to same-day NAS cache
          ansible.builtin.command:
            argv:
              - /usr/bin/timeout
              - "--kill-after={{ proxmox_patch_apply_nas_timeout_kill_after | int }}s"
              - "{{ proxmox_patch_apply_nas_io_timeout | int }}s"
              - /usr/local/sbin/proxmox-patch-cache.sh
              - publish
              - /var/cache/apt/archives
              - "{{ _nas_cache_run_dir }}"
              - "{{ proxmox_patch_apply_nas_cache_dir }}"
          register: _nas_publish
          changed_when: >-
            (_nas_publish.rc | default(1)) == 0 and
            not ((_nas_publish.stdout | default('')) is search('copied=0'))
          failed_when: false
          when: _nas_cache_available | bool

        - name: Warn and continue when NAS publish fails
          ansible.builtin.debug:
            msg: >-
              [WARNING] NAS deb publish failed on {{ inventory_hostname }};
              continuing because the local archives are complete.
          when:
            - _nas_cache_available | bool
            - (_nas_publish.rc | default(0)) != 0

        - name: Record NAS publish warning
          ansible.builtin.set_fact:
            _nas_cache_warnings: "{{ _nas_cache_warnings + ['NAS publish failed; apply continued'] }}"
          when:
            - _nas_cache_available | bool
            - (_nas_publish.rc | default(0)) != 0

        - name: Prune old NAS date generations non-critically
          ansible.builtin.command:
            argv:
              - /usr/bin/timeout
              - "--kill-after={{ proxmox_patch_apply_nas_timeout_kill_after | int }}s"
              - "{{ proxmox_patch_apply_nas_io_timeout | int }}s"
              - /usr/local/sbin/proxmox-patch-cache.sh
              - prune
              - "{{ proxmox_patch_apply_nas_cache_dir }}"
              - "{{ proxmox_patch_apply_nas_cache_keep | string }}"
              - "{{ proxmox_patch_apply_nas_cache_dir }}"
          register: _nas_prune
          changed_when: >-
            (_nas_prune.rc | default(1)) == 0 and
            not ((_nas_prune.stdout | default('')) is search('removed=0'))
          failed_when: false
          when: _nas_cache_available | bool

        - name: Warn and continue when NAS prune fails
          ansible.builtin.debug:
            msg: "[WARNING] NAS cache prune failed; patch apply continues."
          when:
            - _nas_cache_available | bool
            - (_nas_prune.rc | default(0)) != 0

        - name: Record NAS prune warning
          ansible.builtin.set_fact:
            _nas_cache_warnings: "{{ _nas_cache_warnings + ['NAS prune failed; apply continued'] }}"
          when:
            - _nas_cache_available | bool
            - (_nas_prune.rc | default(0)) != 0

        - name: Set abort type for apply phase
          ansible.builtin.set_fact:
            _apply_abort_type: "apply_failed"

        - name: Apply downloaded patches with persistent log
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/proxmox-patch-apt-phase.sh
              - apply
              - "{{ _apply_log_path }}"
          register: _apply_raw
          changed_when: true
          failed_when: false

        - name: Record apply output and duration
          ansible.builtin.set_fact:
            _apply_stdout: "{{ _apply_raw.stdout | default('') }}"
            _apply_seconds: >-
              {{ (_apply_raw.stdout | default('') |
                  regex_findall('(?m)^PROXMOX_PATCH_APPLY_SECONDS=([0-9]+)$') |
                  last | default('0')) | int }}

        - name: Abort when package apply fails
          when: (_apply_raw.rc | default(1)) != 0
          block:
            - ansible.builtin.set_fact:
                _apply_error_msg: >-
                  apt-get dist-upgrade failed with rc={{ _apply_raw.rc | default('unknown') }}.
                  Persistent log: {{ _apply_log_path }}
            - ansible.builtin.fail:
                msg: "{{ _apply_error_msg }}"

        - name: Record successful apply phase
          ansible.builtin.set_fact:
            _apply_abort_type: "none"

    - name: Run post-apply collect
      ansible.builtin.command:
        cmd: /usr/local/sbin/proxmox-patch-apply-collect.sh
      register: _apply_collect_raw
      changed_when: false
      check_mode: false

    - name: Parse post-apply collect JSON
      ansible.builtin.set_fact:
        _apply_collect: "{{ _apply_collect_raw.stdout | from_json }}"

    - name: Record reboot-required state
      ansible.builtin.set_fact:
        _reboot_required_before: "{{ _apply_collect.reboot_required | bool }}"

    # =========================================================================
    # Phase 3: Reboot
    # =========================================================================

    - name: Set abort type for reboot phase
      ansible.builtin.set_fact:
        _apply_abort_type: "reboot_timeout"
      when: _reboot_required_before | bool

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: "{{ proxmox_patch_apply_reboot_timeout }}"
        connect_timeout: 10
        pre_reboot_delay: 5
        post_reboot_delay: 30
        msg: "Rebooting for Proxmox patch apply"
      when: (_reboot_required_before | bool) and not ansible_check_mode
      tags: [destructive]

    - name: Record reboot done
      ansible.builtin.set_fact:
        _apply_reboot_done: "{{ _reboot_required_before | bool }}"
        _apply_abort_type: "none"
      when: _reboot_required_before | bool

  rescue:
    - name: Capture failure info
      ansible.builtin.set_fact:
        _apply_failed: true
        _apply_error_msg: >-
          {{ _apply_error_msg if _apply_error_msg | length > 0
             else (ansible_failed_result.msg | default('Unknown error')) }}

  # ===========================================================================
  # Phase 4: Post-healthcheck + report + email (always runs)
  # ===========================================================================

  always:
    - name: Run post-healthcheck script
      ansible.builtin.command:
        cmd: /usr/local/sbin/proxmox-healthcheck.sh
      register: _post_hc_raw
      changed_when: false
      ignore_errors: true
      check_mode: false

    - name: Parse post-healthcheck output
      ansible.builtin.set_fact:
        _post_hc_json: "{{ _post_hc_raw.stdout | from_json }}"
      ignore_errors: true
      when: _post_hc_raw is succeeded and (_post_hc_raw.stdout | length) > 0

    - name: Determine post-healthcheck status
      ansible.builtin.set_fact:
        _post_hc_status: >-
          {%- if _post_hc_raw is failed or _post_hc_json is not defined -%}
          UNKNOWN
          {%- elif not (_post_hc_json.cluster.quorate == 'Yes') or
                  not (_post_hc_json.apt.check_ok | bool) or
                  not (_post_hc_json.services.pve_cluster == 'active') or
                  not (_post_hc_json.services.corosync == 'active') or
                  not (_post_hc_json.services.pvedaemon == 'active') -%}
          CRITICAL
          {%- else -%}
          OK
          {%- endif -%}
      ignore_errors: true

    # Retry when CRITICAL or UNKNOWN after reboot: services may still be starting up,
    # or the healthcheck script itself may have failed transiently (UNKNOWN).
    # Loop runs range(retry_count+1) iterations; early stopping is handled inside
    # retry_healthcheck_once.yml via a block guard (when: _post_hc_retry_status != 'OK').
    - name: Retry post-healthcheck if CRITICAL or UNKNOWN after reboot
      ansible.builtin.include_tasks: retry_healthcheck_once.yml
      loop: "{{ range(proxmox_patch_apply_hc_retry_count | int + 1) | list }}"
      loop_control:
        loop_var: _post_hc_retry_idx
        label: "attempt {{ _post_hc_retry_idx + 1 }} of {{ proxmox_patch_apply_hc_retry_count | int + 1 }}"
      when:
        - _post_hc_status in ['CRITICAL', 'UNKNOWN']
        - _apply_reboot_done | bool

    - name: Re-determine post-healthcheck status after retry
      ansible.builtin.set_fact:
        _post_hc_status: "{{ _post_hc_retry_status }}"
      when: _post_hc_status in ['CRITICAL', 'UNKNOWN'] and (_apply_reboot_done | bool)

    - name: Set notification subject and body
      ansible.builtin.set_fact:
        _notify_subject: >-
          {%- if _apply_abort_type == 'maintenance_required' -%}
          [ABORT] {{ inventory_hostname }}: 自動適用中止 - 更新内容が変化しました
          {%- elif _apply_abort_type in ['control_node', 'healthcheck', 'vms_not_evacuated', 'apt_update', 'apt_check', 'sim_failed', 'manual_not_confirmed'] -%}
          [ABORT] {{ inventory_hostname }}: 前提チェック失敗 ({{ _apply_abort_type }})
          {%- elif _apply_abort_type == 'download_failed' -%}
          [FAILED] {{ inventory_hostname }}: apt archive download 失敗
          {%- elif _apply_abort_type == 'apply_failed' -%}
          [FAILED] {{ inventory_hostname }}: apt-get dist-upgrade 失敗
          {%- elif _apply_abort_type == 'reboot_timeout' -%}
          [FAILED] {{ inventory_hostname }}: reboot 後の応答タイムアウト
          {%- elif _apply_failed | bool -%}
          [FAILED] {{ inventory_hostname }}: パッチ適用失敗
          {%- elif _post_hc_status != 'OK' -%}
          [WARNING] {{ inventory_hostname }}: パッチ適用完了 - post-healthcheck {{ _post_hc_status }}
          {%- else -%}
          [SUCCESS] {{ inventory_hostname }}: パッチ適用完了
          {%- endif -%}
        _notify_body: |
          Proxmox パッチ適用結果

          実行日時 : {{ _apply_run_ts }}
          対象ノード: {{ inventory_hostname }}
          結果      : {{ 'FAILED' if (_apply_failed | bool) else 'SUCCESS' }}

          =========================================
          Phase 1: 前提チェック
          =========================================
          pre-healthcheck: {{ _pre_hc_status }}
          {% if _apply_abort_type in ['control_node', 'healthcheck', 'vms_not_evacuated', 'manual_not_confirmed'] %}
          中止理由: {{ _apply_error_msg }}
          {% endif %}

          =========================================
          Phase 2: pre-apply dry-run
          =========================================
          {% if _predryrun %}
          apt_update_ok : {{ _predryrun.apt_update_ok | default('N/A') }}
          apt_check_ok  : {{ _predryrun.apt_check_ok | default('N/A') }}
          sim_ok        : {{ _predryrun.sim_ok | default('N/A') }}
          更新パッケージ数: {{ _sim_updates | length }}
          remove 数     : {{ _sim_removes | length }}
          {% else %}
          (未実施)
          {% endif %}
          {% if _apply_abort_type == 'maintenance_required' %}

          [ABORT] MAINTENANCE_REQUIRED 検出
          中止理由: {{ _apply_error_msg }}

          最新 dry-run から追加された更新候補:
          {% if _new_vs_dryrun | length > 0 %}
          {% for pkg in _new_vs_dryrun %}
            - {{ pkg }}
          {% endfor %}
          {% else %}
            (なし)
          {% endif %}

          最新 dry-run から変わらない更新候補:
          {% if _unchanged_vs_dryrun | length > 0 %}
          {% for pkg in _unchanged_vs_dryrun %}
            - {{ pkg }}
          {% endfor %}
          {% else %}
            (なし)
          {% endif %}

          対応方法: dry-run を再実行してください。
          {% endif %}
          {% if _apply_abort_type in ['apt_update', 'apt_check', 'sim_failed'] %}
          中止理由: {{ _apply_error_msg }}
          {% endif %}

          =========================================
          Phase 3: download
          =========================================
          {% if not (_apply_abort_type in ['control_node', 'healthcheck', 'vms_not_evacuated', 'apt_update', 'apt_check', 'sim_failed', 'maintenance_required', 'manual_not_confirmed']) %}
          download bytes  : {{ _download_bytes }}
          download seconds: {{ _download_seconds }}
          cache hit        : {{ _download_cache_hit }}
          mirror host      : {{ proxmox_patch_apply_mirror_host }}
          mirror address   : {{ _mirror_selected_address | default('') }}
          mirror RTT (ms)  : {{ _mirror_selected_rtt_ms | default('') }}
          download log     : {{ _download_log_path }}
          NAS cache        : {{ 'available' if (_nas_cache_available | bool) else 'fallback/direct' }}
          {% if _nas_cache_warnings | length > 0 %}
          NAS warnings     : {{ _nas_cache_warnings | join(' | ') }}
          {% endif %}
          {% if _apply_abort_type == 'download_failed' %}
          エラー: {{ _apply_error_msg }}
          stderr excerpt: {{ ((_download_stderr | trim)[:400]) if ((_download_stderr | trim | length) > 0) else '(none)' }}
          {% endif %}
          {% else %}
          (前提チェック失敗のため未実施)
          {% endif %}

          =========================================
          Phase 4: apply
          =========================================
          {% if not (_apply_abort_type in ['control_node', 'healthcheck', 'vms_not_evacuated', 'apt_update', 'apt_check', 'sim_failed', 'maintenance_required', 'manual_not_confirmed', 'download_failed']) %}
          適用パッケージ数: {{ _sim_updates | length }}
          apply seconds  : {{ _apply_seconds }}
          apply log      : {{ _apply_log_path }}
          reboot 実施   : {{ _apply_reboot_done }}
          reboot trigger: {{ _apply_collect.reboot_trigger | default('') }}
          {% if _apply_abort_type in ['apply_failed', 'reboot_timeout'] %}
          エラー: {{ _apply_error_msg }}
          {% endif %}
          {% else %}
          (前提チェック失敗のため未実施)
          {% endif %}

          =========================================
          Phase 5: post-healthcheck
          =========================================
          post-healthcheck: {{ _post_hc_status }}
        _notify_channel: "{{ 'alerts' if (_apply_abort_type != 'none' or _apply_failed | bool or _post_hc_status != 'OK') else 'patches' }}"
        _notify_status: >-
          {%- if _apply_abort_type != 'none' or _apply_failed | bool -%}
          error
          {%- elif _post_hc_status != 'OK' -%}
          warning
          {%- else -%}
          ok
          {%- endif -%}
      delegate_to: localhost
      become: false
      ignore_errors: true

    - name: Send Slack notification
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
      vars:
        slack_channel: "{{ _notify_channel }}"
        slack_status: "{{ _notify_status }}"
        slack_title: "{{ _notify_subject }}"
        slack_message: "{{ _notify_body }}"

    - name: Build and save final report
      ansible.builtin.copy:
        content: "{{ {
            'run_timestamp': _apply_run_ts,
            'target_node': inventory_hostname,
            'result': 'FAILED' if (_apply_failed | bool) else 'SUCCESS',
            'abort_type': _apply_abort_type,
            'error_msg': _apply_error_msg,
            'pre_healthcheck_status': _pre_hc_status,
            'updates': _sim_updates,
            'removes': _sim_removes,
            'download_bytes': _download_bytes,
            'download_seconds': _download_seconds,
            'cache_hit': _download_cache_hit,
            'download_stderr_excerpt': (_download_stderr | trim)[:1000],
            'download_log': _download_log_path,
            'mirror_host': proxmox_patch_apply_mirror_host,
            'mirror_address': _mirror_selected_address,
            'mirror_rtt_ms': _mirror_selected_rtt_ms,
            'nas_cache_available': _nas_cache_available,
            'nas_cache_warnings': _nas_cache_warnings,
            'apply_seconds': _apply_seconds,
            'apply_log': _apply_log_path,
            'apply_output': _apply_stdout | truncate(3000),
            'reboot_done': _apply_reboot_done,
            'reboot_trigger': _apply_collect.reboot_trigger | default(''),
            'running_kernel': _apply_collect.running_kernel | default(''),
            'post_healthcheck_status': _post_hc_status
          } | to_nice_json }}"
        dest: "{{ proxmox_patch_apply_report_dir }}/{{ _apply_run_ts }}_{{ inventory_hostname }}_apply.json"
      delegate_to: localhost
      become: false
      ignore_errors: true
      check_mode: false

    - name: Re-raise failure to mark play as failed
      ansible.builtin.fail:
        msg: "proxmox_patch_apply_node failed: {{ _apply_error_msg }}"
      when: _apply_failed | bool
