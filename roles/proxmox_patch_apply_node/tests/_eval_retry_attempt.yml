---
# Included with loop_var: _post_hc_retry_idx by test_retry_transitions.yml.
# Mirrors roles/proxmox_patch_apply_node/tasks/retry_healthcheck_once.yml
# verbatim, EXCEPT the `ansible.builtin.command` task that runs the real
# /usr/local/sbin/proxmox-healthcheck.sh is replaced with a set_fact that
# returns this scenario's canned per-attempt output (that absolute path
# cannot be safely faked without writing to real system paths -- see
# test_result's AC8b notes). Everything after the mock (parse, shared
# classify_critical.yml reuse, status determination) is byte-identical to
# the real file.

- block:
    - name: Reset facts for this retry attempt
      ansible.builtin.set_fact:
        _post_hc_retry_status: "CRITICAL"
        _post_hc_retry_json: {}

    # Real file has: "Wait before retry attempt" (ansible.builtin.pause).
    # Skipped here to keep the fixture fast; it has no branching logic.

    # Real file has: "Run healthcheck for retry attempt" (ansible.builtin.command
    # cmd: /usr/local/sbin/proxmox-healthcheck.sh, register: _post_hc_retry_raw).
    # Replaced with the scenario's canned attempt output.
    - name: Fake healthcheck command output for this retry attempt
      ansible.builtin.set_fact:
        _post_hc_retry_raw:
          failed: false
          stdout: "{{ scenario.attempts[_post_hc_retry_idx] | to_json }}"

    - name: Parse healthcheck JSON for retry
      ansible.builtin.set_fact:
        _post_hc_retry_json: "{{ _post_hc_retry_raw.stdout | from_json }}"
      ignore_errors: true
      when:
        - not (_post_hc_retry_raw.failed | default(false) | bool)
        - (_post_hc_retry_raw.stdout | default('') | length) > 0

    - name: Prepare retry healthcheck data for shared classification
      ansible.builtin.set_fact:
        proxmox_health: "{{ _post_hc_retry_json }}"
      when:
        - not (_post_hc_retry_raw.failed | default(false) | bool)
        - _post_hc_retry_json | length > 0

    - name: Classify retry healthcheck with the healthcheck role rule
      ansible.builtin.include_role:
        name: proxmox_healthcheck
        tasks_from: classify_critical.yml
      when:
        - not (_post_hc_retry_raw.failed | default(false) | bool)
        - _post_hc_retry_json | length > 0

    - name: Determine status for retry attempt
      ansible.builtin.set_fact:
        _post_hc_retry_status: >-
          {%- if (_post_hc_retry_raw.failed | default(false) | bool) or
                 not _post_hc_retry_json -%}
          CRITICAL
          {%- elif proxmox_criticals | default([]) | length > 0 -%}
          CRITICAL
          {%- else -%}
          OK
          {%- endif -%}
      ignore_errors: true
  when: _post_hc_retry_status != 'OK'
