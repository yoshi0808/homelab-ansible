---
# Shared by existing notification fixtures; expressions come from main.yml.
- name: Set scenario inputs
  ansible.builtin.set_fact:
    _post_hc_status: "{{ scenario.post_hc_status }}"
    _apply_kernel_cleanup: "{{ _apply_kernel_cleanup | default({'status': 'skipped', 'reason': 'fixture without reboot'}) }}"

- name: Run current production notification tasks
  ansible.builtin.include_tasks: _load_production_notify.yml

- name: Record notify scenario result
  ansible.builtin.set_fact:
    _notify_results: >-
      {{ (_notify_results | default([])) +
         [{'id': scenario.id, 'post_hc_status': scenario.post_hc_status,
           'notify_subject': _notify_subject, 'notify_status': _notify_status,
           'notify_body': _notify_body,
           'expect_status': scenario.expect_status,
           'expect_subject_prefix': scenario.expect_subject_prefix}] }}
