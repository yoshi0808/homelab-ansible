---
# 各対象ホストで実際の状態を採取する。**判定はしない** — 収集のみ。
# 判定・分類・通知は compare.yml(controller側)が行う
# (docs/ai/context/operations/healthcheck.md)。

- name: Select the checks that apply to this host
  ansible.builtin.set_fact:
    deployment_drift_check_my_files: "{{ deployment_drift_check_files | selectattr('hosts', 'contains', inventory_hostname) | list }}"
    deployment_drift_check_my_units: "{{ deployment_drift_check_units | selectattr('hosts', 'contains', inventory_hostname) | list }}"
    deployment_drift_check_my_keys: "{{ deployment_drift_check_forced_command_keys | selectattr('hosts', 'contains', inventory_hostname) | list }}"
    deployment_drift_check_my_report_dirs: "{{ deployment_drift_check_report_dirs | selectattr('hosts', 'contains', inventory_hostname) | list }}"
    deployment_drift_check_my_hosts_file: "{{ deployment_drift_check_hosts_file | selectattr('hosts', 'contains', inventory_hostname) | list }}"
    deployment_drift_check_my_paths: "{{ deployment_drift_check_paths | selectattr('hosts', 'contains', inventory_hostname) | list }}"
    deployment_drift_check_my_absent_paths: "{{ deployment_drift_check_absent_paths | selectattr('hosts', 'contains', inventory_hostname) | list }}"
    deployment_drift_check_my_dispatch_probes: "{{ deployment_drift_check_dispatch_probes | selectattr('hosts', 'contains', inventory_hostname) | list }}"

# --- ① 配備物のハッシュ ------------------------------------------------------
- name: Stat deployed files
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    checksum_algorithm: sha256
  loop: "{{ deployment_drift_check_my_files }}"
  loop_control:
    label: "{{ item.dest }}"
  register: deployment_drift_check_file_stat
  become: true

# --- ②③ unit / timer の状態 -------------------------------------------------
# systemctl show は unit 未配備でも rc=0 を返し、値が空になる。
# 「未配備」と「状態が違う」を区別できるよう、生の値のまま持ち帰る。
# noqa: command-instead-of-module — systemctl show の個別プロパティを取る
# module は無い(ansible.builtin.systemd は状態の要約しか返さない)。
# 「未配備」と「状態が違う」を区別するため LoadState を含む生の値が要る
- name: Collect unit states  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      systemctl show {{ item.name | quote }}
      --property=LoadState --property=UnitFileState --property=ActiveState
      --property=TimersCalendar
  loop: "{{ deployment_drift_check_my_units }}"
  loop_control:
    label: "{{ item.name }}"
  register: deployment_drift_check_unit_show
  changed_when: false
  failed_when: false
  become: true

# --- ⑥ forced command の構造 -------------------------------------------------
- name: Read recovery-exec authorized_keys
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ deployment_drift_check_my_keys }}"
  loop_control:
    label: "{{ item.path }}"
  register: deployment_drift_check_keys_raw
  failed_when: false
  become: true

# --- ④ reports/ 配下の所有権 --------------------------------------------------
- name: Collect ownership of directories directly under the reports root
  ansible.builtin.command:
    cmd: >-
      find {{ item.path | quote }} -mindepth 1 -maxdepth 1 -type d
      -printf '%f\t%u\t%g\n'
  loop: "{{ deployment_drift_check_my_report_dirs }}"
  loop_control:
    label: "{{ item.path }}"
  register: deployment_drift_check_report_owner
  changed_when: false
  failed_when: false
  become: true

# --- ⑤ /etc/hosts の内容 ------------------------------------------------------
- name: Read hosts file
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ deployment_drift_check_my_hosts_file }}"
  loop_control:
    label: "{{ item.path }}"
  register: deployment_drift_check_hosts_raw
  failed_when: false
  become: true

# --- operator_request_channel案件(2026-08-08): 新設3クラス ------------------

# ⑧ spool/event/audit領域のowner/group/mode
- name: Stat paths for owner/group/mode drift
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ deployment_drift_check_my_paths }}"
  loop_control:
    label: "{{ item.path }}"
  register: deployment_drift_check_path_stat
  become: true

# ⑨ /etc/sudoers.d/ 配下の不在。0750 root:root のためtraverseにrootが要る
# -- このファイル内でbecome: trueを使う唯一のcollect task(plan §3.3)。
# noqa: command-instead-of-module — 対象ディレクトリ直下のfilenameだけを
# 列挙するmoduleが無い(findモジュールはbecomeと`recurse: false`の組合せで
# 同等のことはできるが、この用途には直下filenameの一覧で十分でcommandの
# ほうが単純)。
- name: List filenames directly under each sudoers.d-style directory  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      find {{ item.dir | quote }} -mindepth 1 -maxdepth 1 -type f -printf '%f\n'
  loop: "{{ deployment_drift_check_my_absent_paths }}"
  loop_control:
    label: "{{ item.dir }}"
  register: deployment_drift_check_sudoers_listing
  changed_when: false
  failed_when: false
  become: true

# ⑩ dispatcherのallowlist外拒否probe。読み取りのみで、状態を変える
# commandは一切与えない(probe_commandは常にdenyされる語彙)。
# noqa: command-instead-of-module — dispatcher scriptを直接起動するのに
# 対応するmoduleは無い。
- name: Probe the dispatcher with disallowed input (expect non-zero exit)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "{{ item.dispatch_path }}"
  environment:
    SSH_ORIGINAL_COMMAND: "{{ item.probe_command }}"
  loop: "{{ deployment_drift_check_my_dispatch_probes }}"
  loop_control:
    label: "{{ item.probe_command }}"
  register: deployment_drift_check_dispatch_probe_result
  changed_when: false
  failed_when: false
  become: false

- name: Publish collected state for the controller-side comparison
  ansible.builtin.set_fact:
    deployment_drift_check_collected:
      files: "{{ deployment_drift_check_file_stat.results | default([]) }}"
      units: "{{ deployment_drift_check_unit_show.results | default([]) }}"
      keys: "{{ deployment_drift_check_keys_raw.results | default([]) }}"
      report_dirs: "{{ deployment_drift_check_report_owner.results | default([]) }}"
      hosts_file: "{{ deployment_drift_check_hosts_raw.results | default([]) }}"
      paths: "{{ deployment_drift_check_path_stat.results | default([]) }}"
      absent_paths: "{{ deployment_drift_check_sudoers_listing.results | default([]) }}"
      dispatch_probes: "{{ deployment_drift_check_dispatch_probe_result.results | default([]) }}"
