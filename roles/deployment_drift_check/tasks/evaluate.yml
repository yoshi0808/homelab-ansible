---
# 収集した実際値を、controller が repo から出した期待値と突き合わせる。
# ホストごとに自分の分だけを評価する(全ホスト分をまとめて回すより式が単純になる)。
#
# finding の型: { category, item, expected, actual, detail, playbook, run_host }
# playbook: そのfindingの状態を復元するplaybookの相対パス。持たないもの
# (カタログのエントリにplaybookが無い、またはカタログ構造自体がplaybookを
# 持たない report_dirs/hosts_file)は空文字列。report.yml はこれが空のとき
# 「直し方」行を出さない(R1-a)。
# run_host: `-l` に渡すべきホスト。カタログのエントリが run_host を持てば
# それを使い(delegate_toで配布するエントリ、R9)、持たなければfinding自身の
# host(= このtaskを実行しているinventory_hostname)を使う。playbookが空の
# findingでもrun_hostは埋める(スキーマを揃えるだけで、report.yml側では
# playbookが空のとき参照されない)。
#
# pve_unreachable_handling (2026-08-16, R4): 以下8本の "Build findings for X"
# は collect.yml が置く `deployment_drift_check_reachable` が false の
# ホストではすべてskipする。到達不能hostでは collect.yml の
# stat/command/slurpが個々にunreachable扱いでignoreされるが、その
# register結果は `r.content is not defined` / `r.stat.exists|default(false)
# == false` のような「読み取り失敗」判定と区別が付かない形のまま残る
# (decoy実測、implement記録) — このためfinding生成そのものを
# host単位でスキップし、到達不能を「finding 0件」として扱う(R4)。
# 到達不能hostでこの8本がskipされても "Combine findings for this host" は
# 各変数に `| default([])` を通すため安全に空へたたむ。
- name: Build findings for deployed files
  ansible.builtin.set_fact:
    deployment_drift_check_findings_files: >-
      {%- set out = [] -%}
      {%- for r in deployment_drift_check_file_stat.results | default([]) -%}
        {%- set want = deployment_drift_check_expected_hashes[r.item.src] | default('') -%}
        {%- if not r.stat.exists | default(false) -%}
          {%- set _ = out.append({'category': 'file', 'item': r.item.dest,
                                  'expected': 'present (' ~ r.item.src ~ ')',
                                  'actual': 'missing',
                                  'detail': '配備物が存在しない',
                                  'playbook': r.item.playbook | default(''),
                                  'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
        {%- elif want == '' -%}
          {%- set _ = out.append({'category': 'file', 'item': r.item.dest,
                                  'expected': 'repo側のハッシュ',
                                  'actual': 'repo側のsrcが読めない',
                                  'detail': r.item.src ~ ' がcontroller上に無い',
                                  'playbook': r.item.playbook | default(''),
                                  'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
        {%- elif r.stat.checksum != want -%}
          {%- set _ = out.append({'category': 'file', 'item': r.item.dest,
                                  'expected': want,
                                  'actual': r.stat.checksum,
                                  'detail': 'repo(' ~ r.item.src ~ ')と内容が異なる',
                                  'playbook': r.item.playbook | default(''),
                                  'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: deployment_drift_check_reachable

- name: Build findings for systemd units
  ansible.builtin.set_fact:
    deployment_drift_check_findings_units: >-
      {%- set out = [] -%}
      {%- for r in deployment_drift_check_unit_show.results | default([]) -%}
        {%- set kv = {} -%}
        {%- for line in (r.stdout | default('')).splitlines() -%}
          {%- set p = line.split('=', 1) -%}
          {%- if p | length == 2 -%}{%- set _ = kv.update({p[0]: p[1]}) -%}{%- endif -%}
        {%- endfor -%}
        {%- if kv.get('LoadState', '') != 'loaded' -%}
          {%- set _ = out.append({'category': 'unit', 'item': r.item.name,
                                  'expected': 'loaded',
                                  'actual': kv.get('LoadState', '(取得できず)'),
                                  'detail': 'unitが配備されていない可能性(setup playbookの流し忘れ)',
                                  'playbook': r.item.playbook | default(''),
                                  'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
        {%- else -%}
          {%- if kv.get('UnitFileState', '') != r.item.enabled -%}
            {%- set _ = out.append({'category': 'unit', 'item': r.item.name,
                                    'expected': r.item.enabled,
                                    'actual': kv.get('UnitFileState', ''),
                                    'detail': 'enable状態が期待と異なる',
                                    'playbook': r.item.playbook | default(''),
                                    'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
          {%- endif -%}
          {%- if kv.get('ActiveState', '') != r.item.active -%}
            {%- set _ = out.append({'category': 'unit', 'item': r.item.name,
                                    'expected': r.item.active,
                                    'actual': kv.get('ActiveState', ''),
                                    'detail': '稼働状態が期待と異なる',
                                    'playbook': r.item.playbook | default(''),
                                    'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: deployment_drift_check_reachable

- name: Build findings for forced-command keys
  ansible.builtin.set_fact:
    deployment_drift_check_findings_keys: >-
      {%- set out = [] -%}
      {%- for r in deployment_drift_check_keys_raw.results | default([]) -%}
        {%- if r.content is not defined -%}
          {%- set _ = out.append({'category': 'forced_command', 'item': r.item.path,
                                  'expected': 'readable',
                                  'actual': 'read failed',
                                  'detail': 'authorized_keysが読めない(未配備か権限)',
                                  'playbook': r.item.playbook | default(''),
                                  'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
        {%- else -%}
          {%- set lines = (r.content | b64decode).splitlines()
                          | map('trim') | reject('equalto', '') | list -%}
          {%- set bad = lines | reject('match', '^command=') | list -%}
          {%- if bad | length > 0 -%}
            {%- set _ = out.append({'category': 'forced_command', 'item': r.item.path,
                                    'expected': '全エントリが command= で始まる',
                                    'actual': bad | length | string ~ '件が forced command なし',
                                    'detail': 'forced commandの無い鍵は無制限の実行を許す',
                                    'playbook': r.item.playbook | default(''),
                                    'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
          {%- endif -%}
          {%- if lines | length != r.item.entries -%}
            {%- set _ = out.append({'category': 'forced_command', 'item': r.item.path,
                                    'expected': r.item.entries | string ~ ' entries',
                                    'actual': lines | length | string ~ ' entries',
                                    'detail': 'エントリ数が期待と異なる',
                                    'playbook': r.item.playbook | default(''),
                                    'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: deployment_drift_check_reachable

- name: Build findings for report directory ownership
  ansible.builtin.set_fact:
    deployment_drift_check_findings_reports: >-
      {%- set out = [] -%}
      {%- for r in deployment_drift_check_report_owner.results | default([]) -%}
        {%- set users = [] -%}
        {%- for line in (r.stdout | default('')).splitlines() -%}
          {%- set cols = line.split('\t') -%}
          {%- if cols | length >= 2 -%}{%- set _ = users.append(cols[1]) -%}{%- endif -%}
        {%- endfor -%}
        {%- set uniq = users | unique | list -%}
        {%- if uniq | length > 1 -%}
          {%- set _ = out.append({'category': 'ownership', 'item': r.item.path,
                                  'expected': '直下ディレクトリの所有者が一様',
                                  'actual': uniq | join(', '),
                                  'detail': '所有者が混在している。書き込みに失敗する経路がありうる',
                                  'playbook': '', 'run_host': inventory_hostname}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: deployment_drift_check_reachable

- name: Build findings for the hosts file
  ansible.builtin.set_fact:
    deployment_drift_check_findings_hostsfile: >-
      {%- set out = [] -%}
      {%- for r in deployment_drift_check_hosts_raw.results | default([]) -%}
        {%- if r.content is not defined -%}
          {%- set _ = out.append({'category': 'hosts_file', 'item': r.item.path,
                                  'expected': 'readable', 'actual': 'read failed',
                                  'detail': '', 'playbook': '', 'run_host': inventory_hostname}) -%}
        {%- else -%}
          {%- set body = r.content | b64decode -%}
          {%- set want = [] -%}
          {%- for g in r.item.require_groups -%}
            {%- for h in groups[g] | default([]) -%}
              {%- set _ = want.append(hostvars[h].ansible_host | default(h)) -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- set missing = want | unique | reject('in', body) | list -%}
          {%- if missing | length > 0 -%}
            {%- set _ = out.append({'category': 'hosts_file', 'item': r.item.path,
                                    'expected': 'inventoryの全ホスト名を含む',
                                    'actual': missing | join(', ') ~ ' が無い',
                                    'detail': 'sophos-fw停止中はDNSが引けないため、ここに無い名前は障害時に解決できない',
                                    'playbook': '', 'run_host': inventory_hostname}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: deployment_drift_check_reachable

# --- operator_request_channel案件(2026-08-08): 新設3クラス ------------------

- name: Build findings for path owner/group/mode
  ansible.builtin.set_fact:
    deployment_drift_check_findings_paths: >-
      {%- set out = [] -%}
      {%- for r in deployment_drift_check_path_stat.results | default([]) -%}
        {%- if not (r.stat.exists | default(false)) -%}
          {%- set _ = out.append({'category': 'path_permissions', 'item': r.item.path,
                                  'expected': 'present', 'actual': 'missing',
                                  'detail': 'パスが存在しない',
                                  'playbook': r.item.playbook | default(''),
                                  'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
        {%- else -%}
          {%- if (r.stat.pw_name | default('')) != r.item.owner -%}
            {%- set _ = out.append({'category': 'path_permissions', 'item': r.item.path,
                                    'expected': r.item.owner, 'actual': r.stat.pw_name | default('(不明)'),
                                    'detail': '所有者が期待と異なる',
                                    'playbook': r.item.playbook | default(''),
                                    'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
          {%- endif -%}
          {%- if (r.stat.gr_name | default('')) != r.item.group -%}
            {%- set _ = out.append({'category': 'path_permissions', 'item': r.item.path,
                                    'expected': r.item.group, 'actual': r.stat.gr_name | default('(不明)'),
                                    'detail': 'グループが期待と異なる',
                                    'playbook': r.item.playbook | default(''),
                                    'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
          {%- endif -%}
          {%- if (r.stat.mode | default('')) != r.item.mode -%}
            {%- set _ = out.append({'category': 'path_permissions', 'item': r.item.path,
                                    'expected': r.item.mode, 'actual': r.stat.mode | default('(不明)'),
                                    'detail': 'モードが期待と異なる',
                                    'playbook': r.item.playbook | default(''),
                                    'run_host': r.item.run_host | default(inventory_hostname, true)}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: deployment_drift_check_reachable

- name: Build findings for sudoers.d absence
  ansible.builtin.set_fact:
    deployment_drift_check_findings_sudoers: >-
      {%- set out = [] -%}
      {%- for r in deployment_drift_check_sudoers_listing.results | default([]) -%}
        {%- set names = (r.stdout | default('')).splitlines() | select | list -%}
        {%- set hits = [] -%}
        {%- for n in names -%}
          {%- for sub in r.item.forbidden_substrings -%}
            {%- if (sub | lower) in (n | lower) and n not in hits -%}
              {%- set _ = hits.append(n) -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
        {%- if hits | length > 0 -%}
          {%- set _ = out.append({'category': 'sudoers_absent', 'item': r.item.dir,
                                  'expected': '該当ファイルなし',
                                  'actual': hits | join(', '),
                                  'detail': 'dev-investigate/channel関連と思われるsudoersファイルが存在する。手動調査が必要(R-1の受容根拠が崩れている可能性)',
                                  'playbook': '', 'run_host': inventory_hostname}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: deployment_drift_check_reachable

- name: Build findings for dispatcher allowlist-out-of-band probes
  ansible.builtin.set_fact:
    deployment_drift_check_findings_dispatch_probes: >-
      {%- set out = [] -%}
      {%- for r in deployment_drift_check_dispatch_probe_result.results | default([]) -%}
        {%- if (r.rc | default(1)) == 0 -%}
          {%- set _ = out.append({'category': 'dispatch_allowlist', 'item': r.item.probe_command,
                                  'expected': 'non-zero exit (denied)',
                                  'actual': 'exit 0',
                                  'detail': 'dispatcherが許可されていない入力を受け付けている可能性',
                                  'playbook': '', 'run_host': inventory_hostname}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: deployment_drift_check_reachable

# pve_unreachable_handling (2026-08-16, R4): 到達不能hostでは上の8本が
# すべてskipされ、各 deployment_drift_check_findings_* は未定義のまま
# なので、`| default([])` を通さないと "'...' is undefined" で
# ここが落ちる(decoy実測、implement記録)。到達不能hostは
# 結果として `deployment_drift_check_findings: []` になる。
- name: Combine findings for this host
  ansible.builtin.set_fact:
    deployment_drift_check_findings: >-
      {{ (deployment_drift_check_findings_files | default([])) + (deployment_drift_check_findings_units | default([]))
         + (deployment_drift_check_findings_keys | default([])) + (deployment_drift_check_findings_reports | default([]))
         + (deployment_drift_check_findings_hostsfile | default([])) + (deployment_drift_check_findings_paths | default([]))
         + (deployment_drift_check_findings_sudoers | default([])) + (deployment_drift_check_findings_dispatch_probes | default([])) }}
    deployment_drift_check_checked_counts:
      files: "{{ deployment_drift_check_my_files | length }}"
      units: "{{ deployment_drift_check_my_units | length }}"
      keys: "{{ deployment_drift_check_my_keys | length }}"
      report_dirs: "{{ deployment_drift_check_my_report_dirs | length }}"
      hosts_file: "{{ deployment_drift_check_my_hosts_file | length }}"
      paths: "{{ deployment_drift_check_my_paths | length }}"
      absent_paths: "{{ deployment_drift_check_my_absent_paths | length }}"
      dispatch_probes: "{{ deployment_drift_check_my_dispatch_probes | length }}"
