---
# prometheus_update_check always collects current/latest versions. dry_run is
# the primary mode selector; ansible_check_mode remains a second destructive
# gate.
#
# 2026-07-31 retraction (R4, docs/ai/reviews/check_mode_semantics/
# 2026-07-31_001_requirement.md): "Slack is an explicit check-mode
# notification exception" is no longer this role's design. That exception
# was implemented by wrapping the notify.yml include in a check_mode: false
# block (Phase 4, below); the block has been removed. notify.yml itself now
# refuses to send whenever ansible_check_mode is true (R3) and shows the
# full text via debug instead, for every caller uniformly — this role no
# longer opts out of that. The original design record is
# docs/ai/reviews/prometheus_update_check/2026-07-19_015_implement.md; that
# record is now superseded on this one point.

- name: Require an explicit Prometheus dry-run mode
  ansible.builtin.assert:
    that: dry_run is defined
    fail_msg: >-
      dry_run must be specified explicitly: -e dry_run=true for inspection,
      or -e dry_run=false for a deliberate upgrade/rollback apply. Omitting
      it is fail-closed to prevent an unintended automatic upgrade.
    quiet: true

- name: Validate Prometheus update-check inputs
  ansible.builtin.assert:
    that:
      - prometheus_update_check_target_version | length == 0 or prometheus_update_check_target_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - prometheus_update_check_rollback_to | length == 0 or prometheus_update_check_rollback_to is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - (dry_run | string | lower) in ['true', 'false']
      - prometheus_update_check_rollback | bool or prometheus_update_check_rollback_to | length == 0
      - prometheus_update_check_arch == 'linux-amd64'
      - prometheus_update_check_install_dir is match('^/opt/[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?$')
      - prometheus_update_check_binary == prometheus_update_check_install_dir + '/prometheus'
      - prometheus_update_check_backup_dir == prometheus_update_check_install_dir + '/backups'
      - prometheus_update_check_backup_keep | int >= 1
      - prometheus_update_check_backup_keep | int <= 20
      - prometheus_update_check_service is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*$')
      - prometheus_update_check_download_base == 'https://github.com/' + prometheus_update_check_repo + '/releases/download'
      - prometheus_update_check_release_page_base == 'https://github.com/' + prometheus_update_check_repo + '/releases/tag'
      - prometheus_update_check_health_url is match('^http://localhost:[0-9]+/-/healthy$')
      - prometheus_update_check_lock_dir == '/run/lock/prometheus_update_check.lock'
    fail_msg: "Invalid Prometheus target, rollback, path, service, or download configuration."
    quiet: true

- name: Initialize Prometheus update operation facts
  ansible.builtin.set_fact:
    prometheus_update_check_run_timestamp: "{{ lookup('pipe', 'TZ=Asia/Tokyo date +%Y%m%dT%H%M%S') }}"
    prometheus_update_check_status: collection_failed
    prometheus_update_check_error: ""
    prometheus_update_check_failure_step: ""
    prometheus_update_check_result_version: ""
    prometheus_update_check_automatic_rollback_state: not_started
    prometheus_update_check_manual_recovery_state: not_started
    prometheus_update_check_selected_backup: {}
    prometheus_update_check_backup_candidates: []

# ---------------------------------------------------------------------------
# Phase 1: collect the currently installed version
# ---------------------------------------------------------------------------
# check_mode: false below is unrelated to notify (R5 review,
# docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md):
# `command` has no native check_mode support and would auto-skip under
# --check, but this read-only version read must run for real so Status
# classification below is accurate under --check too.
- name: Collect installed Prometheus version
  ansible.builtin.command:
    argv:
      - "{{ prometheus_update_check_binary }}"
      - --version
  register: prometheus_update_check_current_raw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Parse installed Prometheus version
  ansible.builtin.set_fact:
    prometheus_update_check_current_version: >-
      {{ (prometheus_update_check_current_raw.stdout | default('') |
          regex_findall('(?m)^prometheus, version ([0-9]+[.][0-9]+[.][0-9]+)(?:[ ]|$)') |
          first | default('')) }}

# ---------------------------------------------------------------------------
# Phase 2: collect the latest stable GitHub release
# ---------------------------------------------------------------------------
# check_mode: false below is unrelated to notify, same reason as the
# version read above: `uri` would auto-skip under --check without it.
- name: Collect latest stable Prometheus release
  ansible.builtin.uri:
    url: "{{ prometheus_update_check_api_url }}"
    method: GET
    return_content: true
    timeout: "{{ prometheus_update_check_api_timeout }}"
  register: prometheus_update_check_latest_raw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Parse latest Prometheus version
  ansible.builtin.set_fact:
    prometheus_update_check_latest_version: >-
      {{ ((prometheus_update_check_latest_raw.json | default({})).tag_name | default('') | string)
         | regex_replace('^v', '') }}

# ---------------------------------------------------------------------------
# Phase 3/3.5: classify collection and select the requested target
# ---------------------------------------------------------------------------
- name: Judge Prometheus version collection status
  ansible.builtin.set_fact:
    prometheus_update_check_collected: >-
      {{ (prometheus_update_check_current_raw.rc | default(1) | int) == 0
         and (prometheus_update_check_latest_raw.status | default(-1) | int) == 200
         and (prometheus_update_check_current_version is match('^[0-9]+[.][0-9]+[.][0-9]+$'))
         and (prometheus_update_check_latest_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')) }}

- name: Select Prometheus target version
  ansible.builtin.set_fact:
    prometheus_update_check_target_pinned: "{{ prometheus_update_check_target_version | length > 0 }}"
    prometheus_update_check_effective_target_version: >-
      {{ prometheus_update_check_target_version
         if (prometheus_update_check_target_version | length > 0)
         else prometheus_update_check_latest_version }}

- name: Judge whether a Prometheus upgrade is wanted
  ansible.builtin.set_fact:
    prometheus_update_check_update_available: >-
      {{ (prometheus_update_check_latest_version is version(prometheus_update_check_current_version, '>'))
         if (prometheus_update_check_collected | bool) else false }}
    prometheus_update_check_upgrade_wanted: >-
      {{ (prometheus_update_check_collected | bool)
         and ((prometheus_update_check_effective_target_version != prometheus_update_check_current_version)
              if (prometheus_update_check_target_pinned | bool)
              else (prometheus_update_check_latest_version is version(prometheus_update_check_current_version, '>'))) }}

- name: Record normal-mode pre-apply status
  ansible.builtin.set_fact:
    prometheus_update_check_status: >-
      {{ 'collection_failed' if not (prometheus_update_check_collected | bool)
         else 'update_available' if (prometheus_update_check_upgrade_wanted | bool)
         else 'up_to_date' }}
    prometheus_update_check_result_version: "{{ prometheus_update_check_current_version }}"
  when: not (prometheus_update_check_rollback | bool)

# ---------------------------------------------------------------------------
# Phase M/R discovery: rollback target selection is read-only and also runs
# under --check so the exact backup can be reported without restoring it.
# ---------------------------------------------------------------------------
- name: Discover and select Prometheus rollback backup
  ansible.builtin.include_tasks: discover_backups.yml
  when:
    - prometheus_update_check_rollback | bool
    - (prometheus_update_check_current_raw.rc | default(1) | int) == 0
    - prometheus_update_check_current_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')

- name: Record Prometheus rollback target for explicit dry-run mode
  ansible.builtin.set_fact:
    prometheus_update_check_status: rollback_available
  when:
    - prometheus_update_check_rollback | bool
    - dry_run | bool
    - prometheus_update_check_selected_backup.path | default('') | length > 0

- name: Reject manual rollback when current Prometheus version is unavailable
  ansible.builtin.set_fact:
    prometheus_update_check_status: rollback_failed
    prometheus_update_check_failure_step: current_version_collection
    prometheus_update_check_error: >-
      Manual rollback requires a successfully collected current Prometheus version;
      recovery from an unreadable current binary is outside this role's scope.
    prometheus_update_check_result_version: "{{ prometheus_update_check_current_version | default('') }}"
  when:
    - prometheus_update_check_rollback | bool
    - (prometheus_update_check_current_raw.rc | default(1) | int) != 0
      or not (prometheus_update_check_current_version is match('^[0-9]+[.][0-9]+[.][0-9]+$'))

- name: Show selected rollback target
  ansible.builtin.debug:
    msg: >-
      Prometheus rollback target{{ ' (not executed in dry-run mode)' if
      ((dry_run | bool) or ansible_check_mode) else '' }}:
      {{ prometheus_update_check_current_version | default('?', true) }} ->
      {{ prometheus_update_check_selected_backup.version | default('?') }}
      ({{ prometheus_update_check_selected_backup.path | default('backup unavailable') }})
  when: prometheus_update_check_rollback | bool

# ---------------------------------------------------------------------------
# Phase U: real upgrade. dry_run is the primary gate and --check is the
# independent secondary safety gate.
# ---------------------------------------------------------------------------
- name: Upgrade Prometheus with automatic rollback
  when:
    - not (prometheus_update_check_rollback | bool)
    - not (dry_run | bool)
    - not ansible_check_mode
    - prometheus_update_check_upgrade_wanted | bool
  tags: [destructive]
  block:
    - name: Run guarded Prometheus upgrade
      ansible.builtin.include_tasks: upgrade.yml

# ---------------------------------------------------------------------------
# Phase R: manual rollback. Discovery remains active in both dry-run layers;
# restore/restart require dry_run=false and native check mode off.
# ---------------------------------------------------------------------------
- name: Roll back Prometheus from a selected backup
  when:
    - prometheus_update_check_rollback | bool
    - not (dry_run | bool)
    - not ansible_check_mode
    - prometheus_update_check_selected_backup.path | default('') | length > 0
  tags: [destructive]
  block:
    - name: Run guarded manual Prometheus rollback
      ansible.builtin.include_tasks: manual_rollback.yml

- name: Print Prometheus update operation summary
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      dry_run: "{{ dry_run | bool }}"
      status: "{{ prometheus_update_check_status }}"
      current: "{{ prometheus_update_check_current_version | default('') }}"
      target: "{{ prometheus_update_check_effective_target_version | default('') }}"
      result: "{{ prometheus_update_check_result_version | default('') }}"
      error: "{{ prometheus_update_check_error | default('') }}"

# ---------------------------------------------------------------------------
# Phase 4: notification. 2026-07-31 retraction (R4/R5, see header and
# docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md): this
# block previously carried check_mode: false specifically to force the
# notify.yml include to send for real under --check ("Slack is the
# intentional check-mode exception"). That check_mode: false has been
# removed — it existed only for that purpose, nothing else in this block
# needs real execution. notify.yml now decides uniformly via
# ansible_check_mode (R3): it shows the full text via debug under --check
# instead of sending.
# ---------------------------------------------------------------------------
- name: Send Prometheus update operation notification
  when: prometheus_update_check_status in [
          'update_available', 'collection_failed', 'upgraded', 'upgrade_failed',
          'rollback_available', 'rolled_back', 'rollback_failed',
          'lock_release_failed']
  block:
    - name: Build and send Prometheus Slack notification
      ansible.builtin.include_tasks: notify.yml

- name: Fail the play after notifying about an apply or rollback failure
  ansible.builtin.fail:
    msg: >-
      prometheus_update_check {{ prometheus_update_check_status }}:
      {{ prometheus_update_check_error | default('unknown failure', true) }}
  when: prometheus_update_check_status in [
          'upgrade_failed', 'rollback_failed', 'lock_release_failed']
