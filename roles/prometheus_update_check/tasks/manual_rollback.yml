---
- name: Execute manual Prometheus rollback transaction
  become: true
  block:
    - name: Initialize manual Prometheus rollback facts
      ansible.builtin.set_fact:
        prometheus_update_check_rollback_step: initialize
        prometheus_update_check_manual_restore_started: false
        prometheus_update_check_manual_current_backup_ready: false
        prometheus_update_check_manual_generation_created: false
        prometheus_update_check_manual_lock_acquired: false
        prometheus_update_check_manual_current_backup_path: >-
          {{ prometheus_update_check_backup_dir + '/'
             + prometheus_update_check_current_version
             + '-' + prometheus_update_check_run_timestamp }}

    - name: Acquire exclusive Prometheus transaction lock
      ansible.builtin.command:
        argv:
          - /usr/bin/mkdir
          - --mode=0700
          - --
          - "{{ prometheus_update_check_lock_dir }}"
      register: prometheus_update_check_manual_lock_raw
      changed_when: (prometheus_update_check_manual_lock_raw.rc | int) == 0
      failed_when: false

    - name: Record Prometheus transaction lock ownership
      ansible.builtin.set_fact:
        prometheus_update_check_manual_lock_acquired: >-
          {{ (prometheus_update_check_manual_lock_raw.rc | int) == 0 }}

    - name: Require exclusive Prometheus transaction lock
      ansible.builtin.assert:
        that:
          - prometheus_update_check_manual_lock_acquired | bool
        fail_msg: >-
          Another Prometheus upgrade or rollback transaction holds
          {{ prometheus_update_check_lock_dir }}; refusing concurrent mutation.

    - name: Resolve Prometheus install directory before manual rollback
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - -m
          - --
          - "{{ prometheus_update_check_install_dir }}"
      register: prometheus_update_check_manual_install_canonical
      changed_when: false

    - name: Resolve Prometheus backup root before manual rollback
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - -m
          - --
          - "{{ prometheus_update_check_backup_dir }}"
      register: prometheus_update_check_manual_backup_canonical
      changed_when: false

    - name: Resolve selected Prometheus backup before manual rollback
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - -m
          - --
          - "{{ prometheus_update_check_selected_backup.path }}"
      register: prometheus_update_check_manual_selected_canonical
      changed_when: false

    - name: Inspect Prometheus install directory before manual rollback
      ansible.builtin.stat:
        path: "{{ prometheus_update_check_install_dir }}"
        follow: false
      register: prometheus_update_check_manual_install_dir_stat

    - name: Inspect Prometheus backup root before manual rollback
      ansible.builtin.stat:
        path: "{{ prometheus_update_check_backup_dir }}"
        follow: false
      register: prometheus_update_check_manual_backup_dir_stat

    - name: Inspect selected Prometheus backup directory before manual rollback
      ansible.builtin.stat:
        path: "{{ prometheus_update_check_selected_backup.path }}"
        follow: false
      register: prometheus_update_check_manual_selected_dir_stat

    - name: Reinspect selected Prometheus backup binaries before restore
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        get_checksum: true
        follow: false
      loop:
        - "{{ prometheus_update_check_selected_backup.path }}/prometheus"
        - "{{ prometheus_update_check_selected_backup.path }}/promtool"
      register: prometheus_update_check_manual_selected_binary_stats

    - name: Validate canonical Prometheus rollback boundaries
      ansible.builtin.assert:
        that:
          - (prometheus_update_check_manual_install_canonical.stdout | trim) == prometheus_update_check_install_dir
          - prometheus_update_check_manual_install_dir_stat.stat.isdir | default(false)
          - not (prometheus_update_check_manual_install_dir_stat.stat.islnk | default(false))
          - (prometheus_update_check_manual_backup_canonical.stdout | trim) == prometheus_update_check_backup_dir
          - prometheus_update_check_manual_backup_dir_stat.stat.isdir | default(false)
          - not (prometheus_update_check_manual_backup_dir_stat.stat.islnk | default(false))
          - (prometheus_update_check_manual_selected_canonical.stdout | trim) == prometheus_update_check_selected_backup.path
          - prometheus_update_check_manual_selected_backup_parent == prometheus_update_check_backup_dir
          - prometheus_update_check_manual_selected_dir_stat.stat.isdir | default(false)
          - not (prometheus_update_check_manual_selected_dir_stat.stat.islnk | default(false))
          - prometheus_update_check_manual_selected_binary_stats.results[0].stat.isreg | default(false)
          - not (prometheus_update_check_manual_selected_binary_stats.results[0].stat.islnk | default(false))
          - prometheus_update_check_manual_selected_binary_stats.results[1].stat.isreg | default(false)
          - not (prometheus_update_check_manual_selected_binary_stats.results[1].stat.islnk | default(false))
        fail_msg: "Prometheus install/backup directory is non-canonical, a symlink, or unsafe."
      vars:
        prometheus_update_check_manual_selected_backup_parent: >-
          {{ prometheus_update_check_selected_backup.path | dirname }}

    - name: Inspect current Prometheus binary before manual rollback
      ansible.builtin.stat:
        path: "{{ prometheus_update_check_binary }}"
        follow: false
      register: prometheus_update_check_manual_current_prometheus_stat

    - name: Inspect current promtool binary before manual rollback
      ansible.builtin.stat:
        path: "{{ prometheus_update_check_install_dir }}/promtool"
        follow: false
      register: prometheus_update_check_manual_current_promtool_stat

    - name: Validate current binaries before reversible rollback
      ansible.builtin.assert:
        that:
          - prometheus_update_check_manual_current_prometheus_stat.stat.isreg | default(false)
          - not (prometheus_update_check_manual_current_prometheus_stat.stat.islnk | default(false))
          - prometheus_update_check_manual_current_promtool_stat.stat.isreg | default(false)
          - not (prometheus_update_check_manual_current_promtool_stat.stat.islnk | default(false))

    - name: Set manual rollback step to current backup
      ansible.builtin.set_fact:
        prometheus_update_check_rollback_step: current_backup

    - name: Check pre-rollback backup generation does not already exist
      ansible.builtin.stat:
        path: "{{ prometheus_update_check_manual_current_backup_path }}"
        follow: false
      register: prometheus_update_check_manual_current_backup_before

    - name: Require a fresh pre-rollback backup generation path
      ansible.builtin.assert:
        that:
          - not (prometheus_update_check_manual_current_backup_before.stat.exists | default(false))
        fail_msg: "Pre-rollback backup generation already exists; refusing to mix backup contents."

    - name: Create pre-rollback Prometheus backup directory exclusively
      ansible.builtin.command:
        argv:
          - /usr/bin/mkdir
          - --mode=0750
          - --
          - "{{ prometheus_update_check_manual_current_backup_path }}"
      changed_when: true

    - name: Record pre-rollback backup generation ownership
      ansible.builtin.set_fact:
        prometheus_update_check_manual_generation_created: true

    - name: Resolve created pre-rollback backup generation
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - -m
          - --
          - "{{ prometheus_update_check_manual_current_backup_path }}"
      register: prometheus_update_check_manual_current_backup_canonical
      changed_when: false

    - name: Inspect created pre-rollback backup generation
      ansible.builtin.stat:
        path: "{{ prometheus_update_check_manual_current_backup_path }}"
        follow: false
      register: prometheus_update_check_manual_current_backup_after

    - name: Validate created pre-rollback backup generation boundary
      ansible.builtin.assert:
        that:
          - (prometheus_update_check_manual_current_backup_canonical.stdout | trim) == prometheus_update_check_manual_current_backup_path
          - (prometheus_update_check_manual_current_backup_path | dirname) == prometheus_update_check_backup_dir
          - prometheus_update_check_manual_current_backup_after.stat.isdir | default(false)
          - not (prometheus_update_check_manual_current_backup_after.stat.islnk | default(false))
        fail_msg: "Created pre-rollback backup generation is not a safe direct child."

    - name: Back up current Prometheus before rollback
      ansible.builtin.copy:
        src: "{{ prometheus_update_check_binary }}"
        dest: "{{ prometheus_update_check_manual_current_backup_path }}/prometheus"
        remote_src: true
        owner: "{{ prometheus_update_check_manual_current_prometheus_stat.stat.pw_name }}"
        group: "{{ prometheus_update_check_manual_current_prometheus_stat.stat.gr_name }}"
        mode: "{{ prometheus_update_check_manual_current_prometheus_stat.stat.mode }}"

    - name: Back up current promtool before rollback
      ansible.builtin.copy:
        src: "{{ prometheus_update_check_install_dir }}/promtool"
        dest: "{{ prometheus_update_check_manual_current_backup_path }}/promtool"
        remote_src: true
        owner: "{{ prometheus_update_check_manual_current_promtool_stat.stat.pw_name }}"
        group: "{{ prometheus_update_check_manual_current_promtool_stat.stat.gr_name }}"
        mode: "{{ prometheus_update_check_manual_current_promtool_stat.stat.mode }}"

    - name: Mark pre-rollback current backup complete
      ansible.builtin.set_fact:
        prometheus_update_check_manual_current_backup_ready: true
        prometheus_update_check_rollback_step: restore
        prometheus_update_check_manual_restore_started: true

    - name: Calculate pre-rollback Prometheus backup checksums
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        get_checksum: true
        follow: false
      loop:
        - "{{ prometheus_update_check_manual_current_backup_path }}/prometheus"
        - "{{ prometheus_update_check_manual_current_backup_path }}/promtool"
      register: prometheus_update_check_manual_current_backup_checksum_stats

    - name: Record pre-rollback Prometheus backup checksums
      ansible.builtin.set_fact:
        prometheus_update_check_manual_current_prometheus_checksum: >-
          {{ prometheus_update_check_manual_current_backup_checksum_stats.results[0].stat.checksum }}
        prometheus_update_check_manual_current_promtool_checksum: >-
          {{ prometheus_update_check_manual_current_backup_checksum_stats.results[1].stat.checksum }}

    - name: Restore selected Prometheus binary
      ansible.builtin.copy:
        src: "{{ prometheus_update_check_selected_backup.path }}/prometheus"
        dest: "{{ prometheus_update_check_binary }}"
        remote_src: true
        owner: "{{ prometheus_update_check_manual_current_prometheus_stat.stat.pw_name }}"
        group: "{{ prometheus_update_check_manual_current_prometheus_stat.stat.gr_name }}"
        mode: "{{ prometheus_update_check_manual_current_prometheus_stat.stat.mode }}"

    - name: Restore selected promtool binary
      ansible.builtin.copy:
        src: "{{ prometheus_update_check_selected_backup.path }}/promtool"
        dest: "{{ prometheus_update_check_install_dir }}/promtool"
        remote_src: true
        owner: "{{ prometheus_update_check_manual_current_promtool_stat.stat.pw_name }}"
        group: "{{ prometheus_update_check_manual_current_promtool_stat.stat.gr_name }}"
        mode: "{{ prometheus_update_check_manual_current_promtool_stat.stat.mode }}"

    - name: Set manual rollback step to service restart
      ansible.builtin.set_fact:
        prometheus_update_check_rollback_step: service_restart

    - name: Restart Prometheus after manual restore
      ansible.builtin.systemd:
        name: "{{ prometheus_update_check_service }}"
        state: restarted

    - name: Set manual rollback step to health verification
      ansible.builtin.set_fact:
        prometheus_update_check_rollback_step: health_verification

    - name: Wait for rolled-back Prometheus service to become active
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ prometheus_update_check_service }}"
      register: prometheus_update_check_manual_active_raw
      changed_when: false
      retries: 6
      delay: 5
      until:
        - (prometheus_update_check_manual_active_raw.rc | int) == 0
        - (prometheus_update_check_manual_active_raw.stdout | trim) == 'active'

    - name: Collect manually rolled-back Prometheus version
      ansible.builtin.command:
        argv:
          - "{{ prometheus_update_check_binary }}"
          - --version
      register: prometheus_update_check_manual_version_raw
      changed_when: false

    - name: Parse manually rolled-back Prometheus version
      ansible.builtin.set_fact:
        prometheus_update_check_manual_version: >-
          {{ (prometheus_update_check_manual_version_raw.stdout | default('') |
              regex_findall('(?m)^prometheus, version ([0-9]+[.][0-9]+[.][0-9]+)(?:[ ]|$)') |
              first | default('')) }}

    - name: Probe manually rolled-back Prometheus health endpoint
      ansible.builtin.uri:
        url: "{{ prometheus_update_check_health_url }}"
        method: GET
        return_content: false
        timeout: 10
      register: prometheus_update_check_manual_health_raw
      failed_when: false
      retries: 6
      delay: 5
      until: (prometheus_update_check_manual_health_raw.status | default(-1) | int) == 200

    - name: Require manually rolled-back Prometheus version and health
      ansible.builtin.assert:
        that:
          - prometheus_update_check_manual_version == prometheus_update_check_selected_backup.version
          - (prometheus_update_check_manual_health_raw.status | default(-1) | int) == 200

    - name: Find Prometheus backup generations after manual rollback
      ansible.builtin.find:
        paths: "{{ prometheus_update_check_backup_dir }}"
        recurse: false
        file_type: directory
        use_regex: true
        patterns: '^[0-9]+[.][0-9]+[.][0-9]+-[0-9]{8}T[0-9]{6}$'
      register: prometheus_update_check_manual_retention_find
      failed_when: false

    - name: Select unprotected old Prometheus backups for manual rollback retention
      ansible.builtin.set_fact:
        prometheus_update_check_manual_backup_prune: >-
          {{ (prometheus_update_check_manual_retention_find.files | default([]) |
              rejectattr('path', 'equalto', prometheus_update_check_selected_backup.path) |
              rejectattr('path', 'equalto', prometheus_update_check_manual_current_backup_path) |
              sort(attribute='mtime', reverse=true) | list)
             [prometheus_update_check_manual_unprotected_keep:] }}
      vars:
        prometheus_update_check_manual_unprotected_keep: >-
          {{ [((prometheus_update_check_backup_keep | int) - 2), 0] | max }}

    - name: Prune unprotected old Prometheus backups after manual rollback
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ prometheus_update_check_manual_backup_prune }}"
      loop_control:
        label: "{{ item.path }}"
      failed_when: false

    - name: Record successful manual Prometheus rollback
      ansible.builtin.set_fact:
        prometheus_update_check_status: rolled_back
        prometheus_update_check_result_version: "{{ prometheus_update_check_manual_version }}"
        prometheus_update_check_error: ""
        prometheus_update_check_failure_step: ""

  rescue:
    - name: Capture manual Prometheus rollback failure
      ansible.builtin.set_fact:
        prometheus_update_check_failure_step: >-
          {{ prometheus_update_check_rollback_step | default(ansible_failed_task.name | default('unknown')) }}
        prometheus_update_check_error: >-
          {{ (ansible_failed_result.msg | default(ansible_failed_result.stderr | default('rollback task failed')) | string | trim)[:500] }}

    - name: Remove incomplete pre-rollback backup
      ansible.builtin.file:
        path: "{{ prometheus_update_check_manual_current_backup_path }}"
        state: absent
      failed_when: false
      when:
        - prometheus_update_check_manual_current_backup_path is defined
        - prometheus_update_check_manual_lock_acquired | default(false) | bool
        - prometheus_update_check_manual_generation_created | default(false) | bool
        - not (prometheus_update_check_manual_current_backup_ready | default(false) | bool)

    - name: Restore pre-rollback Prometheus after manual rollback failure
      ansible.builtin.copy:
        src: "{{ prometheus_update_check_manual_current_backup_path }}/prometheus"
        dest: "{{ prometheus_update_check_binary }}"
        remote_src: true
        owner: "{{ prometheus_update_check_manual_current_prometheus_stat.stat.pw_name }}"
        group: "{{ prometheus_update_check_manual_current_prometheus_stat.stat.gr_name }}"
        mode: "{{ prometheus_update_check_manual_current_prometheus_stat.stat.mode }}"
      register: prometheus_update_check_manual_recovery_prometheus
      ignore_errors: true
      when:
        - prometheus_update_check_manual_restore_started | default(false) | bool
        - prometheus_update_check_manual_current_backup_ready | default(false) | bool

    - name: Restore pre-rollback promtool after manual rollback failure
      ansible.builtin.copy:
        src: "{{ prometheus_update_check_manual_current_backup_path }}/promtool"
        dest: "{{ prometheus_update_check_install_dir }}/promtool"
        remote_src: true
        owner: "{{ prometheus_update_check_manual_current_promtool_stat.stat.pw_name }}"
        group: "{{ prometheus_update_check_manual_current_promtool_stat.stat.gr_name }}"
        mode: "{{ prometheus_update_check_manual_current_promtool_stat.stat.mode }}"
      register: prometheus_update_check_manual_recovery_promtool
      ignore_errors: true
      when:
        - prometheus_update_check_manual_restore_started | default(false) | bool
        - prometheus_update_check_manual_current_backup_ready | default(false) | bool

    - name: Restart Prometheus after failed manual rollback recovery
      ansible.builtin.systemd:
        name: "{{ prometheus_update_check_service }}"
        state: restarted
      register: prometheus_update_check_manual_recovery_restart
      ignore_errors: true
      when:
        - prometheus_update_check_manual_restore_started | default(false) | bool
        - prometheus_update_check_manual_current_backup_ready | default(false) | bool

    - name: Wait for Prometheus active state after manual rollback recovery
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "{{ prometheus_update_check_service }}"
      register: prometheus_update_check_manual_recovery_active_raw
      changed_when: false
      retries: 6
      delay: 5
      until:
        - (prometheus_update_check_manual_recovery_active_raw.rc | default(1) | int) == 0
        - (prometheus_update_check_manual_recovery_active_raw.stdout | default('') | trim) == 'active'
      ignore_errors: true
      when:
        - prometheus_update_check_manual_restore_started | default(false) | bool
        - prometheus_update_check_manual_current_backup_ready | default(false) | bool

    - name: Collect Prometheus version after manual rollback recovery
      ansible.builtin.command:
        argv:
          - "{{ prometheus_update_check_binary }}"
          - --version
      register: prometheus_update_check_manual_recovery_version_raw
      changed_when: false
      ignore_errors: true
      when:
        - prometheus_update_check_manual_restore_started | default(false) | bool
        - prometheus_update_check_manual_current_backup_ready | default(false) | bool

    - name: Parse Prometheus version after manual rollback recovery
      ansible.builtin.set_fact:
        prometheus_update_check_manual_recovery_version: >-
          {{ (prometheus_update_check_manual_recovery_version_raw.stdout | default('') |
              regex_findall('(?m)^prometheus, version ([0-9]+[.][0-9]+[.][0-9]+)(?:[ ]|$)') |
              first | default('')) }}
      when:
        - prometheus_update_check_manual_restore_started | default(false) | bool
        - prometheus_update_check_manual_current_backup_ready | default(false) | bool

    - name: Probe Prometheus health after manual rollback recovery
      ansible.builtin.uri:
        url: "{{ prometheus_update_check_health_url }}"
        method: GET
        return_content: false
        timeout: 10
      register: prometheus_update_check_manual_recovery_health_raw
      retries: 6
      delay: 5
      until: (prometheus_update_check_manual_recovery_health_raw.status | default(-1) | int) == 200
      ignore_errors: true
      when:
        - prometheus_update_check_manual_restore_started | default(false) | bool
        - prometheus_update_check_manual_current_backup_ready | default(false) | bool

    - name: Inspect Prometheus binaries after manual rollback recovery
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        get_checksum: true
        follow: false
      loop:
        - "{{ prometheus_update_check_binary }}"
        - "{{ prometheus_update_check_install_dir }}/promtool"
      register: prometheus_update_check_manual_recovery_checksum_stats
      ignore_errors: true
      when:
        - prometheus_update_check_manual_restore_started | default(false) | bool
        - prometheus_update_check_manual_current_backup_ready | default(false) | bool

    - name: Record manual rollback recovery state
      ansible.builtin.set_fact:
        prometheus_update_check_manual_recovery_state: >-
          {{ 'not_required' if not (prometheus_update_check_manual_restore_started | default(false) | bool)
             else 'succeeded'
             if not (prometheus_update_check_manual_recovery_prometheus.failed | default(false) | bool)
                and not (prometheus_update_check_manual_recovery_promtool.failed | default(false) | bool)
                and not (prometheus_update_check_manual_recovery_restart.failed | default(false) | bool)
                and not (prometheus_update_check_manual_recovery_active_raw.failed | default(false) | bool)
                and (prometheus_update_check_manual_recovery_active_raw.stdout | default('') | trim) == 'active'
                and prometheus_update_check_manual_recovery_version == prometheus_update_check_current_version
                and not (prometheus_update_check_manual_recovery_health_raw.failed | default(false) | bool)
                and (prometheus_update_check_manual_recovery_health_raw.status | default(-1) | int) == 200
                and not (prometheus_update_check_manual_recovery_checksum_stats.failed | default(false) | bool)
                and not (prometheus_update_check_manual_recovery_checksum_stats.results[0].failed | default(false) | bool)
                and not (prometheus_update_check_manual_recovery_checksum_stats.results[1].failed | default(false) | bool)
                and (prometheus_update_check_manual_recovery_checksum_stats.results[0].stat.isreg | default(false))
                and not (prometheus_update_check_manual_recovery_checksum_stats.results[0].stat.islnk | default(false))
                and (prometheus_update_check_manual_recovery_checksum_stats.results[1].stat.isreg | default(false))
                and not (prometheus_update_check_manual_recovery_checksum_stats.results[1].stat.islnk | default(false))
                and (prometheus_update_check_manual_recovery_checksum_stats.results[0].stat.checksum | default(''))
                    == (prometheus_update_check_manual_current_prometheus_checksum | default('missing'))
                and (prometheus_update_check_manual_recovery_checksum_stats.results[1].stat.checksum | default(''))
                    == (prometheus_update_check_manual_current_promtool_checksum | default('missing'))
             else 'failed' }}
        prometheus_update_check_status: rollback_failed
        prometheus_update_check_result_version: >-
          {{ prometheus_update_check_manual_recovery_version | default('') }}

  always:
    - name: Release exclusive Prometheus transaction lock
      ansible.builtin.command:
        argv:
          - /usr/bin/rmdir
          - --
          - "{{ prometheus_update_check_lock_dir }}"
      register: prometheus_update_check_manual_lock_release_raw
      changed_when: (prometheus_update_check_manual_lock_release_raw.rc | int) == 0
      failed_when: false
      when: prometheus_update_check_manual_lock_acquired | default(false) | bool

    - name: Record manual rollback lock release failure
      ansible.builtin.set_fact:
        prometheus_update_check_lock_release_operation_status: "{{ prometheus_update_check_status }}"
        prometheus_update_check_lock_release_operation_error: "{{ prometheus_update_check_error | default('') }}"
        prometheus_update_check_status: lock_release_failed
        prometheus_update_check_failure_step: lock_release
        prometheus_update_check_error: >-
          Prometheus operation completed with status={{ prometheus_update_check_status }},
          but lock release failed for {{ prometheus_update_check_lock_dir }}
          (rc={{ prometheus_update_check_manual_lock_release_raw.rc | default('unknown') }},
          stderr={{ prometheus_update_check_manual_lock_release_raw.stderr | default('') | trim }}).
      when:
        - prometheus_update_check_manual_lock_acquired | default(false) | bool
        - (prometheus_update_check_manual_lock_release_raw.rc | default(1) | int) != 0
