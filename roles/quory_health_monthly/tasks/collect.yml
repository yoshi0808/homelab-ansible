---
- name: Observe quory capacity, memory and NVMe health without installation or device changes
  ansible.builtin.command:
    argv: [python3, '-']
    stdin: "{{ lookup('file', role_path ~ '/files/quory_collect.py') }}"
  become: true
  register: _quory_health_raw
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  check_mode: false

- name: Retain collection outcome even when observation failed
  block:
    - name: Decode quory health observation
      ansible.builtin.set_fact:
        quory_health_monthly_observation: "{{ _quory_health_raw.stdout | from_json }}"
      when: not (_quory_health_raw.unreachable | default(false)) and (_quory_health_raw.rc | default(-1)) == 0
  rescue:
    - name: Retain invalid collection as unknown
      ansible.builtin.set_fact:
        quory_health_monthly_observation: {error: invalid_collection_json}
