---
quory_health_monthly_operation: collect
quory_health_monthly_report_id: ""
quory_health_monthly_report_dir: "{{ reports_base_dir }}/quory-health-monthly"
quory_health_monthly_fs_usage_warning: 80
quory_health_monthly_fs_usage_critical: 90
quory_health_monthly_mem_available_warning_percent: 15
quory_health_monthly_mem_available_critical_percent: 5
quory_health_monthly_wear_warning: 80
quory_health_monthly_wear_critical: 100
# 前回比較で「悪化」をissue化するための閾値(2026-09-13差分レビュー005 Major#2対応)。
# 絶対使用率がwarning/criticalへ達していなくても、前回からの伸びが大きければ
# 対応要否として表示する。
quory_health_monthly_fs_growth_warning_points: 10
quory_health_monthly_mem_available_drop_warning_points: 10
quory_health_monthly_swap_growth_warning_bytes: 104857600
# quory専用ページ(2026-09-14、Yoshinobu作成)。Integrationの実効権限は
# 初回公開前に別途readbackする(QHM-041/QHM-060)。
quory_health_monthly_notion_parent: "3da22f45-f1b0-802b-b069-e4d6da7c3311"
# 既存 homelab-report Integration と Proxmoxストレージ月次点検が使う、quory上の
# 権限制限付きtokenファイルを再利用する(ADR-014)。新しいtokenは作らない。
quory_health_monthly_notion_token_file: /etc/homelab/notion-storage.token
quory_health_monthly_notion_force_send: false
