---
alloy_package_name: alloy
alloy_binary_path: /usr/bin/alloy
alloy_service_name: alloy
alloy_service_unit: alloy.service
alloy_user: alloy
alloy_group: alloy
alloy_journal_group: systemd-journal

alloy_grafana_repo_file: /etc/apt/sources.list.d/grafana.list
alloy_config_dir: /etc/alloy
alloy_config_path: /etc/alloy/config.alloy
alloy_environment_path: /etc/default/alloy

# The apt unit owns the --storage.path argument. This is the path expected by
# the package version current when Phase 1 was designed; target preflight must
# confirm the installed unit before cutover (see tasks/main.yml).
alloy_expected_storage_path: /var/lib/alloy/data
alloy_http_listen_address: localhost:12345

alloy_loki_push_url: http://localhost:3100/loki/api/v1/push

# The existing /etc/rsyslog.d/10-unifi.conf remains outside this role. This
# role adds a later, separate route for Phase 2 sources after resolving the
# names on monnie; no source address literal is stored in Git.
alloy_rsyslog_service_name: rsyslog
alloy_rsyslog_existing_unifi_config: /etc/rsyslog.d/10-unifi.conf
alloy_rsyslog_remote_config_path: /etc/rsyslog.d/15-observability-sources.conf
alloy_rsyslog_remote_staging_path: /etc/rsyslog.d/15-observability-sources.conf.staging
alloy_rsyslog_logrotate_path: /etc/logrotate.d/observability-remote-syslog
alloy_rsyslog_logrotate_staging_path: /etc/logrotate.d/observability-remote-syslog.staging.disabled
alloy_remote_syslog_sources:
  - name: pve1
    hostname: pve1.internal
    destination: pve_nodes
  - name: pve2
    hostname: pve2.internal
    destination: pve_nodes
  - name: sophos_fw
    hostname: sophos-fw.internal
    destination: sophos_fw
  - name: ansy
    hostname: ansy.internal
    destination: ubuntu_nodes
  - name: quory
    hostname: quory.internal
    destination: ubuntu_nodes
  - name: authy
    hostname: authy.internal
    destination: ubuntu_nodes

alloy_remote_syslog_destinations:
  pve_nodes: /var/log/pve-nodes.log
  sophos_fw: /var/log/sophos-fw.log
  ubuntu_nodes: /var/log/ubuntu-nodes.log

# Promtail positions are intentionally not imported. Existing UniFi sources
# start at EOF to avoid a full replay; optional empty sources start at BOF so
# the first line that creates each file is retained.
alloy_file_sources:
  - name: unifi
    path: /var/log/unifi.log
    tail_from_end: true
    labels:
      job: unifi
      host: uckg2
    extract_second_token_as_host: false
    extract_normalized_level_at_start: false
    extract_level_best_effort: true
    require_existing_file: true
  - name: network_devices
    path: /var/log/unifi-devices.log
    tail_from_end: true
    labels:
      job: network-devices
    extract_second_token_as_host: true
    extract_normalized_level_at_start: false
    extract_level_best_effort: true
    require_existing_file: true
  - name: pve_nodes
    path: /var/log/pve-nodes.log
    # The file is absent before its sender is enabled. file_match waits for it;
    # reading from the beginning preserves the first message that creates it.
    tail_from_end: false
    labels:
      job: pve-nodes
    extract_second_token_as_host: true
    extract_normalized_level_at_start: true
    extract_level_best_effort: false
    require_existing_file: false
  - name: sophos_fw
    path: /var/log/sophos-fw.log
    tail_from_end: false
    labels:
      job: sophos-fw
      host: sophos-fw
    extract_second_token_as_host: false
    extract_normalized_level_at_start: true
    extract_level_best_effort: false
    require_existing_file: false
  - name: ubuntu_nodes
    path: /var/log/ubuntu-nodes.log
    tail_from_end: false
    labels:
      job: ubuntu-nodes
    extract_second_token_as_host: true
    extract_normalized_level_at_start: true
    extract_level_best_effort: false
    require_existing_file: false

alloy_journal_sources:
  - name: system
    max_age: 12h
    labels:
      job: ubuntu-nodes
      host: monnie
    source_unit_label: __journal__systemd_unit
    target_unit_label: unit
    source_priority_label: __journal_priority

alloy_promtail_service_name: promtail
alloy_ready_url: http://localhost:12345/-/ready
alloy_runtime_settle_seconds: 15
alloy_runtime_fatal_log_pattern: >-
  (?i)(invalid selector syntax|invalid char escape|failed to create source,
  skipping|could not perform the initial load successfully|failed to evaluate
  config|component[^\n]*(unhealthy|failed))
