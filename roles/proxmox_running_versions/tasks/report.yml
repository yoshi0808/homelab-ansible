---
- name: Require the five fixed node names
  ansible.builtin.assert:
    that:
      - "proxmox_running_versions_node_roles.keys() | list | sort == ['authy', 'monnie', 'pve1', 'pve2', 'quory']"
      - "proxmox_running_versions_node_roles.values() | list | sort == ['monitoring', 'pve', 'pve', 'qdevice', 'radius']"
      - "item in hostvars"
    fail_msg: proxmox_running_versions requires pve1, pve2, quory, authy, and monnie.
  loop: [pve1, pve2, quory, authy, monnie]

- name: Build every node observation including unreachable nodes
  ansible.builtin.set_fact:
    proxmox_running_versions_observations: "{{ proxmox_running_versions_observations | default({}) | combine({item: _prv_node_observation}) }}"
  vars:
    _prv_raw: "{{ hostvars[item].proxmox_running_versions_observation | default({}) }}"
    _prv_node_observation: >-
      {{ {'status': 'unreachable'}
         if ((hostvars[item].proxmox_running_versions_collect_result | default({})).unreachable | default(false) | bool)
         else (_prv_raw if (_prv_raw | length > 0) else {'status': 'error'}) }}
  loop: [pve1, pve2, quory, authy, monnie]

- name: Define publication suppression before any token or HTTP I/O
  ansible.builtin.set_fact:
    proxmox_running_versions_suppress: >-
      {{ ansible_check_mode or (skip_notifications | default(false) | bool)
         or (lookup('env', 'CLAUDECODE') | trim | length > 0) }}

- name: Render and publish the fixed page
  block:
    - name: Publish running version page or prepare its preview
      proxmox_running_versions_notion:
        page: "{{ proxmox_running_versions_notion_page }}"
        token_file: "{{ proxmox_running_versions_notion_token_file }}"
        lock_directory: "{{ proxmox_running_versions_lock_dir }}"
        observations: "{{ proxmox_running_versions_observations }}"
        apply_report_dir: "{{ proxmox_running_versions_apply_report_dir }}"
        node_roles: "{{ proxmox_running_versions_node_roles }}"
        suppress: "{{ proxmox_running_versions_suppress }}"
      register: proxmox_running_versions_publication
      no_log: true
      tags: [destructive]
      # The module independently gates before token and HTTP I/O.

    - name: Keep collection failure observable after publication
      ansible.builtin.set_fact:
        proxmox_running_versions_failed: "{{ proxmox_running_versions_publication.execution_error | bool }}"
        proxmox_running_versions_failure_code: >-
          {{ 'collection_error' if (proxmox_running_versions_publication.execution_error | bool) else '' }}
  rescue:
    - name: Keep publication failure observable without exposing credentials
      ansible.builtin.set_fact:
        proxmox_running_versions_failed: true
        proxmox_running_versions_failure_code: "{{ proxmox_running_versions_publication.msg | default('publication_failed') }}"
        proxmox_running_versions_publication:
          publication: incomplete
          body: "{{ proxmox_running_versions_publication.body | default('') }}"
          overall_status: "{{ proxmox_running_versions_publication.overall_status | default('error') }}"
  always:
    - name: Show the full page body planned for this run
      ansible.builtin.debug:
        msg: "{{ proxmox_running_versions_publication.body | default('ページ本文を生成できませんでした') }}"

    - name: Send one alert for collection or publication failure  # noqa var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: common_slack
        tasks_from: notify
      vars:
        slack_channel: alerts
        slack_status: error
        slack_title: Proxmox稼働バージョン更新失敗
        slack_message: >-
          Proxmox Watchの稼働バージョン更新に失敗しました。
          status={{ proxmox_running_versions_publication.overall_status | default('error') }}
          publication={{ proxmox_running_versions_publication.publication | default('incomplete') }}
          reason={{ proxmox_running_versions_failure_code | default('publication_failed') }}
      when: proxmox_running_versions_failed | default(true) | bool

- name: Fail when collection or publication was incomplete
  ansible.builtin.assert:
    that:
      - not (proxmox_running_versions_failed | default(true) | bool)
    fail_msg: Proxmox running version collection or page publication is incomplete.
