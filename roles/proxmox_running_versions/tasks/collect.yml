---
- name: Collect version facts without changing this Proxmox node
  ansible.builtin.command:
    argv: [python3, '-']
    stdin: "{{ lookup('file', role_path ~ '/files/collect.py') }}"
  become: true
  register: _prv_collect
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  check_mode: false

- name: Decode successful version collection
  block:
    - name: Save decoded version observation
      ansible.builtin.set_fact:
        proxmox_running_versions_observation: "{{ _prv_collect.stdout | from_json }}"
      when:
        - not (_prv_collect.unreachable | default(false) | bool)
        - (_prv_collect.rc | default(-1)) == 0
  rescue:
    - name: Save invalid collection as an explicit error observation
      ansible.builtin.set_fact:
        proxmox_running_versions_observation:
          ok: false
          error: collection_json_invalid
