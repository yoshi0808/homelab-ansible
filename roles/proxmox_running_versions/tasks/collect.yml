---
- name: Collect version facts without changing this Proxmox node
  ansible.builtin.command:
    argv:
      - python3
      - '-'
      - "{{ proxmox_running_versions_node_roles[inventory_hostname] }}"
    stdin: "{{ lookup('file', role_path ~ '/files/collect.py') }}"
  become: true
  register: proxmox_running_versions_collect_result
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  check_mode: false

- name: Decode successful version collection
  block:
    - name: Save decoded version observation
      ansible.builtin.set_fact:
        proxmox_running_versions_observation: "{{ proxmox_running_versions_collect_result.stdout | from_json }}"
      when:
        - not (proxmox_running_versions_collect_result.unreachable | default(false) | bool)
        - (proxmox_running_versions_collect_result.rc | default(-1)) == 0
  rescue:
    - name: Save invalid collection as an explicit error observation
      ansible.builtin.set_fact:
        proxmox_running_versions_observation:
          ok: false
          error: collection_json_invalid
