---
# homelab-mute CLI を配布する(recovery_probe_setup.yml から include される)。
# mute ファイルの読み書きは set.yml と完全互換。

# Create-only 0755, never re-chmod (review 2026-07-14_008 F1): this role runs on
# ansy (no recovery-exec ACL) where a 0775 mode would grant the owning group
# (root) real write; on quory re-chmod'ing would reset the recovery-exec ACL mask.
# recovery_exec setup adds the mask where recovery-exec exists.
- name: "Recovery mute | ensure mute directory exists at 0755 (create-only)"
  ansible.builtin.command:
    cmd: mkdir -m 0755 -p /var/lib/homelab-recovery/mute
    creates: /var/lib/homelab-recovery/mute
  become: true

- name: "Recovery mute | deploy homelab-mute CLI"
  ansible.builtin.copy:
    src: homelab-mute
    dest: /usr/local/bin/homelab-mute
    mode: "0755"
    owner: root
    group: root
  become: true
