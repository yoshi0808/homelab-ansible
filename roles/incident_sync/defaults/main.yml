---
# incident_sync: quory → ansy 証拠バンドルの定期ミラー(pull-only、read-only at source)。
# 設計の正本: docs/ai/reviews/incident_auto_capture_step2/2026-07-28_007_step2_plan.md
#             §3(I-1〜I-8。この表が変数名と既定値の正本 — I-5)
# Policy: docs/ai/policies/incident_capture_policy.md(IC-012〜IC-015, IC-030, IC-031)
#
# このファイルにあるのは tasks/transfer.yml(play1相当) と tasks/finalize.yml
# (play2相当)が使う変数のみ。timer配置(schedule・run_user・repo_dir相当の
# systemd側変数・lock path)は U2(tasks/install_timer.yml・templates/)の担当で、
# このファイルへ追記される予定(I-5には両方が載っているが、実装単位は分かれる)。

# ---------------------------------------------------------------------------
# 転送元(quory)
# ---------------------------------------------------------------------------

# inventories/homelab/hosts.yml の control_nodes グループは quory 1台のみ。
# play2(hosts: localhost)からは hostvars[incident_sync_source_host] で
# play1(hosts: control_nodes)が残した fact を読む(I-7)。
incident_sync_source_host: quory

# 転送元ディレクトリ。play1(hosts: control_nodes = quory)の実行文脈で解決する
# ため、quory側の reports_base_dir を指す(査読F-11)。ansy側の incident_sync_mirror_dir
# と式は同じ({{ reports_base_dir }}/incidents)だが、参照先はquoryのディスクで
# あり、ansy側の同名パスとは別物(requirement O3: 両ホストは同一絶対パスに
# 独立したgit checkoutを持つ)。
incident_sync_source_dir: "{{ reports_base_dir }}/incidents"

# ---------------------------------------------------------------------------
# 着地先(ansy)
# ---------------------------------------------------------------------------

# ミラー本体。play2(hosts: localhost = ansy)の実行文脈で解決するため、ansy側の
# reports_base_dir を指す。同期(incident_sync)だけがここに書く(I-1)。
# reports/ 直下には書かない(IC-030)。
#
# 注意(play1からはこの変数を直接参照できない): play1(hosts: control_nodes =
# quory)の中では、この変数を `hostvars['localhost'].incident_sync_mirror_dir`
# (またはその角括弧表記)経由で読もうとしても失敗する。role defaultは、その
# roleが対象ホストへ一度importされて初めてhostvarsへmergeされるため、
# incident_syncがlocalhostへ一度もimportされていないplay1の時点では
# `hostvars['localhost']` にこのキーがまだ存在しない(自己検証で
# `object of type 'HostVarsVars' has no attribute ...` として実際に再現・
# 確認済み — ansible-core [core 2.20.1])。play1側(tasks/transfer.yml)は
# 代わりに group_vars由来の `hostvars['localhost'].reports_base_dir` から
# 同じ接尾辞("/incidents/quory")で直接組み立てる。**この接尾辞を変える場合は
# tasks/transfer.yml の同じ組み立て箇所も必ず揃えて変更すること。**
incident_sync_mirror_dir: "{{ reports_base_dir }}/incidents/quory"

# 同期の実行状態(_sync/last-sync.json)。同期だけが書く(I-1)。
incident_sync_state_dir: "{{ reports_base_dir }}/incidents/_sync"

# git status --porcelain のスコープ(P0-3・AC1・OQ-C)。reports/incidents/ 配下
# 全体(quory/ ミラーだけでなく _spool/・_sync/・将来の _evaluations/ を含む)を
# 対象にする。ansyの作業ツリー全体は人の作業で日常的に汚れているため
# (requirement O7)、全体の git status は使わない。
incident_sync_git_status_scope: "{{ reports_base_dir }}/incidents"

# git status / lookup('file') 等の基点となるrepoルート。knowledge_review_repo_dir
# と同じ値(この2つのroleは同じansyの同じcheckoutを指しているため一致させる)。
incident_sync_repo_dir: /home/yoshi/homelab-ansible

# ---------------------------------------------------------------------------
# 転送機構と運ぶ対象
# ---------------------------------------------------------------------------

# U0の観測(ansy・quory双方にrsync 3.4.1が実在)により確定。fetchへの分岐は
# 消えた(docs/ai/reviews/incident_auto_capture_step2/2026-07-28_009_u0_test_result.md)。
# _sync/last-sync.json の mechanism フィールドにそのまま書く値。
incident_sync_mechanism: rsync

# 運ばないもの。quory側の消費用spool(recovery-execが単独所有・消費するローカル
# 入力であり運ぶ意味が無い)と、rsyncの一時ファイル。ディレクトリ単位の
# .gitignore除外(U2が追加)とは別の関心事 — こちらは「転送対象から外す」、
# .gitignoreは「追跡対象から外す」。
incident_sync_excludes:
  - "_spool/"
  - "*.tmp"

# ---------------------------------------------------------------------------
# 検知(P0-5・AC7・§2.6)
# ---------------------------------------------------------------------------

# ミラーの _heartbeat.json の generated_at がこの秒数より古ければ stale とみなす。
# 収集器の周期(5分、incident_capture_schedule "*:0/5")の36倍 = 3時間。
incident_sync_heartbeat_max_age_s: 10800

# ---------------------------------------------------------------------------
# 転送の接続・I/Oタイムアウト(2026-07-28、U5査読Major #2差し戻し対応)
# ---------------------------------------------------------------------------

# SSHのTCP接続確立(3-way handshake〜認識可能な応答)自体が固まった場合の上限。
# quoryへのSSH接続がネットワーク的にblackhole(パケットが黙って捨てられ、
# RST/応答が一切返らない)された場合、OSのTCP接続試行は既定で数分単位まで
# 待ちうる。これは評価側がF16/R-9で慎重に予算計算した「claude -p 2本が
# TimeoutStartSecを食い潰しSIGKILLでpost_tasksごと消える」のと同じ失敗クラス
# であり、転送側にも明示的な上限を置く。値10は roles/recovery_exec の
# 既存テンプレート(homelab-investigate.sh.j2・homelab-investigate-pve.sh.j2の
# `-o ConnectTimeout=10`)と同じ、この repo の既存の慣例値に揃えた。
incident_sync_ssh_connect_timeout_s: 10

# rsyncプロトコル自体のI/Oタイムアウト(接続は確立したがデータが一切流れない
# 状態が続いた場合の上限)。ConnectTimeoutが検知できるのは接続確立前の停止
# だけであり、確立後にサーバ側が無応答になるケース(recovery-execプロセスの
# hang等)はrsync自身の --timeout でしか検知できないため、両方を設定する。
# U0実測のバンドル総量(41件・2.0MB)であれば転送は数秒で終わるため、60秒は
# 実転送時間に対して十分に大きく、かつ TimeoutStartSec(既定300秒。
# incident_sync_timeout_start_sec)に対しては
# ConnectTimeout(10) + この値(60) + 実転送時間 + play2の所要時間(数秒)が
# 十分収まる小ささである。
incident_sync_rsync_timeout_s: 60

# ---------------------------------------------------------------------------
# timer配置用(tasks/install_timer.yml が使う。playbooks/incident_sync_timer.yml
# から起動される。U2追記 — 2026-07-28差し戻しにより、U1が置いた上の変数群には
# 一切触れず本節を追加した)
# ---------------------------------------------------------------------------

# 実行user。knowledge_review_run_user と同じ値(ansyの同じyoshiが両roleを実行する)。
incident_sync_run_user: yoshi

# ansible-playbook実行バイナリ。knowledge_review_playbook_bin と同じ形。
incident_sync_playbook_bin: /usr/bin/ansible-playbook

# 毎時・分をずらす(計画I-5)。収集器の5分毎周期("*:0/5" = 分が:00,:05,:10,...)や
# 月次振り返りの実行時刻(07:15)と重ならない毎時7分とした。「毎時であること」
# 自体は計画の決定だが、具体の分の値はI-5が固定していない実装判断である。
incident_sync_schedule: "*-*-* *:07:00"

# 排他ロック(計画§2.2、査読F-6)。外側は月次Knowledge振り返りと共有するロック
# そのもの。内側はincident_sync自身の多重起動防止用。
#
# 2026-07-28、U5査読Suggestion #4差し戻し対応(未解消・意図的):
# incident_sync_outer_lock_path の値は、この文書作成時点で
# roles/knowledge_review/templates/knowledge-review.service.j2 の
# `ExecStart=/usr/bin/flock -n /run/lock/ansible-knowledge-review.lock ...`
# 行にリテラルとして直書きされている値と**文字どおり一致していなければ
# ならない**。一方だけ変更すると、flockはエラーを出さず単に別のロックを
# 取り合うだけになり、§2.2の入れ子排他(月次評価とincident_syncの相互排除)が
# 無言で壊れる。
#
# 本roleの側からは、両ファイルを単一の変数(例:新規のinventory group_var)
# へ統合することで完全に解消できるが、それには roles/knowledge_review 側
# テンプレートの変更が要る。**現在 roles/knowledge_review/** は別の担当が
# 同時に修正中のため、本差し戻しの範囲では実施しない**(Coordinator指示:
# 跨いだ統合が要ると判断したら実施せず報告する)。本roleの側でできる対処は
# この値を明示・強調するコメントに留めている。統合の実施はCoordinatorが
# 両担当の作業完了後に判断すること。
incident_sync_lock_path: /run/lock/ansible-incident-sync.lock
incident_sync_outer_lock_path: /run/lock/ansible-knowledge-review.lock

# service unit の TimeoutStartSec。既定90秒では初回差分やネットワーク遅延に
# 余裕が無いため、roles/incident_capture の TimeoutStartSec=180(同種の余裕
# 確保)より広めに300秒とした。計画I-5はこの値を固定していない実装判断。
incident_sync_timeout_start_sec: 300
