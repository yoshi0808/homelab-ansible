---
# incident_sync: play2相当 — 状態記録・検査・通知・fail(I-7)。
# 想定される呼び出し元(U2): playbooks/incident_sync.yml の play2
#   (hosts: localhost, connection: local, gather_facts: true, become: false)、
#   明示的に `tasks_from: finalize` で呼ぶこと(main.ymlは経由しない)。
#
# このタスク列は、play1(hosts: control_nodes = quory)が到達不能・失敗した
# 場合でも必ず最後まで実行される。play1の結果は hostvars[incident_sync_source_host]
# 経由で読み、fact が無ければ(play1が一度も走らなかった/quoryが到達不能だった)
# 到達不能として扱う — 特定のbool変数の有無ではなく「facts一式が存在するか」を
# 見る(査読F-2、I-7)。

- name: Record finalize timestamp (JST)
  ansible.builtin.set_fact:
    incident_sync_finished_at: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S%:z') }}"
  check_mode: false

# started_at は本来play1の開始時刻が望ましいが、play1のfactが一切無い
# (=quoryに到達すらできず何も実行されなかった)場合に備え、finalize自身の
# 時刻へフォールバックする。
- name: Determine sync run started_at
  ansible.builtin.set_fact:
    incident_sync_started_at: >-
      {{ hostvars[incident_sync_source_host].incident_sync_transfer_started_at
         | default(incident_sync_finished_at) }}
  check_mode: false

# ---------------------------------------------------------------------------
# ① play1の結果を読む。fact が無い = 到達不能として扱う(I-7)。
# ---------------------------------------------------------------------------

- name: Determine whether play1's transfer facts exist at all
  ansible.builtin.set_fact:
    incident_sync_play1_facts_present: >-
      {{ hostvars[incident_sync_source_host].incident_sync_transfer_failed is defined }}
  check_mode: false

# facts が無い場合は「到達不能」として扱う(failed=trueと同じ結論にする)。
# short-circuit: 左辺がfalseなら右辺(hostvarsへの属性アクセス)は評価しない
# ため、facts不在時に未定義属性へ触れて例外になることはない。
- name: Determine overall transfer success
  ansible.builtin.set_fact:
    incident_sync_transfer_ok: >-
      {{ (incident_sync_play1_facts_present | bool)
         and not (hostvars[incident_sync_source_host].incident_sync_transfer_failed | bool) }}
  check_mode: false

- name: Build transfer error detail (best-effort)
  ansible.builtin.set_fact:
    incident_sync_transfer_error_detail: >-
      {{ hostvars[incident_sync_source_host].incident_sync_transfer_msg
         | default('quory unreachable — play1 produced no result facts at all') }}
  check_mode: false

# ---------------------------------------------------------------------------
# ミラーパスの一致検査(2026-07-28、U5査読Suggestion #3対応)。
#
# `incident_sync_mirror_dir`(このtaskがいま実行されているplay2の文脈で
# 解決される role default)と、play1がtransfer.ymlで実際に書き込んだ先
# (`incident_sync_ansy_mirror_dir`。play1はrole defaultをhostvars越しに
# 読めないため reports_base_dir から独自に組み立てている — 詳細は
# transfer.ymlのコメント)は、接尾辞"/incidents/quory"を2箇所で別々に
# リテラル記述している。role defaultはそのroleを一度importされたホストに
# しかhostvars越しに見えないため(自己検証済み)、単一の変数へ完全に統合する
# ことはできない — ここでは代わりに、2つの値が実行時に一致しているかを
# 検査し、**一致しない場合は結果をfailedにして理由をerrorsへ出す**ことで、
# 「片方だけ変更されて黙って壊れる」を「見える形で失敗する」へ変える。
- name: Detect drift between play1's mirror path and this role's own default (duplication guard)
  ansible.builtin.set_fact:
    incident_sync_mirror_path_mismatch: >-
      {{ (hostvars[incident_sync_source_host].incident_sync_ansy_mirror_dir is defined)
         and (hostvars[incident_sync_source_host].incident_sync_ansy_mirror_dir != incident_sync_mirror_dir) }}
  check_mode: false

- name: Build mirror path mismatch detail (best-effort)
  ansible.builtin.set_fact:
    incident_sync_mirror_path_mismatch_detail: >-
      {{ "play1 wrote to '" ~ (hostvars[incident_sync_source_host].incident_sync_ansy_mirror_dir | default('?'))
         ~ "' but this role's own incident_sync_mirror_dir default resolves to '" ~ incident_sync_mirror_dir
         ~ "' — keep the '/incidents/quory' suffix in sync between defaults/main.yml and transfer.yml" }}
  when: incident_sync_mirror_path_mismatch | bool
  check_mode: false

# ---------------------------------------------------------------------------
# ミラーの現況(件数)。存在しなくても失敗させない(transfer.ymlが必ず先に
# mkdirしているため通常は存在するが、防御的に ignore する)。
# ---------------------------------------------------------------------------

- name: List current mirror bundle directories
  ansible.builtin.find:
    paths: "{{ incident_sync_mirror_dir }}"
    file_type: directory
    recurse: false
  register: incident_sync_mirror_listing
  ignore_errors: true
  check_mode: false

# バンドルディレクトリ(semaphore-*/spool-*)のみを数え、_runs 等の
# アンダースコア始まりのきょうだいディレクトリを除く(F1の命名規則)。
- name: Count mirror bundle directories
  ansible.builtin.set_fact:
    incident_sync_mirror_bundle_count: >-
      {{ (incident_sync_mirror_listing.files | default([])
          | rejectattr('path', 'search', '/_[^/]*$') | list | length) }}
  check_mode: false

# ---------------------------------------------------------------------------
# ② 心拍年齢の判定(P0-5層2・AC7・§2.6)
#
# 2026-07-28、U5査読Critical #1差し戻し対応: `_heartbeat.json` は非信頼
# identity(recovery-exec、IC-016)が書く。中身が壊れていた場合
# (`generated_at` が `date -d` でパース不能な文字列、またはJSON自体が不正)、
# `lookup('pipe', ...)` や `from_json` フィルタはAnsibleErrorを送出し、
# block/rescueで囲っていないと finalize.yml の残り(git status検査・
# `_sync/last-sync.json` 書き出し・Slack通知・fail)が一切実行されない
# まま静かに落ちる — これはI-2「必ず書く」とIC-011(失敗を握りつぶさない)に
# 反する、査読が実機で再現したCritical不具合だった。
# 対処: 心拍の読取・解析一式をblockで囲み、rescueで安全側
# (mirror_stale: true・generated_at: null・age: -1)へフォールバックする。
# 解析に失敗したこと自体は incident_sync_heartbeat_parse_error に記録し、
# 後続の「Build errors list」タスクで errors 配列へ反映する(黙らせない)。
# ---------------------------------------------------------------------------

- name: Default heartbeat parse error to empty (overridden by rescue below on failure)
  ansible.builtin.set_fact:
    incident_sync_heartbeat_parse_error: ""
  check_mode: false

- name: Determine mirror heartbeat freshness (safe against malformed heartbeat data — IC-016)
  check_mode: false
  block:
    - name: Check mirror heartbeat file presence
      ansible.builtin.stat:
        path: "{{ incident_sync_mirror_dir }}/_heartbeat.json"
      register: incident_sync_heartbeat_stat

    - name: Read mirror heartbeat content (only when the file exists)
      ansible.builtin.set_fact:
        incident_sync_heartbeat_json: "{{ lookup('file', incident_sync_mirror_dir + '/_heartbeat.json') | from_json }}"
      when: incident_sync_heartbeat_stat.stat.exists | default(false)

    - name: Default heartbeat content when the file is absent
      ansible.builtin.set_fact:
        incident_sync_heartbeat_json: {}
      when: not (incident_sync_heartbeat_stat.stat.exists | default(false))

    - name: Extract heartbeat generated_at
      ansible.builtin.set_fact:
        incident_sync_heartbeat_generated_at: "{{ incident_sync_heartbeat_json.generated_at | default(None) }}"

    # 心拍が無い(または generated_at を欠く)場合は年齢を -1(不明を表す番兵値)、
    # staleness は true(最も安全側)として扱う。
    - name: Default heartbeat age and staleness when heartbeat data is unavailable
      ansible.builtin.set_fact:
        incident_sync_heartbeat_age_s: -1
        incident_sync_mirror_stale: true
      when: incident_sync_heartbeat_generated_at is none

    - name: Compute current epoch
      ansible.builtin.set_fact:
        incident_sync_now_epoch: "{{ lookup('pipe', 'date +%s') }}"
      when: incident_sync_heartbeat_generated_at is not none

    - name: Compute heartbeat epoch
      ansible.builtin.set_fact:
        incident_sync_heartbeat_epoch: "{{ lookup('pipe', 'date -d ' + (incident_sync_heartbeat_generated_at | quote) + ' +%s') }}"
      when: incident_sync_heartbeat_generated_at is not none

    - name: Compute heartbeat age and staleness
      ansible.builtin.set_fact:
        incident_sync_heartbeat_age_s: "{{ _incident_sync_heartbeat_age }}"
        incident_sync_mirror_stale: "{{ _incident_sync_heartbeat_age > (incident_sync_heartbeat_max_age_s | int) }}"
      vars:
        _incident_sync_heartbeat_age: "{{ (incident_sync_now_epoch | int) - (incident_sync_heartbeat_epoch | int) }}"
      when: incident_sync_heartbeat_generated_at is not none
  rescue:
    - name: Fall back to safe heartbeat defaults after a parse failure (non-trusted data — IC-016)
      ansible.builtin.set_fact:
        incident_sync_heartbeat_json: {}
        incident_sync_heartbeat_generated_at:
        incident_sync_heartbeat_age_s: -1
        incident_sync_mirror_stale: true
        incident_sync_heartbeat_parse_error: >-
          {{ ansible_failed_result.msg | default('mirror heartbeat could not be parsed (malformed _heartbeat.json)', true) }}

# ---------------------------------------------------------------------------
# ③ git status --porcelain -- reports/incidents/ の検査(P0-3・AC1・OQ-C)
# ---------------------------------------------------------------------------

- name: Check scoped git status of reports/incidents/
  ansible.builtin.command:
    cmd: "git status --porcelain -- {{ incident_sync_git_status_scope }}"
    chdir: "{{ incident_sync_repo_dir }}"
  register: incident_sync_git_status
  changed_when: false
  check_mode: false

- name: Determine overall sync result
  ansible.builtin.set_fact:
    incident_sync_result: >-
      {{ 'ok' if (incident_sync_transfer_ok | bool
                  and (incident_sync_git_status.stdout | trim | length == 0)
                  and not (incident_sync_mirror_path_mismatch | bool))
         else 'failed' }}
  check_mode: false

# 何を試みて何が取れなかったかを黙らせない(IC-011・I-2)。空配列でも必ず出す。
# heartbeat解析エラーは result を 'failed' にはしない(転送自体は健全なため。
# stale扱いは既にmirror_stale経由でlayer2通知が担う)が、IC-016の非信頼データが
# 壊れていたという事実そのものは errors から黙らせない。
# ミラーパス不一致(duplication guard)は result を failed にする側 — 実際に
# 書いた場所と読んでいる場所が食い違っている可能性を示すため。
- name: Build errors list
  ansible.builtin.set_fact:
    incident_sync_errors: >-
      {{ ([('quory transfer: ' ~ incident_sync_transfer_error_detail)] if not (incident_sync_transfer_ok | bool) else [])
         + ([('working tree not clean under ' ~ incident_sync_git_status_scope ~ ' after transfer: ' ~ (incident_sync_git_status.stdout | trim))]
            if (incident_sync_git_status.stdout | trim | length > 0) else [])
         + ([('mirror heartbeat unreadable: ' ~ incident_sync_heartbeat_parse_error)]
            if (incident_sync_heartbeat_parse_error | default('') | trim | length > 0) else [])
         + ([('mirror path mismatch: ' ~ incident_sync_mirror_path_mismatch_detail)]
            if (incident_sync_mirror_path_mismatch | bool) else []) }}
  check_mode: false

# ---------------------------------------------------------------------------
# ① _sync/last-sync.json を必ず書く(I-2)。成否によらずここまで到達する。
# ---------------------------------------------------------------------------

- name: Ensure sync state directory exists
  ansible.builtin.file:
    path: "{{ incident_sync_state_dir }}"
    state: directory
    mode: "0755"
  check_mode: false

- name: Assemble sync state document (I-2 schema_version 1)
  ansible.builtin.set_fact:
    incident_sync_state_body:
      schema_version: 1
      started_at: "{{ incident_sync_started_at }}"
      finished_at: "{{ incident_sync_finished_at }}"
      result: "{{ incident_sync_result }}"
      source_host: "{{ incident_sync_source_host }}"
      mechanism: "{{ incident_sync_mechanism }}"
      transferred_files: "{{ hostvars[incident_sync_source_host].incident_sync_transfer_count | default(0) | int }}"
      mirror_bundle_count: "{{ incident_sync_mirror_bundle_count | int }}"
      mirror_heartbeat_generated_at: "{{ incident_sync_heartbeat_generated_at }}"
      mirror_heartbeat_age_seconds: "{{ incident_sync_heartbeat_age_s | int }}"
      mirror_stale: "{{ incident_sync_mirror_stale | bool }}"
      errors: "{{ incident_sync_errors }}"
  check_mode: false

- name: Write sync state file (always, even on failure — I-2, AC4)
  ansible.builtin.copy:
    content: "{{ incident_sync_state_body | to_nice_json }}\n"
    dest: "{{ incident_sync_state_dir }}/last-sync.json"
    mode: "0644"
  check_mode: false

# ---------------------------------------------------------------------------
# ④ 失敗/staleならSlack通知(I-6)。成功時は通知しない。
# ---------------------------------------------------------------------------

- name: Notify Slack on transfer/sync failure (layer 1)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
  vars:
    slack_channel: "alerts"
    slack_status: "error"
    slack_title: "[incident_sync] quoryからのバンドル転送/同期に失敗しました"
    slack_message: |
      quory({{ incident_sync_source_host }})からの証拠バンドル転送、または
      転送後のreports/incidents/の状態検査が失敗しました。

      結果        : {{ incident_sync_result }}
      開始        : {{ incident_sync_started_at }}
      終了        : {{ incident_sync_finished_at }}
      ミラー件数  : {{ incident_sync_mirror_bundle_count }}
      状態ファイル: {{ incident_sync_state_dir }}/last-sync.json

      エラー:
      {% for e in incident_sync_errors %}
      - {{ e }}
      {% endfor %}
  when:
    - incident_sync_result == 'failed'
    - not ansible_check_mode

- name: Notify Slack on stale mirror heartbeat (layer 2)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
  vars:
    slack_channel: "alerts"
    slack_status: "warning"
    slack_title: "[incident_sync] ミラーの心拍が古くなっています"
    slack_message: |
      転送自体は成功していますが、ミラーの _heartbeat.json が
      {{ incident_sync_heartbeat_max_age_s }} 秒の閾値より古くなっています。
      quory側の収集器(homelab-incident-capture.timer)が停止している
      可能性があります。

      心拍時刻: {{ incident_sync_heartbeat_generated_at | default('(heartbeatファイル無し)') }}
      {% if incident_sync_heartbeat_parse_error | default('') | trim | length > 0 %}
      解析エラー: {{ incident_sync_heartbeat_parse_error }}(非信頼データ — IC-016)
      {% endif %}
      経過秒数: {{ incident_sync_heartbeat_age_s }}
      閾値    : {{ incident_sync_heartbeat_max_age_s }}
  when:
    - incident_sync_result != 'failed'
    - incident_sync_mirror_stale | bool
    - not ansible_check_mode

# ---------------------------------------------------------------------------
# ⑤ 最後にfailで非ゼロ終了(AC4・IC-024)。stale単独ではfailさせない
# (§2.6層2はwarning止まり — 転送機構自体は健全なため)。
# ---------------------------------------------------------------------------

- name: Fail when sync did not succeed
  ansible.builtin.fail:
    msg: "incident_sync failed: {{ incident_sync_errors | join('; ') }}"
  when:
    - incident_sync_result == 'failed'
    - not ansible_check_mode
