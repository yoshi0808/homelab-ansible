---
# incident_sync: quory→ansy 即時同期起動の受け口(N5/N8/N9)。ansy(dev_nodes)
# 専用 — quoryへは何も配備しない(D-1・IC-013と同じ理由)。
# 設計の正本: docs/ai/reviews/incident_investigation_notify/
# 2026-08-01_001_requirement.md。
#
# 呼び出し元: playbooks/incident_sync_trigger_setup.yml の play2
# (hosts: dev_nodes)。play1(hosts: quory)が既にsync-triggerの公開鍵を
# slurpし、`incident_sync_source_host`(= quory)のfactとして
# `incident_sync_trigger_pubkey` を残している前提(play1を経由せずこの
# タスクだけを単独実行すると、下の set_fact が未定義エラーで止まる —
# 意図的: 公開鍵が無いままアカウントだけ作っても無意味なため)。
#
# 生成する能力は「forced command 1本 + それが叩けるsudoersコマンド1本」に
# 限定される(N8)。他のunitを起動する経路・引数を受け取る経路は存在しない
# (roles/incident_sync/files/incident-sync-trigger.sh が
# $SSH_ORIGINAL_COMMAND を一切参照しないため — AC5・AC6はこの構造で
# 成立する)。

# --checkでは play1 のslurpタスク自体が when: not ansible_check_mode で
# skipされ、incident_sync_trigger_pubkey が未定義のままになる。ここも同じ
# 条件でgateする(check_modeの実装上の落とし穴 —
# skills/ansible-implementation-style/SKILL.md)。後続の全taskも同じ
# `when:` を持つため、この事実が未定義のままでもJinjaが評価される前に
# task自体がskipされる(when:はtask引数のテンプレート化より先に評価される)。
- name: Resolve quory-side sync-trigger public key content
  ansible.builtin.set_fact:
    incident_sync_trigger_pubkey_content: >-
      {{ hostvars[incident_sync_source_host].incident_sync_trigger_pubkey.content | b64decode | trim }}
  when: not ansible_check_mode

- name: Create incident-sync-trigger user (SSH landing account, no interactive purpose)
  ansible.builtin.user:
    name: "{{ incident_sync_trigger_user }}"
    shell: /bin/sh
    create_home: true
    home: "{{ incident_sync_trigger_home }}"
    password: "!"
    comment: "incident_sync immediate-trigger SSH landing account (N5/N8/N9)"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Create .ssh directory for incident-sync-trigger
  ansible.builtin.file:
    path: "{{ incident_sync_trigger_home }}/.ssh"
    state: directory
    owner: "{{ incident_sync_trigger_user }}"
    group: "{{ incident_sync_trigger_user }}"
    mode: "0700"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

# 「exactly 1 key、drift-safe」の全文テンプレート排他上書き — このアカウントは
# この1本の鍵のためだけに存在し、他のキーを一切持たないため安全
# (roles/recovery_exec/templates/authorized_keys.j2 と同じ考え方。
# yoshi自身のauthorized_keysには一切触れない)。
- name: Deploy authorized_keys (exactly 1 key, drift-safe)
  ansible.builtin.template:
    src: authorized_keys-incident-sync-trigger.j2
    dest: "{{ incident_sync_trigger_home }}/.ssh/authorized_keys"
    owner: "{{ incident_sync_trigger_user }}"
    group: "{{ incident_sync_trigger_user }}"
    mode: "0600"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy incident-sync-trigger forced-command script (fixed, no client-supplied args)
  ansible.builtin.copy:
    src: incident-sync-trigger.sh
    dest: "{{ incident_sync_trigger_wrapper_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  when: not ansible_check_mode
  tags: [destructive]

- name: Deploy sudoers for incident-sync-trigger (start of ansible-incident-sync.service only)
  ansible.builtin.template:
    src: sudoers-incident-sync-trigger.j2
    dest: /etc/sudoers.d/incident-sync-trigger
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  become: true
  when: not ansible_check_mode
  tags: [destructive]
