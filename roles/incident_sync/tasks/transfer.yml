---
# incident_sync: play1相当 — quoryからのpull転送のみ(I-7)。
# 想定される呼び出し元(U2): playbooks/incident_sync.yml の play1
#   (hosts: control_nodes, gather_facts: false, become: false)。
#
# ansible.posix.synchronize は「常にansible controller(=ansy)側でrsyncプロセスを
# 実行する」モジュールである(ansible-doc: "It is run and originates on the local
# host where Ansible is being run.")。mode: pull では、このplayのinventory_hostname
# (quory)の接続情報(control_nodes.ymlのann/id_ann)から自動的にsrcがリモートpath
# として組み立てられる — delegate_to は不要であり、付けると挙動が変わる
# (action plugin: ansible_collections/ansible/posix/plugins/action/synchronize.py
# 内 `if delegate_to is None and remote_transport: self._connection = local`)。
# 公式のpull例もdelegate_toなしである。
#
# 削除操作は一切持たない。delete/--delete/--remove-source-files は指定しない
# (P0の不変条件。IC-021・IC-033前提条件1。転送は読み取りのみ — IC-014)。

- name: Record transfer start timestamp (JST)
  ansible.builtin.set_fact:
    incident_sync_transfer_started_at: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S%:z') }}"

# ansy側のミラーパスを、role defaultではなく group_var(reports_base_dir)から
# 直接組み立てる。
#
# 自己検証で判明した制約(ここが最重要): `incident_sync_mirror_dir` は
# roles/incident_sync/defaults/main.yml の *role default* であり、role
# defaultはそのroleがそのホストに対して(どのplayでであれ)一度importされて
# 初めてhostvarsへ merge される。play1の時点ではこのroleはまだ localhost に
# 対して一度もimportされていない(play2で初めてimportされる)ため、
# `hostvars['localhost']['incident_sync_mirror_dir']` は
# `object of type 'HostVarsVars' has no attribute ...` で失敗する
# (実機のansible-core 2.20.1で実際に再現・確認済み)。
#
# 一方 `reports_base_dir` は role default ではなく group_vars/all.yml の
# 通常のinventory変数であり、run開始時点から全ホスト分がhostvars越しに
# 見える。したがって、ansy側パスは reports_base_dir から直接組み立てる
# ("/incidents/quory" は defaults/main.yml の incident_sync_mirror_dir の
# 組み立てと同じ接尾辞 — 変更する場合は両方を揃えること)。
#
# delegate_to はスコープを変えない点にも注意: `delegate_to: localhost` は
# 接続先を変えるだけで、Jinja変数解決に使うホストスコープ
# (inventory_hostname)は変えない。このtaskのinventory_hostnameは最後まで
# quoryのままである。
- name: Resolve ansy-side mirror directory from reports_base_dir (see comment above)
  ansible.builtin.set_fact:
    incident_sync_ansy_mirror_dir: "{{ hostvars['localhost']['reports_base_dir'] }}/incidents/quory"

# reports/incidents/ 本体ではなく、その下のミラー専用サブディレクトリだけを
# 作る(IC-030: reports/ 直下へは書込権を与えない。ここでは所有権の話ではなく
# 単に書込先をパスで縛っている)。ansy側のローカル操作なので delegate_to: localhost
# で明示する(このtaskはplay1のhosts: control_nodes = quoryの文脈で実行される
# ため、delegate_to が無いとquory側で mkdir されてしまう)。
- name: Ensure ansy-side mirror directory exists
  ansible.builtin.file:
    path: "{{ incident_sync_ansy_mirror_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  check_mode: false

# 実データ転送。重い/実影響のある操作のため --check では走らせない
# (knowledge_review の claude -p 呼び出しと同じ扱い)。
#
# このtask自体には delegate_to を付けない — 付けると mode: pull の action
# plugin が想定する「delegate_to無し・remote_transport有り」の分岐から外れ、
# pull方向のsrc/dest組み立てが変わってしまう。srcは裸の変数参照のままでよい
# — play1の文脈=quory側の意味がそのまま正しい。destは上でset_factした
# incident_sync_ansy_mirror_dir を使う。
#
# rsync_opts:
#   --exclude=... : incident_sync_excludes(_spool/ と *.tmp)を運ばない。
#   --stats       : "Number of regular files transferred:" 行から転送件数を
#                   後続taskで抽出するために付与する。
# delete は指定しない(ミラーからの削除操作を持たない)。
#
# タイムアウト2種(2026-07-28、U5査読Major #2差し戻し対応 — 数値の根拠は
# defaults/main.ymlのincident_sync_ssh_connect_timeout_s/_rsync_timeout_sの
# コメントを参照)。
#   rsync_timeout : moduleパラメータ。rsync自身に `--timeout=N` を付与させる
#                   (接続確立後、データが流れなくなった場合の上限)。
#   use_ssh_args  : trueにすると、action pluginが自動生成する `--rsh=ssh -i
#                   <private_key> ...` へ、taskの vars で指定した
#                   ansible_ssh_common_args を追記させる(モジュール本体の
#                   is_rsh_needed()ロジック — ユーザーが独自に --rsh を
#                   rsync_opts へ直接書いた場合は自動生成そのものが丸ごと
#                   skipされ private_key 等が失われるため、--rsh を自分で
#                   書く形は採らず、この仕組みで追記する)。
#   ansible_ssh_common_args(task vars) : `-o ConnectTimeout=N` を追加する。
#                   SSHのTCP接続確立自体が固まった場合(blackhole)の上限。
#                   inventory側(control_nodes.yml)にはこの変数がまだ定義
#                   されていないため、task varsでの指定は上書きではなく新規
#                   設定であり、既存の接続設定(ann/id_ann)と衝突しない。
- name: Pull incident bundle tree from quory (read-only at source)
  ansible.posix.synchronize:
    mode: pull
    src: "{{ incident_sync_source_dir }}/"
    dest: "{{ incident_sync_ansy_mirror_dir }}/"
    rsync_opts: "{{ ['--stats'] + (incident_sync_excludes | map('regex_replace', '^', '--exclude=') | list) }}"
    rsync_timeout: "{{ incident_sync_rsync_timeout_s }}"
    use_ssh_args: true
  vars:
    ansible_ssh_common_args: "-o ConnectTimeout={{ incident_sync_ssh_connect_timeout_s }}"
  register: incident_sync_transfer_raw
  ignore_unreachable: true
  ignore_errors: true
  failed_when: false
  when: not ansible_check_mode

# --check では上のtaskが skip されるため、以降のfact計算が確実に「未実施」を
# 表せるよう明示的に空の結果へフォールバックする。
- name: Default transfer result when not attempted (--check)
  ansible.builtin.set_fact:
    incident_sync_transfer_raw: "{{ incident_sync_transfer_raw | default({}) }}"

# play2 が hostvars 経由で読む結果一式。「factが無い = 到達不能として扱う」
# (I-7)を成立させるため、このtask自体は無条件に(到達可否・成否を問わず)
# 実行され、必ず何らかの値を残す。
# incident_sync_transfer_raw が unreachable/failed のときも rc/msg は
# best-effort で埋める(モジュールが返さない場合は明示的な既定値にする)。
#
# 自己検証で判明: ansible.posix.synchronize は rsync の出力(--stats含む)を
# `.stdout` ではなく `.msg` に入れて返す(`command`/`shell` とは異なる)。
# `.stdout` は常に空文字列だった(実機ansible-core 2.20.1で確認)。
# そのため統計抽出は `.msg` を読む(下のtask)。
- name: Record transfer result as host facts (read by play2 via hostvars)
  ansible.builtin.set_fact:
    incident_sync_transfer_attempted: "{{ not ansible_check_mode }}"
    incident_sync_transfer_unreachable: "{{ incident_sync_transfer_raw.unreachable | default(false) | bool }}"
    # `is failed` は使わない。上のsynchronize taskへ `failed_when: false` を
    # 付けているため、register結果の failed 属性は常にFalseへ上書きされており
    # `is failed` は絶対に真にならない(skills/ansible-implementation-style/
    # SKILL.md「check_modeの実装上の落とし穴」と同型 — failed_whenがregister
    # 結果を書き換える。自己検証で実際に踏んだ: 存在しないsource_dirを与えて
    # rc=23を発生させたが、failed_whenの上書きにより `is failed` はFalseの
    # ままだった)。代わりに rc を直接見る。--check でtaskがskipされた場合
    # (rc未定義→既定-1)は「未実施」であって「失敗」ではないため
    # not ansible_check_mode で除外する(set_factの同一task内で sibling key を
    # 参照できないため、ここでも `not ansible_check_mode` を書き直している —
    # roles/common_slack/tasks/capture.ymlのコメントと同じ制約)。
    incident_sync_transfer_failed: >-
      {{ (incident_sync_transfer_raw.unreachable | default(false) | bool)
         or (not ansible_check_mode
             and ((incident_sync_transfer_raw.rc | default(-1) | int) != 0)) }}
    incident_sync_transfer_rc: "{{ incident_sync_transfer_raw.rc | default(-1) }}"
    incident_sync_transfer_msg: >-
      {{ incident_sync_transfer_raw.msg
         | default(incident_sync_transfer_raw.stderr | default('(no error detail returned)', true), true) }}

# rsync --stats の "Number of regular files transferred: N" 行から件数を抽出する。
# 入力は `.msg`(synchronizeモジュールの出力先。stdoutは常に空 — 上のtaskの
# コメント参照)、無ければ `.stdout` にフォールバックする(将来別のrsync呼び出し
# 経路に差し替わった場合の保険)。
# regex_search はマッチ全体(ラベル文字列込み)を返すため、regex_replace で
# 数字以外を除去してから int にする(桁区切りカンマが付いても壊れない)。
# マッチが無い(転送しなかった/失敗した)場合は regex_search が None を返す
# ため `| default('0', true)` で明示的に0へ倒す(default()はNoneには効かない
# ため boolean=true が必須 — Undefinedとの違いに注意)。
- name: Extract transferred file count from rsync --stats output
  ansible.builtin.set_fact:
    incident_sync_transfer_count: >-
      {{ ((_incident_sync_stats_text
           | regex_search('Number of regular files transferred:\s*[0-9,]+'))
          | default('0', true)
          | regex_replace('[^0-9]', '')) | int }}
  vars:
    _incident_sync_stats_text: >-
      {{ incident_sync_transfer_raw.msg | default(incident_sync_transfer_raw.stdout | default('')) }}
