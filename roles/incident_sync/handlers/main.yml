---
# incident_sync: systemd daemon-reload handler(2026-07-28差し戻しにより新設)。
#
# tasks/install_timer.yml のtemplate配備taskから notify される。handler化した
# 理由 — 通常taskとして `daemon_reload: true` を毎回実行すると、この呼び出し
# (unit名を指定しない daemon_reload 単体呼び出し)は常に changed を報告する
# ため、「2回目以降の再配備はchangedゼロ」という冪等性の観測ができなくなる。
# handler化すれば、通知元のtemplate taskが実際に差分を出したとき(初回配備、
# または将来unitの内容を変えたとき)だけ発火する — roles/knowledge_review/
# handlers/main.yml と同じ形。
#
# check-mode-native (2026-07-31 round2でrisk-acceptedから変換): 通知元の
# template taskはいずれも when: not ansible_check_mode でゲート済みのため
# --check下ではchangedを報告せずこのhandlerは通知されないが、それだけに
# 依存せず handler自身にも when: not ansible_check_mode を置いて独立に閉じる
# (通知元のゲートはhandlerに継承されない。
# docs/ai/reviews/check_mode_semantics/2026-07-31_007_round2_batchA_implement.md
# §2.4)。`check_mode: false` と併用しない — when: が先に評価されfalseなら
# task自体に到達しないため、その行は効かない。
- name: Reload systemd for incident sync
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: not ansible_check_mode
