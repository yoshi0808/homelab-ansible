---
# tester-gate: check-mode-native — tester_mode/tester_gate を廃止。
# roles/recovery_service_restart/tasks/main.yml の Phase 1 (read-only タグ・
# 稼働状態検証)は --check の有無にかかわらず常に本実行し、Phase 2 (systemctl
# restart)以降は ansible_check_mode でゲートする(tags: destructive)。
# 自律復旧ラダーの実処理のため、--check 時に実行してはならない
# (Yoshinobu指示、2026-07-06)。詳細は docs/ai/policies/ansible_test_safety_policy.md。
# recovery_service_restart.yml
#
# 目的: 自律復旧ラダー第1段。対象 VM のサービスを systemctl restart し、回復を試みる。
#       policy §8 の通り 1 回のみ試行。タグ再検証必須(policy §5)。
#
# 比較対象・対象 VM:
#   | target     | 再起動サービス                                          | 必要タグ   |
#   |------------|--------------------------------------------------------|------------|
#   | authy      | freeradius.service                                     | hacritical |
#   | monnie     | grafana-server / prometheus / loki / unpoller          | ops        |
#   | sophos-fw  | 対象外（VMリブートのみ: recovery_vm_reboot.yml を使用）| -          |
#
# 使用方法:
#   ansible-playbook playbooks/recovery_service_restart.yml -e target=authy
#   ansible-playbook playbooks/recovery_service_restart.yml -e target=monnie
#
# 実行フロー:
#   Phase 1: pvesh で Proxmox タグを再検証（hacritical/ops タグ & sophos-fw 除外）
#   Phase 2: target VM 上で対象サービスを systemctl restart（SSH/become）
#   Phase 3: 各サービスが active になるまで待機（max 60s）
#   always:  JSON レポート保存 + Slack 通知
#
# Fail 条件: タグ不適格 / VM 不存在/非実行中 / タイムアウト内に active にならない
# 成功でも失敗でも Slack 通知を送り、レポートを保存する（best-effort）。
#
# 参照: docs/ai/policies/autonomous_recovery_policy.md §5 §8
#       docs/ai/reviews/autonomous_recovery/2026-06-27_001_requirement.md

- name: Recovery - service restart
  hosts: pve1
  gather_facts: false
  become: true
  pre_tasks:
    - name: Validate target variable (prevent path traversal)
      ansible.builtin.assert:
        that:
          - target is defined
          - target | length > 0
          - target is match('^[A-Za-z0-9_-]+$')
          - target in ['authy', 'monnie']
        fail_msg: >-
          target が不正です: '{{ target | default('') }}'.
          サービス restart の対象は authy / monnie のみです。
          (sophos-fw はサービス restart の対象外)

    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check instead — tag/state verification runs for real under
          --check, and the actual systemctl restart is gated by
          ansible_check_mode. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true
  roles:
    - recovery_service_restart
