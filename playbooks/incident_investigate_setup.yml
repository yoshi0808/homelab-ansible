---
# Deploy the primary incident investigation picker (U2) to quory.
#
# Design authority: docs/ai/adr/009-per-incident-investigation-runtime.md
# Requirement: docs/ai/reviews/incident_auto_investigation/2026-07-31_001_requirement.md
# Trigger mechanism (2026-07-31, current): docs/ai/reviews/incident_investigate_trigger/
# 2026-07-31_001_requirement.md (T1-T9) — see that file and
# roles/incident_investigate/files/incident-investigate.py's module
# docstring for what changed and why.
#
# This playbook deploys the picker (roles/incident_investigate): the
# systemd timer/oneshot that scans reports/incidents/ directly for
# unprocessed `semaphore-<id>/summary.json` bundles (2026-07-31 — this
# role no longer creates or reads a queue directory; T1/T8). It does NOT
# deploy the callback plugin itself (that file lives at
# roles/incident_investigate/callback_plugins/ and stays on disk but is
# currently NOT loaded by any host — enabling it requires adding two lines
# back to this repo's ansible.cfg; see that file's docstring for the
# revert procedure) and it does NOT deploy the investigation
# identity/Codex entry point (roles/incident_inspect — U1's playbook).
#
# Prerequisites (this playbook does not create any of these):
#   - playbooks/recovery_exec_setup.yml already run (homelab-semaphore-query
#     must already exist at /usr/local/bin/).
#   - playbooks/incident_inspect_setup.yml already run (U1: incident-inspect
#     user, Codex investigation wrapper, and the sudoers grant letting
#     `yoshi` invoke that wrapper as incident-inspect). Until that
#     prerequisite is satisfied, the timer this playbook enables will run
#     but every investigation attempt will fail visibly (non-zero exit,
#     systemctl is-failed, and a status:"failed" artifact per job) rather
#     than silently — see roles/incident_investigate/defaults/main.yml
#     "U1との結合値" for why this fails safe rather than reaching any
#     recovery action.
#
# Run (deploy only, timer stays disabled):
#   ansible-playbook playbooks/incident_investigate_setup.yml -l quory
#
# Production enable (starts the timer):
#   ansible-playbook playbooks/incident_investigate_setup.yml -l quory \
#     -e incident_investigate_service_enabled=true
#
# tester-gate: check-mode-native — TS-009 condition 1 (no destructive
# operation on any host other than quory itself, no restart of any
# already-running production service — this is a brand-new timer/oneshot
# pair that did not exist before) holds, but condition 2 (skipping the
# destructive body leaves nothing worth verifying) does not: every change
# here — directory creation (`file`, no ACL/chmod touched — see
# roles/incident_investigate/tasks/main.yml comments) and script/config/unit
# deployment (`copy` / `template`) — is exactly the kind of change Ansible's
# native check_mode can preview without applying. The only real production
# action is enabling + starting the timer (only when
# incident_investigate_service_enabled=true), which
# roles/incident_investigate/tasks/main.yml already gates with
# `when: not ansible_check_mode`. Per TS-010 this belongs in
# check-mode-native, not risk-accepted (the 2026-07-06 original
# classification only evaluated condition 1). See
# docs/ai/policies/ansible_test_safety_policy.md and
# docs/ai/reviews/check_mode_semantics/2026-07-31_004_classification_audit.md
# §2.7.

- name: Deploy primary incident investigation picker (U2)
  hosts: quory
  gather_facts: true
  become: false
  tasks:
    - name: Run incident_investigate role
      ansible.builtin.import_role:
        name: incident_investigate
