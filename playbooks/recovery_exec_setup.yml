---
# Deploy recovery-exec (Codex runner) to quory,
# and set up SSH landing accounts on target nodes (authy, monnie).
#
# **ansy(dev_nodes)は対象にしない**(2026-08-06)。開発機へ本番ランタイムを配る
# 設計をやめたため。検証が要るときは sandbox を使う
# (docs/ai/context/operations/sandbox-vm.md)。
# docs/ai/memory/incidents/2026-08-06_production-runtime-deployed-to-dev-host.md
#
# **target への鍵配布は、この変更とは別に既に quory 固定である**(下記 2026-07-11
# 追記のハードコードguard)。したがって ansy を外すことで塞がるのは配布経路では
# なく、**ansy 上で recovery-exec の秘密鍵が生成・保持され続けること**である。
# 2026-08-06 時点で ansy に id_recovery_action / id_recovery_investigate /
# id_recovery_investigate_pve が実在した。guard により target 側で認可されて
# いないはずだが、**開発機に本番系の秘密鍵を置き続ける理由が無い。**
# Phase 4 の資格情報の数え上げがここを拾えていなかった
# (docs/ai/memory/lessons/enumerate-credentials-that-reach-you-not-those-you-placed.md)。
#
# Production (quory):
#   ansible-playbook playbooks/recovery_exec_setup.yml -l quory
#
# Skip target node setup (e.g. when authy/monnie is unreachable):
#   ansible-playbook playbooks/recovery_exec_setup.yml -l quory \
#     -e recovery_exec_setup_targets=false
#
# Notes:
# - Codex の認証は API キーではなくブラウザ OAuth で、トークンは recovery-exec の
#   ~/.codex/auth.json に入る。vault には何も要らない(2026-08-06 に確認。
#   以前ここには vault_codex_openai_api_key を追加せよと書いてあったが、
#   その変数を参照する定義は repo に1つも無かった)
# - Run this before recovery_io_setup.yml (creates codex-exec-wrapper)
# - After first run, verify key permissions:
#     ansible quory -m command -a "sudo -u nobody stat /home/recovery-exec/.ssh/id_recovery_investigate"
#   Expected: Permission denied
#
# tester-gate: check-mode-native — TS-009 条件1(recovery-exec自体はデーモンで
# はなくCodexランナーのローカル配置であり、サービス再起動を一切伴わない。実害
# は単一ホストのローカル変更+target distributionに限られ、targetへの配布は
# quoryからの実行時のみ許可するハードコードguardで守られている)は満たすが、
# 条件2(本体操作を省いた検証には価値がない)は満たさない。ユーザー作成・SSH
# 鍵生成(creates:で既存キーがあれば元々no-op)・wrapper配置・sudoers・ACL
# (user/file/command+creates:/template/copy/apt/ansible.posix.acl)はいずれも
# Ansible標準のcheck_modeで安全にプレビューできる。TS-010に照らしrisk-accepted
# ではなくcheck-mode-nativeが正しい分類(2026-07-06当時は条件1のみで判断して
# いた)。roles/recovery_exec/tasks/main.yml と target_setup.yml の破壊的task
# をすべて when: not ansible_check_mode でゲートした
# (docs/ai/reviews/check_mode_semantics/2026-07-31_013_round2_batchB2_implement.md)。
#
# 2026-07-11追記: 2026-07-06時点の判断は「本番影響ゼロ/軽微」を単一ホストへの
# 影響のみで評価しており、target(authy/monnie/pve1/pve2)のauthorized_keysを
# 実行元ホストの鍵で排他上書きする横方向の影響を見落としていた。2026-07-08、
# `-l ansy`の通常実行(recovery_exec_setup_targets既定true)がtargetsを
# ansy鍵で上書きし、quoryの本番investigate/action SSH経路を3日間切断する
# インシデントが発生(詳細:
# docs/ai/reviews/autonomous_recovery/2026-07-11_002_ssh_key_investigation.md)。
# 再発防止として、target側への鍵配布は正規配布元quoryからの実行時のみ許可する
# assertをrecovery_execロールに追加した(2026-07-11、2ラウンドのレビューを経て
# 確定: 許可主体をcontrol_nodesグループ所属にすると将来のグループ変更で再発し
# 得るため却下、変数化(recovery_exec_setup_authoritative_host)も-eで上書き
# 可能なため却下し、最終的にtasks/main.yml内でquoryをリテラル固定した。詳細:
# docs/ai/reviews/autonomous_recovery/2026-07-11_009_implement.md)。この
# ハードコードguard(tasks/main.yml内の2箇所)は2026-07-31のcheck-mode-native
# 変換で一切変更していない — 変数・引数・-eで差し替え不可能な設計を保った
# ままである。
#
# 保証範囲の補足: このガードが防ぐのは target authorized_keys の排他的
# 横方向上書きのみである。recovery-execユーザー作成・SSH鍵生成・wrapper配置・
# sudoers・ACLといった単一ホスト内のローカル変更、およびtarget_setup.yml側の
# 配布処理はすべて破壊的taskとしてwhen: not ansible_check_modeでゲートされる
# (通常実行時の挙動・ガードの発動条件は変更していない)。詳細は
# docs/ai/policies/ansible_test_safety_policy.md。

- name: Deploy recovery-exec (Codex runner + SSH key generation)
  hosts: control_nodes
  gather_facts: true
  become: true
  vars:
    recovery_exec_group_members:
      - yoshi
  tasks:
    - name: Run recovery_exec role
      ansible.builtin.import_role:
        name: recovery_exec
