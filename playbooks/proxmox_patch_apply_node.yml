---
# Proxmox single-node patch apply
# Usage:
#   # PATCH_READY apply (default)
#   ansible-playbook -i inventories/homelab/hosts.yml playbooks/proxmox_patch_apply_node.yml \
#     -e target_node=pve2
#
#   # MAINTENANCE_REQUIRED or MAJOR_UPGRADE_DETECTED manual apply (policy
#   # deviation — use with care). proxmox_patch_apply_manual_confirm must
#   # equal exactly the status the re-dry-run detects (requirement.md
#   # 2026-08-01 proxmox_auto_apply_widening §2.3). MAINTENANCE_REQUIRED
#   # without package removes no longer needs this — it auto-applies in the
#   # default 'auto' mode (§2.1).
#   ansible-playbook -i inventories/homelab/hosts.yml playbooks/proxmox_patch_apply_node.yml \
#     -e target_node=pve2 \
#     -e proxmox_patch_apply_mode=manual \
#     -e proxmox_patch_apply_manual_confirm=MAINTENANCE_REQUIRED
#
# target_node: pve1 or pve2 (required)
# Assumes: VM/CT evacuation has already been done before running this playbook.
#
# tester-gate: check-mode-native — Gating relies on Ansible's native --check
# (ansible_check_mode): read-only / diagnostic command tasks force
# check_mode: false so they run for real under --check, while the
# destructive block (apt-get dist-upgrade, reboot) stays gated by
# ansible_check_mode. See docs/ai/policies/ansible_test_safety_policy.md.

- name: Validate target_node before main play
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert target_node is pve1 or pve2
      ansible.builtin.assert:
        that:
          - target_node is defined
          - target_node in ['pve1', 'pve2']
        fail_msg: "target_node must be 'pve1' or 'pve2', got: '{{ target_node | default('undefined') }}'"

    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check (add --check --diff for more detail) instead — read-only
          checks now run for real under --check, and the destructive apply/
          reboot block is gated by ansible_check_mode. See
          docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

    - name: Set recovery mute for authy
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/recovery_mute/tasks/set.yml"
      when: not ansible_check_mode
      vars:
        recovery_mute_target: authy
        recovery_mute_minutes: 120
        recovery_mute_reason: "proxmox_patch_apply_node: {{ target_node }} patch apply in progress"

    - name: Set recovery mute for monnie
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/recovery_mute/tasks/set.yml"
      when: not ansible_check_mode
      vars:
        recovery_mute_target: monnie
        recovery_mute_minutes: 120
        recovery_mute_reason: "proxmox_patch_apply_node: {{ target_node }} patch apply in progress"

    - name: Set recovery mute for sophos-fw
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/recovery_mute/tasks/set.yml"
      when: not ansible_check_mode
      vars:
        recovery_mute_target: sophos-fw
        recovery_mute_minutes: 120
        recovery_mute_reason: "proxmox_patch_apply_node: {{ target_node }} patch apply in progress"

- name: Proxmox patch apply (single node)
  hosts: "{{ target_node | default('__invalid_target__') }}"
  gather_facts: true
  become: true
  vars:
    skip_notifications: "{{ ansible_check_mode }}"
  roles:
    - proxmox_patch_apply_node
