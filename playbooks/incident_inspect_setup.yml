---
# Deploy incident-inspect (primary-investigation Codex runner: identity +
# launch wrapper only) to quory.
#
# Scope (U1 of "障害の一次調査の自動化"): this playbook creates the
# investigation-only Unix user, its Codex config, its launch wrapper, and the
# sudoers entry that lets yoshi switch into it. It does NOT deploy detection,
# the investigation body, or the artifact writer — those belong to
# roles/incident_investigate (U2, a separate implementation unit) and are out
# of scope here. This playbook never touches roles/recovery_exec,
# roles/recovery_io, or roles/incident_capture.
#
# Prerequisite: roles/recovery_exec must already be deployed on this host
# (playbooks/recovery_exec_setup.yml) — homelab-semaphore-query and
# homelab-reports must already exist at /usr/local/bin/. This role only adds
# POSIX ACL grants for incident-inspect's own UID: read on the Semaphore
# query token file (homelab-semaphore-query talks to the Semaphore REST API,
# not semaphore.db directly, since 2026-08-19 —
# docs/ai/reviews/semaphore_query_api/2026-08-19_001_requirement.md) and
# traverse on /home/yoshi; it does not redeploy those wrapper scripts.
#
# **ansy(dev_nodes)は対象にしない**(2026-08-06)。開発機へ本番ランタイムを配る
# 設計をやめたため。検証が要るときは sandbox を使う
# (docs/ai/context/operations/sandbox-vm.md)。
# docs/ai/memory/incidents/2026-08-06_production-runtime-deployed-to-dev-host.md
#
# Production (quory):
#   ansible-playbook playbooks/incident_inspect_setup.yml -l quory
#
# Authentication (manual, out of scope for this playbook): after the first
# run, Yoshinobu runs `codex login --device-auth` as incident-inspect once
# (OQ7, headless device-auth confirmed working 2026-07-31). recovery-exec's
# auth.json is never copied to this user.
#
# tester-gate: check-mode-native — TS-009 条件1(破壊性はあるがサービス
# 再起動を一切伴わない(incident-inspectはデーモンではない)。行う変更は
# ユーザー作成・Codex設定配置・wrapper配置・sudoers・既存パスへのACL付与のみで、
# いずれも自ホスト内に閉じる)は満たすが、条件2(本体操作を省いた検証には
# 価値がない)は満たさない。ユーザー作成・ディレクトリ/設定/wrapper配置・
# ACL付与・sudoers配置(`user`/`file`/`template`/`apt`/`ansible.posix.acl`)は
# いずれもAnsible標準のcheck_modeで安全にプレビューできる。
# roles/incident_inspect/tasks/main.yml の全taskを when: not ansible_check_mode
# でゲートする(相互依存する検証・報告taskが後続しない一連の独立した配置の
# ため、TS-014の個別task単位で足りる)。TS-010に照らし risk-accepted ではなく
# check-mode-native が正しい分類(2026-07-31当時のU1実装時は条件1のみで
# 判断していた)。詳細は docs/ai/policies/ansible_test_safety_policy.md。
- name: Deploy incident-inspect (primary-investigation Codex runner)
  hosts: control_nodes
  gather_facts: true
  become: true
  tasks:
    - name: Run incident_inspect role
      ansible.builtin.import_role:
        name: incident_inspect
