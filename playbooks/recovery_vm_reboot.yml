---
# tester-gate: check-mode-native — roles/recovery_vm_reboot/tasks/main.yml
# の Phase 1 (read-only タグ再検証)は --check の有無にかかわらず常に本実行し、
# Phase 2 以降(shutdown/start)は ansible_check_mode でゲートする
# (tags: destructive)。自律復旧ラダーの実処理のため、--check 時に実行しては
# ならない(Yoshinobu指示、2026-07-06)。詳細は
# docs/ai/policies/ansible_test_safety_policy.md。
# recovery_vm_reboot.yml
#
# 目的: 自律復旧ラダー第2段。VM をリブートして回復を試みる。
#       ソフトシャットダウンが timeout 以内に応答しない場合、強制電源断＋起動に
#       フォールバックする。フォールバックを含めてラダー「1回」のカウント(policy §8)。
#
# 対象 VM・シャットダウン手段:
#   | target     | QEMU guest agent | シャットダウン手段                     | 必要タグ          |
#   |------------|------------------|---------------------------------------|-------------------|
#   | authy      | あり             | pvesh .../agent/shutdown (第1選択)    | hacritical        |
#   | monnie     | あり             | pvesh .../agent/shutdown (第1選択)    | ops               |
#   | sophos-fw  | なし             | pvesh .../status/shutdown (ACPI のみ) | hacritical        |
#   ※ agent shutdown が失敗した場合は ACPI shutdown にフォールバック
#   ※ ACPI shutdown が timeout の場合は pvesh .../status/stop (強制) にフォールバック
#
# 使用方法:
#   ansible-playbook playbooks/recovery_vm_reboot.yml -e target=authy
#   ansible-playbook playbooks/recovery_vm_reboot.yml -e target=sophos-fw
#
# 実行フロー:
#   Phase 1: pvesh でタグ再検証 (hacritical or ops、VMID・現在ノード取得)
#   Phase 2: ソフトシャットダウン要求(guest agent または ACPI)
#   Phase 3: 停止待機 → timeout なら強制電源断にフォールバック
#   Phase 4: pvesh .../status/start → running になるまで待機
#   always:  JSON レポート保存 + Slack 通知
#
# Fail 条件: タグ不適格 / VM 不存在 / 起動後 running にならない
#
# 参照: docs/ai/policies/autonomous_recovery_policy.md §5 §8 §13
#       docs/ai/reviews/autonomous_recovery/2026-06-27_001_requirement.md

# ---------------------------------------------------------------------------
# Play 0: 実行ノードを選定する。候補ノード(inventory group: proxmox)のうち
#         到達可能なものを1台だけ recovery_exec_target へ登録する。優先ノードは
#         指定しない — pvesh/ha-manager はクラスタ全体APIのため入口ノードが
#         どちらでも結果は同じ
#         (docs/ai/reviews/proxmox_exec_node_selection/2026-07-29_002_plan.md §1-2)。
#         read-onlyのprobe/set_fact/add_hostのみで副作用を持たないため、上記
#         tester-gate(check-mode-native)の分類には影響しない。
# ---------------------------------------------------------------------------
- name: Select execution node for recovery_vm_reboot
  hosts: proxmox
  gather_facts: false
  become: false
  roles:
    - role: proxmox_exec_node
      vars:
        pen_target_group: recovery_exec_target
        pen_caller: recovery_vm_reboot

- name: Recovery - VM reboot
  hosts: recovery_exec_target
  gather_facts: false
  become: true
  pre_tasks:
    - name: Validate target variable (prevent path traversal)
      ansible.builtin.assert:
        that:
          - target is defined
          - target | length > 0
          - target is match('^[A-Za-z0-9_-]+$')
          - target in ['authy', 'monnie', 'sophos-fw', 'sandbox']
        fail_msg: >-
          target が不正です: '{{ target | default('') }}'.
          VM リブートの対象は authy / monnie / sophos-fw / sandbox のみです。
  roles:
    - recovery_vm_reboot
