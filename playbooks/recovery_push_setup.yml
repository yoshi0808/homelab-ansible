---
# Recovery push trigger setup (E-2): OnFailure → SSH → quory Codex pipeline.
#
# Deploys:
#   quory : recovery-push-dispatch.sh(forced command handler) + recovery-exec authorized_keys
#   authy : push SSH key + recovery-push.sh + recovery-trigger@.service + freeradius drop-in
#   monnie: push SSH key + recovery-push.sh + recovery-trigger@.service + 4サービス drop-in
#
# VM delegates are driven from quory play (same pattern as recovery_exec_setup.yml).
#
# Run:
#   ansible-playbook playbooks/recovery_push_setup.yml -l quory
#
# tester-gate: check-mode-native — TS-009 条件1(SSH鍵生成・スクリプト配置・
# systemd drop-in配置(中身はOnFailure=recovery-trigger@%p.serviceの1行)+
# daemon_reloadのみで、対象サービス(freeradius/grafana-server/prometheus/loki/
# unpoller)自体の再起動・reloadは一切発生しない)は満たすが、条件2(本体操作を
# 省いた検証には価値がない)は満たさない。ディレクトリ・鍵・スクリプト・
# systemd unit/drop-in/known_hosts配置(`file`/`command`+`creates:`/`copy`/
# `template`)はいずれもAnsible標準のcheck_modeで安全にプレビューできる。
# roles/recovery_push/tasks/main.yml と tasks/sender_setup.yml をあわせて
# when: not ansible_check_mode でゲートする(SSH鍵生成→読み取りの一連は
# TS-015に従い1つのnamed blockでゲートする — sender_setup.yml参照)。
# TS-010に照らし risk-accepted ではなく check-mode-native が正しい分類
# (2026-07-06当時は条件1のみで判断していた)。詳細は
# docs/ai/policies/ansible_test_safety_policy.md。

- name: Deploy recovery push trigger (E-2)
  hosts: quory
  gather_facts: false
  pre_tasks:
    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check (add --check --diff for more detail) instead — read-only
          checks now run for real under --check, and the destructive
          deployment tasks are gated by ansible_check_mode. See
          docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true
  tasks:
    - name: Run recovery_push role
      ansible.builtin.import_role:
        name: recovery_push
