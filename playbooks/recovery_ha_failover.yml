---
# tester-gate: check-mode-native — tester_mode/tester_gate を廃止。
# roles/recovery_ha_failover/tasks/main.yml の Phase 1-2 (read-only タグ・HA
# 登録・移行先検証)は --check の有無にかかわらず常に本実行し、Phase 3以降
# (ha-manager relocate)は ansible_check_mode でゲートする(tags: destructive)。
# 自律復旧ラダーの実処理のため、--check 時に実行してはならない
# (Yoshinobu指示、2026-07-06)。詳細は docs/ai/policies/ansible_test_safety_policy.md。
# recovery_ha_failover.yml
#
# 目的: 自律復旧ラダー第3段（最終手段）。VM を Proxmox HA マネージャー経由で
#       別ノードへフェイルオーバーさせる。これが失敗した場合は人間へエスカレーション。
#       ラダー 1 回のみ試行(policy §8)。
#
# 対象 VM:
#   | target     | 移行先               | 必要タグ   | HA 登録  |
#   |------------|---------------------|------------|---------|
#   | authy      | pve1/pve2 の別ノード | hacritical | 済み     |
#   | sophos-fw  | pve1/pve2 の別ノード | hacritical | 済み     |
#   | monnie     | 対象外              | ops のみ   | -        |
#   ※ 移行先は「現在のノードではないオンラインのクラスタメンバー」を自動選択
#
# 使用方法:
#   ansible-playbook playbooks/recovery_ha_failover.yml -e target=authy
#   ansible-playbook playbooks/recovery_ha_failover.yml -e target=sophos-fw
#
# 実行フロー:
#   Phase 1: pvesh でタグ再検証 (hacritical のみ) + HA 登録確認
#   Phase 2: pvesh /cluster/status から移行先ノード(オンライン・非現在ノード)を選択
#   Phase 3: ha-manager crm-command relocate vm:{vmid} {target-node}
#   Phase 4: VM が target-node で running になるまで待機(max 300s)
#   always:  JSON レポート保存 + Slack 通知(成功=ok / 失敗=critical)
#
# Fail 条件: タグ不適格 / HA 未登録 / 代替ノードなし / 移行タイムアウト
# 失敗時は Slack に critical 通知し、人間のエスカレーションを促す。
#
# 参照: docs/ai/policies/autonomous_recovery_policy.md §5 §8 §13
#       docs/ai/reviews/autonomous_recovery/2026-06-27_001_requirement.md

# ---------------------------------------------------------------------------
# Play 0: 実行ノードを選定する。候補ノード(inventory group: proxmox)のうち
#         到達可能なものを1台だけ recovery_exec_target へ登録する。優先ノードは
#         指定しない — ha-manager はクラスタ全体APIのため入口ノードがどちらでも
#         結果は同じ
#         (docs/ai/reviews/proxmox_exec_node_selection/2026-07-29_002_plan.md §1-2)。
#         read-onlyのprobe/set_fact/add_hostのみで副作用を持たないため、上記
#         tester-gate(check-mode-native)の分類には影響しない。
# ---------------------------------------------------------------------------
- name: Select execution node for recovery_ha_failover
  hosts: proxmox
  gather_facts: false
  become: false
  roles:
    - role: proxmox_exec_node
      vars:
        pen_target_group: recovery_exec_target
        pen_caller: recovery_ha_failover

- name: Recovery - HA failover
  hosts: recovery_exec_target
  gather_facts: false
  become: true
  pre_tasks:
    - name: Validate target variable (prevent path traversal)
      ansible.builtin.assert:
        that:
          - target is defined
          - target | length > 0
          - target is match('^[A-Za-z0-9_-]+$')
          - target in ['authy', 'sophos-fw']
        fail_msg: >-
          target が不正です: '{{ target | default('') }}'.
          HA フェイルオーバーの対象は authy / sophos-fw のみです。
          (monnie は hacritical タグなしのため対象外)

    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check instead — tag/HA-registration/target-node verification
          runs for real under --check, and the actual HA relocate is gated
          by ansible_check_mode. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true
  roles:
    - recovery_ha_failover
