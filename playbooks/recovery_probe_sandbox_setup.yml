---
# tester-gate: check-mode-native — 本体は roles/recovery_probe であり、分類は
# playbooks/recovery_probe_setup.yml と同一である。ディレクトリ作成・設定・unit
# 配置は Ansible 標準の check_mode で安全にプレビューでき、本番へ作用するのは
# daemon の enable+start / restart のみで、roles/recovery_probe/tasks/main.yml と
# handlers/main.yml が when: not ansible_check_mode でゲートする。詳細は
# docs/ai/policies/ansible_test_safety_policy.md。
#
# recovery-probe の**検証用第2インスタンス**を quory へ配備する。
#
# 本番インスタンス(playbooks/recovery_probe_setup.yml)とはコードを共有し、
# 設定と状態ディレクトリだけを分ける。daemon 本体は両インスタンスとも
# /usr/local/sbin/recovery-probe.py であり、複製しない。
#
#   本番        : unit recovery-probe          state /var/lib/homelab-recovery/probe
#   検証(本file): unit recovery-probe-sandbox  state /var/lib/homelab-recovery/probe-sandbox
#
# state_dir を分ける理由は fire_ladder の実行中ロックである。
# `state_dir/ladder.lock` は target 別ではないため、共有すると検証中に本番の
# 障害が起きたときラダーが `LADDER skip: lock held` で見送られる。
#
# 使用方法:
#   ansible-playbook playbooks/recovery_probe_sandbox_setup.yml -l quory
#
# **既定では enable / start しない。常設もしない。** 検証したい窓の間だけ
#
#   systemctl enable --now recovery-probe-sandbox     # 窓を開ける
#   systemctl disable --now recovery-probe-sandbox    # 窓を閉じる
#
# として使い、終わったら止める。常時起動しない理由は2つある。
#
# 1. **週次パッチと衝突する。** `proxmox_evacuate_node` は `prefer*` タグを持たない
#    VM を移行対象にせず、Phase 6 で「残って稼働している VM」として停止する。
#    sandbox はこれに該当するため、パッチ中に停止される。probe が常駐していると
#    5 分後にラダーが発火し、**パッチ中のノードで VM を起動しにいく**。
#    週次パッチが mute するのは authy / monnie / sophos-fw の3件だけで、
#    sandbox は含まれない。
# 2. **常駐させても回帰検出は増えない。** 動かすコードは本番 probe と同一であり、
#    本番インスタンスが実 target に対して常時走っている。検証インスタンスを
#    足しても新しく捕まるものは無い。
#
# 標的が到達不能なまま起動しないこと。閾値到達のたびにラダーが発火し flapping
# エスカレーションに至る。
#
# 設計: docs/ai/reviews/dev_prod_boundary/2026-08-02_001_requirement.md R6
- name: Deploy recovery-probe verification instance (sandbox)
  hosts: control_nodes
  gather_facts: true
  become: true
  vars:
    recovery_probe_instance: sandbox

    # mute ディレクトリと監視一時停止フラグは**本番と共有する**(= 既定値のまま
    # 上書きしない)。mute_remaining() が読むのは `<mute_dir>/<target>.json` で
    # target ごとに別ファイルであり、本番の target 3件と `sandbox` は名前が
    # 重ならないため干渉しない。共有することで `homelab-mute sandbox <分>` が
    # そのまま効き、暴走時の安全弁になる。
    #
    # 分離が要るのは state_dir だけである(`ladder.lock` が target 別でないため)。

    # 標的の到達性が整うまで起動しない(上記ヘッダ参照)。
    recovery_probe_service_enabled: false

    # 検証用の標的のみ。本番の3件(sophos-fw / authy / monnie)は載せない。
    #
    # failover: false — sandbox は HA へ state: ignored で登録してあり、CRM が
    # 当該サービスをマネージャ状態から除外するため relocate を発行しても VM は
    # 動かない。ラダーから呼ぶと Phase 4 の待機 300 秒を消費して必ず
    # エスカレーションするだけなので、failover 段は
    # `SANDBOX: Recovery ha failover (check)` テンプレート(--check)で
    # 個別に検証する。
    recovery_probe_targets:
      sandbox:
        host: sandbox.internal
        probes: ["icmp", "tcp:22"]
        action: ladder
        failover: false
  tasks:
    - name: Deploy recovery-probe (sandbox instance)
      ansible.builtin.include_role:
        name: recovery_probe
