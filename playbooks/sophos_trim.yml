---
# tester-gate: gated-in-role — roles/sophos_trim/tasks/main.yml が tester_mode 時に fstrim --dry-run リハーサルへ差し替え(L3)
- name: Sophos Firewall SSD Trim
  hosts: sophos
  gather_facts: false
  become: false
  vars:
    skip_notifications: "{{ tester_mode | default(false) | bool }}"

  roles:
    - sophos_trim
