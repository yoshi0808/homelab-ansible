---
# tester-gate: check-mode-native — read-only部分(token読取・project/
# inventory/repositoryの名前解決・API GET・diff計算・レポート保存)は
# --check の有無にかかわらず常に本実行し、Semaphore APIへの書き込み
# (POST/PUT)だけを ansible_check_mode でゲートする
# (roles/semaphore_templates/tasks/main.yml の apply.yml include を参照)。
# 側ファイル(state.json)は2026-08-04追補(R11)で廃止した — 同定情報は
# Semaphoreオブジェクト自身の`description`に持つため、読み書きするローカル
# 状態はもう無い。scheduleのreconcile(2026-08-09追補、下記)も同じ規約
# (read-onlyは常時、write=POST/PUTだけをゲート)に従う。
#
# Testerは実行しない。実ホスト(quory)へは到達できないため検証できない。
# **ansy(project id=2)のSemaphoreは2026-08-04にAPI動作検証専用として
# 利用可能になったが、この事実はquoryへの到達可否を変えない** — 要求
# docs/ai/reviews/semaphore_templates_as_code/2026-08-04_001_requirement.md
# §8・追補のとおり、quoryでの実地の最初の観測はYoshinobuの実行によって得る。
#
# semaphore_templates_setup.yml
#
# 目的: Semaphoreの「押せるボタン」の定義と、その定期実行(schedule)の
#       定義を、このリポジトリの正本にする。
#       roles/semaphore_templates/defaults/main.yml のtemplate/schedule
#       両カタログを、Semaphore REST API へ冪等にreconcileする(R3、
#       schedule側はdocs/ai/reviews/semaphore_schedules_as_code/
#       2026-08-09_001_requirement.md)。
#
# 使用方法:
#   確認(必ず先に実行し、差分を読んでから適用する — R6):
#     ansible-playbook playbooks/semaphore_templates_setup.yml --check
#   適用(quory向け、既定):
#     ansible-playbook playbooks/semaphore_templates_setup.yml
#   ansy向け(検証用。id=4ほか既存templateを変更・削除しないこと):
#     ansible-playbook playbooks/semaphore_templates_setup.yml --check \
#       -e semaphore_target=ansy
#     # semaphore_targetは実行先ホストとAPI接続先(api_base_url)を
#     # 1つのつまみでまとめて切り替える(2026-08-09追補、下記
#     # 「実行先ホスト」参照)。**token_pathはこのつまみで切り替わらない**
#     # (2026-08-09の査読差し戻しで撤回。defaults/main.ymlの「tokenの
#     # 置き場」節を参照)。ansyで別のtokenファイルを使う場合は個別に
#     # 上書きする(root所有0600の絶対pathであること、`~`を使わないこと):
#     ansible-playbook playbooks/semaphore_templates_setup.yml --check \
#       -e semaphore_target=ansy \
#       -e semaphore_templates_token_path=/etc/homelab-recovery/semaphore-templates-api-token
#
# --- 実行先ホスト(2026-08-09追補: semaphore_targetで一本化) -------------------
# 本playbookは hosts: "{{ semaphore_target | default('quory') }}" で、
# Semaphore APIを実行先ホスト自身のlocalhost経由で呼ぶ(ansyからquoryの
# Semaphoreを操作する経路は作らない — 非ゴール§3、requirement R4
# 「ansy側にtokenを置かない」)。既定はquory(従来と同じ実行先)。
# `-e semaphore_target=ansy` を渡すと、hosts:の解決先と
# roles/semaphore_templates/defaults/main.yml のapi_base_urlの既定値が、
# 両方まとめてansy向けに切り替わる(role defaults参照)。**token_pathは
# 両ホスト共通の同一絶対pathのまま切り替わらない**(上記「使用方法」参照)。
#
# **未知のsemaphore_targetを渡すと、下の最初のplayで明示的に停止する。**
# Ansibleの既定挙動は、`hosts:`パターンが1件もinventoryに一致しないとき
# WARNINGを出すだけでexit code 0のままplayを黙ってskipする(2026-08-09、
# `--list-hosts`と実行の両方で実測確認済み) — この既定挙動のままでは
# 「未知の値は停止する」という設計を満たさないため、明示的なfail-closedの
# assertを別playとして前段に置いている。
#
# OQ1: 2026-08-04追補により、テンプレート定義のAPI操作についてはansyでの
# 実測が得られている(エンドポイント形、認証ヘッダ、argumentsの文字列化)。
# ただし**quoryそのものの実測ではない**。roles/semaphore_templates/tasks/
# read.yml のGETが最初の到達性・応答形式の確認になり、失敗すればここで
# 停止する(推測で書き込みへ進まない)。詳細は
# docs/ai/reviews/semaphore_templates_as_code/2026-08-04_003_implement.md。
#
# OQ3(このImplementerの判断、変更なし): 本playbookを起動するSemaphore
# テンプレート自体は、このカタログに含めない。含めると「自分を実行する
# ボタンの定義を、自分の実行結果が書き換える」自己参照になり、誤った定義を
# 適用してしまったときに直す手段が、直したいテンプレートそのものに依存
# してしまう。このテンプレートの新規作成・以後の編集はUIでの手作業のまま
# とする(OQ2のtoken発行と同じく、一度きりの人手)。
#
# R11/R12/R13(2026-08-04追補): 同定情報はSemaphoreオブジェクト自身の
# `description`へ埋め込む(R11、旧OQ4を含む「固定project_id」前提は崩れ、
# 名前解決に置き換えた・R12)。PUTは取得したオブジェクトへ管理フィールドを
# 上書きしてまるごと送り返す(R13、フルリプレース仕様でも安全)。いずれも
# ansyでの実測に基づく再設計であり、詳細と自己検証の記録は
# docs/ai/reviews/semaphore_templates_as_code/2026-08-04_003_implement.md
# の追補を参照。
#
# schedule側(2026-08-09追補): template適用が完了した後に、
# roles/semaphore_templates/defaults/main.yml の
# semaphore_schedules_catalog をreconcileする(R10)。
#
# **2026-08-24追補(semaphore_activation_gate_removal案件): 有効化
# (false→true)を別段階へ遅らせて実行ごとの明示的な許可を要求していた
# 旧gate(closed-worldフラグ・明示許可・接続先allowlist・schedule集合の
# 非変化の4条件)は撤去した。** カタログの`active`は、既存・新規を
# 問わず単一のapplyでそのまま反映される(押下1回・commit1回で有効に
# なる)。**ただし接続先の検査(旧allowlistの一部)だけは独立した目的を
# 持つとして復元した(R2)** — 書き込みに使うAPI base URLが、カタログに
# 定めたcanonicalな本番URLと一致しないとき、**各schedule書き込みの直前に
# 取得したfresh値**を使って「このwriteは本当にfalse→trueを行うか」を
# 個別に判定し、該当すればそのwriteとそれ以降のPOST/PUTをすべて中止する
# (`roles/semaphore_templates/tasks/schedules_apply_item.yml` /
# `schedules_apply_new_item.yml`。2026-08-24再追補: diff時点の
# スナップショットで判定すると、diffと実際の書き込みの間の競合を見逃す
# ことが独立レビューで判明したため、write直前の値で判定する設計に
# 改めた)。
# 詳細は docs/ai/reviews/semaphore_schedules_as_code/ と
# docs/ai/reviews/semaphore_activation_gate_removal/。

- name: Fail closed if semaphore_target is not a known Semaphore-server inventory host
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: "Validate semaphore_target before the main play resolves hosts:"
      ansible.builtin.fail:
        msg: >-
          semaphore_target={{ semaphore_target | default('quory') }} は
          inventoryの semaphore_servers グループに存在しないホスト名です
          (既知の値: {{ groups['semaphore_servers'] | join(', ') }})。
          Ansibleの既定挙動(未一致のhostパターンをexit 0で黙ってskip
          する)に任せず、ここで明示的に停止します。
      when: (semaphore_target | default('quory')) not in (groups['semaphore_servers'] | default([]))

- name: Reconcile Semaphore templates and schedules from the repo catalog
  hosts: "{{ semaphore_target | default('quory') }}"
  gather_facts: false
  become: false

  tasks:
    - name: Load the semaphore_templates catalog and reconcile against the API
      ansible.builtin.include_role:
        name: semaphore_templates
