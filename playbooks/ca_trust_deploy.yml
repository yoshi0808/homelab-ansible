---
# ca_trust_deploy.yml - ルートCA(Home-RADIUS-CA)をノードのシステム信頼ストアに配布
# 変更系: /usr/local/share/ca-certificates/ への書き込み + update-ca-certificates
#
# 対象: ansy, quory, monnie, authy, pve1, pve2
# CA秘密鍵は不要（証明書のみ取得）。cert_renew_ca_host(quory)からSSHで取得する。
#
# 配布するのはルートCAだけである(docs/ai/policies/cert_renew_policy.md CERT-021)。
# 中間CA(Home-TLS-CA)はサーバがハンドシェイクで提示するためトラストアンカーとして
# 不要であり、過去に配布済みの home-tls-ca.crt は role 側で absent 回収する。
#
# tester-gate: check-mode-native — TS-009 条件1(copy モジュールの content
# 差分比較による本来の意味での冪等(CA証明書は約10年変化しないため、通常は
# changed=false の no-op)で、変更が発生した場合もサービス再起動を伴わない
# update-ca-certificates(システム証明書バンドルの再構築のみ)だけ)は満たすが、
# 条件2(本体操作を省いた検証には価値がない)は満たさない。中間CA削除・
# ROOT CA配置(`file`/`copy`)はいずれもAnsible標準のcheck_modeで安全に
# プレビューできる。roles/homelab_cert_renew/tasks/deploy_ca_trust.yml の
# 破壊的2taskを when: not ansible_check_mode でゲートする(TS-014、この
# tasks_fromはca_trust_deploy.ymlからしか呼ばれないため — playbooks/cert_renew*.yml
# はtasks_from: prepare_ca/issue/deploy_semaphore/deploy_proxmox/deploy_grafana/
# cleanupしか使わずdeploy_ca_trustは呼ばない、grep確認済み — 編集してもバッチC
# のcert_renewには影響しない)。ROOT CA証明書のslurpは読み取り専用かつ
# `ansible.builtin.slurp`はcheck_mode支援がnative(`support: full`)なため
# ゲートせず常に本実行させ、--check下でも「取得元ホストの証明書が読めるか」を
# 実際に検証する。TS-010に照らし risk-accepted ではなく check-mode-native が
# 正しい分類(2026-07-06当時は条件1のみで判断していた)。詳細は
# docs/ai/policies/ansible_test_safety_policy.md。

- name: ca_trust_deploy - distribute CA cert to all nodes
  hosts: control_nodes:dev_nodes:monitoring_servers:radius_servers:proxmox
  gather_facts: false
  become: true
  vars:
    cert_renew_ca_host: quory
  tasks:
    - name: Deploy ROOT CA to system trust store and retire the intermediate
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: deploy_ca_trust
