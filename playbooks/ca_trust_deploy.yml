---
# ca_trust_deploy.yml - ルートCA(Home-RADIUS-CA)をノードのシステム信頼ストアに配布
# 変更系: /usr/local/share/ca-certificates/ への書き込み + update-ca-certificates
#
# 対象: ansy, quory, monnie, authy, pve1, pve2
# CA秘密鍵は不要（証明書のみ取得）。cert_renew_ca_host(quory)からSSHで取得する。
#
# 配布するのはルートCAだけである(docs/ai/policies/cert_renew_policy.md CERT-021)。
# 中間CA(Home-TLS-CA)はサーバがハンドシェイクで提示するためトラストアンカーとして
# 不要であり、過去に配布済みの home-tls-ca.crt は role 側で absent 回収する。
#
# tester-gate: risk-accepted — tester_mode/tester_gate を廃止。--check の有無に
# かかわらず常に本実行する。理由: copy モジュールの content 差分比較による本来の
# 意味での冪等(CA証明書は約10年変化しないため、通常は changed=false の no-op)で、
# 変更が発生した場合もサービス再起動を伴わない update-ca-certificates(システム
# 証明書バンドルの再構築のみ)だけなので、他の risk-accepted playbook
# (cloudkey_cert_deploy 等)よりさらに安全側とYoshinobuが判断(2026-07-06)。詳細は
# docs/ai/policies/ansible_test_safety_policy.md。

- name: ca_trust_deploy - distribute CA cert to all nodes
  hosts: control_nodes:dev_nodes:monitoring_servers:radius_servers:proxmox
  gather_facts: false
  become: true
  vars:
    cert_renew_ca_host: quory
    skip_notifications: "{{ ansible_check_mode }}"
  tasks:
    - name: "[migration] tester_mode is deprecated for this playbook — it always runs for real"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true and has no
          dry-run mode (--check included): CA trust deployment always runs
          for real. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

    - name: Deploy ROOT CA to system trust store and retire the intermediate
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: deploy_ca_trust
      check_mode: false
