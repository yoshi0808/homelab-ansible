---
# Recovery push drill setup (E-3): Deploy always-failing dummy units to authy/monnie.
# Starting a drill unit fails immediately, triggering OnFailure → push → quory Codex pipeline.
#
# Deploy:
#   ansible-playbook playbooks/recovery_push_drill_setup.yml -l quory
# Fire drill:
#   ansible authy -b -m ansible.builtin.systemd -a "name=recovery-drill-authy.service state=started"
#   (unit fails → OnFailure → push → Codex investigates → finds services healthy → no recover called)
#
# tester-gate: check-mode-native — TS-009 条件1(静的なunitファイルを配置して
# daemon_reloadするだけで、ユニット自体の起動/enableは別コマンドで手動実施の
# ため本playbookの範囲外。サービス再起動・実際のdrill発火を一切伴わない)は
# 満たすが、条件2(本体操作を省いた検証には価値がない)は満たさない。unit配置
# (`copy`)・daemon_reload(`systemd`)はいずれもAnsible標準のcheck_modeで
# 安全にプレビューできる。roles/recovery_push/tasks/drill_setup.yml の各taskを
# when: not ansible_check_mode でゲートする(`loop:`付きincludeのため
# block化はできない — skills/ansible-implementation-style/SKILL.md「check_mode
# の実装上の落とし穴」項目3)。TS-010に照らし risk-accepted ではなく
# check-mode-native が正しい分類(2026-07-06当時は条件1のみで判断していた)。
# 詳細は docs/ai/policies/ansible_test_safety_policy.md。

- name: Deploy recovery push drill units (E-3)
  hosts: quory
  gather_facts: false
  pre_tasks:
    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check (add --check --diff for more detail) instead — read-only
          checks now run for real under --check, and the destructive
          deployment tasks are gated by ansible_check_mode. See
          docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true
  tasks:
    - name: Setup drill units per target
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/recovery_push/tasks/drill_setup.yml"
      loop: "{{ recovery_push_targets }}"
      loop_control:
        loop_var: drill_target
      vars:
        recovery_push_targets:
          - name: authy
          - name: monnie
