---
# incident_sync_teardown.yml - one-time cleanup after `incident_sync`'s
# retirement (Phase 4 Step 2, docs/ai/reviews/dev_prod_boundary/
# 2026-08-03_015_plan_phase4.md §4 Step 2 / requirement R14b).
#
# roles/incident_sync and its 3 entry playbooks (incident_sync.yml,
# incident_sync_timer.yml, incident_sync_trigger_setup.yml) have already been
# removed from this repository. What remains is the state those playbooks
# left behind on real hosts, which nothing in the repo will ever remove on
# its own (there is no role left to run "state: absent" tasks from). This
# playbook is that removal, run exactly once.
#
# This playbook does NOT touch:
#   - reports/incidents/quory/ (the historical mirror copy itself). That is
#     data, not mechanism, and R14b's retirement is of the sync machinery,
#     not of already-synced evidence. It is left in place as a frozen
#     snapshot; no new bundles will land there going forward (see
#     roles/knowledge_review's incident_metrics.yml, which now reads bundle
#     counts live from quory via dispatch instead of this mirror).
#   - the quory-side bundle originals (reports/incidents/ on quory itself) —
#     those were never part of incident_sync's own footprint; incident_sync
#     only ever read them (I-14, "転送は元の証拠を書き換えない").
#
# Run once, by Coordinator/Yoshinobu, after the repo-side removal has been
# applied to both ansy and quory (i.e. after `git pull` on quory so the
# removed role/playbooks are actually gone there too — this playbook itself
# does not depend on the removed files, but leaving them on quory alongside
# this teardown would be an inconsistent half-state).
#
# tester-gate: check-mode-native — every task uses a module with native
# check_mode support (ansible.builtin.systemd / user / file); `--check`
# previews accurately with no custom gating needed. All tasks are read/write
# against local host state only (ansy's systemd + a landing account, quory's
# yoshi-owned key files); no other host is touched, no service is restarted
# that wasn't already being torn down.

- name: Remove incident_sync systemd units and the ansy-side landing account
  hosts: dev_nodes
  gather_facts: false
  become: true

  tasks:
    - name: Stop and disable incident sync timer (absent unit is not an error)
      ansible.builtin.systemd:
        name: ansible-incident-sync.timer
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop incident sync service, in case a run is mid-flight (absent unit is not an error)
      ansible.builtin.systemd:
        name: ansible-incident-sync.service
        state: stopped
      failed_when: false

    - name: Remove incident sync unit files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/ansible-incident-sync.timer
        - /etc/systemd/system/ansible-incident-sync.service
      register: incident_sync_teardown_unit_files

    - name: Reload systemd if any unit file was actually removed
      ansible.builtin.systemd:
        daemon_reload: true
      when: incident_sync_teardown_unit_files.results | selectattr('changed') | list | length > 0

    - name: Remove incident-sync-trigger landing account and its home directory
      ansible.builtin.user:
        name: incident-sync-trigger
        state: absent
        remove: true
      failed_when: false

    - name: Remove incident-sync-trigger forced-command wrapper
      ansible.builtin.file:
        path: /usr/local/bin/incident-sync-trigger
        state: absent

    - name: Remove incident-sync-trigger sudoers file
      ansible.builtin.file:
        path: /etc/sudoers.d/incident-sync-trigger
        state: absent

    # become は play 既定(true)のまま。接続identityは `ann` であり、親の
    # `reports/incidents` は yoshi:yoshi 0755 で ann に書込権が無いため、
    # become を外すと権限エラーで落ちる(2026-08-03 実測)。
    - name: Remove incident_sync state directory (_sync/last-sync.json etc.)
      ansible.builtin.file:
        path: "{{ reports_base_dir }}/incidents/_sync"
        state: absent

- name: Remove quory-side sync-trigger key material
  hosts: quory
  gather_facts: false
  become: true

  tasks:
    # Generated by the now-deleted roles/incident_investigate/tasks/
    # sync_trigger.yml. **ファイルの所有者が yoshi であることと、SSH接続の
    # identity が yoshi であることは別である** — 接続は `ann` で入るため、
    # `/home/yoshi/.ssh`(0700 yoshi:yoshi)は ann から一覧すらできない
    # (2026-08-03 実測)。become を外すと確実に落ちる。
    - name: Remove sync-trigger SSH keypair
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /home/yoshi/.ssh/id_incident_sync_trigger
        - /home/yoshi/.ssh/id_incident_sync_trigger.pub

    - name: Remove sync-trigger dedicated known_hosts file
      ansible.builtin.file:
        path: /home/yoshi/.ssh/known_hosts_incident_sync_trigger
        state: absent
