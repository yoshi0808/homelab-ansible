---
# This playbook must be run FROM the host you want to configure.
# target_hosts selects the inventory group, but connection: local means tasks
# always execute on the Ansible controller itself — not via SSH to the inventory host.
#
# Typical usage:
#   quory: ansible-playbook playbooks/systemd_timers.yml
#   ansy:  ansible-playbook playbooks/systemd_timers.yml -e "target_hosts=dev_nodes"
#
# tester-gate: check-mode-native — TS-009 条件1(timer/serviceユニット配置+
# enable/startのみで、.timerをstartしてもsystemdの仕様上スケジュールが
# armedになるだけで紐づく.service(Type=oneshot)は次回のOnCalendar時刻まで
# 実行されない)は満たすが、条件2(本体操作を省いた検証には価値がない)は
# 満たさない。unit配置(`template`)・enable/start(`systemd`)はいずれも
# Ansible標準のcheck_modeで安全にプレビューできる。
# roles/systemd_timers/tasks/main.yml の全taskを
# when: not ansible_check_mode でゲートする(相互依存する検証・報告taskが
# 後続しない単純な配置+enable/startのみのため、TS-014の個別task単位で足りる
# — roles/incident_capture・roles/incident_investigateと同型)。TS-010に照らし
# risk-accepted ではなく check-mode-native が正しい分類(2026-07-06当時は
# 条件1のみで判断していた)。詳細は docs/ai/policies/ansible_test_safety_policy.md。
- name: Configure Ansible systemd timers
  hosts: "{{ target_hosts | default('control_nodes') }}"
  gather_facts: false
  become: true
  connection: local
  tasks:
    - name: Run systemd_timers role
      ansible.builtin.import_role:
        name: systemd_timers
