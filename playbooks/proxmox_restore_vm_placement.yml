---
# Restore VM/CT placement to home node after patch apply completes.
#
# Usage:
#   ansible-playbook -i inventories/homelab/hosts.yml playbooks/proxmox_restore_vm_placement.yml \
#     -e target_node=pve2
#
# target_node: pve1 or pve2 (required) — the node that was just patched
#
# Steps:
#   1. Validate target_node
#   2. Migrate non-HA VMs with prefer<target_node> tag back to target_node
#   3. Start any stopped VMs after migration
#   4. Disable maintenance mode and wait for LRM to become active
#   5. Issue ha-manager crm-command relocate for each hacritical+prefer<target> VM
#   6. Wait for HA VMs to return to target_node
#   7. Run healthcheck on target_node
#
# tester-gate: check-mode-native — tester_mode/tester_gate を廃止。
# roles/proxmox_restore_vm_placement/tasks/main.yml の VM識別(read-only)は
# --check の有無にかかわらず常に本実行し、実際の migrate / maintenance mode
# 解除 / HA relocate / 起動 / post-restore healthcheck(Phase 1-4)は
# ansible_check_mode でゲートする(tags: destructive)。非HA VMはオンライン
# マイグレーションも可能だが、全体の平仄を取るため --check 時は一切 VM を
# 動かさない(Yoshinobu指示、2026-07-06)。詳細は docs/ai/policies/ansible_test_safety_policy.md。

- name: Validate target_node
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert target_node is pve1 or pve2
      ansible.builtin.assert:
        that:
          - target_node is defined
          - target_node in ['pve1', 'pve2']
        fail_msg: "target_node must be 'pve1' or 'pve2', got: '{{ target_node | default('undefined') }}'"

    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check instead — VM identification runs for real under --check,
          and the actual migrate/maintenance-mode/HA-relocate sequence is
          gated by ansible_check_mode. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

    - name: Set recovery mute for authy
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/recovery_mute/tasks/set.yml"
      when: not ansible_check_mode
      vars:
        recovery_mute_target: authy
        recovery_mute_minutes: 120
        recovery_mute_reason: "proxmox_restore_vm_placement: {{ target_node }} VM placement restore in progress"

    - name: Set recovery mute for monnie
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/recovery_mute/tasks/set.yml"
      when: not ansible_check_mode
      vars:
        recovery_mute_target: monnie
        recovery_mute_minutes: 120
        recovery_mute_reason: "proxmox_restore_vm_placement: {{ target_node }} VM placement restore in progress"

    - name: Set recovery mute for sophos-fw
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/recovery_mute/tasks/set.yml"
      when: not ansible_check_mode
      vars:
        recovery_mute_target: sophos-fw
        recovery_mute_minutes: 120
        recovery_mute_reason: "proxmox_restore_vm_placement: {{ target_node }} VM placement restore in progress"

- name: Restore VM placement to target_node
  hosts: "{{ target_node }}"
  gather_facts: false
  become: true
  vars:
    skip_notifications: "{{ ansible_check_mode }}"
  tasks:
    - name: Skip if called from weekly-full and no updates available
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['_weekly_full_no_updates'] | default(false)

    - name: Gather facts
      ansible.builtin.setup:

    - name: Run restore VM placement role
      ansible.builtin.include_role:
        name: proxmox_restore_vm_placement
