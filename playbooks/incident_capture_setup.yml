---
# Deploy the incident evidence bundle collector (Step 1 / R2, W3) to quory.
#
# Design authority: docs/ai/adr/003-incident-capture-collector-runtime.md
# Input contract (spool record shape): roles/common_slack/tasks/capture.yml
#
# Prerequisite: playbooks/recovery_exec_setup.yml must already have been run
# (this playbook does not create the recovery-exec user, generate SSH keys,
# or deploy homelab-semaphore-query / homelab-investigate-* — it only grants
# an additional POSIX ACL scoped to reports/incidents/ and deploys the
# collector itself).
#
# Run:
#   ansible-playbook playbooks/incident_capture_setup.yml -l quory
#
# Production enable (starts the timer):
#   ansible-playbook playbooks/incident_capture_setup.yml -l quory \
#     -e incident_capture_service_enabled=true
#
# tester-gate: check-mode-native — TS-009 condition 1 (no destructive
# operation on any host other than quory itself, no restart of any
# already-running production service) holds, but condition 2 (skipping the
# destructive body leaves nothing worth verifying) does not: every change
# here — directory creation (`command` + `creates:`), owner/ACL enforcement
# (`file` / `ansible.posix.acl`), and script/config/unit deployment
# (`copy` / `template`) — is exactly the kind of change Ansible's native
# check_mode can preview without applying. The only real production action
# is enabling + starting the timer (only when
# incident_capture_service_enabled=true), which
# roles/incident_capture/tasks/main.yml already gates with
# `when: not ansible_check_mode`. Per TS-010 this belongs in
# check-mode-native, not risk-accepted (the 2026-07-06 original
# classification only evaluated condition 1). See
# docs/ai/policies/ansible_test_safety_policy.md and
# docs/ai/reviews/check_mode_semantics/2026-07-31_004_classification_audit.md
# §2.5.

- name: Deploy incident evidence bundle collector (Step 1 / R2)
  hosts: quory
  gather_facts: true
  become: false
  pre_tasks:
    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check (add --check --diff for more detail) instead — read-only
          checks now run for real under --check, and the destructive
          deployment tasks are gated by ansible_check_mode. See
          docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true
  tasks:
    - name: Run incident_capture role
      ansible.builtin.import_role:
        name: incident_capture
