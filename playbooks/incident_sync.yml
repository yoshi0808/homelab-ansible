---
# incident_sync.yml - quory→ansy 証拠バンドルの定期ミラー同期(pull-only, read-only at source)
#
# 2 play構成(計画§2.2・§3 I-7。実装者に委ねず計画が確定させた形)。
#   play1: hosts: control_nodes(quory)。転送のみを行い、結果を set_fact で残す
#          (roles/incident_sync のtasks/transfer.yml。roleを既定のtasks_from
#          なしで呼ぶとmain.yml経由でtransfer.ymlが動く — 詳細はroles/
#          incident_sync/tasks/main.ymlのコメント)。
#   play2: hosts: localhost(ansy)。play1の結果をhostvars越しに読み、
#          心拍年齢判定・_sync/last-sync.json書き出し(必ず書く)・
#          スコープを絞ったgit status検査・失敗/stale時のSlack通知・
#          最後にfailで非ゼロ終了する(roles/incident_sync/tasks/finalize.yml。
#          main.ymlを経由せず明示的に tasks_from: finalize で呼ぶこと)。
#
# play2はquoryの状態と無関係に必ず走る。Ansibleは到達不能ホストの残り
# タスクをスキップするが、それは play1(hosts: control_nodes)の中だけで完結し、
# 別ホスト(localhost)を対象とする play2 の実行有無には影響しない。
# finalize.yml は hostvars[incident_sync_source_host] の fact 有無で
# 「play1が一度も走れなかった(quory到達不能)」を検出する — 特定のbool変数の
# 有無ではなくfacts一式の存在を見る(査読F-2)。これがAC4・P0-6・I-2・I-6を
# 同時に成立させる根拠であり、`ignore_unreachable: true`という1フラグの
# 挙動には依存しない(そのフラグ自体はtransfer.yml側で補助として付与済み)。
#
# 実行元: ansy の systemd timer(ansible-incident-sync.timer)。
#         配置は playbooks/incident_sync_timer.yml が行う(このplaybook自体は
#         timerを配備しない)。
#
# 設計の正本: docs/ai/reviews/incident_auto_capture_step2/2026-07-28_007_step2_plan.md
#             §2.2・§3 I-1〜I-8。
# Policy: docs/ai/policies/incident_capture_policy.md
#         (IC-011〜IC-015, IC-021, IC-024, IC-030, IC-031)
#
# tester-gate: check-mode-native — 実データ転送(ansible.posix.synchronize、
# roles/incident_sync/tasks/transfer.yml)は `when: not ansible_check_mode` で
# ゲートされ、--checkではskipする(roles/knowledge_review/tasks/main.ymlの
# claude -p 呼び出しと同じ扱い)。心拍年齢判定・スコープ付きgit status検査・
# _sync/last-sync.json書き出しなどのread-only/状態記録taskは、各task側で
# `check_mode: false` を明示するか結果に影響しないため --check でも常時実行
# される(roles/incident_sync/tasks/finalize.yml)。Slack通知とfailのみ
# `not ansible_check_mode` で追加ガードする。副作用はquory側の読み取りのみと、
# ansyのミラー(reports/incidents/quory/)・状態ファイル(_sync/)・Slack通知に
# 限定され、他ホストへは一切書き込まない(IC-030・IC-014)。

- name: Pull incident bundles from quory
  hosts: control_nodes
  gather_facts: false
  become: false
  roles:
    - incident_sync

- name: Record sync state and notify
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  tasks:
    - name: Run incident_sync finalize tasks
      ansible.builtin.import_role:
        name: incident_sync
        tasks_from: finalize
