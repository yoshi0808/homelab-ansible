---
# unifi_backup_fetch.yml - CloudKey Gen2 Plus (UniFi OS) システムバックアップ取得。
# 変更系: CloudKey 上で新規バックアップを生成し、Synology NFS に保存・ローテーションする。
#         CloudKey の設定変更は行わない。
#
# 対象: 実行ノードは共通role roles/proxmox_exec_node で選定する(pve1優先、
#       到達不能なら pve2 にフェイルオーバー。どちらも同一の Synology NFS
#       マウントを持つ実行ホスト)。選定方式の背景は
#       docs/ai/adr/001-unifi_backup_fetch-pve1-shutdown-target.md を参照
#       (pve1夏季平日シャットダウン運用対応)。
#       CloudKey へは cloudkey.internal で接続する。connection: local は使わず、
#       選定されたホスト上で become: true(root)で実行する。
# 実行元: quory(本番 / Semaphore 週次)または ansy(開発 / CLI)。
# 認証情報は inventories/vars/cloudkey.yml(Vault)から読み込む。
# 詳細は docs/ai/reviews/unifi_backup_fetch/2026-06-15_001_requirement.md を参照。
#
# 通知: 結果を Slack へ通知する(取得・保存 OK = info/ok、失敗 = alerts/error)。
#
# tester-gate: risk-accepted — tester_mode/tester_gate を廃止。--check の有無に
# かかわらず常に本実行する。理由: CloudKey側の設定変更は行わずバックアップ生成
# API(UIの「バックアップ取得」ボタンと同等)を叩くのみで本番サービスへの影響は
# ゼロ。バックアップ生成・ダウンロード・鮮度検証を省いた検証には意味がない
# (proxmox_backup_restore_verifyと同じ理由)ためYoshinobuが安全側と判断
# (2026-07-06)。注意: 世代ローテーションは件数基準(既定8世代)のため、
# 頻繁なテスト実行は本番バックアップの実質的な保持期間を縮める可能性がある。
# 詳細は docs/ai/policies/ansible_test_safety_policy.md。

# ---------------------------------------------------------------------------
# Play 1: 実行ノードを選定する。候補ノード(inventory group: proxmox)のうち
#         pve1 を優先し、到達不能なら到達可能な方(pve2)へフェイルオーバー
#         する。両方到達不能な場合は原因が分かるメッセージでfailする。共通role
#         roles/proxmox_exec_node の選定ロジックの正本は
#         docs/ai/reviews/proxmox_exec_node_selection/2026-07-29_002_plan.md
#         §1-1。外部から見た挙動(pve1優先・pve2フォールバック・両系不能で
#         fail)はこの寄せ替えで変更しない。
# ---------------------------------------------------------------------------
- name: Select unifi_backup_fetch execution host (pve1 preferred, pve2 fallback)
  hosts: proxmox
  gather_facts: false
  become: false
  roles:
    - role: proxmox_exec_node
      vars:
        pen_prefer: pve1
        pen_target_group: unifi_backup_fetch_target
        pen_caller: unifi_backup_fetch

# ---------------------------------------------------------------------------
# Play 2: 選定された1ホストに対してのみ、既存の fetch 処理を実行する。
# ---------------------------------------------------------------------------
- name: unifi_backup_fetch
  hosts: unifi_backup_fetch_target
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/vars/cloudkey.yml"
  pre_tasks:
    - name: "[migration] --check has no dry-run here — refuse and stop before any changes"
      ansible.builtin.assert:
        that: not (ansible_check_mode | bool)
        fail_msg: >-
          This playbook (tester-gate: risk-accepted) has no --check dry-run:
          every task always applies for real, so --check would look like a
          simulation while actually making the change (see
          docs/ai/memory/incidents/2026-07-31_subagent-unintended-deploy-risk-accepted-check.md).
          Re-run without --check to apply for real. To suppress Slack
          notifications during that real run, add -e skip_notifications=true.
          See docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md.
        quiet: true
  tasks:
    - name: "[migration] tester_mode is deprecated for this playbook — it always runs for real"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true and has no
          dry-run mode (--check included): backup fetch always runs for
          real. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

    - name: Fetch UniFi OS backup
      check_mode: false
      block:
        - name: Run unifi_backup_fetch role
          ansible.builtin.include_role:
            name: unifi_backup_fetch
      rescue:
        - name: Record fetch failure
          ansible.builtin.set_fact:
            unifi_backup_failed: true
            unifi_backup_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
      always:
        - name: Remove leftover temporary download file
          ansible.builtin.file:
            path: "{{ unifi_backup_tmpfile }}"
            state: absent
          when: unifi_backup_tmpfile is defined

        - name: Build fetch summary
          ansible.builtin.set_fact:
            unifi_backup_summary: |
              cloudkey: {{ unifi_backup_cloudkey | default('n/a') }}
              dest: {{ unifi_backup_dest | default('n/a') }}
              {% if unifi_backup_failed | default(false) | bool %}
              result: FAILED
              error: {{ unifi_backup_error | default('unknown') }}
              file: {{ unifi_backup_filename | default('n/a') }}
              {% else %}
              result: fetched and saved
              file: {{ unifi_backup_filename | default('n/a') }}
              freshness age: {{ unifi_backup_age_ms | default('n/a') }} ms
              kept generations: {{ unifi_backup_kept | default('n/a') }}
              deleted old backups: {{ unifi_backup_deleted | default(0) }}
              csrf source: {{ unifi_csrf_source | default('n/a') }}
              {% endif %}

        - name: Send Slack notification
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
          vars:
            slack_channel: "{{ 'alerts' if (unifi_backup_failed | default(false) | bool) else 'info' }}"
            slack_status: "{{ 'error' if (unifi_backup_failed | default(false) | bool) else 'ok' }}"
            slack_title: "[unifi_backup_fetch] CloudKey UniFi OS backup fetch completed"
            slack_message: |
              CloudKey UniFi OS system backup fetch run completed.

              Results:
              {{ unifi_backup_summary }}
              Executed on: {{ ansible_facts['hostname'] }}
              Executed at: {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'") }}

        - name: Fail if fetch did not succeed
          ansible.builtin.fail:
            msg: "UniFi OS backup fetch failed: {{ unifi_backup_error | default('see log above') }}"
          when: unifi_backup_failed | default(false) | bool
