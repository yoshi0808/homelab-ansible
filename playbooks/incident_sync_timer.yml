---
# incident_sync_timer.yml - quory→ansy 証拠バンドル同期の systemd timer を配置する
#
# 対象: ansy (dev_nodes) のみ。転送はansy起点のpullであり(D-1・IC-013)、
#   quoryには何も配備しない。roles/knowledge_review_timer.yml と同じ理由 —
#   このrole自体がansy専用ジョブであり、共有の systemd_timers role
#   (既定でcontrol_nodes=quoryへ配布される)へ足すと本番外の依存を作ってしまう
#   ため使わない(計画F15)。
#
# 実行: ansible-playbook playbooks/incident_sync_timer.yml
# 配置物: /etc/systemd/system/ansible-incident-sync.{service,timer}
# 実際の同期本体は playbooks/incident_sync.yml。
#
# timer専用の変数(schedule・run_user・playbook_bin・lock path・timeout)は
# roles/incident_sync/defaults/main.yml の「timer配置用」節にある(2026-07-28
# 差し戻し — 初版はここにplay varsとして置いていたが、defaults/main.ymlを
# 読んだだけではschedule/timeout/lock pathが分からなくなるため移した)。
# 値の根拠は同ファイルのコメントと計画§3 I-5を参照。このplaybook自身は
# 上書きしたい値を持たないため、vars: は置かない。
#
# tester-gate: check-mode-native — TS-009 条件1(本番影響は無く、ansyの
# ローカルsystemd設定に自己完結する実害の小さい操作である)は満たすが、
# 条件2(ユニット配置・enable/startという操作自体を省いた検証には乏しい価値
# しかない、という当初の判断)は満たさない: unit配置(`template`)・
# enable/start(`systemd`)はいずれもAnsible標準のcheck_modeで安全に
# プレビューできる。roles/incident_sync/tasks/install_timer.yml の破壊的task
# (相互依存する検証・報告taskが後続しない配置+enable/startのみのため、
# TS-014の個別task単位で足りる — roles/systemd_timersと同型)を
# when: not ansible_check_mode でゲートする。「配置されたunitの中身が正しいか」
# を見る `systemctl list-timers` の読み取り診断(install_timer.yml末尾)は
# read-onlyであり --check 下でも本実行を維持する(TS-017、check_mode: false)。
# TS-010に照らし risk-accepted ではなく check-mode-native が正しい分類
# (2026-07-06当時は条件1のみで判断していた)。詳細は
# docs/ai/policies/ansible_test_safety_policy.md。

- name: Install incident sync timer
  hosts: dev_nodes
  gather_facts: true
  become: false

  tasks:
    - name: Install timer and service units
      ansible.builtin.import_role:
        name: incident_sync
        tasks_from: install_timer
