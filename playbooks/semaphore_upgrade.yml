---
# Semaphore self-upgrade/rollback. Use Ansible check mode for read-only
# diagnostics. Restart and post-restart verification for normal execution run
# in a transient systemd unit because restarting Semaphore kills its own job
# cgroup.
#
# Diagnostic on ansy (consumer query is intentionally absent there):
#   --check -l ansy -e ansible_connection=local
#   -e skip_reading_path_check=true
# Apply:               -l <ansy|quory>
# Rollback:            -l <ansy|quory> -e rollback=true
# Rollback diagnostic: --check -l <ansy|quory> -e rollback=true
#
# tester-gate: check-mode-native — --checkで実データの診断と予定動作の表示を行い、backup・download・transaction書込み・package/service操作・detached起動・Slack送信は通常実行だけに限る
- name: Upgrade Semaphore one host at a time
  hosts: semaphore_servers
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
    - semaphore_upgrade
