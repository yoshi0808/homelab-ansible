---
# Deploy recovery-io (Slack I/O bridge) to ansy or quory.
#
# Development (ansy):
#   ansible-playbook playbooks/recovery_io_setup.yml -l ansy
#   # service is deployed but NOT enabled/auto-started; use systemctl start manually
#
# Production (quory):
#   ansible-playbook playbooks/recovery_io_setup.yml -l quory \
#     -e recovery_io_service_enabled=true
#
# Notes:
# - vault_slack_socket_bot_token, vault_slack_socket_app_token,
#   vault_slack_authorized_user_id must be set in inventories/vars/slack.yml
# - recovery_exec role must be deployed first (codex-exec-wrapper must exist)
#
# tester-gate: check-mode-native — TS-009 条件1(recovery-ioはSlack I/Oの
# 周辺ブリッジであり、内容変更時の再起動が数秒他のSlack経由コマンド受付を
# 止める程度で、Semaphore経由のplaybook実行やsystemdタイマー等の他の自動化
# 系統には波及しない)は満たすが、条件2(本体操作を省いた検証には価値が
# ない)は満たさない。ユーザー作成・venv構築・pip install・script/env/
# sudoers/systemd unit配置(`user`/`file`/`apt`/`command`+`creates:`/`pip`/
# `template`)はいずれもAnsible標準のcheck_modeで安全にプレビューできる。
# 実際に本番へ作用するのはsystemd unitのenable/start、および変更検知に
# 伴うhandler経由の再起動のみであり、roles/recovery_io/tasks/main.yml と
# handlers/main.yml をあわせて when: not ansible_check_mode でゲートする。
# TS-010に照らし risk-accepted ではなく check-mode-native が正しい分類
# (2026-07-06当時は条件1のみで判断していた)。詳細は
# docs/ai/policies/ansible_test_safety_policy.md。

- name: Deploy recovery-io (Slack I/O bridge)
  hosts: dev_nodes:control_nodes
  gather_facts: true
  become: true
  pre_tasks:
    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check (add --check --diff for more detail) instead — read-only
          checks now run for real under --check, and the destructive
          deployment tasks are gated by ansible_check_mode. See
          docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

  tasks:
    - name: Run recovery_io role
      ansible.builtin.import_role:
        name: recovery_io
