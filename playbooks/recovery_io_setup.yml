---
# Deploy recovery-io (Slack I/O bridge) to ansy or quory.
#
# Development (ansy):
#   ansible-playbook playbooks/recovery_io_setup.yml -l ansy
#   # service is deployed but NOT enabled/auto-started; use systemctl start manually
#
# Production (quory):
#   ansible-playbook playbooks/recovery_io_setup.yml -l quory \
#     -e recovery_io_service_enabled=true
#
# Notes:
# - vault_slack_socket_bot_token, vault_slack_socket_app_token,
#   vault_slack_authorized_user_id must be set in inventories/vars/slack.yml
# - recovery_exec role must be deployed first (codex-exec-wrapper must exist)
#
# tester-gate: risk-accepted — tester_mode/tester_gate を廃止。--check の有無に
# かかわらず常に本実行する。理由: 内容が変わった場合のみ recovery-io サービスの
# 再起動が発生するが(Slack I/O bridge。他playbookのquory-semaphoreのような
# 制御平面そのものではなく、単一機能の周辺ブリッジ)、最悪ケースはSlack経由の
# 復旧コマンド受付が再起動中の数秒だけ止まる程度で、他の自動化(Semaphore経由の
# playbook実行、systemdタイマー)には影響しないためYoshinobuが安全側と判断
# (2026-07-06)。詳細は docs/ai/policies/ansible_test_safety_policy.md。

- name: Deploy recovery-io (Slack I/O bridge)
  hosts: dev_nodes:control_nodes
  gather_facts: true
  become: true
  # vars: { skip_notifications: "{{ ansible_check_mode }}" } removed
  # 2026-07-31 (R2, docs/ai/reviews/check_mode_semantics/
  # 2026-07-31_001_requirement.md) — R1 below now refuses --check outright,
  # so this line's only effect (skip_notifications=true under --check) never
  # had a chance to run.
  pre_tasks:
    - name: "[migration] --check has no dry-run here — refuse and stop before any changes"
      ansible.builtin.assert:
        that: not (ansible_check_mode | bool)
        fail_msg: >-
          This playbook (tester-gate: risk-accepted) has no --check dry-run:
          every task always applies for real, so --check would look like a
          simulation while actually making the change (see
          docs/ai/memory/incidents/2026-07-31_subagent-unintended-deploy-risk-accepted-check.md).
          Re-run without --check to apply for real.
          See docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md.
        quiet: true

    - name: "[migration] tester_mode is deprecated for this playbook — it always runs for real"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true and has no
          dry-run mode (--check included): recovery-io setup (incl. any
          resulting service restart) always runs for real. See
          docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

  tasks:
    - name: Run recovery_io role
      ansible.builtin.import_role:
        name: recovery_io
      check_mode: false
