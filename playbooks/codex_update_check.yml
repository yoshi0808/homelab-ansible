---
# codex_update_check.yml - Codex CLI(npm globalパッケージ)の週次バージョン
# 確認・自動更新。あわせて、その基盤であるnpm本体もメジャーバージョンが
# 上がっている場合に限り自動更新する(マイナー/パッチ差分は静かにスキップ、
# 2026-07-10拡張)。
#
# 対象ホスト: ansy, quory。実行元: quory。スケジュールはSemaphore UIで登録する
# (17:30のProxmoxパッチドライランより前、金曜17:00を想定)。単なるモジュール
# 更新でSemaphoreUIプロセス自体やジョブ実行環境には影響しないため、systemd
# timerではなくSemaphoreUIのスケジュール機能を使う(docs/ai/core-migration-map.md C12-01/C12-02、2026-07-10)。
#
# tester-gate: risk-accepted — 常に本実行する。理由: (1) 更新対象はCodex CLI
# というツール自体、およびその基盤であるnpm本体であり、homelabの本番サービス
# (freeradius/grafana等)には直接触れない。quory上ではrecovery-execの
# codex-exec-wrapperが内部でCodex CLIを呼ぶため波及の可能性はあるが、金曜夕方
# (平日最終日)の実行のため問題が出ても週末で対応できる、とYoshinobuが判断
# (2026-07-09)。npm本体の更新も同じ実行タイミング・同じsudo権限で行うため
# リスクの性質は変わらないと判断(2026-07-10)。(2) npm installを省略した検証
# には意味がなく、バージョン比較・実更新まで含めて検証する価値がある。詳細は
# docs/ai/reviews/codex_update_check/2026-07-09_001_requirement.md、
# docs/ai/reviews/codex_update_check/2026-07-10_005_requirement.md。

- name: codex_update_check - verify execution host
  hosts: localhost
  gather_facts: true
  connection: local
  tasks:
    - name: Ensure this playbook is running on quory
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == 'quory'
        fail_msg: >-
          codex_update_check.yml must be run on quory only
          (current host: {{ ansible_facts['hostname'] }}).

    - name: "[migration] tester_mode is deprecated for this playbook — it always runs for real"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true and has no
          dry-run mode (--check included): Codex CLI update check always
          runs for real. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

- name: Check and update Codex CLI on ansy and quory
  hosts: ansy:quory
  gather_facts: false
  pre_tasks:
    - name: "[migration] --check has no dry-run here — refuse and stop before any changes"
      ansible.builtin.assert:
        that: not (ansible_check_mode | bool)
        fail_msg: >-
          This playbook (tester-gate: risk-accepted) has no --check dry-run:
          every task always applies for real, so --check would look like a
          simulation while actually making the change (see
          docs/ai/memory/incidents/2026-07-31_subagent-unintended-deploy-risk-accepted-check.md).
          Re-run without --check to apply for real. To suppress Slack
          notifications during that real run, add -e skip_notifications=true.
          See docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md.
        quiet: true
  tasks:
    - name: Run codex_update_check role (always for real)
      ansible.builtin.import_role:
        name: codex_update_check
      check_mode: false
