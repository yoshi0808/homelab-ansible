---
# codex_update_check.yml - Codex CLI(npm globalパッケージ)の週次バージョン
# 確認・自動更新。あわせて、その基盤であるnpm本体もメジャーバージョンが
# 上がっている場合に限り自動更新する(マイナー/パッチ差分は静かにスキップ、
# 2026-07-10拡張)。
#
# 対象ホスト: ansy, quory。実行元: quory。スケジュールはSemaphore UIで登録する
# (17:30のProxmoxパッチドライランより前、金曜17:00を想定)。単なるモジュール
# 更新でSemaphoreUIプロセス自体やジョブ実行環境には影響しないため、systemd
# timerではなくSemaphoreUIのスケジュール機能を使う(docs/ai/core-migration-map.md C12-01/C12-02、2026-07-10)。
#
# tester-gate: check-mode-native — 2026-07-31 round2でrisk-acceptedから変換
# (docs/ai/reviews/check_mode_semantics/2026-07-31_006_round2_requirement.md
# バッチC)。TS-009の条件1(実害の軽さ)は満たす: 更新対象はCodex CLIという
# ツール自体、およびその基盤であるnpm本体であり、homelabの本番サービス
# (freeradius/grafana等)には直接触れない。quory上ではrecovery-execの
# codex-exec-wrapperが内部でCodex CLIを呼ぶため波及の可能性はあるが、金曜夕方
# (平日最終日)の実行のため問題が出ても週末で対応できる、とYoshinobuが判断
# (2026-07-09)。npm本体の更新も同じ実行タイミング・同じsudo権限で行うため
# リスクの性質は変わらないと判断(2026-07-10)。
# 一方でTS-009の条件2(破壊的な本体操作を省いた検証には意味がない)は満たさ
# ない: バージョン収集(npm list/npm view/npm --version等、計6個のcommand)
# は実更新(npm install -g、計2箇所)と別タスクに分かれており、比較部分だけ
# でも「更新が必要か」を`--check`で安全にプレビューできる
# (2026-07-31_004_classification_audit.md §2.4)。roles/codex_update_check/
# tasks/main.ymlのバージョン収集taskには`check_mode: false`を、npm install
# の2taskには`when: not ansible_check_mode`+`tags: [destructive]`を付けて
# いる。詳細は
# docs/ai/reviews/codex_update_check/2026-07-09_001_requirement.md、
# docs/ai/reviews/codex_update_check/2026-07-10_005_requirement.md、
# docs/ai/policies/ansible_test_safety_policy.md。

- name: codex_update_check - verify execution host
  hosts: localhost
  gather_facts: true
  connection: local
  tasks:
    - name: Ensure this playbook is running on quory
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == 'quory'
        fail_msg: >-
          codex_update_check.yml must be run on quory only
          (current host: {{ ansible_facts['hostname'] }}).

- name: Check and update Codex CLI on ansy and quory
  hosts: ansy:quory
  gather_facts: false
  tasks:
    - name: Run codex_update_check role
      ansible.builtin.import_role:
        name: codex_update_check
