# playbooks/test_ca_env.yml
# tester-gate: safe-readonly — localhost で環境変数を debug 表示するのみ
- name: Test CA env vars
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check CA_Info env vars
      ansible.builtin.debug:
        msg: "homelab-ca-crt length: {{ lookup('env', 'homelab-ca-crt') | length }}"