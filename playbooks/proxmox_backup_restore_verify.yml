---
# Monthly VM backup restore-verify (controlled apply).
#
# Restores the latest vzdump backup of one core VM into a dedicated throw-away
# VMID (999), boots it with the NIC disconnected, checks it came up, then
# destroys 999. Detects silent backup corruption.
#
# Production VMs are only read (config), never rebooted or migrated.
#
# Usage (production / monthly rotation):
#   ansible-playbook -i inventories/homelab/hosts.yml \
#     playbooks/proxmox_backup_restore_verify.yml
#
# Usage (manual / dev — bypass rotation, verify a specific VMID):
#   ansible-playbook -i inventories/homelab/hosts.yml \
#     playbooks/proxmox_backup_restore_verify.yml -e target_vmid=101
#
# Target VM selection, agent expectation and restore node are decided from
# Proxmox tags (verify / prefer<node>) and qm config — no Ansible-side list.
# The query node and the restore node are each selected from the 'proxmox'
# inventory group by reachability (roles/proxmox_exec_node), not decided by
# a hardcoded host name — see
# docs/ai/reviews/proxmox_exec_node_selection/2026-07-29_002_plan.md.
#
# tester-gate: risk-accepted — この playbook に dry-run 区分はない。--check
# を渡すと、変更を行う各play(Play 2 / Play 3)の pre_tasks に置かれた停止
# assert(TS-030)により変更を一切行わずに停止する。--check なしの通常実行
# では常に本実行する。
# tester-gate-condition2: playbookの存在意義そのものが「バックアップが本当にリストアできるかの実地検証」であり、実際にqmrestoreしない検証には意味がない。
# 理由: 対象は常にVMID 999固定の使い捨てVM、本番VMは設定read-onlyのみ、NIC切断
# 起動で隔離、always:で確実に999を破棄(所有者トークンで二重チェック)されるため、
# 本番サービスへの影響はゼロ。一時的な実ストレージI/O・実行時間を要するが、それは
# このplaybook本来の動作でありYoshinobuが安全側と判断(2026-07-06)。詳細は
# docs/ai/policies/ansible_test_safety_policy.md。

# ---------------------------------------------------------------------------
# Play 1: 実行ノードを選定する。候補ノード(inventory group: proxmox)のうち
#         到達可能なものを1台だけ brv_query_node へ登録する。優先ノードは
#         指定しない — pvesh はクラスタ全体APIのため問い合わせの入口ノードは
#         どちらでも結果が同じ
#         (docs/ai/reviews/proxmox_exec_node_selection/2026-07-29_002_plan.md §1-2)。
#         read-onlyのprobe/set_fact/add_hostのみで副作用を持たないため、上記
#         tester-gate(risk-accepted)の分類には影響しない。ここで全候補に立つ
#         pen_reachable per-host fact は、Play 2 のrestore先ノード決定
#         (prefer<node>タグが到達不能なときの代替判定)でも参照する。
# ---------------------------------------------------------------------------
- name: Select query node for proxmox_backup_restore_verify
  hosts: proxmox
  gather_facts: false
  become: false
  roles:
    - role: proxmox_exec_node
      vars:
        pen_target_group: brv_query_node
        pen_caller: proxmox_backup_restore_verify

# ---------------------------------------------------------------------------
# Play 2: Decide the monthly target VM, its agent expectation, and the
#         restore node (the node it prefers, falling back to any reachable
#         candidate if the preferred node is unreachable). Runs on the query
#         node selected by Play 1; cluster resources are cluster-wide.
# ---------------------------------------------------------------------------
- name: Determine monthly restore-verify target
  hosts: brv_query_node
  gather_facts: false
  become: true
  pre_tasks:
    - name: "[migration] --check has no dry-run here — refuse and stop before any changes"
      ansible.builtin.assert:
        that: not (ansible_check_mode | bool)
        fail_msg: >-
          This playbook (tester-gate: risk-accepted) has no --check dry-run:
          every task always applies for real, so --check would look like a
          simulation while actually making the change (see
          docs/ai/memory/incidents/2026-07-31_subagent-unintended-deploy-risk-accepted-check.md).
          Re-run without --check to apply for real. To suppress Slack
          notifications during that real run, add -e skip_notifications=true.
          See docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md.
        quiet: true

    - name: "[migration] tester_mode is deprecated for this playbook — it always runs for real"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true and has no
          dry-run mode (--check included): backup restore-verify always runs
          for real. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

  tasks:
    - name: Get cluster resources
      ansible.builtin.command:
        cmd: pvesh get /cluster/resources --output-format json
      register: _brv_resources_raw
      changed_when: false
      check_mode: false

    - name: Parse cluster resources
      ansible.builtin.set_fact:
        _brv_resources: "{{ _brv_resources_raw.stdout | from_json }}"

    - name: Build deterministic list of verify-tagged VMs (vmid ascending)
      ansible.builtin.set_fact:
        _brv_verify_vms: >-
          {{ _brv_resources |
             selectattr('type', 'defined') |
             selectattr('type', 'equalto', 'qemu') |
             selectattr('tags', 'defined') |
             selectattr('tags', 'search', '(^|;)verify(;|$)') |
             sort(attribute='vmid') |
             list }}

    - name: Resolve manual target VM (target_vmid bypasses rotation)
      ansible.builtin.set_fact:
        _brv_target: >-
          {{ (_brv_resources |
              selectattr('type', 'defined') |
              selectattr('type', 'equalto', 'qemu') |
              selectattr('vmid', 'defined') |
              selectattr('vmid', 'equalto', (target_vmid | int)) |
              list | first) | default(none) }}
      when: target_vmid is defined

    - name: Fail if manual target_vmid does not exist
      ansible.builtin.fail:
        msg: "target_vmid={{ target_vmid }} was not found as a QEMU VM in the cluster."
      when:
        - target_vmid is defined
        - _brv_target is none

    - name: Fail if no verify-tagged VMs exist (rotation mode)
      ansible.builtin.fail:
        msg: >-
          No QEMU VM carries the 'verify' tag. Tag the core VMs to enroll them
          in monthly restore-verify, or pass -e target_vmid=<id>.
      when:
        - target_vmid is not defined
        - _brv_verify_vms | length == 0

    - name: Select monthly target by (month - 1) %% list length
      ansible.builtin.set_fact:
        _brv_target: >-
          {{ _brv_verify_vms[((lookup('pipe', 'date +%m') | int) - 1)
                             % (_brv_verify_vms | length)] }}
      when: target_vmid is not defined

    - name: Extract prefer<node> node names named in the target VM's tags
      ansible.builtin.set_fact:
        _brv_prefer_names: >-
          {{ _brv_target.tags | default('')
             | regex_findall('(?:^|;)prefer([A-Za-z0-9_-]+)(?:;|$)') }}

    - name: Determine preferred restore node (candidate-group driven, no host literals)
      ansible.builtin.set_fact:
        _brv_preferred_node: >-
          {{ (groups['proxmox'] | select('in', _brv_prefer_names) | list | first)
             | default('', true) }}

    - name: Fail if the target VM has no prefer<node> tag matching a candidate node
      ansible.builtin.fail:
        msg: >-
          Target VM {{ _brv_target.vmid }} ({{ _brv_target.name | default('?') }})
          has no prefer<node> tag matching any node in group 'proxmox'
          ({{ groups['proxmox'] | join(', ') }}); cannot decide a restore node.
      when: _brv_preferred_node | length == 0

    - name: Decide restore node — preferred node if reachable, else the first
        reachable candidate (R6; reachability set by Play 1's proxmox_exec_node)
      ansible.builtin.set_fact:
        _brv_restore_node: >-
          {{ _brv_preferred_node
             if (hostvars[_brv_preferred_node].pen_reachable | default(false) | bool)
             else (groups['proxmox']
                   | map('extract', hostvars)
                   | selectattr('pen_reachable', 'equalto', true)
                   | map(attribute='inventory_hostname')
                   | list | first) }}
        _brv_restore_fallback: >-
          {{ not (hostvars[_brv_preferred_node].pen_reachable | default(false) | bool) }}

    - name: Read target VM config (agent expectation) via API
      ansible.builtin.command:
        cmd: >-
          pvesh get /nodes/{{ _brv_target.node }}/qemu/{{ _brv_target.vmid }}/config
          --output-format json
      register: _brv_target_cfg_raw
      changed_when: false
      check_mode: false

    - name: Decide expected health level from agent config
      ansible.builtin.set_fact:
        _brv_agent_raw: "{{ (_brv_target_cfg_raw.stdout | from_json).agent | default('') | string }}"

    - name: Register the restore node into a dynamic group with the decision
      ansible.builtin.add_host:
        name: "{{ _brv_restore_node }}"
        groups: brv_restore_targets
        brv_target_vmid: "{{ _brv_target.vmid }}"
        brv_target_name: "{{ _brv_target.name | default('vm-' ~ _brv_target.vmid) }}"
        brv_agent_expected: "{{ (_brv_agent_raw == '1') or ('enabled=1' in _brv_agent_raw) }}"
        brv_preferred_node: "{{ _brv_preferred_node }}"
        brv_restore_fallback: "{{ _brv_restore_fallback | bool }}"
      changed_when: false

    - name: Show selection
      ansible.builtin.debug:
        msg: >-
          Monthly restore-verify target: VM {{ _brv_target.vmid }}
          ({{ _brv_target.name | default('?') }}),
          preferred node={{ _brv_preferred_node }},
          restore node={{ _brv_restore_node }}
          ({{ 'fallback — preferred node unreachable' if (_brv_restore_fallback | bool) else 'preferred node used' }}),
          agent_expected={{ (_brv_agent_raw == '1') or ('enabled=1' in _brv_agent_raw) }}

# ---------------------------------------------------------------------------
# Play 3: Run the full restore-verify lifecycle on the chosen restore node.
# ---------------------------------------------------------------------------
- name: Verify backup restore on chosen node
  hosts: brv_restore_targets
  gather_facts: false
  become: true
  vars:
    verify_target_vmid: "{{ brv_target_vmid }}"
    verify_target_name: "{{ brv_target_name }}"
    verify_agent_expected: "{{ brv_agent_expected }}"
    verify_preferred_node: "{{ brv_preferred_node }}"
    verify_restore_fallback: "{{ brv_restore_fallback }}"
  pre_tasks:
    # Redundant with Play 2's stop assert by construction (Play 2 fails
    # before the add_host task that populates brv_restore_targets, so this
    # play normally has zero hosts under --check). TS-030 requires the
    # assert on each play that makes changes regardless of whether another
    # play already blocks reachability indirectly — an indirect guard goes
    # silently missing if the play order or the add_host structure changes
    # (2026-07-31, independent review finding).
    - name: "[migration] --check has no dry-run here — refuse and stop before any changes"
      ansible.builtin.assert:
        that: not (ansible_check_mode | bool)
        fail_msg: >-
          This playbook (tester-gate: risk-accepted) has no --check dry-run:
          every task always applies for real, so --check would look like a
          simulation while actually making the change (see
          docs/ai/memory/incidents/2026-07-31_subagent-unintended-deploy-risk-accepted-check.md).
          Re-run without --check to apply for real. To suppress Slack
          notifications during that real run, add -e skip_notifications=true.
          See docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md.
        quiet: true
  tasks:
    - name: Run proxmox_backup_restore_verify role (always for real)
      ansible.builtin.import_role:
        name: proxmox_backup_restore_verify
      check_mode: false
