---
# incident_evaluation.yml - 障害の自動評価だけを手動で回す(手動専用。timerには載せない)
#
# 目的(計画 §2.8):
#   1. 検証のため。月次playbook全体(playbooks/knowledge_review.yml)を素で起動すると、
#      auto-memoryのスナップショット・MEMORY.mdの次回期日行の書き換え・振り返り本体
#      まで走ってしまい、本番の月次を前倒しで消費する。評価だけを安全に試す口が要る。
#   2. 対話セッションから任意のタイミングで評価を回せる(開発への還元)。
#
# roles/knowledge_review/tasks/main.yml は経由しない。main.yml の既存タスク
# (振り返り本体・auto-memoryスナップショット・MEMORY.md更新・Save report等)は
# 一切実行されない — 経由しないので、それらのタスクの `when:` を書き換える必要が
# 無い(既存動作は1文字も変わらない。AC9)。評価工程3ファイル
# (incident_metrics / incident_evaluation / incident_index_write)だけを
# ansible.builtin.include_role(tasks_from)で個別に呼ぶ
# (playbooks/knowledge_review_timer.yml が install_timer を呼ぶのと同じ形)。
#
# 安全弁はmain.ymlの本体と同じ考え方を踏襲する: 作業ツリーが汚れていれば実行
# しない(IC-025)。main.ymlを経由しないため、この判定は本playbook内で独立に
# 行う(main.ymlの「Check working tree is clean」「Decide whether to abort」と
# 同じロジックの再掲。main.ymlの当該タスクは変更していない)。
#
# knowledge_review ロールの defaults(reports_base_dir 由来のパス等)は、
# `roles:` play-keywordを使わずに include_role だけで個別ファイルを呼ぶと
# pre_tasks の時点ではまだ読み込まれていない(実測で確認済み — `roles:` の
# 各要素に `tasks_from` を付けても ansible-core 2.20 では常に main.yml が
# 走ってしまい main.yml 迂回の目的を果たせなかったため、この形は採らなかった)。
# そのため defaults/main.yml を include_vars で明示的に読み込む。
#
# 新しい器ではない(timerもscheduleも増えない。ansible-playbookを直接叩く、
# または対話セッションから起動する)。
#
# tester-gate: check-mode-native — 状態収集(git status)は --check でも常に
# 本実行し、claude -p の起動と評価成果物の保存のみ ansible_check_mode で
# ゲートする(roles/knowledge_review/tasks/incident_evaluation.yml と同じ扱い)。
# 副作用は ansy のリポジトリ作業ツリー(gitignore済みパス)と ~/.local/state
# 配下に限定され、他ホストには一切接続しない。

- name: Manual incident evaluation (standalone)
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  pre_tasks:
    - name: Load knowledge_review role defaults
      # main.yml を経由しないため、reports_base_dir 由来のパス変数
      # (knowledge_review_repo_dir 等)がまだ読み込まれていない。
      ansible.builtin.include_vars: "{{ playbook_dir }}/../roles/knowledge_review/defaults/main.yml"

    # git status は状態照会であり ansible.builtin.git では代替できないため
    # command を使う(roles/knowledge_review/tasks/main.yml と同じ扱い。
    # ansible-lint の command-instead-of-module はこの理由で既存コード側も
    # 受け入れている)。
    - name: Check working tree is clean
      ansible.builtin.command:
        cmd: git status --porcelain
        chdir: "{{ knowledge_review_repo_dir }}"
      register: knowledge_review_git_status
      changed_when: false
      check_mode: false

    # 中止は fail させない。main.ymlの本体と同じ理由(先月分の昇格結果が未commit
    # のときに正常運用でも起きる中止であり、無通知にすると検出手段が失われる)。
    # 本playbookにはpost_tasksのSlack通知は無いため実害は小さいが、挙動を
    # 本体と揃えておく。
    - name: Decide whether to abort (working tree not clean)
      ansible.builtin.set_fact:
        knowledge_review_aborted: >-
          {{ (knowledge_review_git_status.stdout | trim | length > 0)
             and not (knowledge_review_allow_dirty | bool) }}

    - name: Report abort reason
      ansible.builtin.debug:
        msg: >-
          作業ツリーに未commitの変更が {{ knowledge_review_git_status.stdout_lines | length }} 件あるため
          評価を実行しない。commit後に再実行する。
          意図的に実行する場合は -e knowledge_review_allow_dirty=true を付ける。
      when: knowledge_review_aborted | bool

    - name: Ensure state directory exists
      ansible.builtin.file:
        path: "{{ knowledge_review_state_dir }}"
        state: directory
        owner: "{{ ansible_user_id }}"
        mode: "0750"
      check_mode: false

    - name: Record run start timestamp (JST)
      ansible.builtin.set_fact:
        knowledge_review_started_at: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S%:z') }}"

  tasks:
    - name: Compute incident evaluation metrics
      ansible.builtin.include_role:
        name: knowledge_review
        tasks_from: incident_metrics
      when:
        - not (knowledge_review_aborted | bool)
        - knowledge_review_incident_eval_enabled | bool

    - name: Run incident evaluation
      ansible.builtin.include_role:
        name: knowledge_review
        tasks_from: incident_evaluation
      when:
        - not (knowledge_review_aborted | bool)
        - knowledge_review_incident_eval_enabled | bool

    - name: Write incident evaluation index
      ansible.builtin.include_role:
        name: knowledge_review
        tasks_from: incident_index_write
      when:
        - not ansible_check_mode
        - not (knowledge_review_aborted | bool)
        - knowledge_review_incident_eval_enabled | bool

  post_tasks:
    # 同上(状態照会のため command を使う)。
    - name: Collect resulting diff
      ansible.builtin.command:
        cmd: git status --porcelain
        chdir: "{{ knowledge_review_repo_dir }}"
      register: knowledge_review_manual_eval_diff
      changed_when: false
      check_mode: false

    - name: Report outcome
      ansible.builtin.debug:
        msg: >-
          aborted={{ knowledge_review_aborted | bool }}
          rc={{ incident_eval_rc | default('n/a') }}
          summary={{ incident_eval_summary | default('n/a') }}
          artifact={{ incident_eval_artifact | default('n/a') }}
          作業ツリーの差分: {{ knowledge_review_manual_eval_diff.stdout_lines | length }} 件
          (評価成果物はgitignore済みのため通常は現れない。AC6)
