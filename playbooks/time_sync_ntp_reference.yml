---
# time_sync_ntp_reference.yml
#
# 目的: time_sync_check（quory基準の時刻同期チェック）の精度向上のため、
#       各ノードのNTPクライアント設定にquoryを参照先として追加する準備作業。
#       time_sync_check.yml本体はread-onlyのまま、本playbookのみが
#       変更系としてNTP設定に手を加える（core.md: 読み取り専用ロールと
#       変更系ロールの分離）。
#
# 対象ホスト・実行元: pve1, pve2, ansy, monnie, authy（chrony）。
#       実行元はquoryまたはansy（host_vars/quory.ymlの動的ansible_connection
#       により、quory自身が対象に含まれる場合も自己SSHにならない）。
#       cloudkeyは対象外（UniFi OSのGUIで管理されており「Auto」設定が
#       再起動・GUI保存時にtimesyncd.confを再生成する可能性があるため、
#       直接ファイル編集はGUI管理と衝突する。ユーザーがGUIから手動で
#       quory.internalを含むNTPサーバーを登録する運用とした。2026-06-25）。
#       sophos-fwも対象外（独自設定データベースで管理されており、
#       Advanced Shell経由の変更は非サポート・サポート失効リスクのため
#       quory参照の追加は不可と判断。既存の外部NTP参照を維持する）。
#
# 主要な処理フロー:
#   chronyホスト: /etc/chrony/conf.d/quory.conf に
#   `server quory.internal iburst` を配置（既存のpool/sources.d設定は
#   変更しない。追加のみ）。新規ファイル作成時のみchronyを再起動。
#
# 重要な前提・制約:
#   - quory自体は `/etc/chrony/chrony.conf` にhomelab管理ネットワーク向けの
#     allow設定が既に設定済み・123/udp稼働確認済みのため、quory側の追加対応は不要。
#   - quory.internal の名前解決は sophos-fw（社内DNS）に依存する。
#     sophos-fwが起動していない場合、quory参照の追加・time_sync_check双方が
#     正常に動作しない前提を許容する（別途の冗長化は対象外）。
#   - 本playbookは変更系（chronyの再起動を伴う）。実行前にCodexレビューおよび
#     --check/--diffでの確認を経ること。
#
# 参照: docs/ai/reviews/time_sync_check/2026-06-25_002_implement.md
#
# target_hosts: 省略可(D3/D7、docs/ai/reviews/playbook_button_inventory/
# 2026-08-06_001_requirement.md)。`hosts:`キーワードと同じパターン構文。
# 省略時は下記の pve1:pve2:ansy:monnie:authy を変更せず対象とする(R1)。
# 用途は、既に対象として構成済みのホスト(pve1/pve2/ansy/monnie/authy)へ
# 1台だけ再適用すること — 特にansyから直接は届かないpve1/pve2/authyへ、
# Semaphoreのボタン経由で再適用する場合に使う。**新しく作ったVMへ向ける
# 用途ではない。** roles/time_sync_ntp_reference の
# time_sync_ntp_reference_chrony_hosts に無いホストは、実際の変更に入る
# 前にrole側のassertが拒否する(AC7)。新しいホストを対象に加えるには、
# 先にrepo側でそのリストへ追記しcommitする必要がある。指定して
# inventoryのどのホストにも解決しない場合は、下記の最初のplayが
# main playの前にrc非0で停止する(R2。こちらは単なる「inventoryに
# 存在しない/typo」の検査であり、上記のallow-listとは別の判定)。
#
# tester-gate: check-mode-native — TS-009 条件1(再起動してもchronyデーモンが
# 一瞬再起動するだけで他サービス・接続には影響しない)は満たすが、条件2
# (本体操作を省いた検証には価値がない)は満たさない。copyモジュールのcontent
# 差分比較・chrony再起動(`copy`/`systemd`)はいずれもAnsible標準のcheck_modeで
# 安全にプレビューできる。roles/time_sync_ntp_reference/tasks/chrony_hosts.yml
# の2taskを when: not ansible_check_mode でゲートする(dropin配置task が
# --check下でskipされるとregisterされる結果は `changed: false` になり
# (実測確認済み)、restart taskの既存の `when: ...changed` 条件が自然に
# Falseへ倒れて安全に連動する。TS-014の個別task単位で足りる — restart側にも
# 明示の not ansible_check_mode を重ねて意図を自己文書化する)。TS-010に照らし
# risk-accepted ではなく check-mode-native が正しい分類(2026-07-06当時は
# 条件1のみで判断していた)。詳細は docs/ai/policies/ansible_test_safety_policy.md。

- name: Validate target_hosts before the main play
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Resolve the requested target_hosts pattern against the inventory
      ansible.builtin.set_fact:
        time_sync_ntp_reference_target_hosts_resolved: "{{ query('ansible.builtin.inventory_hostnames', target_hosts) }}"
      when: target_hosts is defined

    - name: Fail if target_hosts does not resolve to any inventory host
      ansible.builtin.assert:
        that:
          - time_sync_ntp_reference_target_hosts_resolved | length > 0
        fail_msg: >-
          target_hosts={{ target_hosts }} did not match any host in the
          inventory (inventories/homelab/hosts.yml). Check for a typo —
          target_hosts must name one of pve1/pve2/ansy/monnie/authy (see
          the header; this playbook does not reach a host outside that
          list, D7).
        quiet: true
      when: target_hosts is defined

- name: Add quory as an additional NTP reference on homelab nodes
  hosts: "{{ target_hosts | default('pve1:pve2:ansy:monnie:authy') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Run time_sync_ntp_reference role
      ansible.builtin.import_role:
        name: time_sync_ntp_reference
