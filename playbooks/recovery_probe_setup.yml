---
# Deploy recovery-probe (pull detection daemon) + homelab-mute CLI.
#
# Development (ansy):
#   ansible-playbook playbooks/recovery_probe_setup.yml -l ansy
#   # service is deployed but NOT enabled/auto-started
#
# Production (quory):
#   ansible-playbook playbooks/recovery_probe_setup.yml -l quory
#   # recovery_probe_service_enabled=true comes from
#   # inventories/homelab/host_vars/quory.yml — no -e needed. Config/daemon/unit
#   # changes always reach a running daemon (roles/recovery_probe/handlers).
#
# 設計: docs/ai/reviews/autonomous_recovery/2026-07-02_001_requirement.md
#
# tester-gate: check-mode-native — TS-009の条件1(quory/ansy以外への実害なし、
# recovery-probe以外の既存本番サービスへ波及しない)は満たすが、条件2
# (本体操作を省いた検証には価値がない)は満たさない。homelab-mute CLI配置
# (`command` + `creates:`/`copy`)、recovery-probeのディレクトリ作成・設定・
# daemon本体・unit配置(`file`/`template`/`copy`)はいずれもAnsible標準の
# check_modeで安全にプレビューできる。実際に本番へ作用するのはdaemonの
# enable+start/restartのみであり、roles/recovery_probe/tasks/main.yml と
# handlers/main.yml をあわせて when: not ansible_check_mode でゲートする
# (homelab-mute CLI側はreports/incidentsのような読み取り専用診断を持たない
# ため、playbook側でinclude_role自体をゲートする)。TS-010に照らし
# risk-accepted ではなく check-mode-native が正しい分類(2026-07-06当時は
# 条件1のみで判断していた)。詳細は
# docs/ai/policies/ansible_test_safety_policy.md、
# docs/ai/reviews/check_mode_semantics/2026-07-31_004_classification_audit.md
# §2.12。

- name: Deploy recovery-probe and homelab-mute CLI
  hosts: dev_nodes:control_nodes
  gather_facts: true
  become: true
  tasks:
    # roles/recovery_mute is out of scope for this batch's role changes, and
    # deploy_cli.yml has no read-only diagnostics worth preserving under
    # --check (just a create-only mkdir + a binary copy), so the whole
    # inclusion is gated here at the call site instead of inside that role.
    - name: Deploy homelab-mute CLI
      ansible.builtin.include_role:
        name: recovery_mute
        tasks_from: deploy_cli
      when: not ansible_check_mode
      tags: [destructive]

    - name: Deploy recovery-probe
      ansible.builtin.include_role:
        name: recovery_probe
