---
# cert_renew_quory.yml - TLS certificate renewal for quory semaphore
# 変更系: 証明書配置・semaphore再起動あり
#
# 対象: quory (semaphore)
# systemd timerから実行する。semaphore再起動を含むためsemaphoreからは実行しない。
# すべてlocal connectionで実行する。
#
# 通知: 証明書更新結果をメールで通知する（renewed/skipped/failed）。
# cleanup失敗時もメール通知後にPlaybook自体がfailするため、systemd unitのstateで検知できる。
#
# tester-gate: check-mode-native — tester_mode/tester_gate を廃止。prepare_ca /
# issue / cleanup は --check の有無にかかわらず常に本実行する(CA鍵のtmpfs展開・
# 削除やCA側での鍵生成のみで、quoryのライブサービスには触れないため)。
# deploy_semaphore だけは ansible_check_mode でゲートする(tags: destructive)。
# 理由: quory は本 playbook を含む自動化を動かしている本番 Semaphore(制御平面)
# そのものであり、証明書配置ミスによる semaphore 再起動失敗はCloudKeyのような
# 「Web UIのSSLが効かなくなるだけ」より復旧コストが高い(直接SSHでの復旧が必要
# になり得る)とYoshinobuが判断(2026-07-06)。詳細は docs/ai/policies/ansible_test_safety_policy.md。

- name: cert_renew_quory - verify execution host
  hosts: localhost
  gather_facts: true
  connection: local
  tasks:
    - name: Ensure this playbook is running on quory
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == 'quory'
        fail_msg: >-
          cert_renew_quory.yml must be run on quory only
          (current host: {{ ansible_facts['hostname'] }}).

    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check instead — prepare_ca/issue/cleanup run for real under
          --check, and only the quory semaphore cert deploy/restart step is
          gated by ansible_check_mode. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

- name: cert_renew_quory - prepare CA key on quory
  hosts: quory
  gather_facts: false
  become: true
  connection: local
  vars:
    skip_notifications: "{{ ansible_check_mode }}"
  tasks:
    # check_mode: false below is this playbook's core check-mode-native
    # design (see header): prepare_ca/issue/cleanup always run for real
    # regardless of --check; only deploy_semaphore (further down) is gated
    # by ansible_check_mode. Not notify-related (R5 review,
    # docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md).
    - name: Run prepare_ca tasks
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: prepare_ca
      check_mode: false

- name: cert_renew_quory - issue and deploy quory cert
  hosts: quory
  gather_facts: false
  become: true
  connection: local
  vars:
    cert_renew_ca_host: localhost
    force_renew: true
    skip_notifications: "{{ ansible_check_mode }}"
  tasks:
    - name: Run issue tasks
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: issue
      check_mode: false

    - name: Run deploy_semaphore tasks
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: deploy_semaphore
      when: not ansible_check_mode
      tags: [destructive]

- name: cert_renew_quory - cleanup CA key from quory
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    cert_renew_ca_host: localhost
    skip_notifications: "{{ ansible_check_mode }}"
  tasks:
    - name: Run cleanup tasks
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: cleanup
      check_mode: false

- name: cert_renew_quory - send completion notification
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    cert_renew_ca_host: localhost
  tasks:
    - name: Build renewal summary
      ansible.builtin.set_fact:
        cert_renew_summary: |
          {% if hostvars['quory'].cert_needs_renewal is not defined %}
          quory: check FAILED
          {% else %}
          {% set needs_renewal = hostvars['quory'].cert_needs_renewal | bool %}
          {% set renewed = hostvars['quory'].cert_renewed | default(false) | bool %}
          {% set deployed = hostvars['quory'].cert_deployed | default(false) | bool %}
          {% if not needs_renewal %}
          quory: skipped
          {% elif not renewed %}
          quory: issue FAILED
          {% elif ansible_check_mode %}
          quory: issued for real (check-mode) — semaphore deploy/restart skipped (ansible_check_mode gate)
          {% elif deployed %}
          quory: renewed and deployed
          {% else %}
          quory: renewed but deploy FAILED
          {% endif %}
          {% endif %}
          CA cleanup: {{ cert_cleanup_status | default('OK') }}
          {% if hostvars['quory'].cert_intermediate_ca_warn | default(false) | bool %}
          WARNING: Intermediate CA expires in {{ hostvars['quory'].cert_intermediate_ca_days_left }} days!
          {% endif %}

    - name: Send Slack notification
      # check_mode: false was removed here 2026-07-31 (R5, see
      # docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md):
      # it existed only to force this notify.yml include to run for real
      # under --check. notify.yml itself now refuses to send whenever
      # ansible_check_mode is true (R3) and shows the full text via debug
      # instead, so forcing this block to execute for real no longer changes
      # anything. This play still runs under --check regardless (it targets
      # localhost, independent of the earlier quory plays' outcome); it is
      # notify.yml's own R3 check that now stops a real Slack send here.
      block:
        - name: Include common_slack notify tasks
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
          vars:
            slack_channel: "{{ 'alerts' if ('FAILED' in cert_renew_summary or 'WARNING' in cert_renew_summary) else 'info' }}"
            slack_status: "{{ 'error' if 'FAILED' in cert_renew_summary else ('warning' if 'WARNING' in cert_renew_summary else 'ok') }}"
            slack_title: "[cert_renew_quory] Certificate renewal completed"
            slack_message: |
              TLS certificate renewal run (quory) completed.

              Results:
              {{ cert_renew_summary }}
              Executed at: {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'") }}

    - name: Fail if CA cleanup was not successful
      ansible.builtin.fail:
        msg: "CA cleanup {{ cert_cleanup_status }}: /run/semaphore-ca/ may still exist"
      when: cert_cleanup_status is defined
