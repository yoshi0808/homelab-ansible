---
# cert_renew.yml - TLS certificate renewal for homelab management UIs
# 変更系: 証明書配置・サービス再起動あり
#
# 対象: ansy (semaphore), pve1 (pveproxy), pve2 (pveproxy), monnie (grafana)
# quoryのsemaphore証明書はcert_renew_quory.ymlで管理する（semaphore再起動を含むため）
# CA秘密鍵はquory上 /run/semaphore-ca/ (tmpfs) にのみ展開する
# 実行後、CA秘密鍵は必ず削除される
#
# このPlaybookはquoryからのみ実行すること（Semaphoreから実行）。
# serial: 1 により1ホストずつ処理する。CA署名処理の .srl 競合を防ぐため。
#
# tester-gate: check-mode-native — 2026-07-31 round2でrisk-acceptedから変換
# (docs/ai/reviews/check_mode_semantics/2026-07-31_006_round2_requirement.md
# バッチC)。TS-009の条件1(実害の軽さ)は満たすが、条件2(破壊的な本体操作を
# 省いた検証には意味がない)は満たさない — issue役割は「更新要否チェック
# (cert_needs_renewal、roles/homelab_cert_renew/tasks/issue_check.yml)」と
# 「実際の鍵生成・署名(issue_apply.yml)」に分離可能で、前者は破壊的操作を
# 一切伴わない有意な事前確認である(2026-07-31_004_classification_audit.md
# §2.2、OQ2で再確認)。同じ理由でprepare_ca(CA鍵のtmpfs展開)も
# prepare_ca_check.yml / prepare_ca_apply.yml に分離した。--check時は
# issue_check / prepare_ca_check のみ実行し、鍵生成・証明書配布・サービス
# 再起動(issue_apply / prepare_ca_apply / deploy_semaphore / deploy_proxmox
# / deploy_grafana / cleanup)はすべて `when: not ansible_check_mode` +
# `tags: [destructive]` でゲートする。
#
# roles/homelab_cert_renew の issue.yml / prepare_ca.yml は
# cert_renew_quory.yml(check-mode-native、ただしissue/prepare_ca/cleanupは
# --checkでも常に本実行する別設計)とも共有されている。両ファイルは分割後も
# issue_check+issue_apply / prepare_ca_check+prepare_ca_apply を無条件で
# importする薄いwrapperのままなので、cert_renew_quory.yml側の挙動
# (check_mode: falseによる強制本実行)は本変換で変えていない。
#
# quory自身のsemaphore証明書更新・再起動(制御平面そのもの)は引き続き
# cert_renew_quory.yml側で扱う。詳細はdocs/ai/policies/ansible_test_safety_policy.md。

- name: cert_renew - verify execution host
  hosts: localhost
  gather_facts: true
  connection: local
  tasks:
    - name: Ensure this playbook is running on quory
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == 'quory'
        fail_msg: >-
          cert_renew.yml must be run on quory only
          (current host: {{ ansible_facts['hostname'] }}).
          CA private key must never be placed on {{ ansible_facts['hostname'] }}.

    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check instead — issue_check/prepare_ca_check run for real under
          --check, and the destructive keygen/deploy/restart steps are
          gated by ansible_check_mode. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

- name: cert_renew - prepare CA key on quory
  hosts: quory
  gather_facts: false
  become: true
  connection: local
  tasks:
    - name: Run prepare_ca check tasks (diagnostic; always runs, including under --check)
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: prepare_ca_check

    - name: Run prepare_ca apply tasks (destructive; stages CA cert/key onto tmpfs)
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: prepare_ca_apply
      when: not ansible_check_mode
      tags: [destructive]

- name: cert_renew - issue and deploy ansy cert
  hosts: ansy
  gather_facts: false
  become: true
  vars:
    cert_renew_ca_host: localhost
  tasks:
    - name: Run issue check tasks (diagnostic; determines cert_needs_renewal, always runs)
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: issue_check

    - name: Issue and deploy ansy certificate (destructive; TS-015 chain)
      when: not ansible_check_mode
      tags: [destructive]
      block:
        - name: Run issue apply tasks
          ansible.builtin.import_role:
            name: homelab_cert_renew
            tasks_from: issue_apply

        - name: Run deploy_semaphore tasks
          ansible.builtin.import_role:
            name: homelab_cert_renew
            tasks_from: deploy_semaphore

- name: cert_renew - issue and deploy proxmox certs
  hosts: proxmox
  gather_facts: false
  become: true
  serial: 1
  vars:
    cert_renew_ca_host: localhost
  tasks:
    - name: Run issue check tasks (diagnostic; determines cert_needs_renewal, always runs)
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: issue_check

    - name: Issue and deploy proxmox certificate (destructive; TS-015 chain)
      when: not ansible_check_mode
      tags: [destructive]
      block:
        - name: Run issue apply tasks
          ansible.builtin.import_role:
            name: homelab_cert_renew
            tasks_from: issue_apply

        - name: Run deploy_proxmox tasks
          ansible.builtin.import_role:
            name: homelab_cert_renew
            tasks_from: deploy_proxmox

- name: cert_renew - issue and deploy monnie cert
  hosts: monnie
  gather_facts: false
  become: true
  vars:
    cert_renew_ca_host: localhost
  tasks:
    - name: Run issue check tasks (diagnostic; determines cert_needs_renewal, always runs)
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: issue_check

    - name: Issue and deploy monnie certificate (destructive; TS-015 chain)
      when: not ansible_check_mode
      tags: [destructive]
      block:
        - name: Run issue apply tasks
          ansible.builtin.import_role:
            name: homelab_cert_renew
            tasks_from: issue_apply

        - name: Pause monitoring before grafana-server restart
          ansible.builtin.command: homelab-monitoring-pause
          delegate_to: localhost
          when: cert_needs_renewal | default(false) | bool

        - name: Run deploy_grafana tasks
          ansible.builtin.import_role:
            name: homelab_cert_renew
            tasks_from: deploy_grafana

        - name: Resume monitoring after grafana restart
          ansible.builtin.command: homelab-monitoring-resume
          delegate_to: localhost
          when: cert_needs_renewal | default(false) | bool

- name: cert_renew - cleanup CA key from quory
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    cert_renew_ca_host: localhost
  tasks:
    - name: Run cleanup tasks
      ansible.builtin.import_role:
        name: homelab_cert_renew
        tasks_from: cleanup
      when: not ansible_check_mode
      tags: [destructive]

- name: cert_renew - send completion notification
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    cert_renew_ca_host: localhost
  tasks:
    - name: Build renewal summary
      ansible.builtin.set_fact:
        cert_renew_summary: |
          {% for h in ['ansy', 'pve1', 'pve2', 'monnie'] %}
          {% if hostvars[h].cert_needs_renewal is not defined %}
          {{ h }}: check FAILED
          {% else %}
          {% set needs_renewal = hostvars[h].cert_needs_renewal | bool %}
          {% set renewed = hostvars[h].cert_renewed | default(false) | bool %}
          {% set deployed = hostvars[h].cert_deployed | default(false) | bool %}
          {% if not needs_renewal %}
          {{ h }}: skipped
          {% elif ansible_check_mode %}
          {{ h }}: would renew and deploy (check-mode preview; issue/deploy gated by ansible_check_mode)
          {% elif not renewed %}
          {{ h }}: issue FAILED
          {% elif deployed %}
          {{ h }}: renewed and deployed
          {% else %}
          {{ h }}: renewed but deploy FAILED
          {% endif %}
          {% endif %}
          {% endfor %}
          CA cleanup: {{ 'not applicable (check-mode preview)' if ansible_check_mode else (cert_cleanup_status | default('OK')) }}
          {% if hostvars['quory'].cert_intermediate_ca_warn | default(false) | bool %}
          WARNING: Intermediate CA expires in {{ hostvars['quory'].cert_intermediate_ca_days_left }} days!
          {% endif %}
        # R1/AC1 note (check_mode_semantics round2): without the
        # ansible_check_mode branch, a host with cert_needs_renewal=true
        # under --check would show renewed=false (issue_apply gated,
        # skipped) and fall into "issue FAILED" -- or, if cert_renewed had
        # instead been left true by an ungated issue_apply, into "renewed
        # but deploy FAILED" (deploy is also gated). Both are misleading
        # for a dry run. Placed before the renewed/deployed checks so it
        # short-circuits them; only ever true when --check is passed, so
        # normal-run output (AC2) is unchanged. Same reasoning for the "CA
        # cleanup" line below (cleanup is also gated under --check).

    - name: Send Slack notification
      # This play always runs (hosts: localhost, independent of the
      # earlier plays' pass/fail outcome). notify.yml itself refuses to
      # send a real Slack message whenever ansible_check_mode is true
      # (TS-031) and shows the full text via debug instead, so this block
      # needs no check_mode handling of its own.
      block:
        - name: Include common_slack notify tasks
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
          vars:
            slack_channel: "{{ 'alerts' if ('FAILED' in cert_renew_summary or 'WARNING' in cert_renew_summary) else 'info' }}"
            slack_status: "{{ 'error' if 'FAILED' in cert_renew_summary else ('warning' if 'WARNING' in cert_renew_summary else 'ok') }}"
            slack_title: "[cert_renew] Certificate renewal completed"
            slack_message: |
              TLS certificate renewal run completed.

              Results:
              {{ cert_renew_summary }}
              Executed at: {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'") }}

    - name: Fail if CA cleanup was not successful
      ansible.builtin.fail:
        msg: "CA cleanup {{ cert_cleanup_status }}: /run/semaphore-ca/ may still exist on {{ cert_renew_ca_host }}"
      when: cert_cleanup_status is defined
