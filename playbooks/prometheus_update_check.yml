---
# prometheus_update_check.yml - monnieへ手動導入したPrometheusを3モードで管理する。
# --checkは確認+通知のみ、通常実行はbackup/checksum/config検証付きupgradeと失敗時
# 自動rollback、-e rollback=trueはbackupからの手動rollback。実行元quory、対象monnie。
# config/storage/unit/retentionは変更しない。Semaphore UI設定変更は別作業。
#
# tester-gate: check-mode-native — read-only収集と成果物であるSlack通知は--checkでも
# 実走し、binary swap/restart/restore等のdestructive blockだけをcheck modeで抑止する。

- name: prometheus_update_check - verify execution host
  hosts: localhost
  gather_facts: true
  connection: local
  tasks:
    - name: Ensure this playbook is running on quory
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == 'quory'
        fail_msg: >-
          prometheus_update_check.yml must be run on quory only
          (current host: {{ ansible_facts['hostname'] }}).

- name: Check manually installed Prometheus release on monnie
  hosts: monnie
  gather_facts: false
  tasks:
    - name: Run prometheus_update_check role
      ansible.builtin.import_role:
        name: prometheus_update_check
