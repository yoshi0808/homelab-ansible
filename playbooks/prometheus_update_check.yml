---
# prometheus_update_check.yml - quoryからmonnieへ手動導入したPrometheusを管理する。
# prometheus_update_check_operation が主モード選択。旧変数は値に関係なく拒否する。
# config/storage/unit/retentionは変更せず、binary 2本だけを安全機構付きで更新/復元する。
#
# Weekly inspection / existing Friday Semaphore schedule:
#   ansible-playbook playbooks/prometheus_update_check.yml -e prometheus_update_check_operation=inspect
# Manual apply (optional version pin):
#   ansible-playbook playbooks/prometheus_update_check.yml -e prometheus_update_check_operation=update
#   Optional: append -e prometheus_target_version=X.Y.Z
# Manual rollback (optional backup version):
#   ansible-playbook playbooks/prometheus_update_check.yml \
#     -e prometheus_update_check_operation=rollback
#   Optional: append -e rollback_to=X.Y.Z
# Rollback inspection (the rollback operation is always discovery-first):
#   ansible-playbook playbooks/prometheus_update_check.yml \
#     -e prometheus_update_check_operation=rollback
# Validate the apply path without changing binaries or restarting:
#   ansible-playbook playbooks/prometheus_update_check.yml --check \
#     -e prometheus_update_check_operation=update
#
# Deployment requirement: existing Friday Semaphore task passes inspect in
# environment and native params.dry_run=false.
# Design record: docs/ai/reviews/prometheus_update_check/2026-07-19_015_implement.md
#
# tester-gate: check-mode-native — read-only収集(current/latest version取得・
# 分類・rollback discovery)は--checkでも実走する。destructive blockはoperation=update|rollback
# に加えnot ansible_check_modeも必須とし、--checkで適用引数経路を
# 無変更のまま検証できる。
#
# 2026-07-31撤回(R4、docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md):
# 「成果物であるSlack通知は--checkでも実走する」という以前の設計(旧記録
# docs/ai/reviews/prometheus_update_check/2026-07-19_015_implement.md)は撤回した。
# 現在はroles/prometheus_update_check/tasks/main.ymlのnotify呼び出しから
# check_mode: falseを除去済みで、他playbook同様notify.yml自身がansible_check_mode
# を見て送信を止める(--checkでは常にdebug全文出力のみ)。

- name: prometheus_update_check - verify execution host
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Reject legacy Prometheus mode variables
      ansible.builtin.assert:
        that:
          - dry_run is not defined
          - rollback is not defined
        fail_msg: >-
          Legacy dry_run/rollback variables are rejected. Use
          -e prometheus_update_check_operation=inspect|update|rollback.
        quiet: true
      tags: [always]

    - name: Require an explicit Prometheus operation
      ansible.builtin.assert:
        that:
          - prometheus_update_check_operation is defined
          - prometheus_update_check_operation in ['inspect', 'update', 'rollback']
        fail_msg: >-
          prometheus_update_check_operation must be inspect, update, or rollback.
        quiet: true
      tags: [always]

    - name: Collect execution host facts after input guards
      ansible.builtin.setup:
      tags: [always]

    - name: Ensure this playbook is running on quory
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == 'quory'
        fail_msg: >-
          prometheus_update_check.yml must be run on quory only
          (current host: {{ ansible_facts['hostname'] }}).

- name: Check manually installed Prometheus release on monnie
  hosts: monnie
  gather_facts: false
  tasks:
    - name: Run prometheus_update_check role
      ansible.builtin.import_role:
        name: prometheus_update_check
