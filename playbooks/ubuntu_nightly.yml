      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
      when: not ansible_check_mode
      vars:
        slack_channel: "info"
        slack_status: "info"
        slack_title: "[ubuntu_nightly] Reboot started - {{ inventory_hostname }}"
        slack_message: |
          Host: {{ inventory_hostname }}
          Action: Reboot started
          Time: {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'") }}

    - name: Reboot and post-reboot verification (monitoring_servers)
      when: not ansible_check_mode
      tags: [destructive]
      block:
        - name: Reboot host
          ansible.builtin.reboot:
            reboot_timeout: 300

        # monnie 上で自分自身のループバックへ接続して待つ。
        # 2026-07-30 まで delegate_to: localhost でコントローラから
        # ansible_host へ外部接続していたが、Prometheus 9090 と Loki 3100 は
        # 外部公開していないため UFW が正しく落とし、リブートした夜だけ必ず
        # 失敗していた(外から届くのは Grafana 3000 のみ)。host を省略して
        # 既定のループバックを使う — ループバックで到達できることは
        # roles/alloy(loki push)と roles/recovery_exec の localhost URL が
        # 実績として示している。IPアドレスは書かない(pre-commit が拒否する)。
        # 直後の Run monitoring healthcheck が同じ3ポートを monnie 上の ss で
        # 判定するため、このタスクの役目は「待つ」ことだけである。
        # 詳細: docs/ai/memory/incidents/2026-07-30_ubuntu-nightly-monnie-external-port-wait.md
        - name: Wait for monitoring services to be ready after reboot
          ansible.builtin.wait_for:
            port: "{{ item }}"
            timeout: 120
            state: started
          loop:
            - 9090
            - 3000
            - 3100

        - name: Run monitoring healthcheck
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/monitoring_healthcheck/tasks/check.yml"

