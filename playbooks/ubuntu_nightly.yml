---
# tester-gate: check-mode-native — tester_mode/tester_gate を廃止。reboot-required
# 判定(stat/needrestart)は --check の有無にかかわらず常に本実行し、実際の
# reboot + reboot後検証 + 結果通知(tags: destructive)だけを ansible_check_mode
# でゲートする。reboot_required=true かつ --check のときは「reboot予定だが未実施」
# の軽量レポート/通知を別途出す。詳細は docs/ai/policies/ansible_test_safety_policy.md。

- name: Ubuntu nightly - conditional reboot and service check (radius_servers)
  hosts: radius_servers
  gather_facts: true
  become: true

  vars:
    nightly_report_dir: "{{ reports_base_dir }}/ubuntu-nightly"

  tasks:
    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
          This playbook no longer supports -e tester_mode=true. Re-run with
          --check instead — reboot-required detection runs for real under
          --check, and only the actual reboot/post-reboot verification is
          gated by ansible_check_mode. See docs/ai/policies/ansible_test_safety_policy.md.
        quiet: true

    - name: Check reboot-required flag
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Check if needrestart is available
      ansible.builtin.stat:
        path: /usr/sbin/needrestart
      register: needrestart_bin

    # check_mode: false below is unrelated to notify (R5 review,
    # docs/ai/reviews/check_mode_semantics/2026-07-31_001_requirement.md):
    # `command` has no native check_mode support and would auto-skip under
    # --check, but reboot-required detection must run for real under --check
    # per this playbook's tester-gate classification (header above).
    - name: Run needrestart in batch mode
      ansible.builtin.command:
        cmd: /usr/sbin/needrestart -b
      register: needrestart_output
      changed_when: false
      failed_when: false
      when: needrestart_bin.stat.exists
      check_mode: false

    - name: Evaluate reboot requirement
      ansible.builtin.set_fact:
        reboot_required: >-
          {{ reboot_flag.stat.exists
             or (needrestart_bin.stat.exists
                 and 'NEEDRESTART-KSTA: 3' in (needrestart_output.stdout | default(''))) }}

    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ nightly_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      check_mode: false

    - name: Build skipped report
      ansible.builtin.set_fact:
        nightly_report:
          host: "{{ inventory_hostname }}"
          executed_at: "{{ lookup('pipe', \"TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'\") }}"
          reboot_required: false
          rebooted: false
          result: "SKIPPED"
      when: not reboot_required

    - name: Save skipped report
      ansible.builtin.copy:
        content: "{{ nightly_report | to_nice_json }}"
        dest: "{{ nightly_report_dir }}/{{ inventory_hostname }}_{{ ansible_facts['date_time']['iso8601_basic_short'] }}.json"
      delegate_to: localhost
      become: false
      when: not reboot_required
      check_mode: false

    - name: End play if reboot is not required
      ansible.builtin.meta: end_host
      when: not reboot_required

    - name: Build check-mode report (reboot required but not performed)
      ansible.builtin.set_fact:
        nightly_report:
          host: "{{ inventory_hostname }}"
          executed_at: "{{ lookup('pipe', \"TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'\") }}"
          reboot_required: true
          rebooted: false
          result: "CHECK_MODE_WOULD_REBOOT"
      when: ansible_check_mode

    # check_mode: false below is for the local report file (`copy`), not for
    # the "Send check-mode notification" task right after it — that task has
    # no check_mode setting of its own and is unaffected by this one. Kept
    # so the CHECK_MODE_WOULD_REBOOT report is actually written under
    # --check (R5 review, docs/ai/reviews/check_mode_semantics/
    # 2026-07-31_001_requirement.md).
    - name: Save check-mode report
      ansible.builtin.copy:
        content: "{{ nightly_report | to_nice_json }}"
        dest: "{{ nightly_report_dir }}/{{ inventory_hostname }}_{{ ansible_facts['date_time']['iso8601_basic_short'] }}.json"
      delegate_to: localhost
      become: false
      when: ansible_check_mode
      check_mode: false

    - name: Send check-mode notification
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
      when: ansible_check_mode
      vars:
        slack_channel: "info"
        slack_status: "info"
        slack_title: "[ubuntu_nightly] check-mode: reboot required - {{ inventory_hostname }}"
        slack_message: |
          Host: {{ inventory_hostname }}
          check-mode: reboot is required but was not performed (--check).
          Time: {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'") }}

    - name: Set recovery mute before reboot
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/recovery_mute/tasks/set.yml"
      when: not ansible_check_mode
      vars:
        recovery_mute_target: "{{ inventory_hostname }}"
        recovery_mute_minutes: 120
        recovery_mute_reason: "ubuntu_nightly: {{ inventory_hostname }} reboot in progress"

    - name: Send reboot start notification
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
      when: not ansible_check_mode
      vars:
        slack_channel: "info"
        slack_status: "info"
        slack_title: "[ubuntu_nightly] Reboot started - {{ inventory_hostname }}"
        slack_message: |
          Host: {{ inventory_hostname }}
          Action: Reboot started
          Time: {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'") }}

    - name: Reboot and post-reboot verification (radius_servers)
      when: not ansible_check_mode
      tags: [destructive]
      block:
        - name: Reboot host
          ansible.builtin.reboot:
            reboot_timeout: 300

        # reboot後、freeradiusの起動と1812/1813のbindを待つ。UDPポートのため
        # ansible.builtin.wait_for は使えない(TCP connectのみを実装しており
        # UDPのlisten判定機能を持たない)。until/retriesでssの呼び出し自体を
        # リトライさせる。retries×delay=120秒はmonnie側のwait_for timeout:120
        # と揃えた。failed_when: falseはuntilと両立する(untilはregisterした
        # 値で再判定するため、タスク自体の成否とは独立)。
        # 詳細: docs/ai/memory/incidents/2026-07-30_ubuntu-nightly-monnie-external-port-wait.md
        - name: Check freeradius service status
          ansible.builtin.command:
            cmd: systemctl is-active freeradius
          register: freeradius_active
          until: freeradius_active.stdout.strip() == 'active'
          retries: 12
          delay: 10
          changed_when: false
          failed_when: false

        - name: Check 1812/udp listening
          ansible.builtin.shell:
            cmd: ss -ulnH 'sport = :1812'
          register: port_1812_output
          until: port_1812_output.stdout | length > 0
          retries: 12
          delay: 10
          changed_when: false
          failed_when: false

        - name: Check 1813/udp listening
          ansible.builtin.shell:
            cmd: ss -ulnH 'sport = :1813'
          register: port_1813_output
          until: port_1813_output.stdout | length > 0
          retries: 12
          delay: 10
          changed_when: false
          failed_when: false

        - name: Evaluate service and port results
          ansible.builtin.set_fact:
            nightly_criticals: "{{ []
              + ([] if freeradius_active.stdout.strip() == 'active'
                     else ['freeradius service is not active: ' + freeradius_active.stdout.strip()])
              + ([] if port_1812_output.stdout | length > 0
                     else ['port 1812/udp is not listening'])
              + ([] if port_1813_output.stdout | length > 0
                     else ['port 1813/udp is not listening'])
              }}"

        - name: Gather facts after reboot
          ansible.builtin.setup:
            gather_subset:
              - date_time

        - name: Print post-reboot result
          ansible.builtin.debug:
            msg:
              - "Host      : {{ inventory_hostname }}"
              - "Result    : {{ 'CRITICAL' if nightly_criticals | length > 0 else 'OK' }}"
              - "freeradius: {{ freeradius_active.stdout.strip() }}"
              - "1812/udp  : {{ 'listening' if port_1812_output.stdout | length > 0 else 'not listening' }}"
              - "1813/udp  : {{ 'listening' if port_1813_output.stdout | length > 0 else 'not listening' }}"
              - "Criticals : {{ nightly_criticals }}"

        - name: Build result report
          ansible.builtin.set_fact:
            nightly_report:
              host: "{{ inventory_hostname }}"
              executed_at: "{{ lookup('pipe', \"TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'\") }}"
              reboot_required: true
              rebooted: true
              freeradius: "{{ freeradius_active.stdout.strip() }}"
              port_1812: "{{ 'listening' if port_1812_output.stdout | length > 0 else 'not listening' }}"
              port_1813: "{{ 'listening' if port_1813_output.stdout | length > 0 else 'not listening' }}"
              criticals: "{{ nightly_criticals }}"
              result: "{{ 'CRITICAL' if nightly_criticals | length > 0 else 'OK' }}"

        - name: Save result report
          ansible.builtin.copy:
            content: "{{ nightly_report | to_nice_json }}"
            dest: "{{ nightly_report_dir }}/{{ inventory_hostname }}_{{ ansible_facts['date_time']['iso8601_basic_short'] }}.json"
          delegate_to: localhost
          become: false

        - name: Send result notification
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
          vars:
            slack_channel: "{{ 'alerts' if nightly_criticals | length > 0 else 'info' }}"
            slack_status: "{{ 'critical' if nightly_criticals | length > 0 else 'ok' }}"
            slack_title: "[ubuntu_nightly] {{ 'CRITICAL' if nightly_criticals | length > 0 else 'OK' }} - {{ inventory_hostname }}"
            slack_message: |
              Host: {{ inventory_hostname }}
              Result: {{ 'CRITICAL' if nightly_criticals | length > 0 else 'OK' }}
              Time: {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'") }}

              Service:
                freeradius: {{ freeradius_active.stdout.strip() }}
                1812/udp: {{ 'listening' if port_1812_output.stdout | length > 0 else 'not listening' }}
                1813/udp: {{ 'listening' if port_1813_output.stdout | length > 0 else 'not listening' }}

              Criticals:
              {% for item in nightly_criticals %}
              - {{ item }}
              {% else %}
              (none)
              {% endfor %}

      rescue:
        # この rescue は block 全体(reboot / ポート待ち / healthcheck / レポート /
        # 通知)を覆う。2026-07-30 まで失敗箇所によらず「reboot タイムアウトまたは
        # SSH 接続不能」の固定文言を送っていたため、ポート待ちの失敗を SSH 障害と
        # 誤認させた。失敗したタスク名と理由を必ず本文へ載せる。
        # 詳細: docs/ai/memory/incidents/2026-07-30_ubuntu-nightly-monnie-external-port-wait.md
        - name: Summarize which task failed and why
          ansible.builtin.set_fact:
            _nightly_failed_task: "{{ ansible_failed_task.name | default('(タスク名が取得できなかった)', true) }}"
            # ループしたタスクは msg を持たず results を持つため両方を扱う。
            # join は空文字列を返しうるので default(..., true) で拾う。
            _nightly_fail_reason: >-
              {{ (ansible_failed_result.results | default([])
                  | selectattr('failed', 'defined') | selectattr('failed')
                  | map(attribute='msg') | list | join(' / ')
                  | default('(理由が取得できなかった)', true))
                 if (ansible_failed_result.results is defined)
                 else (ansible_failed_result.msg | default('(理由が取得できなかった)', true)) }}

        - name: Send failure notification
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/common_slack/tasks/notify.yml"
          vars:
            slack_channel: "alerts"
            slack_status: "critical"
            slack_title: "[ubuntu_nightly] FAILED - {{ inventory_hostname }}"
            slack_message: |
              Host: {{ inventory_hostname }}
              失敗タスク: {{ _nightly_failed_task }}
              理由: {{ _nightly_fail_reason }}

              reboot 自体の失敗か、reboot 後の検証の失敗かは上記タスク名で判断する
              こと(SSH 接続不能と決めつけない)。手動確認が必要。
              Time: {{ lookup('pipe', "TZ='Asia/Tokyo' date '+%Y-%m-%dT%H:%M:%S+09:00'") }}

        - name: Re-raise reboot failure
          ansible.builtin.fail:
            msg: "ubuntu_nightly: reboot or post-reboot check failed on {{ inventory_hostname }}"

    - name: Fail if critical
      ansible.builtin.fail:
        msg: "CRITICAL on {{ inventory_hostname }}: {{ nightly_criticals | join(', ') }}"
      when: nightly_criticals | default([]) | length > 0

- name: Ubuntu nightly - conditional reboot and service check (monitoring_servers)
  hosts: monitoring_servers
  gather_facts: true
  become: true

  vars:
    nightly_report_dir: "{{ reports_base_dir }}/ubuntu-nightly"

  tasks:
    - name: "[migration] tester_mode is deprecated for this playbook — use --check instead"
      ansible.builtin.assert:
        that: not (tester_mode | default(false) | bool)
        fail_msg: >-
