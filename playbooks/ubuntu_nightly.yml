        # この rescue は block 全体(reboot / ポート待ち / healthcheck / レポート /
        # 通知)を覆う。2026-07-30 まで失敗箇所によらず「reboot タイムアウトまたは
        # SSH 接続不能」の固定文言を送っていたため、ポート待ちの失敗を SSH 障害と
