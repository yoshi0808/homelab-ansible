[defaults]
inventory = inventories/homelab/hosts.yml
roles_path = roles
host_key_checking = True
interpreter_python = /usr/bin/python3
retry_files_enabled = False
vault_password_file = ~/.ansible/vault/homelab_vault_pass

# incident_investigate (U2, docs/ai/adr/009-per-incident-investigation-runtime.md
# (a) a-4): failure-detection callback for the automated incident primary
# investigation pipeline. This affects EVERY ansible-playbook invocation on
# every host that checks out this repo (ansy, quory, and each Semaphore
# per-template checkout) — see
# docs/ai/reviews/incident_auto_investigation/2026-07-31_005_u2_implement.md
# "ansible.cfgの変更" for what this does, how it was verified not to affect
# normal runs, and how to revert it (delete these two lines; the callback
# plugin file itself can stay, it simply stops being loaded).
#
# The callback (roles/incident_investigate/callback_plugins/
# incident_investigate_trigger.py) is a no-op everywhere this pipeline has
# not been deployed (see that file's docstring): it does nothing unless (1)
# the queue directory it checks for exists (only quory, once
# playbooks/incident_investigate_setup.yml has been run there) and (2) the
# process environment carries SEMAPHORE_TASK_DETAILS_* (only true for
# Semaphore-launched runs). It never performs network I/O and never raises
# an exception out of any hook (self-verified; see the implement record).
callback_plugins = roles/incident_investigate/callback_plugins
callbacks_enabled = incident_investigate_trigger
